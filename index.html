  "ทำกำไรจากการขายไวน์": "Make a profit selling wine:",
  "ระดับสูงสุดของการจัดชั้นไร่องุ่น มาจากแปลงที่ดินที่ดีที่สุด ผลผลิตน้อย ราคาสูง และเก็บบ่มได้นานที่สุด": "The highest vineyard classification, from the very best plots: small yields, high prices and the longest aging",
  "ระดับรองจาก Grand Cru คุณภาพสูงแต่หาได้ง่ายกว่าและราคาย่อมเยากว่า": "One step below Grand Cru: high quality but easier to find and more affordable",
  "ไวน์ที่ใช้องุ่นจากหลายแปลงในหมู่บ้านเดียวกัน เป็นระดับกลางที่คุ้มค่า ดื่มได้เร็ว": "Wine made from several plots in the same village, a good-value middle tier that's ready sooner",
  "การจัดชั้นของบอร์โดซ์สำหรับไร่ที่ดีแต่ไม่ติดกลุ่มชั้นนำ ราคาเข้าถึงง่าย คุณภาพน่าเชื่อถือ": "Bordeaux's classification for good estates outside the top group: accessible prices, reliable quality",
  "การซื้อไวน์ล่วงหน้าตั้งแต่ยังอยู่ในถัง ก่อนบรรจุขวด ราคามักถูกกว่าแต่ต้องรอส่งมอบและมีความเสี่ยง": "Buying wine in advance while it's still in barrel, before bottling. Usually cheaper, but you wait for delivery and take on risk",
  "ปีที่เก็บเกี่ยวองุ่น สภาพอากาศแต่ละปีทำให้คุณภาพต่างกันมาก ปีที่ดีจะมีมูลค่าสูงกว่าอย่างชัดเจน": "The year the grapes were harvested. Weather makes quality vary a lot by year; good vintages are clearly worth more",
  "ปัจจัยรวมของดิน ภูมิอากาศ และภูมิประเทศที่ทำให้ไวน์จากแต่ละแปลงมีบุคลิกเฉพาะตัว": "The combination of soil, climate and landscape that gives each plot's wine its own personality",
  "สารจากเปลือกและเมล็ดองุ่นที่ให้ความฝาด ช่วยให้ไวน์เก็บได้นานและนุ่มขึ้นเมื่อบ่ม": "Compounds from grape skins and seeds that give astringency, help wine age longer, and soften with time",
  "ความหนักแน่นของไวน์ในปาก ตั้งแต่บางเบา (light) ถึงเข้มข้น (full) ใช้จับคู่กับความหนักของอาหาร": "How heavy a wine feels in the mouth, from light to full. Used to match the weight of the food",
  "พ่อค้าคนกลางที่รับซื้อไวน์จากผู้ผลิตมาขายต่อ มักมีโควตาไวน์หายากแต่พ่วงสินค้าอื่นมาด้วย": "A middleman who buys wine from producers to resell, often with rare allocations that come bundled with other stock",
  "ช่วงพีค": "Peak",
  "ช่วงเวลาที่ไวน์อร่อยที่สุดหลังบ่มมาพอดี ขายหรือดื่มตอนนี้ได้มูลค่าสูงสุด เลยไปแล้วจะเริ่มเสื่อม": "The window when a wine tastes best after just the right aging. Selling or drinking now gets the most value; after that it starts to decline",
  "ส่วนต่างราคา": "Spread",
  "ช่องว่างระหว่างราคาซื้อกับราคาขายในตลาด เป็นต้นทุนแฝงที่ทำให้ซื้อมาขายไปทันทีมักขาดทุน": "The gap between the buy and sell price on the market, a hidden cost that makes flipping a wine immediately usually lose money",
  "เข้าใจแล้ว": "Got it",
  "อาจารย์เกรอนาช": "Master Grenache",
  "เมนเทอร์": "Mentor",
  "อดีตซอมเมอลิเยร์ระดับตำนานผู้ยกร้านนี้ให้คุณ คอยชี้แนะและตั้งบททดสอบ": "A legendary former sommelier who handed this shop to you. Offers guidance and sets your trials",
  "วิกเตอร์ ครูซ": "Victor Cruz",
  "คู่แข่ง": "Rival",
  "เจ้าของร้านไวน์หรูฝั่งตรงข้าม เย่อหยิ่งและกว้านซื้อของหายากตัดหน้าคุณเสมอ": "Owner of the luxury wine shop across the street. Arrogant, and always snapping up rare bottles before you",
  "มีอา แทน": "Mia Tan",
  "โบรกเกอร์": "Broker",
  "โบรกเกอร์ตลาดรองไฟแรง ปล่อยข่าววงในและดีลลับให้เป็นระยะ": "A sharp secondary-market broker who passes you inside tips and secret deals now and then",
  "ลอเรนซ์ เพียร์ส": "Laurence Pierce",
  "นักวิจารณ์": "Critic",
  "นักวิจารณ์ไวน์ผู้ทรงอิทธิพล คะแนนของเขาขยับราคาไวน์ทั้งตลาด": "An influential wine critic whose scores move prices across the whole market",
  "คุณป้าโรซ่า": "Auntie Rosa",
  "ลูกค้าประจำ": "Regular",
  "ลูกค้าคนแรกของร้าน ใจดีและบอกต่อเสมอเมื่อประทับใจ": "The shop's first customer, kind-hearted and always spreads the word when impressed",
  "มรดกของอาจารย์": "The Mentor's Legacy",
  "เธอมาช้ากว่านัดสิบห้านาที... ดีแล้ว": "You're fifteen minutes late... Good.",
  "คนที่รีบร้อนเกินไปมักไม่เหมาะกับงานนี้": "People in too much of a hurry are rarely suited to this work.",
  "มองไปรอบๆ สิ เซลลาร์แห่งนี้ — ฉันใช้เวลาสี่สิบปีสร้างมันขึ้นมาทีละขวด": "Look around. This cellar — I spent forty years building it, one bottle at a time.",
  "กลิ่นดินหมัก ไม้โอ๊ค และกาลเวลา... นี่คือกลิ่นของความอดทน": "The smell of damp earth, oak, and time... this is the smell of patience.",
  "เห็นขวดในซอกมุมนั้นไหม ฉันซื้อมันวันที่ลูกสาวฉันเกิด": "See that bottle in the corner? I bought it the day my daughter was born.",
  "ตั้งใจจะเปิดในงานแต่งของเธอ... แต่เธอไม่ได้กลับมาอีกเลย": "I meant to open it at her wedding... but she never came back.",
  "ฉันเลยเรียนรู้ว่า ไวน์ที่ไม่ได้เปิดก็เป็นแค่ของเหลวในแก้ว": "So I learned that an unopened wine is just liquid in glass.",
  "ร้านข้างบน เซลลาร์ข้างล่าง และสิทธิ์เข้าตลาดประมูล — ตอนนี้เป็นของเธอทั้งหมด": "The shop upstairs, the cellar below, and a seat at the auctions — it's all yours now.",
  "แต่ฟังฉันให้ดี ไวน์ที่ดีไม่ใช่แค่ตัวเลขในพอร์ต": "But listen to me carefully: a good wine isn't just a number in a portfolio.",
  "มันคือเรื่องราว คือปีที่ฝนตกถูกเวลา คือมือของคนทำที่ใส่ใจ": "It's a story. The year the rain came at the right time. The careful hands of the one who made it.",
  "คนที่มองเห็นแค่ราคา จะไม่มีวันเข้าใจไวน์อย่างแท้จริง": "Those who see only the price will never truly understand wine.",
  "บททดสอบแรกของเธอง่ายมาก — เปิดร้าน ต้อนรับลูกค้า และทำให้ชื่อเสียงถึง ★5": "Your first trial is simple — open the shop, welcome customers, and reach ★5 reputation.",
  "ชื่อเสียงไม่ได้มาจากขวดที่แพงที่สุด แต่มาจากขวดที่ \"ใช่\" ที่สุดสำหรับคนตรงหน้า": "Reputation doesn't come from the most expensive bottle, but from the bottle that's \"right\" for the person in front of you.",
  "พิสูจน์ให้ฉันเห็นว่าเธอเข้าใจ \"หัวใจ\" ของงานนี้ ไม่ใช่แค่กำไร": "Prove to me that you understand the \"heart\" of this work, not just the profit.",
  "ทำชื่อเสียงร้านให้ถึง ★5": "Raise the shop's reputation to ★5",
  "อาจารย์ยิ้มพอใจ มอบเงินทุนสำรอง ฿50,000 ให้เริ่มต้น": "The mentor smiles, satisfied, and hands you ฿50,000 in reserve funds to get started",
  "ลูกค้าคนแรก": "The First Customer",
  "สวัสดีจ้ะหนู! โอ๊ย ดีใจจังที่ร้านเปิดอีกครั้ง": "Hello, dear! Oh, I'm so glad the shop is open again.",
  "ป้าโรซ่าเป็นลูกค้าที่นี่มาตั้งแต่รุ่นอาจารย์ของหนูยังหนุ่มๆ เลยนะ": "Auntie Rosa has been a customer here since your mentor was a young man, you know.",
  "ทุกวันศุกร์ป้าจะมานั่งจิบไวน์แก้วเดียว มองพระอาทิตย์ตก...": "Every Friday I come and sip a single glass of wine, watching the sunset...",
  "เก้าอี้ตัวที่สามจากหน้าต่างนั่นแหละ ที่ที่แสงตกลงพอดี": "The third chair from the window — right where the light falls.",
  "อาจารย์เขาไม่เคยถามป้าว่าจะเอาไวน์อะไรเลยนะ": "Your mentor never once asked me what wine I wanted.",
  "เขาแค่มองหน้าป้า แล้วเดินไปหยิบขวดมาเลย ทุกครั้งถูกใจทุกครั้ง": "He'd just look at my face, then go fetch a bottle. And every time, it was perfect.",
  "ป้าเคยถามว่าทำได้ยังไง เขาบอกว่า \"ผมไม่ได้เลือกไวน์ให้คุณ ผมเลือกให้กับวันของคุณ\"": "I once asked him how he did it. He said, \"I'm not choosing a wine for you. I'm choosing one for your day.\"",
  "วันเหนื่อยๆ ต้องการอะไรที่ปลอบใจ วันดีๆ ต้องการอะไรที่ฉลอง...": "A tiring day needs comfort. A good day needs celebrating...",
  "เซลลาร์ที่ดีเลยต้องมีของหลากหลาย ไม่ใช่มีแต่ของแพง": "So a good cellar needs variety, not just expensive bottles.",
  "ไวน์แดงเข้มไว้คู่เนื้อ ไวน์ขาวสดไว้คู่ปลา แชมเปญไว้ฉลอง...": "Bold reds for meat, crisp whites for fish, Champagne for celebrations...",
  "หนูลองสะสมไวน์ให้ครบ 8 ขวดในเซลลาร์ก่อนสิจ๊ะ": "Why don't you start by collecting 8 bottles in your cellar, dear?",
  "แล้วป้าจะพาเพื่อนๆ ในชมรมไวน์มาอุดหนุนให้เอง!": "Then Auntie will bring her wine club friends to shop here!",
  "สะสมไวน์ 8 ขวดในเซลลาร์": "Collect 8 bottles in the cellar",
  "ป้าโรซ่าพาเพื่อนชมรมมาอุดหนุน ชื่อเสียงร้านขยับ (+★2)": "Auntie Rosa brings her club friends to shop, and the shop's reputation grows (+★2)",
  "สายข่าววงใน": "The Inside Line",
  "ว่าไง เจ้าของร้านคนใหม่ ฉันมีอา แทน": "Hey there, new shop owner. I'm Mia Tan.",
  "โบรกเกอร์ตลาดรอง — คนที่รู้ว่าขวดไหนกำลังจะพุ่งก่อนใคร": "Secondary-market broker — the one who knows which bottles are about to soar before anyone else.",
  "ฟังนะ ตลาดไวน์สะสมไม่ต่างจากตลาดหุ้นเลย": "Listen, the fine wine market is no different from the stock market.",
  "ดัชนีขึ้นลงตามคะแนนนักวิจารณ์ ข่าวประมูล สภาพอากาศ vintage": "The indices rise and fall with critic scores, auction news, and vintage weather.",
  "แต่มีอย่างหนึ่งที่ต่าง — ไวน์มีจำนวนจำกัด และมันหายไปเรื่อยๆ": "But there's one difference — wine is finite, and it keeps disappearing.",
  "ทุกขวดที่มีคนเปิดดื่ม คือซัพพลายที่หายไปตลอดกาล": "Every bottle someone opens is supply gone forever.",
  "นั่นแหละคือเหตุผลที่ของหายากราคาขึ้นไม่หยุด — คนดื่มมันทิ้ง": "That's why rare wine prices never stop rising — people drink them.",
  "ในตลาดเปิดแต่ละสัปดาห์ ผู้ขายมีของจำกัดนะ อย่าคิดว่าจะกวาดได้ทั้งหมด": "Each week the open market has limited stock, so don't think you can sweep it all up.",
  "ยิ่งเธอซื้อทีละเยอะ ราคายิ่งวิ่งหนีเธอ ค่อยๆ เก็บดีกว่า": "The more you buy at once, the faster the price runs away from you. Pick them up slowly.",
  "ซื้อตอนคนหวาดกลัว ขายตอนคนโลภ — กฎเหล็กข้อเดียวที่ต้องจำ": "Buy when people are afraid, sell when they're greedy — the one iron rule you need to remember.",
  "แต่ฉันไม่ทำงานกับมือใหม่ที่ไม่มีฝีมือหรอกนะ": "But I don't work with beginners who have no skill.",
  "พิสูจน์ตัวเองก่อน — ทำมูลค่าพอร์ตให้ถึง ฿2,000,000": "Prove yourself first — grow your portfolio to ฿2,000,000.",
  "ทำได้เมื่อไหร่ ฉันจะเริ่มกระซิบข่าววงในให้เธอเป็นคนแรก": "Do that, and I'll start whispering inside tips to you first.",
  "ทำมูลค่าพอร์ตถึง ฿2M": "Grow your portfolio to ฿2M",
  "มีอายอมรับฝีมือ คืนค่าคอมมิชชั่นให้ ฿100,000 + เริ่มปล่อยข่าววงใน": "Mia recognizes your skill, refunds ฿100,000 in commission + starts sharing inside tips",
  "คู่แข่งปรากฏตัว": "The Rival Appears",
  "นี่เหรอ... ร้านเล็กๆ ที่คนเริ่มพูดถึงกัน?": "So this is it... the little shop people are starting to talk about?",
  "ฉันวิกเตอร์ ครูซ เจ้าของ \"Cruz Cellars\" ฝั่งตรงข้ามถนน": "I'm Victor Cruz, owner of \"Cruz Cellars\" across the street.",
  "ร้านของฉันมีไวน์ระดับตำนานที่เธอได้แต่ฝันถึง": "My shop has legendary wines you can only dream of.",
  "รู้ไหมว่าฉันเคยมาสมัครงานที่ร้านนี้ ตอนอายุยี่สิบสอง": "Did you know I once applied for a job at this shop, when I was twenty-two?",
  "อาจารย์ของเธอปฏิเสธฉัน บอกว่าฉัน \"ฟังไวน์ไม่เป็น ฟังแต่ราคา\"": "Your mentor turned me down. Said I \"can't listen to wine, only to price.\"",
  "ฉันเลยไปสร้างร้านที่ใหญ่กว่า แพงกว่า ดังกว่า เพื่อพิสูจน์ว่าเขาคิดผิด": "So I built a bigger, pricier, more famous shop to prove him wrong.",
  "แล้วเขาก็ยกร้านให้เธอ... คนที่เพิ่งเดินเข้าวงการเมื่อวาน": "And then he hands his shop to you... someone who walked into the trade yesterday.",
  "พูดตรงๆ นะ ฉันไม่ชอบมีคู่แข่ง โดยเฉพาะมือใหม่ที่ยังไม่รู้จักที่ต่ำที่สูง": "Honestly, I don't like rivals, especially beginners who don't know their place.",
  "แต่ฉันเป็นคนยุติธรรม เอางี้ — มาแข่งกันหน่อยไหม?": "But I'm a fair man. Here's the deal — how about a little contest?",
  "ใครสะสมไวน์ระดับ Unicorn 🦄 ได้ครบ 3 ขวดก่อนเป็นผู้ชนะ": "Whoever collects 3 Unicorn 🦄 wines first wins.",
  "ของพวกนั้นหายากที่สุดในตลาด ผลิตปีละไม่กี่ร้อยขวด": "They're the rarest wines on the market, only a few hundred bottles made a year.",
  "แพ้แล้วก็ปิดร้านไปซะ อย่ามาเสียเวลาฉัน... แล้วเจอกัน": "Lose, and you close your shop. Don't waste my time... See you around.",
  "สะสมไวน์ Unicorn 🦄 ให้ได้ 3 ขวด": "Collect 3 Unicorn 🦄 wines",
  "วิกเตอร์นิ่งไปครู่หนึ่ง ก่อนพยักหน้ายอมรับ \"...ไม่เลว\" (+★5, +฿150k)": "Victor goes quiet for a moment, then nods in acknowledgment: \"...Not bad.\" (+★5, +฿150k)",
  "ขวดที่โกหก": "The Bottle That Lied",
  "เธอ... มานี่เดี๋ยว อย่าเพิ่งทำหน้าแบบนั้น": "You... come here a moment. Don't look at me like that yet.",
  "จำล็อตที่ฉันแนะนำเมื่อสัปดาห์ก่อนได้ไหม": "Remember the lot I recommended last week?",
  "ฉันเพิ่งรู้ว่าผู้ขายรายนั้นโดนสมาคมขึ้นบัญชีดำไปแล้ว": "I just found out that seller has been blacklisted by the guild.",
  "ของปลอมในวงการไวน์ไม่ใช่เรื่องเล่นๆ นะ": "Fakes in the wine world are no joke.",
  "มีคดีดังที่คนขายไวน์ปลอมได้เงินไปหลายร้อยล้าน ก่อนจะโดนจับ": "There was a famous case where a counterfeiter made hundreds of millions before he was caught.",
  "เขาเติมไวน์ถูกๆ ลงในขวดเก่า แล้วพิมพ์ฉลากขึ้นมาใหม่": "He filled old bottles with cheap wine, then printed brand-new labels.",
  "วิธีสังเกต: ฉลากใหม่เกินไปสำหรับอายุขวด จุกไม่ตรงยุค ระดับน้ำในขวดสูงผิดปกติ": "How to spot them: a label too new for the bottle's age, a cork from the wrong era, a fill level suspiciously high.",
  "แต่ตาเปล่าดูยังไงก็ไม่ชัวร์ — เธอต้องมีนักชิมมืออาชีพ": "But the naked eye is never certain — you need a professional taster.",
  "ถ้าไม่มี ความสงสัยก็จะค่อยๆ ผุดขึ้นมาเองตอนเธอหยิบจับขวด": "Without one, suspicion will slowly surface on its own as you handle the bottles.",
  "จุกที่ซึม กลิ่นที่ไม่เข้าท่า ฉลากที่เก่าไม่สมวัย...": "A seeping cork, an odd smell, a label that doesn't look its age...",
  "กฎเหล็ก: อย่าขายของที่เธอไม่แน่ใจ เด็ดขาด": "Iron rule: never, ever sell something you're not sure of.",
  "ถูกจับได้ครั้งเดียว ชื่อเสียงที่สร้างมาสิบปีพังในวันเดียว": "Get caught once, and a reputation built over ten years collapses in a day.",
  "ถ้าเจอของน่าสงสัย — ทำลายทิ้งยังปลอดภัยกว่าเสี่ยงขาย": "If you find something suspicious — destroying it is safer than risking a sale.",
  "เอาล่ะ กลับไปทำงาน ทำชื่อเสียงให้ถึง ★12 แล้วมาคุยกันใหม่": "Alright, back to work. Get your reputation to ★12, then we'll talk again.",
  "ทำชื่อเสียงร้านให้ถึง ★12 (บทเรียนเรื่องของปลอม)": "Raise the shop's reputation to ★12 (the lesson about fakes)",
  "มีอาแนะนำนักชิมฝีมือดีให้รู้จัก (+฿80k, +★2)": "Mia introduces you to a skilled taster (+฿80k, +★2)",
  "ปากกาที่ขยับตลาด": "The Pen That Moves Markets",
  "ขออนุญาตนะครับ... ผมลอเรนซ์ เพียร์ส": "Pardon me... I'm Laurence Pierce.",
  "บางคนเรียกผมว่า \"ปากกาที่ขยับราคาไวน์ทั้งตลาด\"": "Some call me \"the pen that moves wine prices across the market.\"",
  "คะแนนของผมเพียงหนึ่งแต้ม ทำให้ราคาขวดหนึ่งขึ้นหรือลงเป็นล้านได้": "A single point from me can move a bottle's price up or down by a million.",
  "คุณคิดว่านั่นเป็นอำนาจใช่ไหม... ผมคิดว่ามันเป็นภาระ": "You think that's power, don't you... I think it's a burden.",
  "ผมเคยให้ 88 คะแนนกับไวน์ของโรงเล็กๆ ในอิตาลี": "I once gave 88 points to a wine from a small winery in Italy.",
  "ปีถัดมาเขาต้องขายไร่ที่ครอบครัวถือมาห้าชั่วอายุคน": "The next year, they had to sell a vineyard their family had held for five generations.",
  "ผมไม่ได้ผิด ไวน์ปีนั้นมันแย่จริงๆ แต่ผมก็ยังคิดถึงเรื่องนั้นทุกปี": "I wasn't wrong. That vintage really was poor. But I still think about it every year.",
  "ตั้งแต่นั้นผมชิมทุกขวดสามครั้ง คนละวัน ก่อนจะให้คะแนน": "Since then I taste every bottle three times, on different days, before I score it.",
  "ผมได้ยินเสียงลือเสียงเล่าอ้างถึงร้านเล็กๆ ที่จับคู่ไวน์ได้ \"มีชั้นเชิง\"": "I've heard whispers of a little shop that pairs wine with real \"finesse.\"",
  "ผมมาที่นี่เพื่อพิสูจน์ด้วยลิ้นของผมเอง ว่ามันจริงหรือแค่กระแส": "I came to prove with my own palate whether it's true or just hype.",
  "ทำชื่อเสียงร้านให้ถึง ★20 ให้ผมเห็นว่าคุณคู่ควร": "Raise the shop's reputation to ★20 and show me you're worthy.",
  "แล้วผมจะเขียนถึงคุณในคอลัมน์ — ซึ่งจะเปลี่ยนชะตาร้านนี้ไปตลอดกาล": "Then I'll write about you in my column — and it will change this shop's fate forever.",
  "ทำชื่อเสียงร้านให้ถึง ★20": "Raise the shop's reputation to ★20",
  "บทวิจารณ์ห้าดาวของเพียร์สตีพิมพ์! ลูกค้าหลั่งไหลเข้าร้าน (+฿300k)": "Pierce's five-star review is published! Customers flood in (+฿300k)",
  "ค่ำคืนแห่งการประมูล": "Night of the Auction",
  "คุณมาไกลกว่าที่ผมคาดไว้มาก... ผมจึงมีข้อเสนอ": "You've come much further than I expected... so I have an offer.",
  "คืนนี้มีการประมูลลับที่ฮ่องกง เฉพาะผู้ได้รับเชิญเท่านั้น": "Tonight there's a secret auction in Hong Kong, invitation only.",
  "และฉันคือคนที่พาเธอเข้าไปได้ 😏 มีอาไม่เคยพลาดงานแบบนี้": "And I'm the one who can get you in 😏 Mia never misses an event like this.",
  "ขวดหายากจากทั่วโลกจะมารวมกัน ราคาจะพุ่งกระฉูด": "Rare bottles from around the world will be there. Prices will skyrocket.",
  "ดูรอบตัวสิ นักสะสมพวกนี้ไม่ได้มาซื้อไวน์": "Look around. These collectors aren't here to buy wine.",
  "เขามาซื้อสิทธิ์ที่จะบอกว่า \"ฉันมีขวดนั้น\"": "They're buying the right to say, \"I own that bottle.\"",
  "...เธอก็มาด้วยเหรอ น่าสนใจ": "...You're here too? Interesting.",
  "ระวังตัวหน่อยนะ ในห้องนี้มีคนที่ยอมจ่ายเกินราคาสามเท่าเพื่อเอาชนะ": "Be careful. There are people in this room who'll pay three times the price just to win.",
  "ฉันเคยเป็นคนนั้น... และมันเกือบทำให้ฉันหมดตัว": "I used to be one of them... and it nearly ruined me.",
  "ถือว่าเป็นการวัดฝีมือกันอีกครั้งก็แล้วกัน": "Let's call it another test of skill, then.",
  "เอาล่ะ ทุกคนเงียบ การประมูลกำลังจะเริ่ม": "Alright, everyone quiet. The auction is about to begin.",
  "จำไว้ — คนที่ชนะทุกครั้ง คือคนที่จ่ายแพงเกินทุกครั้ง": "Remember — the one who wins every time is the one who overpays every time.",
  "พิสูจน์ให้เห็นว่าเธอเล่นในลีกใหญ่ได้ — ทำมูลค่าพอร์ตให้ถึง ฿5,000,000": "Prove you can play in the big leagues — grow your portfolio to ฿5,000,000.",
  "ทำมูลค่าพอร์ตถึง ฿5M": "Grow your portfolio to ฿5M",
  "คุณคว้าขวดสำคัญมาได้ในค่ำคืนประวัติศาสตร์ (+฿250k, +★5)": "You claimed an important bottle on a historic night (+฿250k, +★5)",
  "ดินที่พูดได้": "The Soil That Speaks",
  "นั่งลงสิ ฉันจะเล่าเรื่องที่ไม่มีในหนังสือให้ฟัง": "Sit down. I'll tell you something that's not in any book.",
  "เธอเคยสงสัยไหมว่าทำไมองุ่นพันธุ์เดียวกัน ปลูกห่างกันร้อยเมตร รสถึงต่างกันลิบ": "Have you ever wondered why the same grape, planted a hundred meters apart, can taste so different?",
  "คนฝรั่งเศสเรียกมันว่า terroir — แต่คำแปลว่า \"ดิน\" นั้นตื้นเกินไป": "The French call it terroir — but translating it as just \"soil\" is far too shallow.",
  "มันคือดิน บวกความลาดชัน บวกทิศที่แดดส่อง บวกลมที่พัดผ่าน": "It's the soil, plus the slope, plus the direction of the sun, plus the wind that blows through.",
  "บวกกับสี่สิบชั่วอายุคนที่เรียนรู้ว่าตรงไหนควรปลูกอะไร": "Plus forty generations learning what should be planted where.",
  "ชาบลีมีรสเปลือกหอย เพราะเมื่อร้อยห้าสิบล้านปีก่อนที่นั่นเป็นทะเล": "Chablis tastes of seashells because a hundred and fifty million years ago it was a sea.",
  "ดินของมันเต็มไปด้วยฟอสซิลหอยนางรม เธอชิมทะเลโบราณอยู่จริงๆ": "Its soil is full of fossil oysters. You really are tasting an ancient ocean.",
  "ปริโอรัตในสเปนปลูกบนหินชนวนที่รากต้องชอนไชลงไปยี่สิบเมตรกว่าจะเจอน้ำ": "In Spain's Priorat, vines grow on slate, and the roots dig twenty meters down to find water.",
  "ต้นที่ทรมานที่สุด ให้ผลที่เข้มข้นที่สุด — มันจริงทั้งกับองุ่นและกับคน": "The vines that suffer most give the most concentrated fruit — true for grapes and for people.",
  "บาโรโลสีซีดจนเธอนึกว่าอ่อน แล้วมันก็ฉีกลิ้นเธอด้วยแทนนิน": "Barolo is so pale you'd think it's light, and then it tears your tongue apart with tannin.",
  "อย่าตัดสินไวน์จากสี อย่าตัดสินคนจากหน้าตา": "Don't judge a wine by its color, and don't judge a person by their looks.",
  "เอาล่ะ บททดสอบ — เก็บไวน์จาก 8 ภูมิภาคที่ต่างกันมาให้ฉันดู": "Now, your trial — gather wines from 8 different regions and show me.",
  "แล้วมานั่งเล่าให้ฉันฟังว่าแต่ละที่มันต่างกันตรงไหน": "Then sit down and tell me how each place is different.",
  "สะสมไวน์จาก 8 ภูมิภาคที่ต่างกัน": "Collect wines from 8 different regions",
  "🌍 อาจารย์พยักหน้าช้าๆ \"ตอนนี้เธอเริ่มชิมด้วยหัวแล้ว\" (+฿200k, +★4)": "🌍 The mentor nods slowly: \"Now you're starting to taste with your head.\" (+฿200k, +★4)",
  "ตำนานบทใหม่": "A New Legend",
  "เธอรู้ไหม... ตอนที่ฉันยกร้านนี้ให้ ฉันแอบสงสัยว่าตัดสินใจถูกหรือเปล่า": "You know... when I handed you this shop, I secretly wondered if I'd made the right choice.",
  "แต่วันนี้ ฉันภูมิใจในตัวเธอยิ่งกว่าที่เคยภูมิใจในตัวเอง": "But today, I'm prouder of you than I ever was of myself.",
  "เธอเข้าใจแล้วว่าไวน์คือเรื่องราว ไม่ใช่แค่สินทรัพย์": "You understand now that wine is a story, not just an asset.",
  "ป้าก็ดีใจด้วยนะหนู! ตอนนี้ชมรมไวน์ทั้งเมืองพูดถึงร้านเราหมดเลย": "Auntie's so happy for you, dear! The whole city's wine clubs are talking about our shop.",
  "เทรดเดอร์ทุกคนอยากได้เธอเป็นพันธมิตร ยินดีด้วยจริงๆ": "Every trader wants you as a partner. Truly, congratulations.",
  "...ฉันยอมรับ เธอเก่งกว่าที่ฉันคิดไว้เยอะ เราน่าจะจับมือกันได้แล้ว": "...I admit it. You're much better than I thought. Maybe we can shake hands now.",
  "แต่ฉันต้องเตือนอย่างหนึ่ง ตอนนี้แหละคือช่วงที่อันตรายที่สุด": "But I must warn you about one thing. This is the most dangerous time of all.",
  "คนที่พังไม่ใช่คนที่ล้มเหลว แต่คือคนที่สำเร็จแล้วเริ่มเชื่อว่าตัวเองไม่มีวันพลาด": "The ones who fall aren't the ones who fail, but the ones who succeed and start believing they can never be wrong.",
  "บททดสอบสุดท้ายของฉัน เพื่อจารึกชื่อเธอลงในตำนาน": "My final trial, to write your name into legend.",
  "สร้างอาณาจักรที่แท้จริง — ทำมูลค่าพอร์ตให้ถึง ฿10,000,000": "Build a true empire — grow your portfolio to ฿10,000,000.",
  "แล้วเธอจะไม่ใช่แค่เจ้าของร้าน... แต่เป็นตำนานบทใหม่ของวงการไวน์": "Then you won't just be a shop owner... you'll be the wine world's new legend.",
  "ทำมูลค่าพอร์ตถึง ฿10M": "Grow your portfolio to ฿10M",
  "🏆 ชื่อของคุณเริ่มถูกพูดถึงในระดับนานาชาติ (+★10, +฿200k)": "🏆 Your name is starting to be spoken internationally (+★10, +฿200k)",
  "ดาวดวงแรก": "The First Star",
  "ผมมีข่าวที่จะเปลี่ยนชีวิตคุณไปตลอดกาล": "I have news that will change your life forever.",
  "คณะกรรมการมิชลินกำลังจับตาร้านของคุณอยู่": "The Michelin committee is watching your shop.",
  "พวกเขาไม่ได้ดูแค่ไวน์ แต่ดูความสม่ำเสมอ การบริการ ทีมงาน": "They don't just look at the wine, but at consistency, service, and the team.",
  "ผมเคยเห็นร้านที่อาหารเทพมาก แต่ไม่ได้ดาว": "I've seen restaurants with divine food that never got a star.",
  "เพราะเชฟทำเองทุกอย่าง วันที่เขาป่วย ร้านก็ไม่เหลืออะไรเลย": "Because the chef did everything himself. The day he fell ill, the restaurant had nothing left.",
  "ร้านที่มีดาวต้องมีทีมที่แข็งแกร่ง ไม่ใช่เจ้าของที่ทำทุกอย่างคนเดียว": "A starred restaurant needs a strong team, not an owner who does everything alone.",
  "ซอมเมอลิเยร์ที่จับคู่แทนคุณได้ นักชิมที่ตรวจของแทนคุณได้": "A sommelier who can pair for you, a taster who can check stock for you.",
  "วันที่คุณไม่อยู่ ร้านต้องดีเท่าวันที่คุณอยู่ — นั่นแหละคือดาว": "On the days you're not there, the shop must be as good as when you are — that's what a star means.",
  "จ้างทีมงานให้ครบ 4 คน แล้วรักษาชื่อเสียงให้ถึง ★40": "Hire a full team of 4 and keep your reputation at ★40.",
  "ทำได้ — ผมจะเสนอชื่อร้านคุณเข้าพิจารณาด้วยตัวเอง": "Do it — and I'll nominate your shop for consideration myself.",
  "จ้างพนักงาน 4 คน + ชื่อเสียง ★40": "Hire 4 staff + ★40 reputation",
  "⭐ ร้านของคุณได้รับดาวมิชลินดวงแรก! (+฿400k, +★5)": "⭐ Your shop has earned its first Michelin star! (+฿400k, +★5)",
  "นักสะสมระดับโลก": "World-Class Collector",
  "เธอกลายเป็นคนที่ทุกคนในวงการอยากรู้จักแล้วนะ": "You've become someone everyone in the trade wants to know.",
  "แต่นักสะสมตัวจริงไม่ได้วัดกันที่เงิน — วัดกันที่ \"ความกว้าง\"": "But true collectors aren't measured by money — they're measured by \"breadth.\"",
  "คนที่มีแต่บอร์กโดซ์ ไม่ใช่นักสะสม เป็นแค่นักลงทุน": "Someone who owns only Bordeaux isn't a collector, just an investor.",
  "ฉันเคยเข้าเซลลาร์ของมหาเศรษฐีคนหนึ่ง มีแต่ขวดละล้านทั้งหมด": "I once visited a billionaire's cellar where every bottle cost a million.",
  "สวยมาก แต่ไม่มีวิญญาณเลย เหมือนห้องสมุดที่มีแต่หนังสือที่ไม่มีใครอ่าน": "Beautiful, but soulless. Like a library full of books nobody reads.",
  "เธอต้องเข้าใจไวน์จากทุกมุมโลก ทุกสไตล์ ทุกเทอรัวร์": "You need to understand wine from every corner of the world, every style, every terroir.",
  "ญี่ปุ่นทำโคชูที่บางเบาจนเกือบโปร่งใส เลบานอนทำไวน์ในหุบเขาที่มีสงคราม": "Japan makes Koshu so light it's almost transparent. Lebanon makes wine in a valley touched by war.",
  "กรีซใช้องุ่นที่คนปลูกมาตั้งแต่ก่อนโรมันเกิด": "Greece uses grapes people grew before Rome was even born.",
  "สะสมไวน์ให้ครบ 12 ภูมิภาคที่แตกต่างกันในเซลลาร์": "Collect wines from 12 different regions in your cellar.",
  "ทำได้เมื่อไหร่ ฉันจะเปิดประตูสู่วงในระดับโลกให้เธอ": "When you do, I'll open the door to the world's inner circle for you.",
  "อ้อ — แล้วมีอีกเรื่องที่เธอต้องรู้ก่อนเข้าวงใน": "Oh — and there's one more thing you need to know before you join the inner circle.",
  "ของหายากระดับนั้น เขาไม่ขายให้ใครง่ายๆ ต่อให้เธอถือเงินสดไปกองตรงหน้า": "Bottles at that level aren't sold easily, even if you pile cash in front of them.",
  "พ่อค้าคนกลางจะบังคับ 'ขายพ่วง' — อยากได้กร็องด์ครูหนึ่งลัง ต้องรับไวน์ระดับภูมิภาคไปด้วยห้าลัง": "The négociants force 'bundling' — want one case of Grand Cru, and you have to take five cases of regional wine too.",
  "เขาเรียกมันว่าโควตา ฉันเรียกมันว่าค่าผ่านประตู": "They call it an allocation. I call it the price of admission.",
  "เธอต้องคำนวณเองว่ากำไรจากขวดแรร์ คุ้มกับเงินสดและพื้นที่ที่จมไปกับของพ่วงไหม": "You'll have to work out whether the profit on the rare bottle is worth the cash and space sunk into the bundle.",
  "บางคนรับหมดทุกโควตาจนเซลลาร์เต็มไปด้วยของขายไม่ออก แล้วก็เจ๊ง": "Some people accept every allocation until their cellar is full of wine nobody wants, and then they go bust.",
  "เปิดหน้า 'ธุรกิจ' ไว้ ฉันจะส่งข้อเสนอไปให้เรื่อยๆ": "Keep the 'Business' page open. I'll keep sending you offers.",
  "สะสมไวน์จาก 12 ภูมิภาคที่ต่างกัน": "Collect wines from 12 different regions",
  "🌍 คุณได้รับเชิญเข้าสมาคมนักสะสมระดับโลก (+฿500k, +★8)": "🌍 You've been invited into the world collectors' society (+฿500k, +★8)",
  "พันธมิตรที่ไม่คาดฝัน": "An Unexpected Ally",
  "...ฉันมีเรื่องจะสารภาพ": "...I have something to confess.",
  "Cruz Cellars กำลังจะปิดตัว ฉันขยายเร็วเกินไปจนหนี้ท่วม": "Cruz Cellars is about to close. I expanded too fast and drowned in debt.",
  "สามสาขาในสองปี ทุกที่ตกแต่งหรูกว่าที่จำเป็น": "Three branches in two years, each one fitted out far more lavishly than needed.",
  "ฉันซื้อขวดละหลายแสนมาโชว์ในตู้ ทั้งที่ไม่มีลูกค้าคนไหนซื้อไหว": "I bought bottles worth hundreds of thousands just to show off in the cabinets, though no customer could afford them.",
  "ตลอดมาฉันคิดว่าการชนะคือการมีของแพงที่สุด": "All along I thought winning meant owning the most expensive things.",
  "วันหนึ่งมีเด็กเดินเข้ามาถามว่ามีไวน์ราคาห้าร้อยไหม": "One day a kid walked in and asked if we had a wine for five hundred baht.",
  "พนักงานฉันหัวเราะใส่เขา... แล้วเขาก็เดินออกไป": "My staff laughed at him... and he walked out.",
  "คืนนั้นฉันนั่งอยู่ในร้านที่เงียบสนิท ล้อมรอบด้วยขวดที่ไม่มีใครรัก": "That night I sat in a silent shop, surrounded by bottles nobody loved.",
  "แต่เธอสอนฉันว่ามันคือการทำให้คนรักไวน์ต่างหาก": "But you taught me it's really about making people love wine.",
  "ฉันมาขอ... ไม่สิ ฉันมาเสนอตัวมาร่วมงานกับเธอ": "I've come to ask... no, I've come to offer myself to work with you.",
  "เซลลาร์ของฉันมีของดีอยู่ ถ้าเธอมีทุนพอที่จะรับช่วงต่อ": "My cellar still has good stock, if you have the capital to take it over.",
  "ทำเงินสดให้ถึง ฿5,000,000 แล้วมารับกิจการฉันไปเถอะ": "Get your cash to ฿5,000,000 and take over my business.",
  "มีเงินสด ฿5M เพื่อรับช่วงกิจการคู่แข่ง": "Have ฿5M in cash to take over the rival's business",
  "🤝 วิกเตอร์กลายเป็นหุ้นส่วน! เซลลาร์รวมกันเป็นหนึ่ง (+★10)": "🤝 Victor becomes your partner! The cellars are merged into one (+★10)",
  "ค่ำคืนของป้าโรซ่า": "Auntie Rosa's Evening",
  "หนูจ๊ะ... ป้าอยากขออะไรอย่างหนึ่ง": "Dear... there's something Auntie would like to ask.",
  "สัปดาห์หน้าเป็นวันครบรอบแต่งงานปีที่ห้าสิบของป้า": "Next week is my fiftieth wedding anniversary.",
  "สามีป้าเคยสัญญาว่าจะเปิดขวดพิเศษด้วยกัน... แต่เขาจากไปก่อน": "My husband promised we'd open a special bottle together... but he passed away first.",
  "เขาเก็บขวดหนึ่งไว้ตั้งแต่ปีที่เราแต่งงาน บอกว่า \"รอวันครบห้าสิบนะ\"": "He kept a bottle from the year we married and said, \"Let's wait for our fiftieth.\"",
  "ป้าเปิดมันเมื่อปีก่อน... มันเสียไปแล้วจ้ะ เก็บนานเกินไป": "I opened it last year... it had gone bad, dear. Kept too long.",
  "ป้านั่งร้องไห้อยู่คนเดียวทั้งคืน ไม่ใช่เพราะไวน์เสียหรอก": "I sat crying alone all night, and not because the wine was spoiled.",
  "แต่เพราะป้าเพิ่งเข้าใจว่า เราไม่ควรรอวันที่สมบูรณ์แบบ": "But because I finally understood that we shouldn't wait for the perfect day.",
  "ขวดที่ดีที่สุดคือขวดที่เปิดกับคนที่ยังอยู่": "The best bottle is the one you open with the people still here.",
  "ป้าอยากจัดงานเล็กๆ ที่ร้านนี้ ที่ที่เราเคยมาด้วยกันทุกศุกร์": "I'd like to hold a small gathering here, where we used to come together every Friday.",
  "ช่วยเตรียมไวน์ระดับตำนานให้ป้าหน่อยได้ไหมจ๊ะ": "Could you prepare some legendary wines for me, dear?",
  "ไวน์ Unicorn 🦄 สัก 6 ขวด สำหรับเพื่อนๆ ทุกคนที่จะมา": "Six Unicorn 🦄 wines, for all the friends who'll come.",
  "ป้าจะจ่ายเต็มราคา ไม่ต้องเกรงใจนะ": "I'll pay full price, don't you worry.",
  "แล้วเราจะเปิดมันทุกขวดในคืนเดียว ไม่เก็บไว้แม้แต่ขวดเดียว": "And we'll open every one of them in a single night, not keeping even one.",
  "อ้อ — หลานชายป้าเป็นเชฟนะจ๊ะ เขาจะมาด้วยคืนนั้น": "Oh — my grandson is a chef, you know. He'll come that night too.",
  "เขาเปิดร้านที่เพิ่งได้ดาวมิชลินดวงแรกเมื่อปีก่อน": "His restaurant just earned its first Michelin star last year.",
  "ป้าเล่าให้เขาฟังเรื่องร้านหนูตลอด เขาอยากชิมฝีมือจัดไวน์ของหนูมานานแล้ว": "I've told him all about your shop. He's long wanted to taste your wine pairing skills.",
  "ถ้าเขาถูกใจ... เขาอาจจะชวนหนูทำอะไรที่ใหญ่กว่าการขายทีละขวดก็ได้นะ": "If he likes it... he might invite you into something bigger than selling one bottle at a time.",
  "เตรียมไวน์ Unicorn 🦄 6 ขวดสำหรับงานของป้าโรซ่า": "Prepare 6 Unicorn 🦄 wines for Auntie Rosa's gathering",
  "💐 งานประสบความสำเร็จงดงาม — หลานชายป้าโรซ่ายื่นนามบัตรให้ก่อนกลับ \"พรุ่งนี้ผมจะติดต่อมานะครับ\" 🍽️ ปลดล็อก: สัญญาส่งร้านอาหาร (หน้าธุรกิจ) (+฿6.4M, +★15)": "💐 The evening is a beautiful success — Auntie Rosa's grandson hands you his card before leaving: \"I'll be in touch tomorrow.\" 🍽️ Unlocked: restaurant contracts (Business page) (+฿6.4M, +★15)",
  "จดหมายที่ไม่เคยส่ง": "The Letters Never Sent",
  "เธอเจอกล่องไม้ในซอกหลังชั้นวางแล้วสินะ": "So you've found the wooden box tucked behind the shelves.",
  "ฉันตั้งใจให้เธอเจอตอนที่เธอพร้อม ไม่ใช่ก่อนหน้านั้น": "I meant for you to find it when you were ready, not before.",
  "ข้างในคือจดหมายที่ฉันเขียนถึงลูกสาว สี่สิบสองฉบับ ไม่เคยส่งสักฉบับ": "Inside are letters I wrote to my daughter. Forty-two of them, and I never sent a single one.",
  "ทุกปีที่ฉันชิมไวน์ปีที่เธอเกิด ฉันจะเขียนหนึ่งฉบับ": "Every year I tasted a wine from the year she was born, I wrote one letter.",
  "ปีแรกๆ ฉันเขียนว่ารอเธอกลับมา": "In the early years, I wrote that I was waiting for her to come home.",
  "ปีหลังๆ ฉันแค่เล่าให้ฟังว่าปีนี้ฝนตกเป็นยังไง องุ่นสุกทันไหม": "In the later years, I just told her how the rain fell that year, whether the grapes ripened in time.",
  "เธอรู้ไหมว่าทำไมฉันถึงเลือกเธอ ทั้งที่เธอไม่มีประสบการณ์เลย": "Do you know why I chose you, even though you had no experience at all?",
  "วันที่เธอเดินเข้ามาครั้งแรก เธอถามฉันว่า \"ขวดนี้มีเรื่องอะไร\"": "The first day you walked in, you asked me, \"What's the story behind this bottle?\"",
  "ไม่ได้ถามว่าราคาเท่าไหร่ ไม่ได้ถามว่าคะแนนกี่แต้ม": "You didn't ask the price. You didn't ask how many points it scored.",
  "คนสิบปีที่ผ่านมาไม่มีใครถามฉันแบบนั้นเลยสักคน": "In ten years, not a single person had asked me that.",
  "ฉันไม่ได้ยกร้านให้เธอเพราะเธอเก่ง — ฉันยกให้เพราะเธอ \"ฟังเป็น\"": "I didn't give you the shop because you're talented — I gave it to you because you \"know how to listen.\"",
  "ตอนนี้ถึงตาเธอแล้ว หาคนที่จะฟังต่อจากเธอให้เจอ": "Now it's your turn. Find the one who will listen after you.",
  "แต่ก่อนอื่น — พาร้านนี้ไปให้ถึงจุดที่ฉันไปไม่ถึง": "But first — take this shop to a place I never reached.",
  "มูลค่าพอร์ต ฿18,000,000 ฉันเคยไปได้สูงสุดแค่สิบสอง": "A portfolio of ฿18,000,000. The highest I ever reached was twelve.",
  "ทำมูลค่าพอร์ตถึง ฿18M — ข้ามสถิติของอาจารย์": "Grow your portfolio to ฿18M — beat the mentor's record",
  "📜 คุณข้ามสถิติที่อาจารย์ทำไว้ทั้งชีวิต (+★12, +฿600k)": "📜 You've surpassed the record your mentor set in a lifetime (+★12, +฿600k)",
  "เรื่องอื้อฉาวขวดหมื่นล้าน": "The Billion-Baht Bottle Scandal",
  "คุณเห็นข่าวเช้านี้หรือยัง": "Have you seen this morning's news?",
  "นักสะสมชื่อดังถูกจับ พบว่าขายไวน์ปลอมมานานกว่าสิบปี": "A famous collector was arrested, found to have been selling fakes for over ten years.",
  "ฉันเคยซื้อจากเขานะ... สองขวด ตอนที่เพิ่งเข้าวงการ": "I bought from him once... two bottles, when I was new to the trade.",
  "เพิ่งรู้เมื่อเช้าว่าทั้งสองขวดเป็นของปลอม": "I only found out this morning that both were fakes.",
  "ทั้งวงการสั่นไปหมด ราคาของหายากดิ่งลงเพราะไม่มีใครเชื่อใจใครแล้ว": "The whole trade is shaken. Rare wine prices are plunging because nobody trusts anyone anymore.",
  "นั่นคือสิ่งที่ของปลอมทำลาย — ไม่ใช่เงิน แต่คือความไว้ใจ": "That's what fakes destroy — not money, but trust.",
  "ตลาดไวน์สะสมทั้งตลาดยืนอยู่บนความเชื่อว่า \"ในขวดคือสิ่งที่ฉลากบอก\"": "The whole fine wine market stands on the belief that \"what's in the bottle is what the label says.\"",
  "ถ้าความเชื่อนั้นพัง ทุกขวดในโลกก็เป็นแค่แก้วกับของเหลว": "If that belief breaks, every bottle in the world is just glass and liquid.",
  "แล้วเราจะรู้ได้ยังไงล่ะจ๊ะว่าขวดไหนจริงขวดไหนปลอม": "Then how can we ever know which bottles are real and which are fake, dear?",
  "เราจะไม่มีวันรู้ร้อยเปอร์เซ็นต์ ป้าโรซ่า": "We can never be one hundred percent sure, Auntie Rosa.",
  "เราทำได้แค่ซื้อจากคนที่เราไว้ใจ และเป็นคนที่คนอื่นไว้ใจได้": "All we can do is buy from people we trust, and be someone others can trust.",
  "ตอนนี้แหละคือโอกาสของคุณ ตลาดกลัว ราคาถูก": "This is your opportunity. The market is scared and prices are low.",
  "แต่ถ้าคุณขายของที่ไม่แน่ใจแม้แต่ขวดเดียวในช่วงนี้ — จบเลย": "But if you sell even one bottle you're unsure of during this time — it's over.",
  "สร้างชื่อเสียงให้ถึง ★60 ในตลาดที่ทุกคนระแวงกัน": "Build your reputation to ★60 in a market where everyone is suspicious.",
  "คนที่รอดจากวิกฤตแบบนี้ คือคนที่จะครองตลาดหลังจากนั้น": "Those who survive a crisis like this are the ones who dominate the market afterward.",
  "ทำชื่อเสียงถึง ★60 ท่ามกลางวิกฤตความเชื่อมั่น": "Reach ★60 reputation amid a crisis of confidence",
  "🛡️ ร้านของคุณกลายเป็นชื่อที่วงการไว้ใจที่สุด (+฿900k, +★5)": "🛡️ Your shop has become the most trusted name in the trade (+฿900k, +★5)",
  "เซลลาร์แห่งศตวรรษ": "The Cellar of the Century",
  "เธอทำได้ทุกอย่างที่ฉันเคยฝันไว้ และมากกว่านั้น": "You've done everything I ever dreamed of, and more.",
  "แต่มีสิ่งหนึ่งที่ฉันไม่เคยทำสำเร็จ...": "But there's one thing I never managed to achieve...",
  "\"เซลลาร์แห่งศตวรรษ\" — คอลเลกชันที่สมบูรณ์แบบจนคนรุ่นหลังต้องกล่าวขาน": "\"The Cellar of the Century\" — a collection so perfect that generations to come will speak of it.",
  "ผมเคยเห็นเซลลาร์ระดับนั้นเพียงสองแห่งในชีวิต": "I've only seen two cellars of that caliber in my life.",
  "แห่งแรกอยู่ในปราสาทที่สกอตแลนด์ เจ้าของไม่เคยเปิดให้ใครดู": "The first was in a castle in Scotland. The owner never let anyone see it.",
  "แห่งที่สองอยู่ใต้ร้านอาหารเล็กๆ ในลียง เจ้าของเปิดให้ทุกคนเข้าฟรี": "The second was beneath a little restaurant in Lyon. The owner let everyone in for free.",
  "เดาสิว่าแห่งไหนที่ผมยังฝันถึงอยู่ทุกคืน": "Guess which one I still dream about every night.",
  "มูลค่าระดับนั้นต้องใช้ทั้งฝีมือและความอดทนมหาศาล": "Value on that scale takes both skill and enormous patience.",
  "แต่ถ้าเป็นเธอ... ฉันเชื่อว่าทำได้": "But if it's you... I believe you can do it.",
  "ป้าจะรอดูวันนั้นนะจ๊ะ": "Auntie will wait to see that day, dear.",
  "สร้างมันขึ้นมา — มูลค่าพอร์ต ฿30,000,000": "Build it — a portfolio of ฿30,000,000.",
  "แล้วชื่อของเธอจะอยู่คู่กับไวน์ไปอีกร้อยปี": "And your name will live alongside wine for a hundred years.",
  "ทำมูลค่าพอร์ตถึง ฿30M — เซลลาร์แห่งศตวรรษ": "Grow your portfolio to ฿30M — the Cellar of the Century",
  "🏛️ คุณสร้างเซลลาร์แห่งศตวรรษสำเร็จ! ตำนานที่แท้จริง (+★25, +฿1M)": "🏛️ You've built the Cellar of the Century! A true legend (+★25, +฿1M)",
  "เก้าอี้ตัวที่สาม": "The Third Chair",
  "หนูจ๊ะ ป้าไม่ได้มาซื้อไวน์วันนี้": "Dear, Auntie didn't come to buy wine today.",
  "ป้ามาบอกลา ลูกชายจะพาป้าไปอยู่ต่างจังหวัดกับเขา": "I came to say goodbye. My son is taking me to live with him in the countryside.",
  "ห้าสิบสองปีที่ป้านั่งเก้าอี้ตัวที่สามจากหน้าต่างนี้": "Fifty-two years I've sat in the third chair from this window.",
  "ป้าเห็นร้านนี้เปลี่ยนเจ้าของสองครั้ง เห็นถนนหน้าร้านเปลี่ยนไปหมด": "I've seen this shop change hands twice, and seen the street outside change completely.",
  "แต่แสงตอนห้าโมงเย็นยังตกลงตรงเดิมทุกวันเลยนะ": "But the five o'clock light still falls in the same place every day.",
  "ป้ามีของจะให้ — สมุดเล่มนี้": "I have something for you — this notebook.",
  "ป้าจดไว้ทุกครั้งที่ดื่มอะไรที่นี่ ตั้งแต่ปี 1974": "I wrote down every drink I had here, since 1974.",
  "ไม่ได้จดชื่อไวน์อย่างเดียวนะ จดว่าวันนั้นเกิดอะไรขึ้นด้วย": "Not just the name of the wine, mind you. What happened that day, too.",
  "\"วันที่ลูกคนแรกเดินได้ — ดื่มบูร์กอญกับสามี\"": "\"The day our first child took his first steps — Bourgogne with my husband.\"",
  "\"วันที่เขาจากไป — ดื่มน้ำเปล่า นั่งเก้าอี้ตัวเดิม\"": "\"The day he passed away — plain water, sitting in the same chair.\"",
  "ทุกขวดในสมุดนี้ ป้าจำได้หมดว่าดื่มกับใคร": "Every bottle in this book, I remember exactly who I drank it with.",
  "นั่นแหละคือสิ่งที่หนูขายอยู่จ้ะ ไม่ใช่ไวน์ แต่เป็นวันที่คนจะจำได้": "That's what you're really selling, dear. Not wine, but days people will remember.",
  "เก็บเก้าอี้ตัวนั้นไว้ให้ลูกค้าคนต่อไปนะ": "Keep that chair for the next customer.",
  "แล้วทำให้ร้านนี้ใหญ่พอที่จะมีเก้าอี้ให้ทุกคน — พอร์ต ฿45,000,000": "And make this shop big enough to have a chair for everyone — a ฿45,000,000 portfolio.",
  "ทำมูลค่าพอร์ตถึง ฿45M — ที่ว่างสำหรับทุกคน": "Grow your portfolio to ฿45M — room for everyone",
  "🪑 คุณติดป้ายเล็กๆ บนเก้าอี้ตัวที่สาม \"สำหรับผู้ที่มาบ่อยๆ\" (+฿12M, +★20)": "🪑 You put a small sign on the third chair: \"For those who come often\" (+฿12M, +★20)",
  "คนที่ฟังเป็น": "The One Who Listens",
  "นี่คือครั้งสุดท้ายที่เธอจะได้ยินเสียงฉันนะ": "This is the last time you'll hear my voice.",
  "ไม่ใช่เพราะฉันจะหายไป แต่เพราะเธอไม่ต้องการฉันแล้ว": "Not because I'm disappearing, but because you don't need me anymore.",
  "ผมเขียนบทความสุดท้ายเรื่องคุณเมื่อสัปดาห์ก่อน แล้วก็วางปากกา": "I wrote my last article about you last week, and then I put down my pen.",
  "สามสิบปีที่ผมให้คะแนนไวน์ ผมเพิ่งเข้าใจว่าคะแนนวัดได้แค่ขวด": "Thirty years of scoring wine, and I've only just understood that a score measures only the bottle.",
  "มันวัดไม่ได้ว่าใครนั่งดื่มมันด้วยกัน": "It can't measure who sat and drank it together.",
  "ฉันปิดโต๊ะเทรดแล้วนะ ไปเปิดร้านเล็กๆ ในชนบท": "I've closed my trading desk, you know. I'm opening a little shop in the countryside.",
  "ขายไวน์ขวดละสามร้อยให้ชาวบ้าน มีความสุขกว่าที่คิดเยอะ": "Selling wine for three hundred baht a bottle to the locals. Happier than I ever expected.",
  "ส่วนฉันดูแลสาขาที่สองให้เธอ และจะไม่หัวเราะใส่ใครที่ถามหาไวน์ราคาห้าร้อยอีก": "As for me, I'm running your second branch, and I'll never laugh at anyone asking for a five-hundred-baht wine again.",
  "เห็นไหม เธอไม่ได้แค่สร้างธุรกิจ เธอเปลี่ยนคนรอบตัวไปด้วย": "You see? You didn't just build a business. You changed the people around you.",
  "มีเด็กคนหนึ่งมายืนหน้าร้านทุกเย็นนะ เธอสังเกตไหม": "There's a kid who stands in front of the shop every evening. Have you noticed?",
  "เมื่อวานเขาเดินเข้ามาถามเธอว่า \"ขวดนี้มีเรื่องอะไรครับ\"": "Yesterday he walked in and asked you, \"What's the story behind this bottle?\"",
  "เธอตอบเขาไปยาวยี่สิบนาที ตาเป็นประกาย เหมือนที่ฉันเคยทำ": "You answered him for twenty minutes, eyes shining, just like I used to.",
  "วงจรนี้ไม่มีวันจบ ตราบใดที่ยังมีคนที่ฟังเป็น": "This cycle never ends, as long as there are people who know how to listen.",
  "ทำให้ครบสมบูรณ์ที่สุดเท่าที่จะทำได้ — ไวน์จาก 18 ภูมิภาค": "Make it as complete as you possibly can — wines from 18 regions.",
  "แล้วสอนเขาให้หมดทุกอย่างที่เธอรู้": "And then teach him everything you know.",
  "ขอบใจนะ... ที่ฟังฉันมาตลอด": "Thank you... for always listening to me.",
  "สะสมไวน์จาก 18 ภูมิภาค — ส่งต่อความรู้ทั้งหมด": "Collect wines from 18 regions — pass on everything you know",
  "🕯️ วงจรครบรอบ — คุณกลายเป็นอาจารย์ของใครสักคนแล้ว (+★40, +฿2M)": "🕯️ The circle is complete — you've become someone's mentor now (+★40, +฿2M)",
  "ทุกขวดเริ่มต้นจากดินผืนหนึ่ง<br>และปีที่ฟ้าเป็นใจ": "Every bottle begins with a patch of earth<br>and a year when the sky was kind",
  "บางขวดถูกเก็บไว้นานกว่าชีวิตคน<br>รอวันที่มีคนเข้าใจมันจริงๆ": "Some bottles are kept longer than a human life<br>waiting for someone who truly understands them",
  "จดหมายฉบับหนึ่งมาถึงคุณในเช้าวันฝนตก<br>ลายมือหนักแน่น เขียนด้วยหมึกสีน้ำเงินเข้ม": "A letter reaches you on a rainy morning<br>in firm handwriting, written in deep blue ink",
  "\"สี่สิบปีแล้วที่ฉันเฝ้าเซลลาร์นี้<br>ถึงเวลาที่ใครสักคนจะรับช่วงต่อ — มาหาฉันบ่ายวันศุกร์\"": "\"For forty years I have kept watch over this cellar.<br>It's time for someone to take over — come and see me Friday afternoon.\"",
  "หลายปีผ่านไป เซลลาร์ที่เคยเงียบเหงา<br>กลับมามีชีวิตอีกครั้ง": "Years pass, and the cellar that once stood silent<br>comes alive once again",
  "คุณเสิร์ฟลูกค้าไปแล้ว": "You have served",
  "คน": "customers",
  "แต่ละคนมีค่ำคืนที่จำได้ไม่ลืม": "each with an evening they'll never forget",
  "ไวน์ในตำนานที่คุณตามหาจนพบ:": "Legendary wines you hunted down:",
  "/8 ขวด": "/8 bottles",
  "มูลค่ากิจการ": "Business value",
  "\"ไวน์ที่ไม่ได้เปิดก็เป็นแค่ของเหลวในแก้ว\"<br>คำของอาจารย์ยังก้องอยู่": "\"An unopened wine is just liquid in glass\"<br>The mentor's words still echo",
  "คืนนี้คุณเปิดขวดที่เก็บไว้นานที่สุด<br>ไม่ได้ขาย ไม่ได้ประเมินราคา — แค่ดื่ม": "Tonight you open the bottle you kept the longest<br>not to sell, not to appraise — just to drink",
  "จบบริบูรณ์ · ขอบคุณที่ร่วมเดินทาง": "The End · Thank you for sharing the journey",
  "ข้าม": "Skip",
  "จบเกม": "Finish",
  "เริ่มเรื่องราว": "Begin the Story",
  "ถัดไป ▶": "Next ▶",
  "ยินดีต้อนรับสู่ Cellar & Vine": "Welcome to Cellar & Vine",
  "คุณเพิ่งได้รับมรดกเป็นร้านไวน์และเซลลาร์ เป้าหมายคือสร้างอาณาจักรไวน์ผ่าน 3 เสาหลัก:<br><br>🏪 <b>ขายไวน์ในร้าน</b> — จับคู่ไวน์กับอาหารให้ลูกค้า<br>📈 <b>เทรดในตลาดรอง</b> — ซื้อถูกขายแพงเหมือนหุ้น<br>🍾 <b>บ่มไวน์ในเซลลาร์</b> — ยิ่งเก็บนานยิ่งมีมูลค่า": "You've just inherited a wine shop and cellar. Your goal is to build a wine empire on 3 pillars:<br><br>🏪 <b>Sell wine in the shop</b> — pair wine with food for your customers<br>📈 <b>Trade on the secondary market</b> — buy low, sell high, like stocks<br>🍾 <b>Age wine in the cellar</b> — the longer it's kept, the more it's worth",
  "ขั้นแรก: ซื้อไวน์": "Step one: Buy wine",
  "ไปที่หน้า <b>ตลาด</b> เพื่อซื้อไวน์เข้าเซลลาร์<br><br>• <b>Offer</b> = ราคาที่คุณซื้อได้ (แพงกว่า)<br>• <b>Bid</b> = ราคาที่คุณขายได้ (ถูกกว่า)<br>• ส่วนต่างเรียก <b>spread</b> — ไวน์หายากยิ่ง spread กว้าง<br><br>💡 เริ่มจากไวน์ราคาไม่แพง (tier ต่ำ) ก่อนก็ได้": "Go to the <b>Market</b> page to buy wine for your cellar<br><br>• <b>Offer</b> = the price you can buy at (higher)<br>• <b>Bid</b> = the price you can sell at (lower)<br>• The difference is the <b>spread</b> — the rarer the wine, the wider the spread<br><br>💡 Feel free to start with inexpensive (low-tier) wines",
  "ขั้นสอง: เปิดร้าน": "Step two: Open the shop",
  "ที่หน้า <b>ร้าน</b> ลูกค้าจะบอกว่าสั่งอาหารอะไรมา<br><br>เลือกไวน์ที่ <b>เข้ากับอาหาร</b> เพื่อได้กำไรและชื่อเสียงสูงสุด:<br>🥩 เนื้อแดง → ไวน์แดงแทนนินสูง (Bordeaux, Napa)<br>🦞 อาหารทะเล → ไวน์ขาว/แชมเปญ<br>🍫 ของหวาน → ไวน์หวาน (Sauternes, Port)<br><br>💡 จ้างซอมเมอลิเยร์แล้วเกมจะบอกใบ้ให้ว่าคู่ไหนเข้ากัน": "On the <b>Shop</b> page, customers tell you what food they ordered<br><br>Choose a wine that <b>matches the food</b> for the best profit and reputation:<br>🥩 Red meat → high-tannin red (Bordeaux, Napa)<br>🦞 Seafood → white wine / Champagne<br>🍫 Dessert → sweet wine (Sauternes, Port)<br><br>💡 Hire a sommelier and the game will hint which pairings work",
  "ขั้นสาม: จบสัปดาห์": "Step three: End the week",
  "เมื่อบริการลูกค้าครบ กดปุ่ม <b>สัปดาห์ถัดไป</b> (หรือปุ่ม Y บน controller)<br><br>ทุกสัปดาห์จะเกิดสิ่งเหล่านี้:<br>• ราคาตลาดเปลี่ยน + มีข่าวใหม่<br>• หัก <b>ค่าเช่าและเงินเดือน</b> — ระวังอย่าให้เงินติดลบ!<br>• ไวน์ในเซลลาร์บ่มนานขึ้น = มีมูลค่ามากขึ้น<br>• ได้เควสต์ใหม่และลูกค้าชุดใหม่": "When you've served your customers, press <b>Next Week</b> (or Y on a controller)<br><br>Every week:<br>• Market prices change + new news arrives<br>• <b>Rent and salaries</b> are deducted — don't let your cash go negative!<br>• Wine in the cellar ages = becomes more valuable<br>• New quests and a new set of customers arrive",
  "เนื้อเรื่องและเป้าหมาย": "Story and goals",
  "เกมมีเนื้อเรื่อง <b>18 บท</b> พร้อมตัวละครที่จะคอยตั้งเป้าหมายให้คุณ<br><br>ดูเควสต์ปัจจุบันได้ที่หน้า <b>เรื่อง</b> เสมอ ทำสำเร็จแล้วจะได้รางวัลและปลดบทใหม่<br><br>💡 ถ้าไม่รู้จะทำอะไรต่อ — เปิดหน้าเรื่องดูเป้าหมายปัจจุบัน หรือหน้า <b>คู่มือ</b> เพื่ออ่านคำแนะนำ": "The game has an <b>18-chapter</b> story with characters who set goals for you<br><br>You can always check the current quest on the <b>Story</b> page. Complete it to earn rewards and unlock the next chapter<br><br>💡 If you're not sure what to do next — open the Story page to see your current goal, or the <b>Guide</b> page for tips",
  "จัดการไวน์ปลอมง่ายขึ้น": "Easier handling of fake wine",
  "เมื่อมีไวน์ต้องสงสัยในคลัง จะเห็น<b>ตัวเลขสีแดงกะพริบ</b>ที่เมนูเซลลาร์ และมี<b>แผงจัดการอยู่บนสุดของหน้าเซลลาร์</b> — ไม่ต้องไล่หาป้ายทีละใบอีกต่อไป<br><br>แต่ละวิธีบอกชัดว่าได้/เสียอะไร: <b>แจ้งสมาคม</b> ได้เงิน + ชื่อเสียง (ต้องมีนักชิมหรือส่งแล็บก่อน) · <b>ทำลายทิ้ง</b> จ่ายค่ากำจัดแต่ปลอดภัยสุด · <b>ปล่อยตลาดมืด</b> ได้เงินเร็วแต่เสี่ยงเสียชื่อเสียง<br><br>มี<b>ป้าย \"แนะนำ\"</b> ชี้วิธีที่ดีที่สุด และปุ่ม <b>จัดการทั้งหมด</b> เคลียร์ทุกขวดในคลิกเดียว<br><br>จ้าง<b>นักชิม (พนักงานสาย quality)</b> ไว้ จะตรวจของปลอมเจอเองและแจ้งสมาคมรับเงินได้ทันที": "When there's suspect wine in stock, you'll see a <b>flashing red number</b> on the Cellar menu and a <b>management panel at the top of the Cellar page</b> — no more hunting for labels one by one<br><br>Each option spells out what you gain or lose: <b>Report to the guild</b> earns money + reputation (requires a taster or a lab test first) · <b>Destroy</b> costs a disposal fee but is safest · <b>Black market</b> pays fast but risks your reputation<br><br>A <b>\"Recommended\"</b> tag points to the best option, and the <b>Handle all</b> button clears every bottle in one tap<br><br>Hire a <b>taster (quality staff)</b> and fakes are detected automatically and can be reported for money right away",
  "เทศกาลประจำปี — จังหวะทำเงินก้อนใหญ่": "Annual festivals — your big-money moments",
  "ปีหนึ่ง (12 สัปดาห์) มี <b>6 เทศกาล</b> ที่ลูกค้าเยอะขึ้นและงบหนาขึ้น แต่ละงานมีไวน์ที่ขายดีเป็นพิเศษ:<br><br>🎉 ปีใหม่ (สปาร์กลิง) · ตรุษจีน (แดง) · ฤดูใบไม้ผลิ (โรเซ่) · กลางฤดูร้อน (ขาว) · <b>งานกาลาเก็บเกี่ยว</b> (แดง งานใหญ่สุด) · สิ้นปี (หวาน)<br><br>หน้าร้านจะเตือนล่วงหน้า 4 สัปดาห์ — <b>เตรียมสต๊อกไวน์ให้ตรงธีมไว้รับงาน</b> จะได้กำไรสูงสุด": "Each year (12 weeks) has <b>6 festivals</b> with more customers and bigger budgets, each with wines that sell especially well:<br><br>🎉 New Year (sparkling) · Chinese New Year (red) · Spring (rosé) · Midsummer (white) · <b>Harvest Gala</b> (red, the biggest) · Year-End (sweet)<br><br>The shop warns you 4 weeks ahead — <b>stock up on wines that fit the theme</b> for maximum profit",
  "ภัยในเซลลาร์ — เก็บไวน์ก็มีความเสี่ยง": "Cellar hazards — storing wine has risks too",
  "ตั้งแต่บทที่ 7 ไวน์ที่เก็บไว้อาจเจอภัย: <b>ไฟดับ</b> (อุณหภูมิพุ่ง), <b>ท่อแตก</b> (น้ำท่วม), <b>จุกเสีย</b> (ออกซิไดซ์), <b>แมลงกัดฉลาก</b><br><br>เมื่อเกิดเหตุ เลือกได้ว่า<b>จ่ายจัดการทันที</b> (ปลอดภัย) หรือ<b>ปล่อยไว้</b> (เสี่ยงเสียหาย)<br><br>ป้องกันได้ 2 ทางในหน้าร้าน: <b>บำรุงระบบควบคุมอุณหภูมิ</b> (ยิ่งดูแลดี ยิ่งเกิดเหตุน้อย) และ<b>ทำประกัน</b> (ลดโอกาส + จ่ายคืน 70%) — ยิ่งเก็บไวน์แพงเยอะ ยิ่งควรป้องกัน": "From chapter 7, stored wine may face hazards: <b>power cuts</b> (temperature spikes), <b>burst pipes</b> (flooding), <b>bad corks</b> (oxidation), <b>label-eating insects</b><br><br>When one happens, you can <b>pay to fix it now</b> (safe) or <b>leave it</b> (risk damage)<br><br>Two ways to prevent it on the Shop page: <b>climate-control maintenance</b> (better upkeep, fewer incidents) and <b>insurance</b> (lower odds + 70% payout) — the more expensive wine you store, the more you should protect it",
  "วิกเตอร์ ครูซ — คู่แข่งตัวจริง": "Victor Cruz — a real rival",
  "หลังเจอกันในเนื้อเรื่อง (บท 3) วิกเตอร์จะ<b>กว้านไวน์ชั้นดี (tier 4+) ในตลาดตัดหน้าคุณ</b>ทุกสัปดาห์ — ของดีจะหมดชั้นเร็ว รีบซื้อก่อน<br><br>ยิ่งคุณแย่งไวน์ดีๆ มาได้ <b>ความเป็นคู่แข่งยิ่งร้อนแรง</b> เขาจะสู้หนักขึ้นทั้งในตลาดและ<b>ในการประมูล</b> — แต่การเอาชนะเขาในงานประมูลก็ยิ่งสะใจ<br><br>ดูระดับความดุเดือดได้ที่แถบบนหน้าตลาด": "After you meet in the story (chapter 3), Victor will <b>snap up fine wines (tier 4+) on the market before you</b> every week — good stock sells out fast, so buy early<br><br>The more fine wine you win from him, <b>the hotter the rivalry gets</b>. He'll fight harder both on the market and <b>at auctions</b> — but beating him at an auction feels all the sweeter<br><br>See how fierce it is on the bar at the top of the Market page",
  "โรเซ่ และเขตไวน์ทั่วโลก": "Rosé and wine regions worldwide",
  "ตอนนี้เกมมีไวน์ <b>207 ขวดจาก 46 เขต</b> ครอบคลุมทั้งคลาสสิกและแหล่งใหม่ที่กำลังมาแรง — โพรวองซ์ · โตกาจ · ซานโตรีนี · ปริโอราต · โมเซล · เอตนา · วาเคา · บารอสซา · เซ็นทรัลโอทาโก · หนิงเซี่ย · ยามานาชิ และอีกมาก<br><br>🌸 <b>โรเซ่เป็นประเภทที่สาม</b> แยกจากแดงและขาว มีตัวกรองของตัวเองในหน้าตลาด<br><br>จุดเด่นของโรเซ่คือ<b>เข้ากับอาหารได้แทบทุกจาน</b> — ไม่เคยได้คะแนนจับคู่สูงสุด แต่ก็แทบไม่เคยพลาดเลย เหมาะเมื่อไม่แน่ใจว่าลูกค้าสั่งอะไร หรือคลังเหลือไม่ตรงธีม": "The game now has <b>207 wines from 46 regions</b>, covering both the classics and rising new areas — Provence · Tokaj · Santorini · Priorat · Mosel · Etna · Wachau · Barossa · Central Otago · Ningxia · Yamanashi and many more<br><br>🌸 <b>Rosé is a third category</b>, separate from red and white, with its own filter on the Market page<br><br>Rosé's strength is that it <b>goes with almost any dish</b> — it never gets the top pairing score, but it almost never misses. Great when you're not sure what the customer ordered or your stock doesn't fit the theme",
  "ไม่รู้จักศัพท์ไวน์? แตะดูได้เลย": "Don't know a wine term? Just tap it",
  "คำเฉพาะทางในเกมจะมี<b>ไอคอน ? เล็กๆ</b> ต่อท้าย แตะแล้วมีคำอธิบายสั้นๆ เด้งขึ้นมาทันที ไม่ต้องออกจากหน้าที่เล่นอยู่<br><br>ครอบคลุมคำอย่าง Grand Cru · Premier Cru · Cru Bourgeois · En Primeur · Vintage · Terroir · Tannin · Négociant และอีกหลายคำ<br><br>💡 ถ้าเงินสดใกล้หมด <b>มีอา แทน</b> โบรกเกอร์จะโผล่มาเตือนพร้อมบอกทางออก (ขายขวดไหนดี · กู้ได้เท่าไร · ลดค่าใช้จ่ายยังไง) ก่อนที่จะสายเกินแก้": "Technical terms in the game have a <b>small ? icon</b> after them. Tap it and a short explanation pops up instantly without leaving the page<br><br>Covers terms like Grand Cru · Premier Cru · Cru Bourgeois · En Primeur · Vintage · Terroir · Tannin · Négociant and many more<br><br>💡 If your cash runs low, <b>Mia Tan</b> the broker will pop up with a warning and a way out (which bottles to sell · how much you can borrow · how to cut costs) before it's too late",
  "กรองและเรียงลำดับให้เจอไวน์เร็วขึ้น": "Filter and sort to find wine faster",
  "ทั้งหน้า <b>ตลาด</b> และ <b>เซลลาร์</b> ใช้ปุ่มกดแทนเมนูดรอปดาวน์ แตะครั้งเดียวได้เลย ไม่ต้องเลื่อนหา<br><br>🔍 <b>ตลาด</b>: กรองตามระดับชั้น (Grand Cru → Table) · ประเภท (แดง/ขาว) · ภูมิภาค · เฉพาะที่มีในคลัง · <b>เฉพาะที่ซื้อไหว</b> (ซ่อนขวดที่เงินไม่พอ) แล้วเรียงตามราคา/คะแนน/ความเปลี่ยนแปลง<br><br>🍷 <b>เซลลาร์</b>: กรองระดับชั้นและภูมิภาค เรียงตามมูลค่า กำไร% อายุบ่ม ความพร้อมดื่ม หรือ vintage<br><br>ปุ่ม <b>ล้างตัวกรอง</b> จะโผล่มาเมื่อมีตัวกรองทำงานอยู่ กดครั้งเดียวกลับมาดูทั้งหมด<br><br>💡 การ์ดไวน์แต่ละใบมีป้ายระดับชั้นมุมขวาบน (GC / 1er / VIL / CB / TBL) และชื่อภูมิภาคใต้ชื่อไวน์ ดูปราดเดียวรู้ว่าหายากแค่ไหน": "Both the <b>Market</b> and <b>Cellar</b> pages use tap buttons instead of dropdowns — one tap, no scrolling<br><br>🔍 <b>Market</b>: filter by tier (Grand Cru → Table) · type (red/white) · region · in stock only · <b>affordable only</b> (hides bottles you can't pay for), then sort by price/score/change<br><br>🍷 <b>Cellar</b>: filter by tier and region, sort by value, profit %, age, readiness or vintage<br><br>A <b>Clear filters</b> button appears whenever a filter is active — one tap to see everything again<br><br>💡 Each wine card has a tier badge in the top-right corner (GC / 1er / VIL / CB / TBL) and the region under the name, so you can see at a glance how rare it is",
  "เสียงและเพลงประกอบ": "Sound and music",
  "เกมมี<b>เอฟเฟกต์เสียง</b>ครบทุกจังหวะ — เปิดจุกไวน์ รินไวน์ เคาะค้อนประมูล เสียงเงิน และแตรแฟนแฟร์เมื่อทำสำเร็จ<br><br>🎵 <b>เพลงประกอบ (BGM)</b> เป็นดนตรีบรรยากาศแบบสังเคราะห์สดๆ — คอร์ดอุ่นๆ กับทำนองเบาๆ ให้ฟีลร้านไวน์หรู วนไม่ซ้ำ ปรับระดับเสียงได้<br><br>เปิด/ปิดเสียงและเพลงแยกกันได้ที่หน้า <b>ตั้งค่า</b> · เพลงจะเริ่มหลังแตะหน้าจอครั้งแรก (ข้อจำกัดของเบราว์เซอร์) ทั้งหมดสร้างในเกม ไม่ต้องโหลดไฟล์เสียง เหมาะกับเน็ตในรถ": "The game has <b>sound effects</b> for every moment — popping corks, pouring wine, the auction hammer, the ka-ching of money and a fanfare when you succeed<br><br>🎵 <b>Background music (BGM)</b> is live-synthesized ambient music — warm chords and a gentle melody for a fine wine bar feel, never looping the same way, with adjustable volume<br><br>Turn sound and music on/off separately on the <b>Settings</b> page · Music starts after your first tap on the screen (a browser restriction). Everything is generated in-game with no audio files to download — perfect for in-car internet",
  "ลงทุนบ่มไวน์ให้ได้กำไร (พอร์ตระยะยาว)": "Invest in aging wine for profit (long-term portfolio)",
  "ไม่จำเป็นต้องขายไวน์ทุกขวดในร้าน — <b>ไวน์ชั้นดี (tier 4-5) ยิ่งเก็บนานยิ่งมีมูลค่า</b> ขวดกร็องด์ครูที่บ่ม 2 ปีอาจมีมูลค่าเพิ่ม +30% ถึง +150% ขึ้นกับจังหวะตลาด<br><br>📈 <b>ตลาดรองเป็นสองทาง</b> (มีขึ้นมีลง วิ่งกลับเข้าหาราคายุติธรรมเสมอ) — กลยุทธ์คือ <b>ซื้อตอนราคาตก เก็บบ่ม ขายตอนพีค</b> ดูกราฟราคาย้อนหลังและข่าวเพื่อจับจังหวะ<br><br>ไวน์ tier ต่ำ (1-2) บ่มแล้วไม่ค่อยขึ้น (เหมาะดื่ม/ขายเร็ว) แต่ไวน์แพงคือสินทรัพย์ลงทุนจริง — แบ่งเซลลาร์ส่วนหนึ่งเก็บของดีไว้ยาวๆ ดูกำไร/ขาดทุนแต่ละขวดได้ที่หน้า <b>พอร์ต</b><br><br>💡 กระจายความเสี่ยง: อย่าทุ่มเงินสดทั้งหมดกับการเก็บของ ต้องมีสภาพคล่องจ่ายค่าเช่า/เงินเดือนด้วย": "You don't have to sell every bottle in the shop — <b>fine wines (tier 4-5) gain value the longer you keep them</b>. A Grand Cru aged 2 years might gain +30% to +150% depending on market timing<br><br>📈 <b>The secondary market goes both ways</b> (up and down, always pulling back toward fair value) — the strategy is to <b>buy on dips, age, and sell at the peak</b>. Use the price history chart and the news to time it<br><br>Low-tier wines (1-2) barely gain with age (better to drink or sell quickly), but expensive wines are real investment assets — keep part of your cellar for long-term holds and track each bottle's profit/loss on the <b>Portfolio</b> page<br><br>💡 Spread your risk: don't sink all your cash into storage. You need liquidity for rent and salaries too",
  "เหตุการณ์พิเศษคืออะไร? (ปลดล็อกบทที่ 5)": "What are special events? (unlocks in chapter 5)",
  "เป็นครั้งคราวจะมี<b>เหตุการณ์ให้เลือกตัดสินใจ</b>โผล่มาหลังจบสัปดาห์ เช่น มรดกตกทอด (ซื้อเหมาไวน์เสี่ยงของปลอม) · นักวิจารณ์แวะเยี่ยม (เปิดขวดดีเลี้ยงเพื่อรีวิว) · ผู้ขายร้อนเงิน (ไวน์ลด 35%) · งานการกุศล · เด็กฝึกงาน<br><br>แต่ละเหตุการณ์มีทางเลือกที่ให้ผลต่างกัน — บางอันได้กำไร บางอันเสี่ยง ทำให้ทุกรอบการเล่นไม่เหมือนกัน คิดให้ดีก่อนเลือก เพราะบางโอกาสมาแล้วไม่มาอีก": "Every so often, <b>events that need a decision</b> pop up after the week ends, such as a family inheritance (buy a cellar in bulk, risking fakes) · a critic's visit (open a fine bottle for a review) · a seller in need of cash (wine at 35% off) · a charity event · an intern<br><br>Each event has choices with different outcomes — some profitable, some risky — so every playthrough is different. Think before you choose, because some opportunities never come back",
  "จัดการเซลลาร์ใหญ่ๆ ยังไงให้เร็ว?": "How do I manage a big cellar quickly?",
  "เมื่อคลังเริ่มใหญ่ ใช้ <b>ตัวกรองอัจฉริยะ</b> ในหน้าเซลลาร์: แตะชิประดับชั้น (Grand Cru / Premier Cru / Village / Cru Bourgeois / Table) เพื่อดูเฉพาะกลุ่ม หรือเลือกภูมิภาคจากเมนู<br><br>ด้านบนมี<b>สรุปเซลลาร์</b>: มูลค่ารวม กำไร/ขาดทุน และจำนวนขวดพร้อมดื่ม เห็นภาพรวมได้ทันที<br><br>เวลาซื้อ/ขาย ใช้<b>แถบเลื่อน (slider)</b> หรือปุ่มลัด (1/5/10/ซื้อสูงสุด/ขายทั้งหมด) เพื่อปรับจำนวนทีเดียว ไม่ต้องกดทีละครั้ง — เหมาะกับจอสัมผัสในรถ": "When your stock grows, use the <b>smart filters</b> on the Cellar page: tap a tier chip (Grand Cru / Premier Cru / Village / Cru Bourgeois / Table) to see just that group, or pick a region<br><br>At the top is a <b>cellar summary</b>: total value, profit/loss, and how many bottles are ready to drink, all at a glance<br><br>When buying or selling, use the <b>slider</b> or quick buttons (1/5/10/buy max/sell all) to set the amount in one go instead of tapping repeatedly — made for an in-car touchscreen",
  "งานปาร์ตี้ประจำเดือนคืออะไร? (ปลดล็อกบทที่ 10)": "What are the monthly parties? (unlocks in chapter 10)",
  "ราวเดือนละครั้ง ลูกค้ารายใหญ่ (โรงแรม บริษัท งานแต่ง) จะมาจัดงานและ<b>ซื้อไวน์จำนวนมากทีเดียว</b> เขาไม่สนการจับคู่ให้เป๊ะ — ขอแค่ปริมาณตามธีม (สีไวน์ + เพดาน tier)<br><br>💰 <b>นี่คือทางระบายไวน์ถูกในช่วงท้ายเกม:</b> แทนที่จะรอขายทีละขวดให้ลูกค้างบน้อย คุณส่งไวน์ tier 1-3 เข้างานทีละหลายสิบขวดในราคา +15-40% จากตลาด พร้อมโบนัสเมื่อส่งครบ<br><br>เก็บไวน์ถูกๆ ที่ซื้อมาเยอะๆ ไว้รองานได้เลย ยิ่งชื่อเสียงสูง งานยิ่งใหญ่ (ต้องการไวน์มากขึ้นและจ่ายดีขึ้น) มีเวลา 3 สัปดาห์ต่องาน · ส่งไวน์ต้องสงสัยเข้างานไม่ได้": "About once a month, a big client (hotel, company, wedding) holds an event and <b>buys a large amount of wine at once</b>. They don't care about perfect pairings — they just need volume to match the theme (wine color + a tier cap)<br><br>💰 <b>This is how you clear cheap wine late in the game:</b> instead of selling bottle by bottle to low-budget customers, send tier 1-3 wines to the party dozens at a time at +15-40% over market, plus a bonus when the order is complete<br><br>Keep cheap wine you bought in bulk ready for parties. The higher your reputation, the bigger the party (more wine needed, better pay). You have 3 weeks per party · suspected fakes can't be sent",
  "ไวน์หายากในตำนานปลดล็อกยังไง?": "How are the legendary rare wines unlocked?",
  "ขวดที่หายากที่สุด 8 ตัวในเกมไม่มีขายในตลาดตั้งแต่แรก คุณต้องพิสูจน์ตัวเองก่อนถึงจะซื้อได้ แต่ละขวดปลดล็อกด้วยความสำเร็จคนละแบบ:<br><br>🍷 จับคู่สมบูรณ์แบบ 25 ครั้ง · ชื่อเสียง ★150 · ส่งครบสัญญาร้านอาหาร 3 ฉบับ · ตรวจแล็บ 8 ครั้ง · รับโควตาพ่วง 5 ครั้ง · มูลค่าเซลลาร์ ฿20M · เดินเรื่องถึงบทที่ 16 · มีลูกค้าประจำ 8 คน<br><br>ดูความคืบหน้าทั้งหมดได้ที่หน้า \"ธุรกิจ\" — พอปลดล็อกแล้ว ขวดจะโผล่ในตลาดเหมือนไวน์ทั่วไป (แต่ยังหายากและสต๊อกน้อยมาก) ออกแบบให้เป็นเป้าหมายระยะยาวที่ผลักดันให้คุณลองเล่นทุกระบบในเกม": "The 8 rarest bottles in the game aren't on the market at first. You must prove yourself before you can buy them, and each one unlocks with a different achievement:<br><br>🍷 25 perfect pairings · ★150 reputation · 3 completed restaurant contracts · 8 lab tests · 5 bundled allocations · ฿20M cellar value · reach chapter 16 · 8 regular customers<br><br>See all progress on the \"Business\" page — once unlocked, the bottle appears on the market like any other wine (but still rare with very little stock). Designed as long-term goals that push you to try every system in the game",
  "โควตาพ่วงสินค้าคืออะไร? (ปลดล็อกบทที่ 11)": "What are bundled allocations? (unlocks in chapter 11)",
  "ไวน์หายากระดับกร็องด์ครูไม่ได้ขายให้ใครก็ได้ พ่อค้าคนกลาง (négociant) จะบังคับ \"ขายพ่วง\" — อยากได้ของดี 1-2 ขวด ต้องรับไวน์ระดับรองไปด้วยหลายขวด<br><br>ราคารวมมักถูกกว่าซื้อแยก แต่คุณต้องคิดให้ดี 3 อย่าง: <b>เงินสด</b>จมไปเท่าไหร่ · <b>พื้นที่เซลลาร์</b>พอไหม · แล้วจะ<b>ระบายของพ่วง</b>ออกหน้าร้านยังไงโดยไม่ขาดทุน<br><br>ของพ่วงมักเป็นไวน์ tier 1-2 ที่ขายออกช้า ถ้ารับทุกโควตาโดยไม่คิด เซลลาร์จะเต็มไปด้วยของขายไม่ออกและเงินสดหมด — ปฏิเสธเป็นก็สำคัญพอๆ กับรับเป็น": "Rare Grand Cru wines aren't sold to just anyone. Négociants force \"bundling\" — want 1-2 great bottles, and you must take several lesser wines too<br><br>The total price is usually cheaper than buying separately, but think about 3 things: how much <b>cash</b> gets tied up · whether you have the <b>cellar space</b> · and how you'll <b>sell the bundled wine</b> in the shop without a loss<br><br>Bundled wines are usually slow-selling tier 1-2. Accept every allocation without thinking and your cellar fills with unsellable stock and your cash runs out — knowing when to say no matters as much as saying yes",
  "สัญญาส่งร้านอาหารคืออะไร? (ปลดล็อกบทที่ 13)": "What are restaurant contracts? (unlocks in chapter 13)",
  "เชฟระดับมิชลินจะเสนอสัญญาส่งไวน์ต่อเนื่อง 8 สัปดาห์ ในราคาคงที่ที่สูงกว่าตลาด ณ วันเซ็น<br><br><b>ข้อดี:</b> รายได้แน่นอนทุกสัปดาห์ ไม่ต้องลุ้นลูกค้าหน้าร้าน ส่งครบทั้งสัญญาได้โบนัสก้อนใหญ่ + ชื่อเสียง ★8<br><br><b>ข้อเสีย:</b> ราคาล็อกไว้แล้ว ถ้าราคาตลาดพุ่งขึ้นคุณก็ต้องกัดฟันซื้อของแพงมาส่ง และถ้าส่งไม่ครบ ครั้งแรกเชฟให้อภัย แต่ครั้งต่อไปโดนค่าปรับ 35% และเสียชื่อเสียง −★3<br><br><b>เคล็ดลับ:</b> กันไวน์ในสัญญาไว้อย่าเอาไปขายหน้าร้าน และตุนไว้อย่างน้อย 2 เท่าของยอดส่งต่อสัปดาห์เสมอ": "Michelin-level chefs offer 8-week wine supply contracts at a fixed price above the market price on the day you sign<br><br><b>Pros:</b> guaranteed income every week, no gambling on walk-in customers, and a big bonus + ★8 reputation for completing the contract<br><br><b>Cons:</b> the price is locked. If market prices soar, you must grit your teeth and buy expensive stock to deliver. Miss a delivery and the chef forgives you once, but after that it's a 35% penalty and −★3 reputation<br><br><b>Tip:</b> set aside contract wine so you don't sell it in the shop, and always keep at least 2× the weekly delivery in stock",
  "ทำกำไรจากร้านอย่างไร?": "How do I make money from the shop?",
  "ราคาขายในร้าน = ราคาตลาด × markup โดย markup สูงขึ้นตามคุณภาพการจับคู่ ยิ่งจับคู่ตรงใจยิ่งได้ราคาดี + ทิป + ชื่อเสียง<br><br>💎 <b>ไวน์ยิ่งแพงยิ่งคุ้มถ้าจับคู่เก่ง:</b> ขวด tier 4-5 ที่เสิร์ฟได้สมบูรณ์แบบจะได้ทิปพิเศษ (+20-35%) และชื่อเสียงมากกว่าปกติ เพราะ \"ความหรู\" ของขวดหายาก กำไรสุทธิต่อขวด tier 5 อาจสูงถึงหลักล้าน เทียบกับ tier 1 ที่ได้หลักหมื่น — แต่ต้องมีลูกค้ากระเป๋าหนัก (ชื่อเสียงสูง) มารองรับ<br><br>ถ้าไวน์แพงเกินงบลูกค้ามาก เขาจะจ่ายแค่เท่างบ ทำให้เสียโอกาส — ช่วงแรกเน้นไวน์ถูกก่อน พอชื่อเสียงขึ้นค่อยขยับไปขวดแพง": "Shop price = market price × markup, and the markup rises with pairing quality. The better the match, the better the price + tips + reputation<br><br>💎 <b>Expensive wine pays off if you pair well:</b> a tier 4-5 bottle served perfectly earns a special tip (+20-35%) and extra reputation for the \"luxury\" of a rare bottle. Net profit per tier 5 bottle can reach the millions, compared with tens of thousands for tier 1 — but you need wealthy customers (high reputation) to buy them<br><br>If a wine is far above the customer's budget, they'll only pay up to their budget and you lose out — focus on cheap wine early, then move up to expensive bottles as your reputation grows",
  "เทรดให้ได้กำไรอย่างไร?": "How do I trade for profit?",
  "ราคามี momentum (แรงเฉื่อย) ถ้าขึ้นแล้วมักขึ้นต่ออีกระยะ ดูกราฟและลูกศร 📈/📉 ในหน้าต่างซื้อขาย ข่าวดี (คะแนนนักวิจารณ์ ประมูลทำสถิติ) ดันราคาขึ้น ข่าวร้าย (ทิ้งสต๊อก ข่าวลือของปลอม) กดราคาลง ซื้อตอนตกแล้วรอเด้ง คือกลยุทธ์พื้นฐาน": "Prices have momentum: once rising, they tend to keep rising for a while. Watch the chart and the 📈/📉 arrows in the trade window. Good news (critic scores, record auctions) pushes prices up; bad news (stock dumps, fake rumors) pushes them down. Buying the dip and waiting for the bounce is the basic strategy",
  "ทำไมเงินหายทุกสัปดาห์?": "Why does my money drop every week?",
  "ทุกสัปดาห์หักค่าเช่าร้าน + เงินเดือนพนักงาน ยิ่งอัพเกรดและจ้างคนเยอะ ค่าใช้จ่ายยิ่งสูง ต้องแน่ใจว่ารายได้จากร้าน + กำไรเทรด มากกว่าค่าใช้จ่าย ดูสรุปได้ในหน้าต่างจบสัปดาห์ ถ้าขาดทุนติดกัน ให้ขายไวน์บางส่วนหรือลดพนักงาน": "Every week, shop rent + staff salaries are deducted. The more you upgrade and hire, the higher the costs. Make sure shop income + trading profit exceed your expenses. See the summary in the end-of-week window. If you keep losing money, sell some wine or cut staff",
  "บ่มไวน์คุ้มไหม?": "Is aging wine worth it?",
  "คุ้ม! ไวน์ในเซลลาร์ได้โบนัสมูลค่าเพิ่มขึ้นตามเวลา (สูงสุด +60%) และอัพเกรดเซลลาร์ทำให้บ่มได้ดีขึ้น แต่ต้องแลกกับสภาพคล่อง — เงินจมอยู่ในขวด สมดุลระหว่างของที่เก็บยาวกับของที่หมุนขายคือกุญแจสำคัญ": "Yes! Wine in the cellar gains a value bonus over time (up to +60%), and cellar upgrades improve aging. The trade-off is liquidity — your money is locked in bottles. Balancing long-term holds with stock you turn over is the key",
  "ปี vintage ในเกมทำงานอย่างไร?": "How does the vintage year work in the game?",
  "ไวน์ที่คุณซื้อจะติดปี vintage ของปีนั้นในเกม แต่ละปีมีเรตติ้งคุณภาพต่างกัน (ปีทอง/ยอดเยี่ยม/ดี/ปานกลาง) vintage ดีขายได้ราคาสูงกว่าและลูกค้าประทับใจกว่า ปีในเกมเปลี่ยนทุก 12 สัปดาห์ ดังนั้นการรอซื้อในปีดีก็เป็นกลยุทธ์": "Wine you buy is tagged with that in-game year's vintage. Each year has a different quality rating (Golden/Excellent/Good/Average). Good vintages sell for more and impress customers more. The in-game year changes every 12 weeks, so waiting to buy in a good year is also a strategy",
  "ควรจ้างพนักงานเมื่อไหร่?": "When should I hire staff?",
  "จ้างเมื่อรายได้ต่อสัปดาห์มั่นคงแล้ว แต่ละตำแหน่งช่วยต่างกัน: ซอมเมอลิเยร์ (จับคู่แม่นขึ้น + บอกใบ้), เทรดเดอร์ (ลดค่าคอมและ spread — คุ้มมากถ้าเทรดบ่อย), พนักงานต้อนรับ (ลูกค้าเพิ่ม), นักชิม (ประเมินคุณภาพ) เทรนพนักงานเพิ่มเลเวลได้แต่เงินเดือนขึ้นตาม": "Hire once your weekly income is stable. Each role helps differently: sommelier (better pairing + hints), trader (lower commission and spread — great value if you trade often), host (more customers), taster (quality checks). Training raises their level, but their salary rises too",
  "En Primeur เสี่ยงไหม?": "Is En Primeur risky?",
  "ซื้อล่วงหน้าได้ส่วนลด ~25-28% จากราคาตลาด แต่ต้องรอส่งมอบ 3-5 สัปดาห์ และเงินจมระหว่างนั้น ระวัง: ถ้าเซลลาร์เต็มตอนของมาส่ง ระบบจะขายอัตโนมัติที่ 95% ของราคาตลาด ให้เผื่อพื้นที่ไว้เสมอ": "Buying in advance gets ~25-28% off the market price, but delivery takes 3-5 weeks and your money is tied up meanwhile. Careful: if your cellar is full when it arrives, it's auto-sold at 95% of market price, so always leave room",
  "ทำไมซื้อไวน์ได้จำกัด?": "Why can I only buy a limited amount?",
  "ตลาดเปิดมีของจำกัดต่อสัปดาห์ (ดูป้าย \"ตลาดมี N\" บนการ์ดไวน์) ไวน์ยิ่งหายากยิ่งมีของน้อย — Unicorn บางตัวมีแค่ 1-2 ขวด<br><br>• <b>ซื้อทีละมากๆ ดันราคาขึ้น</b> — กวาดทั้งชั้นจ่ายแพงขึ้นได้ถึง ~18%<br>• ของที่เหลือขายไม่หมดจะทบไปสัปดาห์หน้าบางส่วน แล้วมีของเข้าใหม่<br>• ภูมิภาคที่กำลังฮอต 🔥 ของจะหายเร็ว ภูมิภาคที่เย็น 🧊 ของจะเหลือเยอะ<br>• ตลาดหมี = ของล้นตลาด · ตลาดกระทิง = ของขาดแคลน<br>• ไวน์ที่คุณขายออกไปจะกลับเข้าไปเป็นสต๊อกในตลาดด้วย": "The open market has limited stock each week (see the \"Market has N\" tag on each wine card). The rarer the wine, the less stock — some Unicorns have only 1-2 bottles<br><br>• <b>Buying in bulk pushes the price up</b> — sweeping the whole shelf can cost up to ~18% more<br>• Unsold stock partly carries over to next week, and new stock arrives<br>• Hot regions 🔥 sell out fast, cold regions 🧊 have plenty left<br>• Bear market = oversupply · Bull market = shortage<br>• Wine you sell goes back into the market's stock too",
  "เจอไวน์ปลอมต้องทำยังไง?": "What do I do if I find fake wine?",
  "ล็อตที่ราคาต่ำกว่าตลาดผิดปกติมักเป็นของปลอม ไวน์ยิ่ง tier สูงยิ่งถูกปลอมบ่อย (สูงสุด ~14%)<br><br><b>ถ้ามีนักชิม</b> — จะเตือนตั้งแต่ก่อนซื้อ และตรวจเจอทั้งเซลลาร์ทันที<br><b>ถ้าไม่มีนักชิม</b> — ความสงสัยจะค่อยๆ ผุดขึ้นเองสัปดาห์ละราว 22% ต่อขวด (จุกซึม กลิ่นเพี้ยน ฉลากไม่สมวัย) พอสงสัยแล้วจะมีป้าย <b>!</b> สีแดงบนช่องเซลลาร์<br><br>กดป้าย <b>!</b> เพื่อเลือกวิธีจัดการ 4 ทาง:<br>🔥 <b>ทำลายทิ้ง</b> — จ่ายค่ากำจัด ปลอดภัยที่สุด <b>ทำได้เสมอแม้ไม่มีนักชิม</b><br>🧪 <b>ส่งแล็บตรวจ</b> — จ่ายค่าตรวจ ได้ใบรับรองแทนนักชิม แล้วแจ้งสมาคมได้<br>🛡️ <b>แจ้งสมาคม</b> — ได้เงินรางวัล + ชื่อเสียง (ต้องมีนักชิมหรือใบแล็บ)<br>🕶️ <b>ตลาดมืด</b> — ได้เงินเร็วแต่เสี่ยงถูกจับ 40%<br><br>⚠️ <b>ห้ามขายตามปกติเด็ดขาด</b> — จะถูกจับได้และเสียชื่อเสียงหนัก": "Lots priced unusually below market are often fakes. The higher the tier, the more often it's faked (up to ~14%)<br><br><b>With a taster</b> — you're warned before buying, and the whole cellar is checked instantly<br><b>Without a taster</b> — suspicion surfaces on its own at about 22% per bottle per week (seeping corks, odd smells, labels that don't match their age). Once suspected, a red <b>!</b> tag appears on the cellar slot<br><br>Tap the <b>!</b> tag to choose one of 4 ways to deal with it:<br>🔥 <b>Destroy</b> — pay a disposal fee, the safest option, <b>always available even without a taster</b><br>🧪 <b>Lab test</b> — pay for testing and get a certificate in place of a taster, then report to the guild<br>🛡️ <b>Report to the guild</b> — earn a reward + reputation (needs a taster or lab certificate)<br>🕶️ <b>Black market</b> — fast money but a 40% risk of getting caught<br><br>⚠️ <b>Never sell it normally</b> — you'll be caught and lose a lot of reputation",
  "ติดอยู่ ไม่รู้จะทำอะไรต่อ?": "Stuck and don't know what to do next?",
  "1) เปิดหน้า เรื่อง ดูเควสต์ปัจจุบันและความคืบหน้า<br>2) ดูเควสต์รายสัปดาห์ที่หน้าร้าน — ทำง่ายและได้เงินเร็ว<br>3) ถ้าเงินตึง ขายไวน์ที่กำไรสูงสุดในหน้าพอร์ต<br>4) ถ้าชื่อเสียงไม่ขึ้น ให้เน้นจับคู่ให้แม่น (จ้างซอมเมอลิเยร์ช่วยได้มาก)": "1) Open the Story page to see your current quest and progress<br>2) Check the weekly quests on the Shop page — easy and quick money<br>3) If cash is tight, sell your most profitable wine on the Portfolio page<br>4) If your reputation isn't growing, focus on accurate pairings (a sommelier helps a lot)",

  "แตะที่การ์ดหรือปุ่มได้โดยตรง — ออกแบบให้กดง่ายด้วยนิ้วบนจอในรถ<br><br>หากต่อจอยเกม: D-pad/สติ๊ก = เลื่อน · A = เลือก · B = กลับ · Y = สัปดาห์ถัดไป · LB/RB = สลับหน้า": "Tap cards and buttons directly — designed for easy finger use on an in-car screen<br><br>With a game controller: D-pad/stick = move · A = select · B = back · Y = next week · LB/RB = switch page",
