        <div class="wine-tags"><span class="tag score">${w.score} pts</span><span class="tag rare">ประหยัด ${Math.round((1-disc)*100)}%</span>${already?`<span class="tag">จองแล้ว ${already}</span>`:''}</div></div>

function openPrimeur(id, ep){
  const w=wineById(id); modalQty=1;
  const m=document.getElementById('modal');
  m.innerHTML=`<div style="display:flex; gap:16px; align-items:center; margin-bottom:6px">
      <div style="flex-shrink:0; filter:drop-shadow(0 4px 6px rgba(62,44,38,.22))">${bottleSVGLite(w,54)}</div>
      <div><h3 style="margin:0">${w.name}</h3><div class="wine-sub">En Primeur · ${w.cuvee}</div></div>
    </div>
    <div class="knowledge"><b>En Primeur คือ?</b> การซื้อไวน์ตั้งแต่ยังบ่มในถัง ก่อนบรรจุขวด 1-2 ปี ได้ราคาถูกกว่าตอนออกตลาด แต่มีความเสี่ยงเรื่องคุณภาพและการส่งมอบ</div>
    <div class="body row" style="justify-content:space-between"><div><div class="wine-sub">ราคา EP/ขวด</div><div style="font-family:Fraunces;font-size:20px;font-weight:600;color:var(--sage-deep)">${fmt(ep)}</div></div>
    <div><div class="wine-sub">ราคาตลาดตอนนี้</div><div style="font-family:Fraunces;font-size:18px;font-weight:600">${fmt(G.prices[id])}</div></div></div>
    <div class="qty-ctrl"><button id="qMinus">−</button><div class="qnum" id="qNum">1</div><button id="qPlus">+</button></div>
    <div class="qty-cost" id="qCost"></div>
    <div class="row" style="justify-content:center;gap:10px">
      <button class="btn sage" id="btnEP" data-focus="modal"><span class="bic">${lineIcon('sprout',16)}</span>จองล่วงหน้า</button>
      <button class="btn ghost" id="btnClose" data-focus="modal">ปิด</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
  const epAfford=()=>Math.max(0, Math.floor(G.cash/(ep*(1+BROKER_FEE))));
  const epSpace=()=>cellarFreeForPrimeur();
  const epMax=()=>Math.max(0, Math.min(epAfford(), epSpace()));
  if(modalQty>epMax()) modalQty=Math.max(1, epMax());
  const upd=()=>{
    if(modalQty>epMax()) modalQty=epMax();
    document.getElementById('qNum').textContent=modalQty;
    const lim=epMax();
    const reason = epSpace()<epAfford() ? `เซลลาร์ว่าง <b>${epSpace()}</b> ขวด (รวมที่จองไว้แล้ว)` : `เงินสดจองได้ <b>${epAfford()}</b> ขวด`;
    document.getElementById('qCost').innerHTML='รวม '+fmt(ep*modalQty*(1+BROKER_FEE))
      + `<div class="qty-limit">จองได้สูงสุด <b>${lim}</b> ขวด · ${reason}</div>`;
    document.getElementById('qPlus').disabled = modalQty>=lim;
    document.getElementById('qMinus').disabled = modalQty<=1;
    document.getElementById('btnEP').disabled = lim<1;
  };
  document.getElementById('qMinus').onclick=()=>{modalQty=Math.max(1,modalQty-1);upd();};
  document.getElementById('qPlus').onclick=()=>{modalQty=Math.min(epMax(),modalQty+1);upd();};
  document.getElementById('btnClose').onclick=closeModal;
  document.getElementById('btnEP').onclick=()=>{
    if(!primeurOpen()){ toast('แคมเปญปิดแล้ว จองไม่ได้','bad'); return; }
    modalQty=Math.min(modalQty, epMax());   // final clamp in case space changed
    if(modalQty<1){ toast('เซลลาร์ไม่พอสำหรับการจองล่วงหน้า — ขายหรือขยายคลังก่อน','bad'); return; }
    const cost=ep*modalQty*(1+BROKER_FEE);
    if(cost>G.cash){toast('เงินสดไม่พอ','bad');return;}
    G.cash-=cost;
    // deliveries all land in the autumn bottling run of the same year
    const bottlingWeek = G.week + (9 - gameMonth()) + 1;   // ~ต.ค. ของปีเดียวกัน
    const rel = Math.max(G.week+3, bottlingWeek);
    if(G.primeur[id]){ G.primeur[id].qty+=modalQty; }
    else G.primeur[id]={qty:modalQty, releaseWeek:rel, buyPrice:ep};
    sfx('coin');
    toast(`จอง ${w.name} ×${modalQty} · ส่งมอบสัปดาห์ที่ ${rel}`,'gold');
    closeModal(); renderTop(); routePage();
  };
  upd(); modalFocusables();
}

      <div style="margin-top:10px;font-size:11px;color:var(--ink-soft);font-weight:700">รอคิว: ${queuePreview||'— คนสุดท้าย —'}</div>
      ${Object.keys(G.cellar).length?`<button class="btn sm gold" data-focus="autoserve" tabindex="0" style="margin-top:12px">${lineIcon('sparkle',14)} เสิร์ฟตัวที่ดีที่สุดอัตโนมัติ</button>`:''}
    </div>
    <div class="pairing-list" id="pairList">`;
  const owned=Object.keys(G.cellar);
  if(!owned.length){
    html+=`<div class="empty-note" style="padding:20px">${spotArt('emptyCellar',200)}<div style="margin-top:8px">คุณไม่มีไวน์ในเซลลาร์เลย!<br><span style="font-weight:600;color:var(--ink-soft)">ซื้อไวน์จากตลาดก่อนเปิดร้าน</span></div></div>`;
  } else {

    html+=`<div class="dish-want">

    // sort: best pairing first (always — the hint detail scales with staff)
    let list=owned.map(id=>({id, q:evalPairing(cust,wineById(id),G.cellar[id])}));

      const R=pairingReasons(w, cust.food);

      // ---- what this serve actually pays, straight from the real formula ----
      const est = estimateServe(id, cust, q);

      const overBudget = est.capped;

      const pctOfBudget = Math.round(askPrice/cust.budget*100);

          <span class="ap-pl ${profitCls}">ทุน ${fmtK(est.cost)} · ${est.profit>=0?'กำไร':'ขาดทุน'} ${fmtK(Math.abs(est.profit))}</span>
        </div>`;
      // reason chips: green for what fits, amber for what clashes
      let chips='';
      if(regionOK) chips+=`<span class="rchip ok">ภูมิภาคเข้ากัน</span>`;
      R.good.slice(0,2).forEach(k=>chips+=`<span class="rchip ok">${k}พอดี</span>`);
      if(expert) R.bad.slice(0,2).forEach(t=>chips+=`<span class="rchip warn">${t}</span>`);
      if(overBudget) chips+=`<span class="rchip bad">ลูกค้าจ่ายได้แค่ ${fmtK(cust.budget)}</span>`;
      const notes=(w.notes||[]).slice(0,4).map(n=>`<span class="nchip">${n}</span>`).join('');
      html+=`<div class="pair-opt ${overBudget?'is-over':''}" data-focus="pair" data-id="${id}" tabindex="0">

        <div class="pair-right">${hint}${priceTag}<button class="btn sm sage" style="margin-top:4px">เสิร์ฟ</button></div>
      </div>`;

  }

  UPGRADES.forEach(u=>{
    const lv=G.upgrades[u.id]; const cost=u.cost(lv); const maxed=lv>=u.max;
    html+=`<div class="card upg-card" data-focus="upg" data-id="${u.id}" tabindex="0">
      <span class="upg-icon">${u.icon}</span>
      <div class="upg-info"><h4>${u.name}</h4><p>${u.desc}</p>
      <div class="lvl-dots">${Array.from({length:u.max},(_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div></div>
      <button class="btn sm ${maxed?'ghost':'gold'}" ${maxed?'disabled':''}>${maxed?'สูงสุด':fmtK(cost)}</button>
    </div>`;
  });
  html+=`</div>`;

  // cellar protection: insurance + climate upkeep against hazards
  if(G.chapter>=HAZARD_CHAPTER){

// weekly insurance premium scales with the value in the cellar
function insuranceWeekly(){
  return Math.round(28000 + portfolioValue()*0.004);

function generateShopQueue(){
  G.shopQueue=[];
  const n=seatsPerWeek() + festivalTraffic();
  const mktBonus=G.upgrades.marketing;
  const diff=G.difficulty||1;
  G.regulars=G.regulars||{};
  // Track who is already seated this week so the same person can't appear twice.
  // We re-roll on collision (with a retry cap) rather than filtering a Set —
  // this keeps selection genuinely random and unpredictable each week instead
  // of walking a fixed remaining-list order.
  const seated={};
  for(let i=0;i<n;i++){
    let base, reg=null;
    // Draw someone not already seated. We make several independent random draws
    // (regular-or-new decided fresh each time), and if they all collide we fall
    // back to a random pick among whoever is still unseated. This stays random
    // and unpredictable — no fixed traversal order like a Set-filter would give.
    for(let attempt=0; attempt<12; attempt++){
      reg=null;
      const regIds=Object.keys(G.regulars).filter(rid=>!seated[rid]);
      const newPool=CUSTOMERS.filter(c=>(!c.minRep||G.rep>=c.minRep) && !seated[c.name]);
      const wantReg = regIds.length && Math.random()<0.42;
      if(wantReg){
        const rid=regIds[Math.floor(Math.random()*regIds.length)];
        reg=G.regulars[rid];
        base=CUSTOMERS.find(c=>c.name===reg.name)||CUSTOMERS[0];
      } else if(newPool.length){
        base=newPool[Math.floor(Math.random()*newPool.length)];
      } else if(regIds.length){
        // no new faces left this week — take an unseated regular instead
        const rid=regIds[Math.floor(Math.random()*regIds.length)];
        reg=G.regulars[rid];
        base=CUSTOMERS.find(c=>c.name===reg.name)||CUSTOMERS[0];
      } else {
        // everyone is seated (tiny roster) — accept a repeat as a last resort
        const pool=CUSTOMERS.filter(c=>!c.minRep || G.rep>=c.minRep);
        base=pool[Math.floor(Math.random()*pool.length)];
      }
      const nm = reg? reg.name : base.name;
      if(!seated[nm]) break;   // unseated — take it
    }
    const seatKey = reg? reg.name : base.name;
    seated[seatKey]=true;
    const food=FOODS[Math.floor(Math.random()*FOODS.length)];
    // regulars have bigger budgets the more they like you
    const loyalty = reg? reg.visits : 0;
    // trait shapes budget and fussiness
    const T={
      rare:       {bud:1.4, fus:0.10},
      fussy:      {bud:1.1, fus:0.28},
      value:      {bud:0.85,fus:0.05},
      loyal:      {bud:0.95,fus:-0.05},
      obscure:    {bud:1.0, fus:0.12},
      easy:       {bud:0.8, fus:-0.15},
      bigspender: {bud:2.1, fus:0.05},
      collector:  {bud:8.0, fus:0.22},
      budget:     {bud:0.45,fus:-0.10},
      rep:        {bud:1.2, fus:0.20},
    }[base.trait] || {bud:1, fus:0};
    const repTier=1+Math.min(G.rep,400)/400*7.5;   // ★0 -> 1.0x, ★400+ -> 8.5x
    const prestigeMul=1+(G.prestige||0)*0.35;
    const budget=Math.round((40000+Math.random()*190000)*(1+mktBonus*0.25)*diff*(1+loyalty*0.06)*T.bud*repTier*prestigeMul*seasonDemand()*festivalBudgetMult());
    const fussy = Math.max(0, Math.min(1, 0.3 + Math.random()*0.3 + G.rep*0.004 + T.fus));
    let opener;
    if(reg && reg.visits>=1){
      const back=[
        `กลับมาอีกแล้วครับ! คราวก่อนคุณแนะนำได้ดีมาก วันนี้ผมสั่ง ${food.name}${food.em}`,
        `ร้านนี้ไม่เคยทำให้ผิดหวัง วันนี้ขอไวน์คู่ ${food.name}${food.em} หน่อย`,
        `มาเป็นครั้งที่ ${reg.visits+1} แล้วนะ! วันนี้ ${food.name}${food.em} ครับ`,
      ];
      opener=back[Math.floor(Math.random()*back.length)];
    } else {
      const openers=[
        `สวัสดีครับ ${food.name}${food.em} คืนนี้ ขอไวน์ที่เข้ากันหน่อย`,
        `ผมสั่ง ${food.name}${food.em} มา อยากได้ไวน์ที่ใช่ๆ`,
        `คู่กับ ${food.name}${food.em} ควรดื่มอะไรดีครับ?`,
        `วันนี้กิน ${food.name}${food.em} ช่วยเลือกไวน์ให้หน่อย`,
      ];
      opener=openers[Math.floor(Math.random()*openers.length)];
    }
    G.shopQueue.push({...base, food, budget, fussy, opener, isRegular:!!reg, visits: loyalty, lastWine: reg?reg.lastWine:null});
  }
  G.shopDone=false;
}

// evaluate a wine pairing quality (0..1) for a customer
/* Food profiles: what each dish wants in a wine (0-5 scales) */
const FOOD_PROFILE={

  lobster:   {body:3, tannin:0, acid:5, sweet:1, why:'เนื้อหวานละเอียดต้องการไวน์ขาวกรดสูง'},
  chocolate: {body:5, tannin:2, acid:2, sweet:5, why:'ของหวานต้องคู่ไวน์ที่หวานกว่าเสมอ'},

  fish:      {body:2, tannin:0, acid:5, sweet:0, why:'ปลาดิบต้องการความสดคมไม่มีแทนนิน'},
  duck:      {body:4, tannin:3, acid:4, sweet:1, why:'เป็ดมันแต่เนื้อนุ่ม ต้องการไวน์กลางที่มีกรด'},
  curry:     {body:3, tannin:1, acid:4, sweet:3, why:'ความเผ็ดถูกกดด้วยความหวานเล็กน้อย แทนนินยิ่งทำให้แสบ'},
  pork:      {body:3, tannin:3, acid:4, sweet:0, why:'หมูนุ่มไขมันปานกลาง ต้องการไวน์แดงกลางที่มีกรดตัด'},
  pizza:     {body:3, tannin:3, acid:5, sweet:0, why:'มะเขือเทศเปรี้ยวจัด ต้องใช้ไวน์กรดสูงพอกันถึงจะไม่จืด'},
  salad:     {body:2, tannin:0, acid:5, sweet:0, why:'ชีสแพะเปรี้ยวมัน ต้องการไวน์ขาวกรดสูงสดชื่น'},
  ramen:     {body:3, tannin:0, acid:4, sweet:1, why:'น้ำซุปมันเข้มข้น ต้องการกรดมาล้างปาก'},
  oyster:    {body:2, tannin:0, acid:5, sweet:0, why:'ความเค็มทะเลต้องการไวน์แร่ธาตุคมและกรดสูงมาก'},
  lamb:      {body:5, tannin:4, acid:3, sweet:0, why:'แกะกลิ่นแรงไขมันสูง ต้องการไวน์เข้มแทนนินสูง'},
  dessert:   {body:3, tannin:0, acid:4, sweet:5, why:'ของหวานต้องคู่ไวน์ที่หวานกว่า ไม่งั้นไวน์จะเปรี้ยวเฝื่อน'},
  bluecheese:{body:4, tannin:1, acid:4, sweet:5, why:'บลูชีสเค็มจัด คู่กับไวน์หวานคือการจับคู่ตัดกันที่สมบูรณ์แบบ'},
};
function foodProfile(food){ return FOOD_PROFILE[food.ic] || {body:3,tannin:3,acid:4,sweet:0,why:''}; }

/* How close is this wine's structure to what the dish wants? 0..1 */
function structureMatch(w, food){
  const fp=foodProfile(food);
  const wb=w.body??3, wt=w.tannin??3, wa=w.acid??4, ws=w.sweet??0;
  // weighted distance — tannin and sweetness matter most for clashes
  const d = Math.abs(wb-fp.body)*1.0 + Math.abs(wt-fp.tannin)*1.4
          + Math.abs(wa-fp.acid)*0.8 + Math.abs(ws-fp.sweet)*1.6;
  const maxD = 5*1.0 + 5*1.4 + 5*0.8 + 5*1.6;
  return Math.max(0, 1 - d/maxD);
}

/* Per-axis explanation used by the hint UI */
function pairingReasons(w, food){
  const fp=foodProfile(food);
  const wb=w.body??3, wt=w.tannin??3, wa=w.acid??4, ws=w.sweet??0;
  const axes=[
    {k:'บอดี้',   w:wb, f:fp.body,   hiT:'เข้มเกินอาหาร', loT:'เบาเกินอาหาร'},
    {k:'แทนนิน', w:wt, f:fp.tannin, hiT:'แทนนินสูงเกินไป', loT:'แทนนินน้อยไปสำหรับจานนี้'},
    {k:'กรด',    w:wa, f:fp.acid,   hiT:'กรดสูงกว่าที่ต้องการ', loT:'กรดน้อยไป จานนี้ต้องการความสดตัดเลี่ยน'},
    {k:'ความหวาน', w:ws, f:fp.sweet, hiT:'หวานเกินจาน', loT:'หวานน้อยไปสำหรับจานนี้'},
  ];
  const good=[], bad=[];
  axes.forEach(a=>{
    const diff=a.w-a.f;
    if(Math.abs(diff)<=1) good.push(a.k);
    else if(diff>1) bad.push(a.hiT);
    else bad.push(a.loT);
  });
  return {good, bad, why:fp.why};
}

function evalPairing(cust, w, c){
  const sm = structureMatch(w, cust.food);      // 0..1 how well the wine's build fits the dish
  const regionOK = cust.food.pairRegions.includes(w.region);
  // structure is the backbone of the score; region is a classic-pairing bonus on top
  let q = 0.12 + sm*0.52 + (regionOK?0.22:0);
  const white = isWhiteWine(w);
  const rose  = isRoseWine(w);
  const sweet = (w.sweet??0)>=4;
  if(rose){
    // Rosé is the great all-rounder: never the top score for a specific
    // pairing, but it rarely clashes either.
    q += cust.food.pairColor==='sweet' ? 0.02 : 0.06;
  }
  else if(cust.food.pairColor==='white'&&white) q+=0.08;
  else if(cust.food.pairColor==='sweet'&&sweet) q+=0.12;
  else if(cust.food.pairColor==='red'&&!white&&!sweet) q+=0.07;
  else if(cust.food.pairColor==='any') q+=0.05;
  // quality/vintage of the specific bottle helps
  if(c&&c.quality) q += (c.quality-82)/18*0.10;
  // staff + upgrade
  q += G.upgrades.sommelier*0.03 + staffBonus('pairing')*0.05;
  // score prestige nudges impression
  q += (w.score-90)/10*0.14;
  // fussy customers only punish a genuinely poor structural match
  if(sm<0.72 && !regionOK) q -= cust.fussy*0.12;
  return Math.max(0, Math.min(1,q));
}

function serveCustomer(id){
  // guard against a double-tap serving before the UI re-renders
  if(G._serving) return;
  const cust=G.shopQueue[0]; if(!cust) return;
  const w=wineById(id);
  if(!w){ toast('ไม่พบข้อมูลไวน์นี้','bad'); return; }
  const c=G.cellar[id];
  if(!c||c.qty<1){ toast('ไม่มีไวน์นี้แล้ว','bad'); return; }
  G._serving=true;
  const quality=evalPairing(cust, w, c);

  const price=G.prices[id];
  const servedCost=Math.round(c.buyPrice||price);   // captured before the lot is decremented
  const markup=1.05+quality*quality*0.75;
  let sellPrice=price*markup*seasonPref(w)*festivalStyleBonus(w);
  let repGain, tip=0, reaction, mood;

  // Prestige premium: serving a rare, expensive bottle well is worth more than
  // its markup alone — the cachet earns extra reputation and a fatter tip. This
  // is what makes high-tier wines worth their steep buy-in, instead of players
  // only ever churning cheap bottles near each customer's budget.
  const tierPrem = [0, 0, 0.04, 0.10, 0.20, 0.35][w.tier] || 0;   // tier4 +20% tip, tier5 +35%
  const repPrem  = [0, 0, 0,    1,    2,    3   ][w.tier] || 0;   // bonus rep for a great high-tier pairing

  // Budget is a real ceiling. A great pairing earns a small stretch (up to
  // +15%); anything beyond that, the customer simply pays what they can.
  const stretch = 1 + (quality>0.78 ? 0.15 : quality>0.55 ? 0.07 : 0);
  const payCap  = Math.max(0, cust.budget||0) * stretch;
  if(sellPrice > payCap){
    sellPrice = payCap; repGain = quality>0.7?1:0;
    reaction=`"${cust.name} ยิ้มบางๆ — ขวดนี้เกินงบ จ่ายได้เท่าที่มี"`; mood='ok';
  } else {
    if(quality>0.78){ repGain=3+repPrem+Math.floor(staffBonus('pairing')/2); tip=sellPrice*(0.15+tierPrem+staffBonus('pairing')*0.02); 
      reaction=`✨ "สมบูรณ์แบบ! ${w.cuvee} เข้ากับ${cust.food.name}อย่างเหลือเชื่อ" — ${cust.name}ประทับใจสุดๆ`; mood='great';
      G.stats.perfectPairs++; questProgress('perfect',1);
      if(w.tier>=4){ reaction=`✨ "ขวดระดับนี้หายากมาก! ${w.cuvee} กับ${cust.food.name} คือประสบการณ์ที่ผมจะไม่มีวันลืม" — ${cust.name}ตื้นตัน`; } }
    else if(quality>0.55){ repGain=2; tip=sellPrice*(0.06+tierPrem*0.4);
      reaction=`🙂 "${cust.name} พยักหน้าพอใจ รสชาติเข้ากันดีทีเดียว"`; mood='good'; }
    else { repGain=1; tip=0;
      reaction=`😐 "${cust.name} ดื่มเงียบๆ ดูไม่ค่อยเข้ากับอาหารเท่าไร"`; mood='meh'; }
  }
  const total=Math.max(0, (sellPrice+tip)*prestigeMult());
  G.cash += total; G.cash=Math.round(G.cash);
  floatMoney(total);
  G._weekRevenue=(G._weekRevenue||0)+total;
  G._weekServed=(G._weekServed||0)+1;
  // reputation has diminishing returns — the floor used to guarantee +1 per serve,
  // which let rep run away to 4-digit values. Accumulate fractionally instead.
  const repScale = G.rep<20 ? 1 : G.rep<50 ? 0.6 : G.rep<100 ? 0.30 : G.rep<200 ? 0.12 : G.rep<400 ? 0.05 : 0.02;
  const rawGain = repGain*repScale;
  G._repFrac = (G._repFrac||0) + rawGain;
  repGain = Math.floor(G._repFrac);
  G._repFrac -= repGain;
  G.rep = Math.max(0, G.rep+repGain);
  G.stats.served++;
  questProgress('serve',1);
  // Serving removes a bottle; re-clamp so fake/suspect can never exceed what
  // is left in the lot (0 <= suspect <= fake <= qty).
  c.qty--; sealLot(c); if(c.qty<=0) delete G.cellar[id];

  // occasional review
  if(mood==='great'||mood==='meh'){
    const revs = mood==='great'
      ? [`ร้านนี้ซอมเมอลิเยร์เก่งมาก! แนะนำ${w.cuvee}ได้ตรงใจ ⭐⭐⭐⭐⭐`,`ประสบการณ์ไวน์ที่ดีที่สุดในเมือง ⭐⭐⭐⭐⭐`]
      : [`บริการโอเค แต่ไวน์ไม่ค่อยเข้ากับอาหาร ⭐⭐`,`ยังต้องพัฒนาการจับคู่อีกนิด ⭐⭐⭐`];
    G.stats.reviews.unshift({week:G.week, text:revs[Math.floor(Math.random()*revs.length)], by:cust.name, mood});
    if(G.stats.reviews.length>12) G.stats.reviews.length=12;
  }

  // a well-served customer may become a regular
  G.regulars=G.regulars||{};
  if(mood==='great'||mood==='good'){
    const key=cust.name;
    const r=G.regulars[key]||{name:cust.name, av:cust.av, visits:0, spent:0};
    r.visits++; r.spent+=total; r.lastWine=w.name; r.lastWeek=G.week;
    G.regulars[key]=r;
  } else if(mood==='meh' && G.regulars[cust.name]){
    // a bad pairing can lose a regular
    if(Math.random()<0.35) delete G.regulars[cust.name];
  }

  G.shopQueue.shift();
  if(G.shopQueue.length===0) G.shopDone=true;
  checkStory(); checkAchievements();
  renderTop();
  G._serving=false;
  showServeResult(cust, w, reaction, total, tip, repGain, mood, servedCost);
}

function buyUpgrade(uid){
  const u=UPGRADES.find(x=>x.id===uid); const lv=G.upgrades[uid];
  if(lv>=u.max){ toast('อัพเกรดสูงสุดแล้ว','bad'); return; }
  const cost=u.cost(lv);
  if(cost>G.cash){ toast('เงินสดไม่พอ','bad'); return; }
  G.cash-=cost; G.upgrades[uid]++;
  sfx('levelup');
  toast(`อัพเกรด ${u.name} เป็นระดับ ${G.upgrades[uid]}!`,'gold');
  renderTop(); pageShop(); bindFocusables();
}

/* ---------- DISPLAY PREFERENCES (separate from save) ---------- */
const DISP_KEY='cellarAndVine_display';
let DISP={dark:(()=>{ try{ return window.matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; } })(), fs:'normal', sfx:true, bgm:false, bgmVol:0.5, car:'auto'};
function loadDisplay(){
  try{ const d=JSON.parse(localStorage.getItem(DISP_KEY)||'{}'); DISP=Object.assign(DISP,d); }catch(e){}
  applyDisplay();
}
// The Tesla browser identifies itself with "Tesla/<firmware>" in its user
// agent (older MCU1 cars: "QtCarBrowser").
const IS_TESLA = /Tesla\/|QtCarBrowser/i.test(navigator.userAgent||'');
function carMode(){ return DISP.car==='on' || (DISP.car!=='off' && IS_TESLA); }
function applyDisplay(){
  const b=document.body;
  b.classList.toggle('dark', !!DISP.dark);
  b.classList.toggle('car', carMode());
  b.classList.remove('fs-large','fs-xlarge');
  if(DISP.fs==='large') b.classList.add('fs-large');
  if(DISP.fs==='xlarge') b.classList.add('fs-xlarge');
  sfxOn = !!DISP.sfx;
  if(DISP.bgm) startBGM(); else stopBGM();
  try{ localStorage.setItem(DISP_KEY, JSON.stringify(DISP)); }catch(e){}
}

  {p:'learn', ic:'book', t:'ความรู้'},

  {p:'settings', ic:'gear', t:'ตั้งค่า'},
];
function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=NAV_ITEMS.map(n=>{
    // A flex:1 spacer would expand inside a scrolling column and push the last
    // items past the fold; a fixed gap keeps every entry reachable.
    if(n.p==='__spacer') return '<div style="height:10px;border-top:2px solid var(--line);margin:6px 4px 0"></div>';
    if(n.gated && !allocUnlocked() && !contractsUnlocked() && !partyUnlocked() && G.chapter<3) return '';
    let badge = n.p==='shop' && !G.shopDone && G.shopQueue.length ? `<span class="nav-badge">${G.shopQueue.length}</span>` : '';
    if(n.p==='cellar'){ const sc=suspectCount(); if(sc>0) badge=`<span class="nav-badge alert">${sc}</span>`; }
    return `<button class="navbtn ${G.page===n.p?'active':''}" data-page="${n.p}"><span class="ic">${lineIcon(n.ic,22)}</span><span class="tx">${n.t}</span>${badge}</button>`;
  }).join('');
}

/* ---------- ROUTER ---------- */
let _routedPage=null;
function routePage(){
  const content=document.getElementById('content');
  const samePage = _routedPage===G.page;
  const keepScroll = samePage && content ? content.scrollTop : 0;
  _routedPage=G.page;
  renderNav();
  // leaving the cellar: tear down the lazy-bottle observer so it doesn't linger
  if(G.page!=='cellar' && _bottleObserver){ _bottleObserver.disconnect(); _bottleObserver=null; }
  if(G.page==='market') pageMarket();
  else if(G.page==='cellar') pageCellar();
  else if(G.page==='portfolio') pagePortfolio();
  else if(G.page==='primeur') pagePrimeur();
  else if(G.page==='learn') pageLearn();
  else if(G.page==='story') pageStory();
  else if(G.page==='staff') pageStaff();
  else if(G.page==='stats') pageStats();
  else if(G.page==='guide') pageGuide();
  else if(G.page==='biz') pageBiz();
  else if(G.page==='settings') pageSettings();
  else pageShop();
  if(content) content.scrollTop = keepScroll;
  if(!samePage) focusIndex=0;
  updateFocus();
}

/* ---------- NEXT WEEK ---------- */
function nextWeek(){
  normalizeCellarLots();   // start the week from a consistent cellar
  const cashBefore=G.cash;
  const revenueThisWeek = G._weekRevenue||0; // accumulated from shop sales during the week
  G.week++;
  G.stats.weeksPlayed++;
  tickMarket();

  // deliver primeur
  let delivered=[];
  for(const id in G.primeur){
    const p=G.primeur[id];
    if(p.releaseWeek<=G.week){
      if(cellarUsed()+p.qty<=cellarCapacity()){
        const yr=p.vintage||gameYear();
        if(G.cellar[id]){G.cellar[id].qty+=p.qty;} else { G.cellar[id]={qty:p.qty,buyWeek:G.week,buyPrice:p.buyPrice,vintage:yr,quality:vintageRating(id,yr),fake:0,suspect:0}; sealLot(G.cellar[id]); }
        delivered.push(`${wineById(id).name} ×${p.qty}`);
      } else {
        G.cash+=G.prices[id]*p.qty*0.95;
        toast(`เซลลาร์เต็ม — ${wineById(id).name} ถูกขายอัตโนมัติ`,'bad');
      }
      delete G.primeur[id];
    }
  }
  if(delivered.length) toast(`📦 ส่งมอบ En Primeur: ${delivered.join(', ')}`,'gold');

  // rare wines may have just become available
  checkRareUnlocks();
  // B2B deliveries settle first — they are revenue for this week
  const contractResult = settleContracts();
  // new offers arrive
  tickAllocations();
  tickContractOffers();
  tickParty();
  tickOpportunity();
  tickHazard();

  // weekly costs
  const costs = weeklyCosts();
  G.cash -= costs;

  // flag wines that just reached their drinking peak so the cellar can highlight them
  G._justRipe = [];
  for(const id in G.cellar){
    const st = drinkWindow(id).state;
    const prev = (G.cellar[id]._dw || 'young');
    if(prev!=='peak' && st==='peak') G._justRipe.push(id);
    G.cellar[id]._dw = st;
  }
  if(G._justRipe.length){
    const nm = wineById(G._justRipe[0]);
    toast(`🍷 ${nm?nm.cuvee||nm.name:'ไวน์'}${G._justRipe.length>1?` และอีก ${G._justRipe.length-1} รายการ`:''} พร้อมดื่มแล้ว`,'gold');
  }

  // loan interest is charged after operating costs
  const interest = accrueLoans();

  // build financial report
  G.lastReport = {
    week:G.week-1,
    revenue: revenueThisWeek,
    salaries: weeklySalaries(),
    rent: weeklyRent(),
    interest: interest,
    debt: loanDebt(),
    contractPaid: contractResult.paid,
    contractFailed: contractResult.failed,
    net: revenueThisWeek - costs - interest,
    served: G._weekServed||0,
    cash: G.cash,
  };
  G.weeklyLog.push({week:G.week-1, revenue:revenueThisWeek, costs, net:revenueThisWeek-costs});
  if(G.weeklyLog.length>52) G.weeklyLog.shift();
  if(revenueThisWeek>G.stats.bestWeek) G.stats.bestWeek=revenueThisWeek;

  // reset weekly accumulators
  G._weekRevenue=0; G._weekServed=0;

  // difficulty scales slowly with reputation/time
  G.difficulty = 1 + G.week*0.015 + G.rep*0.004;

  generateShopQueue();
  generateQuests();
  checkStory();
  checkAchievements();

  normalizeCellarLots();
  if(isStuck()){
    // no cash and nothing left to sell — offer the bank instead of a dead save
    setTimeout(()=>openBank(true), 420);
  } else if(G.cash<0){
    toast('⚠️ เงินสดติดลบ! ขายไวน์ ลดค่าใช้จ่าย หรือกู้เงินที่หน้าธนาคาร','bad');
  }

  // smart QoL alerts
  smartAlerts();

  roundMoney();
  pruneEmptyLots();   // safe here: nothing is iterating the cellar any more
  saveGame(true);
  renderTop();
  routePage();

  sfx('week');
  // show weekly report modal
  showWeeklyReport();
}
/* QoL: contextual warnings so players don't miss important states */
function smartAlerts(){
  const space=cellarCapacity()-cellarUsed();
  if(space<=2 && space>0) toast(`⚠️ เซลลาร์ใกล้เต็ม (เหลือ ${space} ช่อง)`,'bad');
  if(G.cash < weeklyCosts()*2 && G.cash>=0) toast('⚠️ เงินสดใกล้ไม่พอจ่ายค่าใช้จ่าย','bad');
  if(!Object.keys(G.cellar).length) toast('เซลลาร์ว่าง — ไปซื้อไวน์ที่หน้าตลาดก่อน','bad');
  // big winners worth taking profit on
  const winners=Object.keys(G.cellar).filter(id=>{
    const c=G.cellar[id]; return G.prices[id]*agingMult(id) > c.buyPrice*1.6;
  });
  if(winners.length) toast(`📈 มีไวน์ ${winners.length} รายการกำไรเกิน 60% — พิจารณาขายทำกำไร`,'gold');
}

// Event and auction follow-ups after the weekly report, unless a cash crisis
// took the slot first.
function afterReportExtras(){
  // a cellar hazard is urgent — resolve it before opportunities or auctions
  if(G._pendingHazard){
    G._pendingHazard=false;
    setTimeout(()=>showHazardEvent(), 450);
  } else if(G._pendingEvent){
    G._pendingEvent=false;
    setTimeout(()=>showOpportunityEvent(), 450);
  } else if(maybeStartAuction()){
    setTimeout(()=>{ sfx('gavel'); renderAuction(); }, 500);
  }
}

/* ============================================================
   SAVE / LOAD SYSTEM
   ============================================================ */
function saveGame(silent){
  let json;
  try{ json=JSON.stringify(G); }
  catch(e){ if(!silent) toast('บันทึกไม่สำเร็จ (ข้อมูลเสียหาย)','bad'); return false; }
  try{
    localStorage.setItem(SAVE_KEY, json);
    if(!silent) toast('💾 บันทึกเกมแล้ว','good');
    return true;
  }catch(e){
    // QuotaExceededError or private-mode block. The previous save is untouched
    // because setItem is atomic — it either writes the whole value or nothing.
    const quota = e && (e.name==='QuotaExceededError' || e.code===22 || e.code===1014);
    if(quota){
      // last resort: drop bulky non-essential history so the core save fits
      try{
        const slim=JSON.parse(json);
        if(slim.priceHist) for(const k in slim.priceHist) slim.priceHist[k]=slim.priceHist[k].slice(-24);
        if(slim.bidHist) for(const k in slim.bidHist) slim.bidHist[k]=slim.bidHist[k].slice(-24);
        if(Array.isArray(slim.news)) slim.news=slim.news.slice(-20);
        if(slim.stats&&Array.isArray(slim.stats.reviews)) slim.stats.reviews=slim.stats.reviews.slice(-8);

        return true;

        return false;

  }
}
// Recursively fill in any missing keys from the template (freshState) without
// clobbering saved values. Plain objects merge key-by-key; arrays and scalars
// from the save win as-is. This means new nested fields added in a later
// version appear automatically without hand-written `G.x = G.x || ...` lines.
function deepMergeDefaults(target, template){
  for(const k in template){
    const tv=template[k], sv=target[k];
    const tIsObj = tv && typeof tv==='object' && !Array.isArray(tv);
    if(!(k in target) || sv===undefined || sv===null){
      // clone the template default so saves don't share references with freshState
      target[k] = tIsObj || Array.isArray(tv) ? JSON.parse(JSON.stringify(tv)) : tv;
    } else if(tIsObj && sv && typeof sv==='object' && !Array.isArray(sv)){
      deepMergeDefaults(sv, tv);
    }
  }
  return target;
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw){ toast('ไม่พบไฟล์เซฟ','bad'); return false; }
    const data=JSON.parse(raw);
    // deep-merge the save onto a fresh template so every field — including
    // nested ones added in later versions — exists, without overwriting saved data
    G = deepMergeDefaults(JSON.parse(JSON.stringify(data)), freshState());
    // ensure prices exist for any new wines added since save
    WINES.forEach(w=>{ if(!(w.id in G.prices)){ G.prices[w.id]=w.base; G.priceHist[w.id]=[w.base]; } });
    // v1.9: the whole economy was rescaled. A pre-1.9 save carries prices from the
    // old scale, which would make everything look free. Detect and rebase.
    if(!data.econScale || data.econScale < 2){
      const sample = WINES[0];
      const saved = G.prices[sample.id] || sample.base;
      const ratio = sample.base / Math.max(1, saved);
      if(ratio > 3){   // clearly an old-scale save
        WINES.forEach(w=>{
          G.prices[w.id] = Math.round((G.prices[w.id]||w.base) * ratio);
          if(Array.isArray(G.priceHist[w.id])) G.priceHist[w.id]=G.priceHist[w.id].map(v=>Math.round(v*ratio));
          if(Array.isArray(G.bidHist?.[w.id])) G.bidHist[w.id]=G.bidHist[w.id].map(v=>Math.round(v*ratio));
        });
        for(const id in G.cellar){ if(G.cellar[id].buyPrice) G.cellar[id].buyPrice=Math.round(G.cellar[id].buyPrice*ratio); }
        for(const id in G.primeur){ if(G.primeur[id].buyPrice) G.primeur[id].buyPrice=Math.round(G.primeur[id].buyPrice*ratio); }
        G.cash = Math.round(G.cash * ratio);
        toast('ปรับสเกลเศรษฐกิจของเซฟเก่าให้เข้ากับเวอร์ชันใหม่แล้ว','gold');
      }
      G.econScale = 2;
    }
    // deep-merge already guaranteed every field exists; just clean stale refs
    pruneMissingWines();
    normalizeCellarLots();
    pruneEmptyLots();     // a corrupt save can clamp to qty 0; don't show ghosts
    checkRareUnlocks();   // re-evaluate in case an old save already met a condition
    return true;
  }catch(e){ toast('โหลดเซฟผิดพลาด','bad'); return false; }
}

function generateQuests(){
  G.quests=[];
  const pool=[...QUEST_TEMPLATES];
  for(let i=0;i<2;i++){
    const t=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    let target;
    if(t.step) target = t.min + Math.floor(Math.random()*(t.rng/t.step))*t.step;
    else target = t.min + Math.floor(Math.random()*t.rng);
    G.quests.push({type:t.id, target, reward:t.reward, progress:0, done:false});
  }
}
function questProgress(type, amount){
  G.quests.forEach(q=>{
    if(q.done) return;
    if(q.type===type){
      q.progress+=amount;
      if(q.progress>=q.target){
        q.done=true;
        G.cash+=q.reward;
        sfx('quest');
        toast(`✅ เควสต์สำเร็จ +${fmtK(q.reward)}`,'gold');
      }
    }
  });
}

function currentChapter(){ return CHAPTERS[G.chapter] || null; }

function goalProgress(goal){
  switch(goal.type){
    case 'rep': return G.rep;
    case 'cellar': return cellarUsed();
    case 'portfolio': return portfolioValue();
    case 'cash': return G.cash;
    case 'unicorn': return Object.keys(G.cellar).reduce((s,id)=> s + ((wineById(id)?.tier||0)>=5? G.cellar[id].qty:0), 0);
    case 'regions': return new Set(Object.keys(G.cellar).map(id=>wineById(id)?.region).filter(Boolean)).size;
    case 'staffRep': return G.staff.length>=4 ? G.rep : 0; // requires 4 staff AND rep target
    default: return 0;
  }
}
// human-readable sub-status for goals with compound conditions
function goalSubtext(goal){
  if(goal.type==='staffRep') return `พนักงาน ${G.staff.length}/4 คน · ชื่อเสียง ★${G.rep}/${goal.target}`;
  if(goal.type==='regions'){
    const rs=[...new Set(Object.keys(G.cellar).map(id=>wineById(id)?.region).filter(Boolean))];
    return `ภูมิภาคที่มี: ${rs.length? rs.join(', ') : '—'}`;
  }
  return '';
}
function goalMet(goal){ return goalProgress(goal) >= goal.target; }

function checkStory(){
  const ch=currentChapter();
  if(!ch) return;
  if(goalMet(ch.goal)){
    // grant reward
    const r=ch.reward||{};
    if(r.cash) G.cash+=r.cash;
    if(r.rep) G.rep+=r.rep;
    G.storyLog.push(ch.id);
    G.chapter++;
    // queue an explainer for any system that just became available
    if(G.chapter===PARTY_CHAPTER) G._unlockExplain='party';
    else if(G.chapter===ALLOC_CHAPTER) G._unlockExplain='alloc';
    else if(G.chapter===CONTRACT_CHAPTER) G._unlockExplain='contract';
    const nextCh=currentChapter();
    showChapterComplete(ch, r, nextCh);
  }
}

}

function hireStaff(idx){
  const sp=STAFF_POOL[idx]; const cost=sp.salary*3;
  if(cost>G.cash){ toast('เงินสดไม่พอจ้าง','bad'); return; }
  G.cash-=cost;
  const name=sp.names[Math.floor(Math.random()*sp.names.length)];
  G.staff.push({role:sp.role, icon:sp.icon, salary:sp.salary, skill:sp.skill, name, lvl:1});
  sfx('coin');
  toast(`จ้าง ${name} (${sp.role}) แล้ว!`,'gold');
  checkAchievements(); renderTop(); pageStaff(); bindFocusables();
}
function trainStaff(idx){
  const s=G.staff[idx]; if(!s) return;
  if(s.lvl>=STAFF_MAX_LVL){ toast('ถึงระดับสูงสุดแล้ว (ระดับโลก)','bad'); return; }
  const nextTier=tierOf(s.lvl+1);
  const base=STAFF_POOL.find(p=>p.skill===s.skill)?.salary || s.salary;
  const cost=Math.round(base*(s.lvl===1?9:22));      // big jumps, real commitment
  if(cost>G.cash){ toast(`เงินสดไม่พอ ต้องใช้ ${fmtK(cost)}`,'bad'); return; }
  G.cash-=cost;
  s.lvl++;
  s.salary=Math.round(base*nextTier.salaryMult);
  sfx('great');
  toast(`🎓 ${s.name} เลื่อนขั้นเป็น "${nextTier.t}"! (เงินเดือน ${fmtK(s.salary)})`,'gold');
  checkAchievements(); renderTop(); pageStaff(); bindFocusables();
}

/* ============================================================
   PRESTIGE / NEW GAME+
   ============================================================ */
function canPrestige(){ return G.chapter>=CHAPTERS.length || portfolioValue()>=30000000; }
function prestigeGain(){
  // bonus scales with how big the empire got
  const v=portfolioValue()+G.cash;
  return Math.max(5, Math.min(50, Math.floor(v/2000000)));
}
function doPrestige(){
  if(!canPrestige()){ toast('ยังไม่ถึงเงื่อนไข — เล่นจบเนื้อเรื่องหรือทำพอร์ตถึง ฿30M','bad'); return; }
  const gain=prestigeGain();
  const newLevel=(G.prestige||0)+1;
  const newBonus=(G.prestigeBonus||0)+gain;
  const keepAch=G.ach, keepStats=G.stats;
  G=freshState();
  G.prestige=newLevel;
  G.prestigeBonus=newBonus;
  G.ach=keepAch;                  // achievements persist
  G.stats=keepStats;              // lifetime stats persist
  G.cash=Math.round(1500000*(1+newBonus/100));
  G.tutDone=true;                 // skip tutorial on NG+
  G.introSeen=true;               // and the opening cinematic
  initPrices(); generateShopQueue(); generateQuests();
  sfx('great');
  saveGame(true); renderTop(); routePage();
  toast(`✨ New Game+ ระดับ ${newLevel}! โบนัสถาวร +${newBonus}%`,'gold');
  setTimeout(()=>maybeShowChapterScene(), 500);
}
// prestige boosts shop revenue permanently
function prestigeMult(){ return 1 + (G.prestigeBonus||0)/100; }

/* Estimate what a serve actually pays out, using the same maths as
   serveCustomer. The shop card previously ran its own formula, which drifted
   badly from the real payout — players saw one number and banked another. */
function estimateServe(id, cust, quality){
  const w=wineById(id); const c=G.cellar[id];
  if(!w||!c) return null;
  const price=G.prices[id];
  const markup=1.05+quality*quality*0.75;
  let sellPrice=price*markup*seasonPref(w)*festivalStyleBonus(w);
  const tierPrem=[0,0,0.04,0.10,0.20,0.35][w.tier]||0;
  let tip=0, capped=false;
  const stretch = 1 + (quality>0.78 ? 0.15 : quality>0.55 ? 0.07 : 0);
  const payCap  = Math.max(0, cust.budget||0) * stretch;
  if(sellPrice > payCap){
    sellPrice = payCap;
    capped=true;
  } else if(quality>0.78){
    tip=sellPrice*(0.15+tierPrem+staffBonus('pairing')*0.02);
  } else if(quality>0.55){
    tip=sellPrice*(0.06+tierPrem*0.4);
  }
  const total=Math.max(0, Math.round((sellPrice+tip)*prestigeMult()));
  const cost=Math.round(c.buyPrice||price);
  return {total, cost, profit: total-cost, tip: Math.round(tip), capped};
}

/* ============================================================
   FOCUS / CONTROLLER NAVIGATION
   ============================================================ */
let focusList=[], focusIndex=0;
let modalFocusList=[], modalFocusIndex=0;

function bindFocusables(){
  focusList=[...content.querySelectorAll('[data-focus]')];
  // click handlers
  focusList.forEach(el=>{
    el.onclick=()=>activate(el);
  });
  if(focusIndex>=focusList.length) focusIndex=Math.max(0,focusList.length-1);
  updateFocus();
}
// Input mode. On a touch screen (the Tesla display) the controller focus ring
// is meaningless, and its scrollIntoView yanked the page around after every
// tap that re-rendered it. The ring only shows — and only scrolls — once a
// keyboard arrow or a gamepad has been used; the next tap hides it again.
let navMode=false;
function setNavMode(on){
  if(navMode===on) return;
  navMode=on;
  document.body.classList.toggle('kbd', on);
  updateFocus();
}
window.addEventListener('pointerdown', ()=>setNavMode(false), true);

function updateFocus(){
  document.querySelectorAll('.focus').forEach(e=>e.classList.remove('focus'));
  if(!navMode) return;
  // nav highlight when in nav mode handled separately
  if(modalFocusList.length){
    modalFocusList.forEach(e=>e.classList.remove('focus'));
    const el=modalFocusList[modalFocusIndex]; if(el){el.classList.add('focus'); el.scrollIntoView({block:'nearest'});}
    return;
  }
  const el=focusList[focusIndex];
  if(el){ el.classList.add('focus'); el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function activate(el){
  const type=el.dataset.focus;
  if(type==='wine') openTrade(el.dataset.id);
  else if(type==='cellar') openTrade(el.dataset.id);
  else if(type==='primeur') openPrimeur(el.dataset.id, +el.dataset.ep);
  else if(type==='pair') serveCustomer(el.dataset.id);
  else if(type==='upg') buyUpgrade(el.dataset.id);
  else if(type==='upkeep'){
    const cost=120000;
    if(G.cash<cost){ toast('เงินสดไม่พอ','bad'); sfx('bad'); return; }
    G.cash-=cost; G.cash=Math.round(G.cash); G.cellarUpkeep=Math.min(1,(G.cellarUpkeep||0)+0.34);
    sfx('cash'); toast('บำรุงรักษาระบบควบคุมอุณหภูมิแล้ว','good'); renderTop(); routePage();

  else if(type==='insoff'){ G.cellarInsured=false; sfx('click'); toast('ยกเลิกประกันแล้ว','bad'); renderTop(); routePage(); }

  else if(type==='load'){ if(loadGame()){ renderTop(); routePage(); toast('📂 โหลดเซฟแล้ว','good'); } }

/* QoL: serve the current customer with the best-matching wine */
function autoServe(){
  const cust=G.shopQueue[0]; if(!cust) return;
  const own=Object.keys(G.cellar);
  if(!own.length){ toast('ไม่มีไวน์ในเซลลาร์','bad'); return; }
  let best=own[0], bq=-1;
  own.forEach(id=>{ const q=evalPairing(cust,wineById(id),G.cellar[id]); if(q>bq){bq=q;best=id;} });
  serveCustomer(best);

/* ============================================================
   COUNTERFEIT DISPOSAL — get rid of fakes without wrecking your name
   ============================================================ */
function fakeCount(){ return Object.values(G.cellar).reduce((s,c)=>s+(c.fake||0),0); }
// Bottles you already know are suspect. With a taster this is everything;
// without one, doubts creep in slowly as you handle the bottles.
function lotSuspect(c){ return Math.max(0, Math.min(c.suspect||0, Math.min(c.fake||0, c.qty||0))); }
function suspectCount(){ return Object.values(G.cellar).reduce((s,c)=>s+lotSuspect(c),0); }
// Enforce suspect <= fake <= qty at the property level. Any code path that
// writes a too-large value silently gets the clamped one, so the invariant
// cannot be violated regardless of call ordering.
// A cellar lot must always satisfy: 0 <= suspect <= fake <= qty.
// An earlier version enforced this with a property accessor, but JSON
// round-trips (saving, loading, auction payouts) strip accessors and leave a
// stale plain number behind. A plain clamp survives serialisation, so that is
// what we use — call it after anything that changes qty/fake/suspect.
// Coerce any caller-supplied quantity to a safe whole number. NaN/undefined/
// Infinity all collapse to 0, because `Math.floor(NaN)` stays NaN and every
// comparison against it is false — which lets bad input slip past a `< 1`
// guard and poison the cash total.
function safeQty(n){
  n = Math.floor(Number(n));
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function sealLot(c){
  if(!c) return c;
  c.qty = Math.max(0, c.qty||0);
  c.fake = Math.max(0, Math.min(c.fake||0, c.qty));
  c.suspect = Math.max(0, Math.min(c.suspect||0, c.fake));
  if(!c.fake) c.certified=false;
  return c;
}
function sealAllLots(){ for(const id in G.cellar) sealLot(G.cellar[id]); }

function normalizeCellarLots(){
  // Clamp every lot to 0 <= suspect <= fake <= qty.
  // Empty lots are NOT deleted here: callers may be iterating G.cellar.
  for(const id in G.cellar) sealLot(G.cellar[id]);
}

function tickFakeSuspicion(){
  normalizeCellarLots();
  const skill=staffBonus('quality');
  let found=0, names=[];
  for(const id in G.cellar){
    const c=G.cellar[id];
    // a sale may have removed fake bottles since the last tick, so re-clamp first
    c.fake = Math.max(0, Math.min(c.fake||0, c.qty));
    c.suspect = Math.max(0, Math.min(c.suspect||0, c.fake));
    const hidden=(c.fake||0)-(c.suspect||0);
    if(hidden<=0) continue;
    if(skill>0){
      // a taster on the payroll audits the cellar and flags everything at once
      c.suspect=c.fake; found+=hidden; names.push(wineById(id).name);
    } else {
      // no taster: a leaking cork, an off nose, a label that ages wrong...
      let n=0;
      for(let i=0;i<hidden;i++) if(Math.random()<0.22) n++;
      if(n>0){ c.suspect=Math.min(c.fake, (c.suspect||0)+n); found+=n; names.push(wineById(id).name); }
    }
    // hard clamp every lot each tick, no matter which branch ran
    sealLot(c);
  }
  normalizeCellarLots();
  if(found>0){
    G.news.push({mult:1, msg:`🔍 คุณเริ่มสงสัยไวน์ ${found} ขวดในเซลลาร์ (${names.slice(0,2).join(', ')}${names.length>2?' ฯลฯ':''}) — เปิดหน้าเซลลาร์เพื่อจัดการ`});
    toast(`🔍 พบไวน์ต้องสงสัย ${found} ขวดในเซลลาร์!`,'bad');
  }
}

// Disposal costs live here so the modal and the action can never disagree.
const DISPOSAL_RATES = {
  destroy: 16000,   // paid to a licensed disposal service, per bottle
  lab:     28000,   // independent authentication, per bottle
  report:  48000,   // bounty paid by the trade association, per bottle
};
function disposalCost(mode, n){ return Math.round((DISPOSAL_RATES[mode]||0) * n); }

// Core disposal effect without toasts/modal — used by the bulk "handle all"
// action so it can process many lots without a popup per bottle.
function disposeFakesSilent(id, mode){
  const c=G.cellar[id]; if(!c||!lotSuspect(c)) return false;
  const n=lotSuspect(c);
  if(mode==='destroy'){
    const cost=disposalCost('destroy', n);
    if(cost>G.cash) return false;
    G.cash=Math.round(G.cash-cost);
  } else if(mode==='report'){
    if(staffBonus('quality')<=0 && !c.certified) return false;
    const rw=disposalCost('report', n), rep=Math.max(1,Math.round(n/2));
    G.cash=Math.round(G.cash+rw); G.rep+=rep;
    G.stats.fakesReported=(G.stats.fakesReported||0)+n;
  } else { return false; }
  c.qty-=n; c.fake=Math.max(0,(c.fake||0)-n); c.suspect=0; c.certified=false;
  c.fake=Math.max(0, Math.min(c.fake||0, c.qty));
  if(c.qty<=0) delete G.cellar[id];
  return true;
}

function disposeFakes(id, mode){
  const c=G.cellar[id]; if(!c||!lotSuspect(c)) return;
  const n=lotSuspect(c);
  if(mode==='lab'){
    const cost=disposalCost('lab', n);
    if(cost>G.cash){ toast('เงินสดไม่พอส่งแล็บตรวจ','bad'); return; }
    G.cash-=cost; c.certified=true;
    sfx('click');
    toast(`🧪 แล็บยืนยันว่าเป็นของปลอม ${n} ขวด (−${fmtK(cost)}) — แจ้งสมาคมได้แล้ว`,'gold');
    closeModal(); renderTop(); routePage(); openDisposal(id);
    return;
  }
  if(mode==='destroy'){
    const cost=disposalCost('destroy', n);
    if(cost>G.cash){ toast('เงินสดไม่พอจ่ายค่ากำจัด','bad'); return; }
    G.cash-=cost;
    sfx('click');
    toast(`ทำลายไวน์ปลอม ${n} ขวดอย่างถูกต้อง (−${fmtK(cost)})`,'good');
  } else if(mode==='report'){
    if(staffBonus('quality')<=0 && !c.certified){ toast('ต้องมีนักชิม หรือส่งแล็บตรวจก่อนจึงจะแจ้งสมาคมได้','bad'); return; }
    const rw=disposalCost('report', n), rep=Math.max(1,Math.round(n/2));
    G.cash+=rw; G.rep+=rep;
    G.stats.fakesReported=(G.stats.fakesReported||0)+n;
    sfx('great');
    toast(`🛡️ แจ้งสมาคมสำเร็จ! +${fmtK(rw)} · ชื่อเสียง +★${rep}`,'gold');
  } else {
    const gain=Math.round(bidPrice(id)*n*0.35);
    G.cash+=gain;
    if(Math.random()<0.40){
      const pen=n*2; G.rep=Math.max(0,G.rep-pen);
      sfx('bad');
      toast(`🚨 ถูกจับได้! ได้ ${fmtK(gain)} แต่เสียชื่อเสียง −★${pen}`,'bad');
    } else {
      sfx('sell');
      toast(`ปล่อยของได้เงียบๆ +${fmtK(gain)}`,'good');
    }
  }
  // remove the fakes from the lot
  c.qty-=n; c.fake=Math.max(0,(c.fake||0)-n); c.suspect=0; c.certified=false;
  c.fake=Math.max(0, Math.min(c.fake||0, c.qty));
  if(c.qty<=0) delete G.cellar[id];
  closeModal(); checkAchievements(); renderTop(); routePage();
}

  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){focusIndex=(focusIndex-1+focusList.length)%focusList.length;updateFocus();e.preventDefault();}

function pollGamepad(){
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  const gp=gpIndex!==null?pads[gpIndex]:(pads[0]||null);
  if(gp){
    const btn=i=>gp.buttons[i]&&gp.buttons[i].pressed;
    if(!navMode && gp.buttons.some(b=>b&&b.pressed)) setNavMode(true);
    const edge=(i,name)=>{ const p=btn(i); const was=gpPrev[name]; gpPrev[name]=p; return p&&!was; };
    // dpad + left stick
    const ax0=gp.axes[0]||0, ax1=gp.axes[1]||0;
    const inModal=document.getElementById('modalBg').classList.contains('show');
    const dead=0.5;
    const right = edge(15,'r')||(ax0>dead&&!gpPrev.axR)|| (edge(14,'ignoreL'),false);
    // simpler stick handling:
    handleStick(ax0,ax1);
    // buttons: 12 up,13 down,14 left,15 right
    if(edge(13,'down')||edge(15,'right')) moveFocus(1);
    if(edge(12,'up')||edge(14,'left')) moveFocus(-1);
    if(edge(0,'a')){ // A
      if(inModal) modalFocusList[modalFocusIndex]?.click();
      else focusList[focusIndex]?.click();
    }
    if(edge(1,'b')){ if(inModal) closeModal(); } // B
    if(edge(2,'x')){ // X quick trade
      if(!inModal){ const el=focusList[focusIndex]; if(el)activate(el); }
    }
    if(edge(3,'y')){ if(!inModal) nextWeek(); } // Y
    if(edge(4,'lb')){ cyclePage(-1); } // LB
    if(edge(5,'rb')){ cyclePage(1); } // RB
  }
  requestAnimationFrame(pollGamepad);
}
let stickCooldown=0;
function handleStick(x,y){
  const now=Date.now();
  if(now<stickCooldown) return;
  const dead=0.55;
  if(y>dead||x>dead){ moveFocus(1); stickCooldown=now+180; }
  else if(y<-dead||x<-dead){ moveFocus(-1); stickCooldown=now+180; }
}
function moveFocus(dir){
  const inModal=document.getElementById('modalBg').classList.contains('show');

    if(!focusList.length)return;
    focusIndex=(focusIndex+dir+focusList.length)%focusList.length;
  }

}

let AC=null, sfxOn=true;
function audioCtx(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC && AC.state==='suspended') AC.resume();
  return AC;
}
// generic tone
function tone(freq, dur=0.12, type='sine', vol=0.16, delay=0, sweepTo=null){
  if(!sfxOn) return;
  const ac=audioCtx(); if(!ac) return;
  const t0=ac.currentTime+delay;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  if(sweepTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,sweepTo), t0+dur);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
// filtered noise burst (for cork pop / pour)
function noise(dur=0.12, vol=0.14, freq=900, q=2, delay=0){
  if(!sfxOn) return;
  const ac=audioCtx(); if(!ac) return;
  const t0=ac.currentTime+delay;
  const n=Math.floor(ac.sampleRate*dur);
  const buf=ac.createBuffer(1,n,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=ac.createBufferSource(); src.buffer=buf;
  const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
  const g=ac.createGain(); g.gain.value=vol;
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(t0);
}

  const filter=ac.createBiquadFilter();
  filter.type='lowpass'; filter.frequency.value=1600; filter.Q.value=0.5;
  filter.connect(master);
  // reverb send for depth/space
  let reverb=null, revGain=null;
  try{
    const len=Math.floor(ac.sampleRate*2.6);
    const imp=ac.createBuffer(2, len, ac.sampleRate);
    for(let ch=0; ch<2; ch++){ const d=imp.getChannelData(ch);
      for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len, 2.4); } }
    reverb=ac.createConvolver(); reverb.buffer=imp;
    revGain=ac.createGain(); revGain.gain.value=0.32;
    reverb.connect(revGain); revGain.connect(master);
  }catch(e){ reverb=null; }
  const voice=(o,g)=>{ g.connect(filter); if(reverb) g.connect(reverb); };
  BGM={ master, filter, reverb, step:0, melodyIdx:0, stopped:false, timer:null };
  const playStep=()=>{
    if(!BGM || BGM.stopped) return;
    const ac=audioCtx(); if(!ac) return;
    const chord=BGM_CHORDS[BGM.step % BGM_CHORDS.length];
    const t0=ac.currentTime, dur=4.2;
    chord.notes.forEach((f,i)=>{
      [0, 0.6].forEach((det,d)=>{
        const o=ac.createOscillator(), g=ac.createGain();
        o.type = d? 'sine':'triangle'; o.frequency.value=f+det;
        const peak=0.045/(i*0.5+1);
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(peak, t0+1.1);
        g.gain.linearRampToValueAtTime(peak*0.8, t0+dur*0.6);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
        o.connect(g); voice(o,g); o.start(t0); o.stop(t0+dur+0.1);
      });
    });
    const bo=ac.createOscillator(), bg=ac.createGain();
    bo.type='sine'; bo.frequency.value=chord.bass;
    bg.gain.setValueAtTime(0,t0); bg.gain.linearRampToValueAtTime(0.10, t0+0.5);
    bg.gain.exponentialRampToValueAtTime(0.0001, t0+dur*0.9);
    bo.connect(bg); bg.connect(filter); bo.start(t0); bo.stop(t0+dur);
    const bo2=ac.createOscillator(), bg2=ac.createGain();
    bo2.type='sine'; bo2.frequency.value=chord.bass*1.5;
    bg2.gain.setValueAtTime(0,t0+dur*0.5); bg2.gain.linearRampToValueAtTime(0.06, t0+dur*0.5+0.4);
    bg2.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    bo2.connect(bg2); bg2.connect(filter); bo2.start(t0+dur*0.5); bo2.stop(t0+dur);
    if(BGM.step % 2 === 0 && Math.random()<0.85){
      const mf=BGM_MELODY[BGM.melodyIdx % BGM_MELODY.length];
      BGM.melodyIdx += (Math.random()<0.3?2:1);
      const mt=t0+0.3+Math.random()*0.6;
      const pluck=(freq, when, vol)=>{
        const mo=ac.createOscillator(), mg=ac.createGain();
        mo.type='triangle'; mo.frequency.value=freq; const md=1.4;
        mg.gain.setValueAtTime(0, when); mg.gain.linearRampToValueAtTime(vol, when+0.04);
        mg.gain.exponentialRampToValueAtTime(0.0001, when+md);
        mo.connect(mg); voice(mo,mg); mo.start(when); mo.stop(when+md+0.1);
      };
      pluck(mf, mt, 0.07); pluck(mf, mt+0.42, 0.035);
    }
    BGM.step++; BGM.timer=setTimeout(playStep, 4000);
  };
  playStep();
}

function stopBGM(){
  if(!BGM) return;
  const ac=audioCtx();
  BGM.stopped=true;
  if(BGM.timer) clearTimeout(BGM.timer);
  if(ac && BGM.master){
    try{
      BGM.master.gain.cancelScheduledValues(ac.currentTime);
      BGM.master.gain.setValueAtTime(BGM.master.gain.value, ac.currentTime);
      BGM.master.gain.linearRampToValueAtTime(0, ac.currentTime+1.2);
    }catch(e){}
  }
  const dead=BGM; BGM=null;
  setTimeout(()=>{ try{ dead.master.disconnect(); dead.filter.disconnect(); if(dead.reverb) dead.reverb.disconnect(); }catch(e){} }, 1500);
}

function setBgmVolume(v){
  DISP.bgmVol=v;
  if(BGM && BGM.master){
    const ac=audioCtx();
    if(ac) BGM.master.gain.linearRampToValueAtTime(v*0.16, ac.currentTime+0.3);
  }
}

function floatMoney(amount, anchorEl){
  try{
    const host = anchorEl || document.getElementById('stCash');
    if(!host) return;
    const r = host.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'floatmoney ' + (amount>=0?'pos':'neg');
    d.textContent = (amount>=0?'+':'\u2212') + fmtK(Math.abs(amount));
    d.style.left = (r.left + r.width/2) + 'px';
    d.style.top  = (r.top) + 'px';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 1150);
  }catch(e){}
}

function toast(msg,type=''){
  const t=document.createElement('div');
  t.className='toast '+type;
  // messages are internal strings only; emojify swaps emoji for inline SVG so
  // the car browser's font support doesn't matter
  t.innerHTML=emojify(msg, 16);
  const box=document.getElementById('toasts');
  box.appendChild(t);
  // a burst of events (buying several lots, a busy week) shouldn't wall off
  // the middle of the screen — keep only the newest three
  while(box.children.length>3) box.firstElementChild.remove();
  setTimeout(()=>t.remove(),2800);
}

/* ============================================================
   AGE GATE — the game is built around wine, so confirm the player
   meets the legal drinking age before anything else renders. The
   answer is remembered locally; a player who says no is shown a
   polite exit rather than the game.
   ============================================================ */
const AGE_KEY = 'cellarAndVine_ageOk';
const LEGAL_AGE = 20;   // Thailand

function ageVerified(){
  try{ return localStorage.getItem(AGE_KEY)==='1'; }catch(e){ return false; }
}

function showAgeGate(onPass){
  const el=document.getElementById('ageGate');
  if(!el){ onPass(); return; }
  el.innerHTML=`
    <div class="ag-card">
      <div class="ag-logo">${lineIcon('glass',44)}</div>
      <h2 class="ag-title">Cellar &amp; Vine</h2>
      <p class="ag-sub">เกมบริหารร้านไวน์และเซลลาร์</p>
      <div class="ag-body">
        <p>เกมนี้มีเนื้อหาเกี่ยวกับ<b>เครื่องดื่มแอลกอฮอล์</b><br>กรุณายืนยันว่าคุณอายุ <b>${LEGAL_AGE} ปีขึ้นไป</b></p>
      </div>
      <div class="ag-actions">
        <button class="btn gold big" id="agYes">ใช่ ฉันอายุ ${LEGAL_AGE} ปีขึ้นไป</button>
        <button class="btn ghost" id="agNo">ยังไม่ถึงเกณฑ์</button>
      </div>
      <p class="ag-fine">เกมนี้เป็นเรื่องแต่ง ราคาและข้อมูลไวน์เป็นการจำลองเพื่อความบันเทิงเท่านั้น<br>ไม่ใช่คำแนะนำการลงทุน และไม่ได้สนับสนุนการดื่มแอลกอฮอล์</p>
    </div>`;
  el.style.display='flex';
  document.getElementById('agYes').onclick=()=>{
    try{ localStorage.setItem(AGE_KEY,'1'); }catch(e){}
    el.style.opacity='0';
    setTimeout(()=>{ el.style.display='none'; el.style.opacity=''; onPass(); }, 280);
  };
  document.getElementById('agNo').onclick=()=>{
    el.innerHTML=`
      <div class="ag-card">
        <div class="ag-logo">${lineIcon('glass',44)}</div>
        <h2 class="ag-title">ขอบคุณที่ตอบตามจริง</h2>
        <div class="ag-body">
          <p>เกมนี้มีเนื้อหาเกี่ยวกับเครื่องดื่มแอลกอฮอล์<br>จึงเปิดให้เล่นเฉพาะผู้ที่อายุ ${LEGAL_AGE} ปีขึ้นไป</p>
          <p style="margin-top:10px;color:var(--ink-soft);font-size:13px">แล้วพบกันใหม่เมื่อถึงเกณฑ์นะครับ 🍇</p>
        </div>
      </div>`;
  };
}

/* ============================================================
   INSOLVENCY RESCUE — a new player can spend their way into a
   spiral without noticing a toast go by. When cash runs short,
   Mia the broker steps in with a plain explanation of the options
   so the run is recoverable instead of quietly lost.
   ============================================================ */
function rescueNeeded(){
  const costs=weeklyCosts();
  // trouble = already negative, or not enough left to cover two more weeks
  return G.cash < 0 || (costs>0 && G.cash < costs*2);
}

function maybeShowRescue(){
  if(!rescueNeeded()) return false;
  if(G.week - (G.lastRescueWeek||0) < 8) return false;   // at most once every 8 weeks
  G.lastRescueWeek=G.week;

  const costs=weeklyCosts();
  const debt=loanDebt();
  const canLoan=creditLimit()-debt;
  // the most valuable bottles they could sell right now
  const sellable=Object.keys(G.cellar)
    .filter(id=>G.cellar[id].qty>0 && !G.cellar[id].suspect)
    .map(id=>({id, name:wineById(id)?.name||id, val:Math.round(bidPrice(id)*agingMult(id)*G.cellar[id].qty)}))
    .sort((a,b)=>b.val-a.val).slice(0,3);

  const m=document.getElementById('modal');
  m.innerHTML=`
    <div class="row" style="gap:14px;align-items:flex-start;margin-bottom:10px">
      <div style="width:76px;flex-shrink:0">${charPortrait('broker','sad')}</div>
      <div>
        <h3 style="margin:0">มีอา แทน</h3>
        <div class="wine-sub">โบรกเกอร์ตลาดรอง</div>
      </div>
    </div>
    <p style="font-size:14px;line-height:1.75;color:var(--ink);margin-bottom:12px">
      ${G.cash<0
        ? 'ฟังนะ เงินสดคุณ<b>ติดลบ</b>แล้ว ถ้าปล่อยไว้ดอกเบี้ยจะกินคุณทั้งเป็น — แต่ยังแก้ได้ ฉันช่วยดูให้'
        : 'ดูตัวเลขคุณแล้วฉันเป็นห่วง เงินสดเหลือไม่พอจ่ายค่าใช้จ่ายอีกสองสัปดาห์ — จัดการตอนนี้ยังทัน'}
    </p>
    <div class="rescue-facts">
      <div class="rf-row"><span>เงินสดตอนนี้</span><b style="color:${G.cash<0?'var(--down)':'var(--ink)'}">${fmt(G.cash)}</b></div>
      <div class="rf-row"><span>ค่าใช้จ่ายต่อสัปดาห์</span><b style="color:var(--down)">${fmt(costs)}</b></div>
      ${debt>0?`<div class="rf-row"><span>หนี้คงเหลือ</span><b style="color:var(--down)">${fmt(debt)}</b></div>`:''}
      <div class="rf-row"><span>มูลค่าไวน์ในคลัง</span><b>${fmt(portfolioValue())}</b></div>
    </div>
    <div class="rescue-tips">
      <div class="rt-title">ทางออกที่ฉันแนะนำ</div>
      ${sellable.length?`<div class="rt-item">${lineIcon('coin',15)} <span><b>ขายไวน์ที่มีมูลค่าสูง</b> — ${sellable.map(x=>`${x.name} (~${fmtK(x.val)})`).join(' · ')}</span></div>`:''}
      ${canLoan>0?`<div class="rt-item">${lineIcon('bank',15)} <span><b>กู้เงินจากธนาคาร</b> — วงเงินที่เหลือ ${fmtK(canLoan)} ใช้ต่อลมหายใจได้ แต่มีดอกเบี้ยทุกสัปดาห์</span></div>`:''}
      <div class="rt-item">${lineIcon('people',15)} <span><b>ลดค่าใช้จ่าย</b> — ปลดพนักงานที่ยังไม่จำเป็นออกก่อน แล้วค่อยจ้างใหม่ตอนฟื้น</span></div>
      <div class="rt-item">${lineIcon('shop',15)} <span><b>เน้นขายหน้าร้าน</b> — จับคู่ไวน์กับอาหารให้ตรงใจ ได้กำไรเร็วกว่ารอราคาตลาด</span></div>
    </div>
    <div class="row" style="justify-content:center;gap:10px;margin-top:14px">
      ${canLoan>0?`<button class="btn gold big" id="rescueBank" data-focus="modal">ไปหน้าธนาคาร</button>`:''}
      <button class="btn ghost" id="rescueClose" data-focus="modal">ฉันจัดการเอง</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
  sfx('alert');
  const rb=document.getElementById('rescueBank');
  if(rb) rb.onclick=()=>{ closeModal(); openBank(); };
  document.getElementById('rescueClose').onclick=closeModal;
  modalFocusables();
  return true;
}

/* ---------- START ---------- */
function start(){
  loadDisplay();
  // Confirm legal drinking age before the game is revealed. Returning players
  // who already answered go straight through.
  if(!ageVerified()){ showAgeGate(bootGame); return; }
  bootGame();
}

function bootGame(){
  const loaded = hasSave() && loadGame();
  if(!loaded){ initPrices(); generateShopQueue(); generateQuests(); }
  if(!G.quests || !G.quests.length) generateQuests();
  bindTopbar();
  renderTop();
  routePage();
  pollGamepad();
  if(loaded){
    // an existing save is mid-playthrough — never replay the opening
    if(!G.introSeen){ G.introSeen=true; saveGame(true); }
    toast('📂 โหลดเกมที่บันทึกไว้ · ยินดีต้อนรับกลับ! 🍷','gold');
    if(!G.tutDone) setTimeout(showTutorial, 500);
  } else if(!G.introSeen){
    // brand-new game: play the opening cinematic, then the tutorial
    setTimeout(()=>playCutscene(INTRO_CARDS, false), 450);
  } else {
    setTimeout(showTutorial, 400);
  }
  // one delegated listener covers every glossary term on every page
  document.addEventListener('click', e=>{
    const g=e.target.closest && e.target.closest('[data-gloss]');
    if(g){ e.preventDefault(); e.stopPropagation(); sfx('click'); showGlossary(g.dataset.gloss); }
  });
  document.addEventListener('keydown', e=>{
    if(e.key!=='Enter' && e.key!==' ') return;
    const g=document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-gloss]');
    if(g){ e.preventDefault(); sfx('click'); showGlossary(g.dataset.gloss); }
  });
  injectIcons();   // fill static chrome icons (week button, hint bar, brand)
  setInterval(()=>saveGame(true), 60000);
  window.addEventListener('beforeunload', ()=>saveGame(true));
  // The car browser rarely gets a clean unload: the screen goes to sleep, the
  // driver shifts out of Park, or the tab is discarded in the background. Save
  // whenever the page is hidden so at most a few seconds are ever lost.
  window.addEventListener('pagehide', ()=>saveGame(true));
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveGame(true); });
  // Ask the browser not to evict our save under storage pressure (best effort).
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

  // Browsers block audio until the user interacts. Resume the context on the
  // very first tap/click/key so SFX work from then on, then remove the listener.
  const unlockAudio=()=>{
    try{ const ac=audioCtx(); if(ac && ac.state==='suspended') ac.resume(); }catch(e){}
    // if the player had music enabled, it couldn't autostart before this first
    // interaction — start it now that audio is unlocked
    try{ if(DISP.bgm && !BGM) startBGM(); }catch(e){}
    window.removeEventListener('pointerdown', unlockAudio);
    window.removeEventListener('keydown', unlockAudio);
    window.removeEventListener('touchstart', unlockAudio);
  };
  window.addEventListener('pointerdown', unlockAudio, {once:false});
  window.addEventListener('keydown', unlockAudio, {once:false});
  window.addEventListener('touchstart', unlockAudio, {once:false});
}
start();
</script>
