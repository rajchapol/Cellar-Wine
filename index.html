<style>
  /* ============ FONTS & TOKENS ============ */
  /* Web fonts load via a non-blocking <link> in <head>; every rule below
     carries a system fallback so the game is fully playable — and readable in
     Thai — even when Google Fonts is slow, blocked, or entirely offline. */

  :root{
    /* Warm, soft cartoon palette */
    --paper:      #F6EDDD;   /* warm cream base */
    --paper-2:    #EFE2CC;   /* deeper cream */
    --parchment:  #FBF5EA;   /* card face */
    --ink:        #3E2C26;   /* warm dark brown text */
    --ink-soft:   #7A6355;   /* muted brown */
    --wine:       #7B2C3A;   /* claret */
    --wine-deep:  #591C2A;
    --wine-bright:#A23A4C;
    --gold:       #C8973F;   /* warm gold */
    --gold-soft:  #E4C77E;
    --sage:       #7C8B5E;   /* olive/sage green */
    --sage-deep:  #5B6A42;
    --sky:        #6E93A6;   /* dusty blue */
    --terra:      #C77B4E;   /* warm clay */
    --up:         #4F7D4A;   /* market up */
    --down:       #B24A3E;   /* market down */
    --shadow:     rgba(62,44,38,.18);
    --line:       rgba(62,44,38,.14);
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden;}
  html{
    /* Stop the edge-swipe from triggering browser back/forward and kill the
       rubber-band bounce — both make a full-screen game feel broken on a phone. */
    overscroll-behavior:none;
    height:100%;
  }
  body{
    overscroll-behavior:none;
    touch-action:manipulation;   /* no double-tap zoom delay on buttons */
    position:fixed; inset:0;     /* the shell never scrolls; panes scroll inside */
    overflow:hidden;
    font-family:'Sarabun','Nunito Sans','Noto Sans Thai','Leelawadee UI','Thonburi',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, #FCF6EC 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 120%, #EAD9BC 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    user-select:none;
    line-height:1.35;
  }
  body.dark{
    --paper:      #221A18;
    --paper-2:    #2C2220;
    --parchment:  #2A211F;
    --ink:        #F0E3D2;
    --ink-soft:   #B49E8C;
    --wine:       #C4697A;
    --wine-deep:  #8A3B4C;
    --wine-bright:#D98698;
    --gold:       #E0B25C;
    --gold-soft:  #8A6B32;
    --sage:       #8FA06F;
    --sage-deep:  #A8BA85;
    --sky:        #8FB4C6;
    --terra:      #D9906A;
    --up:         #7BB374;
    --down:       #E07A6A;
    --shadow:     rgba(0,0,0,.45);
    --line:       rgba(240,227,210,.16);
    background:
      radial-gradient(1200px 600px at 15% -10%, #2E2320 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 120%, #1C1512 0%, transparent 55%),
      #221A18;
  }
  body.dark .speech{background:#332826; color:var(--ink);}
  body.dark .slot{background:linear-gradient(165deg,#332824,#2A211D);}
  body.dark .tb-search input{color:var(--ink);}
  body.dark .tb-select{color:var(--ink);}
  body.fs-large{font-size:117%;}
  body.fs-xlarge{font-size:132%;}

  #app{height:100vh; height:100dvh; width:100vw; display:flex; flex-direction:column; position:relative;
    padding-left:env(safe-area-inset-left, 0px); padding-right:env(safe-area-inset-right, 0px);
    box-sizing:border-box;}

  /* ============ TOP BAR ============ */
  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:11px 20px;
    background:linear-gradient(180deg, #FBF4E8 0%, #F1E4CC 100%);
    border-bottom:1px solid rgba(123,44,58,.16);
    box-shadow:0 4px 14px -6px rgba(62,44,38,.30);
    z-index:20;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto;}
  .brand .glass{font-size:26px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.08));}
  .brand h1{
    font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:600; font-size:22px;
    color:var(--wine); letter-spacing:.3px; white-space:nowrap;
  }
  .brand small{display:block; font-size:10.5px; color:var(--ink-soft); font-weight:600; letter-spacing:2px; text-transform:uppercase;}

.sec-h{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-size:17px; color:var(--wine); margin:18px 0 10px; font-weight:600;}
  .biz-card{padding:14px 16px; margin-bottom:11px;}
  .rare-card{padding:12px 14px; margin-bottom:9px;}
  .rare-card.locked{opacity:.82; background:rgba(62,44,38,.03);}
  .rare-card.unlocked{border-color:rgba(200,151,63,.5); background:rgba(200,151,63,.06);}
  .rare-badge{display:inline-block; padding:2px 8px; border-radius:999px; font-size:10.5px; font-weight:800;
    background:rgba(62,44,38,.1); color:var(--ink-soft);}
  .rare-badge.ok{background:rgba(200,151,63,.22); color:var(--gold-deep);}
  .rare-cond{margin-top:8px; font-size:12px; padding:6px 9px; border-radius:8px;
    background:rgba(62,44,38,.05); color:var(--ink-soft);}
  .rare-cond.met{background:rgba(78,124,74,.12); color:#3F6A3B; font-weight:600;}
  .party-card{padding:14px 16px; margin-bottom:10px; border-color:rgba(200,151,63,.5); background:linear-gradient(135deg,rgba(200,151,63,.08),rgba(123,44,58,.05));}
  .party-need{margin-top:9px; font-size:13px; padding:7px 10px; border-radius:9px; background:rgba(255,255,255,.4);}
  .party-bar{margin-top:9px; height:12px; border-radius:999px; background:rgba(62,44,38,.12); overflow:hidden;}
  .party-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--gold),var(--gold-deep)); transition:width .4s;}
  .party-item{padding:9px 12px; margin-bottom:7px;}
  .bottle-ph{width:40px; height:133px; border-radius:6px; background:linear-gradient(180deg,rgba(123,44,58,.08),rgba(62,44,38,.05)); margin:0 auto;}
  .btn.sm{padding:7px 12px; font-size:12.5px; min-height:38px;}
  .biz-card.risk{border-color:rgba(178,74,62,.55); background:rgba(178,74,62,.05);}
  .alloc-star{margin-top:10px; padding:8px 10px; border-radius:10px;
    background:rgba(200,151,63,.12); border:1.5px solid rgba(200,151,63,.4); font-size:13px;}
  .alloc-fill{margin-top:7px; padding:8px 10px; border-radius:10px;
    background:rgba(62,44,38,.05); border:1.5px dashed var(--line); font-size:12.5px; line-height:1.6;}
  .con-stock{margin-top:8px; padding:7px 10px; border-radius:9px; font-size:12.5px; font-weight:600;}
  .con-stock.ok{background:rgba(78,124,74,.12); color:#3F6A3B;}
  .con-stock.short{background:rgba(178,74,62,.12); color:var(--down);}
  .btn.off{opacity:.45; pointer-events:none;}

  .floatmoney{
    position:fixed; transform:translate(-50%,0); pointer-events:none; z-index:9999;
    font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:700; font-size:19px;
    text-shadow:0 2px 4px rgba(0,0,0,.28);
    animation:floatUp 1.1s cubic-bezier(.22,.9,.3,1) forwards;
  }
  .floatmoney.pos{color:#4E7C4A;}
  .floatmoney.neg{color:#B24A3E;}
  @keyframes floatUp{
    0%{opacity:0; transform:translate(-50%,4px) scale(.9);}
    18%{opacity:1; transform:translate(-50%,-6px) scale(1.06);}
    100%{opacity:0; transform:translate(-50%,-42px) scale(1);}
  }
  @keyframes ripen{
    0%{filter:none;}
    50%{filter:drop-shadow(0 0 7px var(--gold)) brightness(1.1);}
    100%{filter:none;}
  }
  .slot.ripening .slot-bottle{animation:ripen 1.9s ease-in-out 2;}
  .slot.ripening{border-color:var(--gold) !important;}

  .bank-sum{display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 6px;}
  .bank-sum>div{flex:1; min-width:110px; background:rgba(255,255,255,.5); border:1.5px solid var(--line); border-radius:12px; padding:8px 10px;}
  .bank-sum span{display:block; font-size:10.5px; color:var(--ink-soft); font-weight:700; letter-spacing:.4px;}
  .bank-sum b{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-size:16px;}
  .bank-list{display:flex; flex-direction:column; gap:9px; margin-top:8px;}
  .bank-opt{
    text-align:left; padding:11px 13px; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,.5); border:1.8px solid var(--line);
    min-height:44px; touch-action:manipulation;
  }
  .bank-opt.off{opacity:.45; pointer-events:none;}
  @media(hover:hover){ .bank-opt:hover{border-color:var(--gold-deep);} }
  .bank-opt:active{background:rgba(200,151,63,.12); transform:scale(.99);}

  .tb-actions{display:flex; gap:7px; align-items:center; margin-left:6px;}
  .tb-ic{display:inline-flex; align-items:center; justify-content:center;}
  .tb-ic svg{display:block;}
  .wk-ic{display:inline-flex; vertical-align:middle; margin-right:2px;}
  .wk-ic svg{display:block;}
  [data-ic] svg{display:block;}
  /* Dark mode: thin light strokes read as faint on a dark field, so thicken
     every line icon and lift its colour toward the brightest ink tone. */
  body.dark svg[stroke]{ stroke-width:2.1; }
  body.dark .tb-ic svg, body.dark .navbtn .ic svg, body.dark .wk-ic svg{ stroke-width:2.3; }
  body.dark .tb-ic svg{ color:#F6EADC; }
  body.dark .navbtn .ic svg{ color:#F0E3D2; }
  body.dark .rr-ic svg, body.dark .chip svg{ stroke-width:2.2; }
  /* ---- cinematic cutscene ---- */
  .cs-modal{ max-width:640px; padding:0; overflow:hidden; }
  .cs-stage{ position:relative; width:100%; aspect-ratio:600/340; background:#160E10; overflow:hidden; }
  .cs-art{ position:absolute; inset:-6%; transition:opacity 1.1s ease; transform-origin:center;
    animation:csKen 14s ease-in-out infinite alternate; }
  @keyframes csKen{ 0%{transform:scale(1.06) translate(1.5%,-1%);} 100%{transform:scale(1.12) translate(-1.5%,1.5%);} }
  .cs-vignette{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 42%, rgba(0,0,0,.58) 100%); }
  .cs-stage::after{ content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(120,70,30,0.06), rgba(20,10,8,0.14)); mix-blend-mode:multiply; }
  @media (prefers-reduced-motion:reduce){ .cs-art{ animation:none; } }
  .cs-narr{ position:absolute; left:0; right:0; bottom:0; padding:22px 26px 26px;
    font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-size:17px; line-height:1.75; color:#F4E8D6;
    text-align:center; text-shadow:0 2px 10px rgba(0,0,0,.85);
    background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.72));
    transition:opacity .9s ease; }
  .cs-titlecard{ position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; text-align:center; }
  .cs-title-main{ font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-size:40px; font-weight:600; color:#E8C07A;
    letter-spacing:1.5px; text-shadow:0 4px 22px rgba(0,0,0,.9); animation:csFade 1.4s ease; }
  .cs-title-sub{ font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Thonburi',system-ui,-apple-system,sans-serif; font-size:14px; font-weight:700; color:#D9C4A8;
    letter-spacing:.5px; text-shadow:0 2px 10px rgba(0,0,0,.9); animation:csFade 1.9s ease; }
  @keyframes csFade{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
  .cs-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 18px; background:var(--paper); }
  .cs-count{ font-size:12px; font-weight:800; color:var(--ink-soft); }
  @media(max-width:560px){ .cs-narr{font-size:15px; padding:16px 18px 20px;} .cs-title-main{font-size:30px;} }

  .rr-ic{display:inline-flex; align-items:center; gap:5px;}
  .rr-ic svg{display:inline-block; vertical-align:middle; flex-shrink:0;}
  .rep-star{display:inline-flex; align-items:center; gap:3px;}
  .rep-star svg{display:block;}
  .tb-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    min-width:52px; padding:5px 8px; border-radius:12px; cursor:pointer;
    background:rgba(255,255,255,.55); border:1.5px solid var(--line);
    box-shadow:0 2px 0 var(--shadow); font-size:16px; line-height:1;
    transition:transform .08s, background .15s;
  }
  .tb-btn span{font-size:9.5px; font-weight:800; color:var(--ink-soft); letter-spacing:.2px;}
  @media(hover:hover){ .tb-btn:hover{background:#fff; transform:translateY(-1px);} }
  .tb-btn:active{transform:translateY(1px); box-shadow:0 1px 0 var(--shadow);}
  .tb-btn.danger{border-color:rgba(178,74,62,.45);}
  .tb-btn.indebt{border-color:rgba(178,74,62,.55); background:rgba(178,74,62,.10);}
  .tb-btn.indebt span{color:var(--down);}
  .tb-btn.danger span{color:var(--down);}
  .tb-btn.focused{outline:3px solid var(--gold); outline-offset:2px;}
  @media(max-width:760px){ .tb-btn span:not(.tb-ic){display:none;} .tb-btn{min-width:44px;} }

  .stat{
    display:flex; flex-direction:column; align-items:flex-start;
    padding:5px 15px; border-radius:13px;
    background:linear-gradient(160deg, rgba(255,255,255,.72), rgba(255,250,240,.42));
    border:1px solid rgba(123,44,58,.14);
    box-shadow:0 2px 5px -2px rgba(62,44,38,.18), inset 0 1px 0 rgba(255,255,255,.55);
    min-width:96px;
  }
  .stat .lbl{font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft);}
  .stat .val{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:600; font-size:18px; color:var(--ink);}
  .stat .val.money{color:var(--sage-deep);}
  .stat .val.rep{color:var(--gold);}
  .stat .week{color:var(--wine);}

  /* ============ MAIN LAYOUT ============ */
  .main{flex:1; display:flex; min-height:0; position:relative;}

  /* Left nav */
  .nav{
    width:88px; flex-shrink:0;
    background:linear-gradient(175deg, #F0E2C9 0%, #EAD9BC 55%, #E4D0B0 100%);
    border-right:1px solid rgba(123,44,58,.18);
    box-shadow:inset -8px 0 16px -12px rgba(89,28,42,.35);
    display:flex; flex-direction:column; gap:6px; padding:12px 8px;
    z-index:10;
    /* On short screens (a car display, a laptop in landscape) the 12 nav items
       are taller than the viewport. Without this the bottom entries — settings
       among them — are simply unreachable. */
    overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    scrollbar-width:thin;
  }
  .nav::-webkit-scrollbar{width:6px;}
  .nav::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
  .nav::-webkit-scrollbar-track{background:transparent;}
  .navbtn{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 4px; border-radius:14px; cursor:pointer;
    border:2px solid transparent; background:transparent;
    transition:transform .12s, background .12s, border-color .12s;
    color:var(--ink-soft); position:relative;
  }
  .navbtn .ic{display:flex; align-items:center; justify-content:center; height:24px;}
  .nav-badge{
    position:absolute; top:4px; right:8px; min-width:18px; height:18px;
    background:var(--wine); color:#F8ECD8; border-radius:9px;
    font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center;
    padding:0 5px; border:1.5px solid var(--parchment);
  }
  .navbtn.active .nav-badge{background:var(--gold); color:#3E2C15;}
  .nav-badge.alert{background:#C0392B; color:#fff; animation:navPulse 1.8s ease-in-out infinite;}
  @keyframes navPulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .navbtn .tx{font-size:10.5px; font-weight:700; letter-spacing:.3px;}
  @media(hover:hover){ .navbtn:hover{background:rgba(255,255,255,.55);} }
  .navbtn:active{background:rgba(255,255,255,.75);}
  .navbtn.active{
    background:linear-gradient(160deg, var(--wine-bright), var(--wine) 60%, var(--wine-deep));
    color:#FBEFD8; border-color:var(--wine-deep);
    box-shadow:0 4px 12px -3px rgba(89,28,42,.55), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .navbtn.focus{border-color:var(--gold); transform:scale(1.04);}

  /* Content area */
  .content{flex:1; overflow-y:auto; padding:20px 26px; min-width:0;
    -webkit-overflow-scrolling:touch;   /* momentum scroll on iOS */
    overscroll-behavior:contain;        /* scrolling to the end doesn't bubble out */
    padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));}
  .content::-webkit-scrollbar{width:10px;}
  .content::-webkit-scrollbar-thumb{background:var(--gold-soft); border-radius:8px;}

  .page-head{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .page-head h2{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:600; font-size:26px; color:var(--wine);}
  .page-head p{color:var(--ink-soft); font-size:13.5px; font-weight:500;}

  /* ============ CARDS / GRID ============ */
  .grid{display:grid; gap:14px;}
  .card{
    background:linear-gradient(168deg, #FCF7EC 0%, var(--parchment) 45%, #F4EAD6 100%);
    border:1.5px solid rgba(123,44,58,.13);
    border-radius:18px;
    padding:16px;
    box-shadow:0 6px 18px -8px rgba(62,44,38,.28), 0 2px 0 rgba(62,44,38,.06), inset 0 1px 0 rgba(255,255,255,.6);
    position:relative;
  }
  .card.focus{border-color:var(--gold); box-shadow:0 4px 0 var(--shadow), 0 0 0 3px var(--gold-soft);}

  /* Wine bottle card */
  .wine-card{display:flex; gap:14px; align-items:center;}
  .bottle-wrap{
    flex-shrink:0; width:52px; display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 3px 5px rgba(62,44,38,.18));
    transition:transform .18s ease;
  }
  @media(hover:hover){ .card:hover .bottle-wrap{transform:translateY(-2px) rotate(-1.5deg);} }
  .card.focus .bottle-wrap{transform:translateY(-2px) rotate(-1.5deg);}
  .card:active{transform:scale(.985);}
  .slot-bottle{filter:drop-shadow(0 2px 4px rgba(62,44,38,.2)); transition:transform .18s;}
  @media(hover:hover){ .slot:hover .slot-bottle{transform:translateY(-3px);} }
  .slot.focus .slot-bottle{transform:translateY(-3px);}
  .pair-bottle{flex-shrink:0; display:flex; filter:drop-shadow(0 2px 3px rgba(62,44,38,.18));}
  .wine-info{flex:1; min-width:0;}
  .wine-name{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:600; font-size:16px; color:var(--ink); line-height:1.2;}
  .wine-sub{font-size:12px; color:var(--ink-soft); font-weight:600; margin-top:1px;}
  .wine-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px;}
  .tag{
    font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px;
    background:rgba(124,139,94,.16); color:var(--sage-deep); letter-spacing:.3px;
  }
  .tag.region{background:rgba(110,147,166,.18); color:var(--sky);}
  .tag.score{background:rgba(200,151,63,.2); color:var(--gold);}
  .tag.rare{background:rgba(123,44,58,.16); color:var(--wine);}

  .wine-price{text-align:right; flex-shrink:0;}
  .wine-price .now{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:600; font-size:17px;}
  .wine-price .chg{font-size:12px; font-weight:800;}
  .chg.up{color:var(--up);} .chg.down{color:var(--down);}

  /* ============ BUTTONS ============ */
  .btn{
    font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Thonburi',system-ui,-apple-system,sans-serif; font-weight:700; font-size:13.5px;
    padding:9px 16px; border-radius:12px; border:1.5px solid var(--wine-deep);
    background:linear-gradient(165deg, var(--wine-bright), var(--wine) 60%, var(--wine-deep));
    color:#FBEFD8; cursor:pointer;
    box-shadow:0 3px 0 var(--wine-deep), 0 5px 12px -5px rgba(89,28,42,.5); transition:transform .08s, box-shadow .08s, filter .1s;
    letter-spacing:.3px;
  }
  @media(hover:hover){ .btn:hover{ filter:brightness(1.06); } }
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--wine-deep);}
  .btn.ghost{background:transparent; color:var(--wine); box-shadow:0 2px 0 var(--line); border-color:rgba(123,44,58,.35);}
  .btn.gold{background:linear-gradient(165deg,#DBAB50,var(--gold) 58%,#A87B2C); border-color:#8A6420; box-shadow:0 3px 0 #8A6420, 0 5px 12px -5px rgba(160,120,40,.5); color:#38240A;}
  .btn.sage{background:linear-gradient(165deg,#93A46E,var(--sage) 58%,var(--sage-deep)); border-color:var(--sage-deep); box-shadow:0 3px 0 var(--sage-deep), 0 5px 12px -5px rgba(91,106,66,.5); color:#F4F0E4;}
  .btn.sm{padding:6px 12px; font-size:12px;}
  .btn.focus{outline:3px solid var(--gold-soft); outline-offset:2px;}
  .btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none; transform:none;}
  /* Big high-contrast action buttons for in-car touch (glare-resistant) */
  .btn.big{ font-size:16px; padding:15px 22px; min-height:56px; border-width:2.5px;
    box-shadow:0 4px 0 var(--wine-deep); letter-spacing:.4px; }
  .btn.big:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--wine-deep); }
  .btn.big .bic{display:inline-flex; vertical-align:middle; margin-right:5px;}
  .btn.big .bic svg{display:block;}
  /* stronger contrast variants: filled, saturated, dark border */
  .btn.buy{ background:#2E6B3E; border-color:#1C4A28; box-shadow:0 4px 0 #1C4A28; color:#FFFFFF; }
  .btn.sell{ background:#C8973F; border-color:#8A6320; box-shadow:0 4px 0 #8A6320; color:#2A1E08; }
  .btn.buy:active{ box-shadow:0 1px 0 #1C4A28; }
  .btn.sell:active{ box-shadow:0 1px 0 #8A6320; }

  /* quantity slider */
  .qty-slider{ display:flex; align-items:center; gap:12px; margin:6px 4px 12px; }
  .qty-slider input[type=range]{ flex:1; height:36px; -webkit-appearance:none; appearance:none;
    background:transparent; cursor:pointer; }
  .qty-slider input[type=range]::-webkit-slider-runnable-track{
    height:10px; border-radius:6px; background:linear-gradient(90deg,var(--wine),var(--gold)); }
  .qty-slider input[type=range]::-moz-range-track{
    height:10px; border-radius:6px; background:linear-gradient(90deg,var(--wine),var(--gold)); }
  .qty-slider input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none;
    width:32px; height:32px; margin-top:-11px; border-radius:50%; background:var(--parchment);
    border:3px solid var(--wine-deep); box-shadow:0 2px 5px rgba(0,0,0,.3); }
  .qty-slider input[type=range]::-moz-range-thumb{
    width:32px; height:32px; border-radius:50%; background:var(--parchment);
    border:3px solid var(--wine-deep); box-shadow:0 2px 5px rgba(0,0,0,.3); }

  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .spacer{flex:1;}

  /* ============ MARKET INDEX ============ */
  .index-strip{
    display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px;
  }
  .index-box{
    flex-shrink:0; min-width:150px; padding:12px 16px; border-radius:16px;
    background:linear-gradient(180deg,var(--parchment),var(--paper-2));
    border:2px solid var(--line); box-shadow:0 3px 0 var(--shadow);
  }
  .index-box .nm{font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft);}
  .index-box .vl{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:600; font-size:22px; margin-top:2px;}
  .index-box .dl{font-size:12.5px; font-weight:800; margin-top:1px;}

  /* Sparkline */
  .spark{width:100%; height:34px; margin-top:6px; display:block;}

  /* ============ SHOP / CUSTOMER ============ */
  .customer-stage{
    display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start;
  }
  .cust-card{text-align:center; padding:20px;}
  .cust-avatar{font-size:56px; margin-bottom:6px;}
  .cust-name{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:600; font-size:18px;}
  .cust-mood{font-size:13px; color:var(--ink-soft); font-weight:600; margin-top:2px;}
  .bud-reach{display:inline-block; margin-left:6px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:800; color:#fff; background:#8A7A5A; vertical-align:1px;}
  .bud-reach.t5{background:#6E2233;} .bud-reach.t4{background:#8A3B2E;} .bud-reach.t3{background:#7B5B2C;} .bud-reach.t2{background:#5E7A4A;} .bud-reach.t1{background:#6A7480;}
  .cust-request{
    margin-top:12px; padding:12px 14px; border-radius:14px;
    background:rgba(200,151,63,.12); border:1.5px dashed var(--gold);
    font-size:13.5px; text-align:left; font-weight:500;
  }
  .cust-request b{color:var(--wine);}
  .speech{
    margin-top:12px; padding:12px 15px; border-radius:14px 14px 14px 4px;
    background:#fff; border:1.5px solid var(--line);
    font-size:13.5px; text-align:left; font-weight:500; position:relative;
    box-shadow:0 2px 0 var(--shadow); color:var(--ink);
  }
  .food-badge{
    display:flex; align-items:center; gap:10px; justify-content:center;
    margin-top:12px; padding:10px 14px; border-radius:14px;
    background:rgba(200,151,63,.12); border:1.5px dashed var(--gold);
  }
  .food-badge span{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:600; font-size:15px; color:var(--wine);}
  .reg-badge{
    display:inline-block; font-size:10px; font-weight:800; padding:2px 8px; border-radius:12px;
    background:rgba(200,151,63,.22); color:var(--gold); vertical-align:middle; margin-left:4px;
    font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Thonburi',system-ui,-apple-system,sans-serif;
  }

  /* ===== Pairing hints ===== */
  .dish-want{
    background:linear-gradient(180deg,var(--paper-2),var(--parchment));
    border:2px solid var(--gold-soft); border-radius:16px; padding:12px 14px; margin-bottom:12px;
  }
  .dw-head{display:flex; align-items:center; gap:10px;}
  .dw-head b{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-size:15px; color:var(--wine); display:block;}
  .dw-head span{font-size:12px; color:var(--ink-soft); font-weight:600; display:block; line-height:1.4;}
  .dw-axes{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:6px 14px; margin-top:10px;}
  .dw-axes > div{display:flex; align-items:center; gap:7px;}
  .dw-axes label{font-size:11.5px; font-weight:800; color:var(--ink-soft); min-width:52px;}
  .sbar{display:inline-flex; gap:3px;}
  .sbar i{width:9px; height:9px; border-radius:3px; background:var(--line);}
  .sbar i.on{background:var(--wine);}
  .dw-regions{font-size:11.5px; color:var(--ink-soft); margin-top:9px; padding-top:8px; border-top:1.5px solid var(--line); font-weight:600;}
  .dw-regions b{color:var(--sage-deep);}
  .tnotes{display:flex; flex-wrap:wrap; gap:4px; margin-top:5px;}
  .nchip{
    font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:8px;
    background:rgba(123,44,58,.09); color:var(--wine); border:1px solid rgba(123,44,58,.16);
  }
  .rchips{display:flex; flex-wrap:wrap; gap:4px; margin-top:5px;}
  .rchip{font-size:10px; font-weight:800; padding:2px 7px; border-radius:8px;}
  .rchip.ok{background:rgba(124,139,94,.18); color:var(--sage-deep);}
  .rchip.warn{background:rgba(200,151,63,.18); color:#9A6B22;}
  body.dark .rchip.warn{color:var(--gold);}
  .pair-opt .tx{min-width:0; flex:1;}
  .pair-right{display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex-shrink:0;}
  .ask-price{text-align:right; line-height:1.15;}
  .ask-price .ap-val{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:700; font-size:16px; display:block;}
  .ask-price .ap-note{font-size:10px; font-weight:800; display:block;}
  .ask-price.fits .ap-val{color:var(--up);} .ask-price.fits .ap-note{color:var(--sage-deep);}
  .ask-price.near .ap-val{color:#9A6B22;} .ask-price.near .ap-note{color:#9A6B22;}
  .ask-price.over .ap-val{color:var(--down);} .ask-price.over .ap-note{color:var(--down);}
  body.dark .ask-price.near .ap-val, body.dark .ask-price.near .ap-note{color:var(--gold);}
  .pair-opt.is-over{opacity:.72;}
  .pair-opt.is-over .pair-bottle{filter:grayscale(.4);}
  .rchip.bad{background:rgba(178,74,62,.18); color:var(--down);}
  .cust-avatar{display:flex; justify-content:center;}
  .cal-chip{
    font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Thonburi',system-ui,-apple-system,sans-serif; font-size:11px; font-weight:800;
    background:rgba(200,151,63,.18); color:var(--gold);
    padding:2px 8px; border-radius:9px; vertical-align:middle; margin-left:4px;
    white-space:nowrap;
  }

  /* ===== Staff tiers ===== */
  .tier-dots{display:flex; gap:5px; margin:5px 0 6px;}
  .tier-dots i{width:22px; height:5px; border-radius:3px; background:var(--line);}
  .perk-now{font-size:11.5px; font-weight:700; color:var(--sage-deep); display:flex; align-items:center; gap:5px; line-height:1.4;}
  .perk-next{font-size:11px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:5px; margin-top:2px; line-height:1.4;}

  /* ===== Market trends ===== */
  .trend-row{display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; padding-top:9px; border-top:1.5px solid var(--line);}
  .trend{font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:10px;}
  .trend.up{background:rgba(124,139,94,.18); color:var(--sage-deep);}
  .trend.down{background:rgba(143,180,198,.18); color:var(--sky);}

  /* ===== Drinking window ===== */
  .dw-tag{font-size:10px; font-weight:800; margin-top:2px; display:block;}
  .dw-young{color:var(--sky);} .dw-peak{color:var(--up);} .dw-late{color:#9A6B22;} .dw-old{color:var(--down);}
  .dw-bar{height:4px; border-radius:3px; background:var(--line); overflow:hidden; margin:4px 0 3px; width:100%;}
  .dw-bar i{display:block; height:100%; border-radius:3px;}
  .dw-bar i.dw-young{background:var(--sky);} .dw-bar i.dw-peak{background:var(--up);}
  .dw-bar i.dw-late{background:var(--gold);} .dw-bar i.dw-old{background:var(--down);}
  .slot.has-fake{border-color:rgba(178,74,62,.5);}
  .slot .b-fake{cursor:pointer;}
  /* classification ribbon: instant read on rarity/value for collectors */
  .slot .b-tier{
    position:absolute; top:7px; right:8px; z-index:2;
    font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-size:9.5px; font-weight:700; letter-spacing:.3px;
    padding:2px 6px; border-radius:6px; border:1.5px solid rgba(0,0,0,.18);
    background:var(--paper-2); color:var(--ink);
  }
  .slot .b-tier.t5{ background:#6E2233; color:#F2D9A8; border-color:#4A0F1E; }
  .slot .b-tier.t4{ background:#8A3B2E; color:#F5E0D2; border-color:#5E2318; }
  .slot .b-tier.t3{ background:#7B5B2C; color:#F5E7C8; border-color:#54390F; }
  .slot .b-tier.t2{ background:#4A6244; color:#E6F0E2; border-color:#2E3E2C; }
  .slot .b-tier.t1{ background:var(--paper); color:var(--ink-soft); }
  .slot .b-region{
    font-size:9.5px; font-weight:700; color:var(--ink-soft);
    letter-spacing:.2px; margin-top:1px;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* ===== Counterfeit disposal ===== */
  .disp-opts{display:flex; flex-direction:column; gap:9px; margin:6px 0 12px;}
  .disp-group-label{ font-size:12px; font-weight:800; color:var(--sage-deep); margin:8px 0 2px;
    display:flex; align-items:center; gap:5px; }
  .disp-group-label.risky{ color:var(--down); }
  .do-head{ display:flex; align-items:center; gap:8px; }
  .do-tag{ font-size:10px; font-weight:800; padding:2px 8px; border-radius:999px; }
  .do-tag.rec{ background:var(--up); color:#fff; }
  .disp-opt.rec{ border-color:var(--up); box-shadow:0 0 0 1px var(--up); }
  .disp-opt.risky{ border-style:dashed; border-color:var(--down); }
  .disp-opt.risky:not(:hover){ opacity:.9; }
  .disp-opt.cant{ opacity:.55; border-style:dashed; }
  .disp-opt.cant b{ color:var(--ink-soft); }
  .disp-opt{
    border:2px solid var(--line); border-radius:14px; padding:11px 14px; cursor:pointer;
    background:var(--paper-2); transition:border-color .12s, transform .12s;
  }
  @media(hover:hover){ .disp-opt:hover{border-color:var(--wine); transform:translateY(-1px);} }
  .disp-opt:active{border-color:var(--wine); background:rgba(123,44,58,.06);}
  .disp-opt b{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-size:15px; color:var(--wine); display:block;}
  .disp-opt span{font-size:12px; color:var(--ink-soft); font-weight:600; display:block; margin-top:2px; line-height:1.45;}
  .disp-opt em{font-size:11px; font-weight:800; display:block; margin-top:3px; font-style:normal;}
  .taste-box{
    background:var(--paper-2); border:1.5px solid var(--line); border-radius:14px;
    padding:11px 13px; margin:8px 0;
  }
  .tb-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .tb-row b{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-size:14px; color:var(--wine);}
  .pairing-list{display:flex; flex-direction:column; gap:10px;}
  .pair-opt{
    display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer;
    border:2px solid var(--line); border-radius:14px; background:var(--parchment);
    transition:transform .1s, border-color .1s;
  }
  @media(hover:hover){ .pair-opt:hover{transform:translateX(3px);} }
  .pair-opt:active{background:rgba(123,44,58,.07);}
  .pair-opt.focus{border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft);}
  .pair-opt .em{font-size:26px;}
  .pair-opt .tx{flex:1; text-align:left;}
  .pair-opt .tx b{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-size:14.5px; display:block;}
  .pair-opt .tx span{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .pmatch{font-size:10px; font-weight:800; padding:2px 8px; border-radius:12px; white-space:nowrap;}
  .pmatch.great{background:rgba(200,151,63,.2); color:var(--gold);}
  .pmatch.good{background:rgba(124,139,94,.18); color:var(--sage-deep);}
  .pmatch.meh{background:rgba(122,99,85,.15); color:var(--ink-soft);}

  /* Weekly quests */
  .quest-strip{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  .quest-chip{
    flex:1; min-width:220px; padding:10px 14px; border-radius:14px;
    background:var(--parchment); border:1.5px solid var(--line); box-shadow:0 2px 0 var(--shadow);
  }
  .quest-chip.done{border-color:var(--sage); background:rgba(124,139,94,.1);}
  .qc-top{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:700; gap:8px;}
  .qc-top b{color:var(--gold);}
  .qc-bar{margin-top:7px; height:7px; background:var(--paper-2); border-radius:6px; overflow:hidden;}
  .qc-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--sage),var(--gold)); border-radius:6px; transition:width .3s;}

  /* Report rows */
  .rep-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:14px;}
  .rep-row span{color:var(--ink-soft); font-weight:600;}

  /* Tutorial dots */
  .tut-dots{display:flex; gap:6px; justify-content:center; margin:10px 0 4px;}
  .tut-dots i{width:8px; height:8px; border-radius:50%; background:var(--line); transition:background .2s;}
  .tut-dots i.on{background:var(--gold);}

  /* ============ TOOLBAR (search / filter / sort) ============ */
  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;
    position:sticky; top:0; z-index:50;
    padding:12px 26px; margin-left:-26px; margin-right:-26px; margin-top:-20px;
    background:var(--paper); border-bottom:1.5px solid var(--line);
    box-shadow:0 4px 10px -6px var(--shadow);
  }
  .tb-search{
    display:flex; align-items:center; gap:7px; flex:1; min-width:200px;
    background:var(--parchment); border:2px solid var(--line); border-radius:12px;
    padding:8px 12px; color:var(--ink-soft);
  }
  .tb-search input{
    border:none; background:transparent; outline:none; flex:1; min-width:0;
    font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Thonburi',system-ui,-apple-system,sans-serif; font-size:13.5px; font-weight:600; color:var(--ink);
  }
  .tb-search input::placeholder{color:var(--ink-soft); font-weight:500;}
  .tb-select{
    font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Thonburi',system-ui,-apple-system,sans-serif; font-size:13px; font-weight:700; color:var(--ink);
    background:var(--parchment); border:2px solid var(--line); border-radius:12px;
    padding:9px 12px; cursor:pointer; outline:none;
  }
  .tb-toggle{
    display:flex; align-items:center; gap:6px;
    font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Thonburi',system-ui,-apple-system,sans-serif; font-size:13px; font-weight:700;
    background:var(--parchment); color:var(--ink-soft);
    border:2px solid var(--line); border-radius:12px; padding:8px 14px; cursor:pointer;
  }
  .tb-toggle.on{background:var(--wine); color:#F8ECD8; border-color:var(--wine-deep);}
  .tb-count{font-size:12px; color:var(--ink-soft); font-weight:700;}
  /* smart filter chips — big, high-contrast, finger-sized */
  .filter-chips{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 10px; align-items:center;}
  .chip{ font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Thonburi',system-ui,-apple-system,sans-serif; font-weight:700; font-size:13px;
    padding:9px 15px; min-height:42px; border-radius:999px; cursor:pointer;
    border:2px solid var(--line); background:var(--paper); color:var(--ink-soft);
    touch-action:manipulation; transition:transform .08s; }
  .chip:active{transform:scale(.95);}
  .chip.on{ background:var(--wine); color:#F8ECD8; border-color:var(--wine-deep); }
  .chip.tier-chip.t5.on{ background:#6E2233; border-color:#4A0F1E; }
  .chip.tier-chip.t4.on{ background:#8A3B2E; border-color:#5E2318; }
  .chip.tier-chip.t3.on{ background:#7B5B2C; border-color:#54390F; }
  .region-sel{ min-height:42px; }
  /* ---- age gate ---- */
  .age-gate{
    position:fixed; inset:0; z-index:9999; display:none;
    align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(900px 500px at 20% 0%, rgba(155,45,60,.35) 0%, transparent 60%),
      linear-gradient(160deg, #2A1A1E 0%, #1A1012 100%);
    transition:opacity .28s ease;
    padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .ag-card{
    max-width:440px; width:100%; text-align:center;
    background:var(--parchment); border:2.5px solid var(--gold);
    border-radius:22px; padding:30px 26px 24px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    animation:agIn .45s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes agIn{ from{opacity:0; transform:translateY(16px) scale(.97);} to{opacity:1; transform:none;} }
  .ag-logo{ display:flex; justify-content:center; color:var(--wine); margin-bottom:6px; }
  .ag-title{ font-family:'Fraunces','Noto Serif Thai',Georgia,serif; font-size:27px; font-weight:600;
    color:var(--wine); margin:0; letter-spacing:.4px; }
  .ag-sub{ font-size:13px; color:var(--ink-soft); font-weight:700; margin:2px 0 16px; }
  .ag-body{ font-size:14.5px; line-height:1.75; color:var(--ink); margin-bottom:20px; }
  .ag-actions{ display:flex; flex-direction:column; gap:10px; }
  .ag-actions .btn{ width:100%; justify-content:center; }
  .ag-fine{ margin-top:16px; font-size:11px; line-height:1.6; color:var(--ink-soft); }

  /* ---- glossary term ---- */
  .gloss{ display:inline-flex; align-items:center; gap:2px; cursor:pointer;
    border-bottom:1.5px dotted var(--gold-soft); }
  .gloss-q{
    display:inline-flex; align-items:center; justify-content:center;
    width:14px; height:14px; border-radius:50%; flex-shrink:0;
    background:var(--gold-soft); color:var(--parchment);
    font-size:9.5px; font-weight:900; line-height:1;
  }
  .gloss:active{ opacity:.6; }
  .gloss-hint{ font-size:11.5px; color:var(--ink-soft); align-self:center; margin-left:2px; }
  .gloss:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:3px; }
  body.dark .gloss-q{ background:var(--gold); color:#241A18; }

  /* ---- insolvency rescue ---- */
  .rescue-facts{ background:var(--paper-2); border:1.5px solid var(--line); border-radius:12px;
    padding:10px 14px; margin-bottom:12px; }
  .rf-row{ display:flex; justify-content:space-between; gap:10px; padding:4px 0; font-size:13px; }
  .rescue-tips{ background:rgba(200,151,63,.10); border:1.5px solid var(--gold-soft);
    border-radius:12px; padding:12px 14px; }
  .rt-title{ font-size:12px; font-weight:800; color:var(--gold-deep); margin-bottom:7px; letter-spacing:.3px; }
  .rt-item{ display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.65;
    margin-bottom:7px; color:var(--ink); }
  .rt-item:last-child{ margin-bottom:0; }
  .rt-item svg{ flex-shrink:0; margin-top:2px; }

  .ap-pl{ display:block; font-size:10.5px; font-weight:800; margin-top:2px; letter-spacing:.1px; }
  .ap-pl.up{ color:var(--up); }
  .ap-pl.down{ color:var(--down); }
  .ap-pl.flat{ color:var(--ink-soft); }

  /* ---- festival banner ---- */
  .fest-banner{ display:flex; gap:13px; align-items:center; padding:13px 16px;
    border-radius:14px; margin-bottom:14px; }
  .fest-banner.active{ background:linear-gradient(135deg,rgba(200,151,63,.20),rgba(123,44,58,.12));
    border:2px solid var(--gold); }
  .fest-banner.soon{ background:var(--paper-2); border:1.5px dashed var(--gold-soft); }
  .fb-icon{ flex-shrink:0; color:var(--wine); display:flex; }
  .fb-title{ font-family:'Fraunces','Noto Serif Thai',serif; font-size:15.5px; font-weight:600; color:var(--wine); }
  .fb-note{ font-size:12px; color:var(--ink-soft); line-height:1.55; margin-top:2px; }
  .fb-tags{ font-size:11.5px; font-weight:700; color:var(--gold-deep); margin-top:5px;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .fb-tags svg{ vertical-align:middle; margin-right:1px; }

  /* ---- cellar hazard + protection ---- */
  .hz-risk{ background:rgba(178,74,62,.12); border:1.5px solid var(--down); border-radius:11px;
    padding:10px 13px; font-size:13px; font-weight:700; color:var(--ink);
    display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .hz-ins{ margin-left:auto; font-size:11.5px; color:var(--up); font-weight:800;
    display:inline-flex; align-items:center; gap:3px; }
  .prot-card{ padding:14px 16px; }
  .upkeep-bar{ height:9px; border-radius:999px; background:rgba(62,44,38,.14); overflow:hidden; margin-top:9px; }
  .upkeep-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg,var(--sage),var(--sage-deep)); transition:width .4s; }
  .ins-on{ font-size:12.5px; font-weight:700; color:var(--up); margin-top:8px;
    display:flex; align-items:center; gap:5px; }

  /* ---- rival strip ---- */
  .rival-strip{ display:flex; gap:12px; align-items:center; padding:12px 15px; margin-bottom:14px;
    border-radius:13px; background:linear-gradient(135deg,rgba(89,28,42,.14),rgba(62,44,38,.06));
    border:1.5px solid var(--wine-deep); }
  .rv-face{ flex-shrink:0; color:var(--wine-deep); display:flex; }
  .rv-title{ font-family:'Fraunces','Noto Serif Thai',serif; font-size:14.5px; font-weight:600; color:var(--wine-deep); }
  .rv-note{ font-size:12px; color:var(--ink-soft); margin-top:2px; line-height:1.5; }
  .rv-heat{ display:flex; gap:3px; margin-top:6px; }
  .rv-heat i{ width:14px; height:5px; border-radius:3px; background:rgba(89,28,42,.2); }
  .rv-heat i.on{ background:var(--wine-deep); }

  /* ---- counterfeit management panel ---- */
  .fake-panel{ border:2px solid #C0392B; border-radius:16px; margin-bottom:16px; overflow:hidden;
    background:linear-gradient(180deg, rgba(192,57,43,.10), rgba(192,57,43,.03)); }
  .fp-head{ display:flex; gap:12px; align-items:flex-start; padding:14px 16px 10px; }
  .fp-icon{ flex-shrink:0; color:#C0392B; display:flex; }
  .fp-title{ font-family:'Fraunces','Noto Serif Thai',serif; font-size:16px; font-weight:600; color:#C0392B; }
  .fp-sub{ font-size:12.5px; color:var(--ink-soft); line-height:1.55; margin-top:3px; }
  .fp-list{ padding:0 12px; display:flex; flex-direction:column; gap:8px; }
  .fp-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; }
  .fp-wine{ display:flex; align-items:center; gap:9px; min-width:0; }
  .fp-wine b{ font-size:13.5px; display:block; }
  .fp-wine span{ font-size:11.5px; color:var(--ink-soft); }
  .fp-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .fp-btn{ white-space:nowrap; }
  .btn.muted{ opacity:.5; }
  .fp-bulk{ width:calc(100% - 24px); margin:12px; justify-content:center; }
  .fp-hint{ font-size:11.5px; color:var(--ink-soft); text-align:center; padding:0 16px 14px; line-height:1.5; }
  @media(max-width:560px){ .fp-row{ flex-direction:column; align-items:stretch; } .fp-actions{ justify-content:stretch; } .fp-btn{ flex:1; } }

  .hold-box{ background:var(--paper-2); border:1.5px solid var(--line); border-radius:11px;
    padding:9px 12px; margin-top:8px; }
  .hb-row{ display:flex; justify-content:space-between; gap:10px; padding:2.5px 0; font-size:12.5px; }
  .hb-lbl{ color:var(--ink-soft); }

  /* Dark mode: the light wine token makes gradient buttons look pastel, so use
     a richer, self-contained gradient that keeps them looking premium. */
  body.dark .btn{ background:linear-gradient(165deg,#A84658,#8A3346 60%,#6E2436); color:#F6E6D6;
    border-color:#5A1E2C; box-shadow:0 3px 0 #5A1E2C, 0 5px 12px -5px rgba(0,0,0,.5); }
  body.dark .btn.gold{ background:linear-gradient(165deg,#C89A48,#A87C34 60%,#856224); color:#241708;
    border-color:#6E5220; box-shadow:0 3px 0 #6E5220, 0 5px 12px -5px rgba(0,0,0,.5); }
  body.dark .btn.sage{ background:linear-gradient(165deg,#7C8C58,#657446 60%,#4E5A36); color:#F0F0E0;
    border-color:#3E4A2C; box-shadow:0 3px 0 #3E4A2C, 0 5px 12px -5px rgba(0,0,0,.5); }
  body.dark .btn.ghost{ background:transparent; color:var(--wine-bright); border-color:rgba(216,134,152,.4); box-shadow:0 2px 0 rgba(255,255,255,.08); }
  body.dark .weekbtn{ background:linear-gradient(165deg,#C89A48,#A87C34 55%,#856224); color:#241708; border-color:#6E5220; }
  body.dark .card{ background:linear-gradient(168deg,#2E2420 0%,var(--parchment) 50%,#241B18 100%);
    border-color:rgba(216,134,152,.14); box-shadow:0 6px 18px -8px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05); }
  body.dark .slot{ background:linear-gradient(168deg,#332822 0%,#2A211C 50%,#231A16 100%);
    border-color:rgba(216,134,152,.14); box-shadow:0 6px 16px -8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); }
  body.dark .stat{ background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
    border-color:rgba(216,134,152,.16); box-shadow:0 2px 5px -2px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06); }
  body.dark .topbar{ background:linear-gradient(180deg,#2C221E,#241B17); border-bottom-color:rgba(216,134,152,.16); }
  body.dark .nav{ background:linear-gradient(175deg,#2A211C,#241B17); border-right-color:rgba(216,134,152,.14);
    box-shadow:inset -8px 0 16px -12px rgba(0,0,0,.5); }

  .save-warn{ display:flex; gap:9px; align-items:flex-start; margin-top:10px;
    padding:11px 14px; border-radius:12px; font-size:12.5px; line-height:1.65;
    background:rgba(200,151,63,.14); border:1.5px solid var(--gold-soft); color:var(--ink); }
  .save-warn svg{ flex-shrink:0; margin-top:2px; }
  /* labelled filter rows: a horizontal band of tap targets replaces the
     dropdowns, which are fiddly to open and scroll on a touch screen. */
  .filter-row{ display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .fr-label{ flex-shrink:0; width:62px; padding-top:11px;
    font-size:11.5px; font-weight:800; color:var(--ink-soft); letter-spacing:.3px; }
  .filter-row .filter-chips{ flex:1; margin-bottom:0; }
  .chip.col-red.on{ background:#7B2C3A; border-color:#5E1E28; }
  .chip.col-white.on{ background:#C8A24E; border-color:#8A6B34; color:#2A1E08; }
  .chip.col-rose.on{ background:#D97D8E; border-color:#A6485C; color:#2A1015; }
  .chip.col-sparkling.on{ background:#C9B26E; border-color:#8A7433; color:#2A2408; }
  .chip.col-sweet.on{ background:#C87A2E; border-color:#8A4E15; color:#2A1608; }
  .chip.col-fortified.on{ background:#7A4A2E; border-color:#4E2C16; color:#F2E2CE; }
  @media(max-width:560px){
    .filter-row{ flex-direction:column; gap:3px; }
    .fr-label{ width:auto; padding-top:0; }
  }
  /* cellar summary bar */
  .cellar-summary{ display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .cs-item{ flex:1; min-width:100px; background:var(--paper); border:1.5px solid var(--line);
    border-radius:12px; padding:10px 14px; display:flex; flex-direction:column; gap:2px; }
  .cs-lbl{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .cs-val{ font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-size:17px; font-weight:600; }

  /* Vintage weather */
  .wx-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;}
  .wx-item{padding:9px 12px; border-radius:12px; background:var(--paper-2); border:1.5px solid var(--line);}
  .wx-rg{font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-soft);}
  .wx-t{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:600; font-size:15px; margin:1px 0;}
  .wx-d{font-size:11px; color:var(--ink-soft); font-weight:600; line-height:1.3;}

  /* Auction */
  .auc-price{
    text-align:center; margin:14px auto; padding:14px 20px; max-width:300px;
    background:linear-gradient(180deg,var(--paper-2),var(--parchment));
    border:2px solid var(--gold); border-radius:16px; box-shadow:0 3px 0 var(--shadow);
  }
  .auc-now{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:700; font-size:30px; color:var(--wine); line-height:1.1;}

  /* Quick quantity buttons */
  .qty-limit{font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-top:4px;}
  .qty-limit b{color:var(--wine);}
  /* market stock depth */
  .stock-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px;
    padding:7px 10px; background:var(--paper-2); border-radius:10px; border:1px solid var(--line);}
  .stock-bar .sl{font-weight:800; font-size:12.5px; white-space:nowrap;}
  .tag.stock{background:transparent; border:1px solid var(--line); font-weight:800;}
  .qty-ctrl button:disabled{opacity:.35; cursor:not-allowed;}
  .qty-quick .qq:disabled{opacity:.4; cursor:not-allowed;}
  .qty-quick{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:-4px 0 10px;}
  .qty-quick{gap:10px !important;}
  .qty-quick .qq{
    font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Thonburi',system-ui,-apple-system,sans-serif; font-size:14px; font-weight:700;
    background:transparent; color:var(--wine); border:1.5px solid var(--line);
    border-radius:12px; padding:0 16px; cursor:pointer;
    min-height:44px; min-width:52px;   /* finger-sized target for in-car use */
    touch-action:manipulation;
  }
  @media(hover:hover){ .qty-quick .qq:hover{background:rgba(123,44,58,.08); border-color:var(--wine);} }
  .qty-quick .qq:active{background:rgba(123,44,58,.16); border-color:var(--wine); transform:scale(.96);}

  /* ============ CELLAR RACK ============ */
  .rack{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:14px;
  }
  .slot{
    border-radius:16px; border:1px solid rgba(123,44,58,.14);
    background:linear-gradient(168deg,#FAF1DF 0%,#F1E4CD 45%,#E6D4B4 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    gap:3px; padding:14px 10px 12px; text-align:center; position:relative; overflow:hidden;
    box-shadow:0 6px 16px -8px rgba(62,44,38,.30), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .14s ease, box-shadow .14s ease;
  }
  @media(hover:hover){ .slot:hover{ transform:translateY(-2px);
    box-shadow:0 12px 24px -10px rgba(62,44,38,.40), inset 0 1px 0 rgba(255,255,255,.6); } }
  .slot::before{ /* wood shelf line */
    content:''; position:absolute; left:0; right:0; bottom:0; height:8px;
    background:linear-gradient(180deg, rgba(123,90,60,.18), rgba(123,90,60,.32));
  }
  .slot.empty{opacity:.5; border-style:dashed;}
  .slot-bottle{margin-bottom:2px;}
  .slot .b-name{font-size:11px; font-weight:800; line-height:1.15; color:var(--ink);}
  .slot .b-age{font-size:9.5px; color:var(--ink-soft); font-weight:700;}
  .slot .b-qty{
    position:absolute; top:7px; right:8px; font-size:10px; font-weight:800;
    background:var(--wine); color:#F8ECD8; padding:1px 7px; border-radius:10px; z-index:2;
    box-shadow:0 1px 2px rgba(0,0,0,.2);
  }
  .slot.aging{box-shadow:0 3px 0 var(--shadow), inset 0 0 0 2px var(--gold-soft);}
  .slot .b-fake{
    position:absolute; top:7px; left:8px; width:22px; height:22px; z-index:3;
    background:#C0392B; color:#fff; border-radius:50%;
    font-size:14px; font-weight:900; display:flex; align-items:center; justify-content:center;
    border:2px solid #FFF0EC;
    box-shadow:0 0 0 0 rgba(192,57,43,.65);
    animation:fakePulse 1.9s ease-out infinite;
  }
  @keyframes fakePulse{
    0%   { box-shadow:0 0 0 0 rgba(192,57,43,.65); }
    70%  { box-shadow:0 0 0 9px rgba(192,57,43,0); }
    100% { box-shadow:0 0 0 0 rgba(192,57,43,0); }
  }
  /* the whole card glows so a suspect bottle can't be sold by accident */
  .slot.has-fake{
    border-color:#C0392B !important;
    animation:fakeCardGlow 1.9s ease-in-out infinite;
  }
  @keyframes fakeCardGlow{
    0%,100% { box-shadow:0 0 0 1px rgba(192,57,43,.35); }
    50%     { box-shadow:0 0 12px 2px rgba(192,57,43,.45); }
  }
  /* dark mode: a deep red disappears into the background, so brighten it */
  body.dark .slot .b-fake{
    background:#FF5A47; color:#2A0E0A; border-color:#3A1512;
    box-shadow:0 0 0 0 rgba(255,90,71,.75);
    animation:fakePulseDark 1.9s ease-out infinite;
  }
  @keyframes fakePulseDark{
    0%   { box-shadow:0 0 0 0 rgba(255,90,71,.75); }
    70%  { box-shadow:0 0 0 9px rgba(255,90,71,0); }
    100% { box-shadow:0 0 0 0 rgba(255,90,71,0); }
  }
  body.dark .slot.has-fake{
    border-color:#FF5A47 !important;
    animation:fakeCardGlowDark 1.9s ease-in-out infinite;
  }
  @keyframes fakeCardGlowDark{
    0%,100% { box-shadow:0 0 0 1px rgba(255,90,71,.45); }
    50%     { box-shadow:0 0 14px 3px rgba(255,90,71,.55); }
  }
  /* respect users who ask for less motion */
  @media (prefers-reduced-motion:reduce){
    .slot .b-fake, .slot.has-fake,
    body.dark .slot .b-fake, body.dark .slot.has-fake{ animation:none; }
    .slot.has-fake{ box-shadow:0 0 0 2px rgba(192,57,43,.55); }
    body.dark .slot.has-fake{ box-shadow:0 0 0 2px rgba(255,90,71,.65); }
  }

  /* ============ MODAL ============ */
  .modal-bg{
    position:fixed; inset:0; background:rgba(62,44,38,.5); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:var(--parchment); border:2.5px solid var(--gold); border-radius:22px;
    max-width:560px; width:100%; padding:24px; box-shadow:0 12px 0 var(--shadow);
    max-height:88vh; overflow-y:auto;
  }
  .modal h3{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:600; font-size:22px; color:var(--wine); margin-bottom:6px;}
  .modal .body{font-size:14px; color:var(--ink); margin:12px 0; line-height:1.6;}
  .modal .body p{margin-bottom:8px;}
  .modal .knowledge{
    background:rgba(110,147,166,.1); border-left:4px solid var(--sky);
    padding:12px 14px; border-radius:10px; font-size:13px; margin:10px 0;
  }
  .modal .knowledge b{color:var(--sky);}

  /* ============ VISUAL NOVEL CUTSCENE ============ */
  .vn-modal{padding:0; overflow:hidden; max-width:640px; border-color:var(--gold);}
  .vn-stage{position:relative; width:100%; height:300px; overflow:hidden; background:#241816;}
  .vn-vignette{position:absolute; inset:0; box-shadow:inset 0 0 90px 30px rgba(20,12,10,.55); pointer-events:none;}
  .vn-title{
    position:absolute; top:14px; left:18px; z-index:3;
    font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:600; font-size:16px; color:#F8ECD8;
    background:rgba(62,44,38,.55); padding:4px 14px; border-radius:20px; backdrop-filter:blur(4px);
    border:1px solid rgba(228,199,126,.35);
  }
  .vn-portrait{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:300px; height:290px; z-index:2;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));
    animation:vnPop .4s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes vnPop{from{transform:translateX(-50%) translateY(20px) scale(.96); opacity:0;} to{transform:translateX(-50%) translateY(0) scale(1); opacity:1;}}
  .vn-dialogue{
    background:linear-gradient(180deg, var(--parchment), var(--paper-2));
    padding:16px 22px 18px; border-top:2px solid var(--gold);
  }
  .vn-namebar{display:flex; align-items:baseline; gap:10px; margin-bottom:8px;}
  .vn-name{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:700; font-size:19px; color:var(--wine);}
  .vn-role{font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--gold);}
  .vn-text{font-size:15.5px; line-height:1.6; color:var(--ink); min-height:70px; font-weight:500;}
  .vn-foot{display:flex; align-items:center; justify-content:space-between; margin-top:12px;}
  .vn-count{font-size:12px; color:var(--ink-soft); font-weight:700;}

  .qty-ctrl{display:flex; align-items:center; gap:12px; justify-content:center; margin:14px 0;}
  .qty-ctrl button{
    width:54px; height:54px; border-radius:14px; border:2.5px solid var(--wine-deep);
    background:var(--wine); color:#F8ECD8; font-size:26px; font-weight:800; cursor:pointer;
    box-shadow:0 3px 0 var(--wine-deep); touch-action:manipulation;
  }
  .qty-ctrl button:active{transform:translateY(2px); box-shadow:0 1px 0 var(--wine-deep);}
  .qty-ctrl .qnum{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-size:28px; font-weight:600; min-width:60px; text-align:center;}
  .qty-cost{text-align:center; font-size:14px; color:var(--ink-soft); font-weight:700; margin-bottom:8px;}

  /* ============ TOAST ============ */
  #toasts{position:fixed; bottom:calc(22px + env(safe-area-inset-bottom, 0px)); left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{
    background:var(--ink); color:var(--parchment); padding:11px 20px; border-radius:14px;
    font-size:14px; font-weight:700; box-shadow:0 5px 16px rgba(0,0,0,.3);
    animation:toastIn .3s ease, toastOut .3s ease 2.4s forwards;
    max-width:80vw; text-align:center;
  }
  .toast.good{background:var(--sage-deep);}
  .toast.bad{background:var(--wine);}
  .toast.gold{background:var(--gold); color:#3E2C15;}
  @keyframes toastIn{from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  @keyframes toastOut{to{transform:translateY(-10px); opacity:0;}}

  /* ============ NEXT WEEK BUTTON ============ */
  .weekbtn{
    /* Sit above the iPhone home indicator and inside rounded-corner cutouts;
       env() falls back to 0 on hardware without insets. */
    position:fixed;
    bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    right:calc(24px + env(safe-area-inset-right, 0px));
    z-index:30;
    font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-weight:600; font-size:15px;
    padding:14px 28px; border-radius:18px; border:2px solid #7A5A24;
    background:linear-gradient(165deg, #D9A94E, var(--gold) 55%, #B0812E);
    color:#38240A; cursor:pointer;
    box-shadow:0 6px 18px -5px rgba(123,44,58,.45), 0 4px 0 #7A5A24, inset 0 1px 0 rgba(255,255,255,.4);
    display:flex; align-items:center; gap:8px; letter-spacing:.3px;
  }
  .weekbtn:active{transform:translateY(3px); box-shadow:0 3px 10px -4px rgba(123,44,58,.4), 0 1px 0 #7A5A24;}
  @media(hover:hover){ .weekbtn:hover{ filter:brightness(1.05); } }
  .weekbtn.focus{outline:3px solid var(--gold-soft); outline-offset:3px;}

  /* Portfolio table */
  .ptable{width:100%; border-collapse:collapse; font-size:13px;}
  .ptable th{text-align:left; font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-soft); padding:8px 10px; border-bottom:2px solid var(--line);}
  .ptable td{padding:10px; border-bottom:1px solid var(--line); font-weight:600;}
  .ptable tr.focus td{background:rgba(200,151,63,.12);}
  .pill{font-size:11px; font-weight:800; padding:2px 9px; border-radius:20px;}
  .pill.up{background:rgba(79,125,74,.18); color:var(--up);}
  .pill.down{background:rgba(178,74,62,.18); color:var(--down);}

  /* Controller hint bar */
  .hintbar{
    display:flex; gap:16px; align-items:center; justify-content:center;
    padding:6px; font-size:11.5px; color:var(--ink-soft); font-weight:700;
    background:var(--paper-2); border-top:1.5px solid var(--line);
  }
  .hintbar .k{display:inline-flex; align-items:center; gap:4px;}
  .hintbar .btn-ic{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; font-size:10px; font-weight:800;
    background:var(--ink); color:var(--parchment);
  }
  .btn-ic.a{background:var(--sage-deep);} .btn-ic.b{background:var(--wine);}
  .btn-ic.x{background:var(--sky);} .btn-ic.y{background:var(--gold); color:#3E2C15;}

  .empty-note{text-align:center; color:var(--ink-soft); font-weight:600; padding:40px; font-size:14px;}

  /* Shop upgrades */
  .upg-card{display:flex; gap:14px; align-items:center;}
  .upg-icon{font-size:40px; flex-shrink:0;}
  .upg-info{flex:1;}
  .upg-info h4{font-family:'Fraunces','Noto Serif Thai','Georgia',serif; font-size:16px; color:var(--ink);}
  .upg-info p{font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-top:2px;}
  .lvl-dots{display:flex; gap:4px; margin-top:6px;}
  .lvl-dots i{width:10px; height:10px; border-radius:50%; background:var(--line);}
  .lvl-dots i.on{background:var(--gold);}

  @media (max-width:820px){
    .customer-stage{grid-template-columns:1fr;}
    .nav{width:70px;}
    .brand h1{font-size:18px;}
  }
  /* Short viewports (car screens, laptops in landscape): tighten the nav so
     every destination fits without hunting for the scroll. */
  @media (max-height:820px){
    .nav{gap:3px; padding:8px 6px;}
    .navbtn{padding:7px 3px; gap:2px;}
    .navbtn .ic{height:20px;}
    .navbtn .tx{font-size:10.5px;}
  }
  @media (max-height:680px){
    .nav{gap:2px;}
    .navbtn{padding:5px 3px;}
    .navbtn .ic{height:18px;}
    .navbtn .tx{font-size:10px;}
  }

  /* ============ TESLA / IN-CAR TOUCH EDITION (v4.7) ============ */
  /* The controller hint bar is noise on a touch screen; it appears only once a
     keyboard or gamepad is actually being used to drive the focus ring. */
  .hintbar{display:none;}
  body.kbd .hintbar, body.pad .hintbar{display:flex;}

  /* Language button: the icon slot shows the target language code */
  .tb-lang{font-family:'Nunito Sans','Sarabun',system-ui,sans-serif; font-size:13px; font-weight:800; letter-spacing:.3px;
    min-width:24px; height:20px; padding:0 4px; border-radius:6px; background:var(--wine); color:#FBEFD8;}
  .ag-lang{display:flex; gap:8px; justify-content:center; margin-top:14px;}
  .ag-lang .tb-toggle{min-height:44px;}

  /* Collapsible filter panel (market + cellar): the chips used to fill a whole
     car screen before the first wine appeared. */
  .filter-panel{display:none; margin-bottom:6px;}
  .filter-panel.open{display:block;}

  /* filter sets: tabs inside the panel, origin drill-down rows, active summary */
  .fp-tabs{display:flex; gap:6px; margin:2px 0 10px; padding:4px; border-radius:14px; background:var(--paper-2,rgba(0,0,0,.04)); border:1.5px solid var(--line); overflow-x:auto;}
  .fp-tab{flex:1; min-width:max-content; padding:9px 14px; border:0; border-radius:10px; background:transparent; font:inherit; font-size:13px; font-weight:800; color:var(--ink-soft); cursor:pointer; white-space:nowrap;}
  .fp-tab.on{background:var(--wine); color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.18);}
  .fp-tab .f-count{display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; border-radius:9px; font-size:11px; background:var(--gold); color:#3E2C15;}
  .filter-row.sub{padding-left:12px; border-left:3px solid var(--gold-soft);}
  .filter-row.sub2{padding-left:24px; border-left:3px solid var(--line);}
  .chip .cnt{font-size:10.5px; font-weight:800; opacity:.6; margin-left:2px;}
  .chip .flag{vertical-align:-1px; margin-right:5px; border-radius:2px;}
  .active-filters{display:flex; flex-wrap:wrap; gap:6px; margin:-2px 0 10px;}
  .active-filters.hide{display:none;}
  .af-chip{display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; border:1.5px solid var(--gold-soft); background:rgba(200,151,63,.12); font:inherit; font-size:12px; font-weight:700; color:var(--ink); cursor:pointer;}
  .af-chip b{color:var(--down); font-size:11px;}
  .af-chip .flag{border-radius:2px;}
  body.car .fp-tab{font-size:15px; padding:13px 18px; min-height:52px;}
  body.car .af-chip{font-size:14px; padding:9px 14px; min-height:44px;}
  .tb-toggle .f-count{display:inline-flex; align-items:center; justify-content:center;
    min-width:20px; height:20px; padding:0 6px; border-radius:10px; font-size:11.5px; font-weight:800;
    background:var(--gold); color:#3E2C15;}

  /* Car mode: auto-on in the Tesla browser (or forced from Settings). Arm's-
     length viewing on a glossy screen with a bumpy fingertip — so every tap
     target grows to ≥52px and the small print gets a size up. */
  body.car .topbar{padding:10px 18px; gap:12px;}
  body.car .tb-btn{min-width:64px; min-height:56px; padding:7px 10px; border-radius:14px;}
  body.car .tb-btn span{font-size:11px;}
  body.car .stat .lbl{font-size:11px;}
  body.car .stat .val{font-size:20px;}
  body.car .nav{width:100px; gap:6px; padding:10px 8px;}
  body.car .navbtn{padding:11px 4px; min-height:62px; justify-content:center;}
  body.car .navbtn .tx{font-size:12.5px;}
  body.car .btn{font-size:15px; padding:11px 18px; min-height:50px;}
  body.car .btn.sm{font-size:14px; padding:9px 14px; min-height:48px;}
  body.car .btn.big{font-size:17px; min-height:60px;}
  body.car .tb-toggle{font-size:14.5px; padding:11px 16px; min-height:50px;}
  body.car .chip{font-size:14.5px; padding:11px 18px; min-height:52px;}
  body.car .tb-search{padding:11px 14px;}
  body.car .tb-search input{font-size:16px;}
  body.car .fr-label{font-size:13px; width:72px; padding-top:15px;}
  body.car .wine-name{font-size:17px;}
  body.car .wine-sub{font-size:13.5px;}
  body.car .tag{font-size:12px;}
  body.car .modal{max-width:680px; padding:28px;}
  body.car .modal .body{font-size:16px;}
  body.car .qty-ctrl button{width:64px; height:64px; font-size:30px;}
  body.car .qty-quick .qq{min-height:52px; font-size:15px; padding:10px 18px;}
  body.car .weekbtn{font-size:18px; padding:18px 32px; border-radius:20px;}
  body.car .page-head h2{font-size:28px;}
  body.car .page-head p{font-size:14.5px;}
  body.car .content{padding-bottom:110px;}   /* clear the floating week button */
  body.car .toast{font-size:16px; padding:13px 24px;}
  /* Phones (portrait): the top bar used to wrap into three tall rows and eat a
     third of the screen. Two compact rows: brand + stats, then the buttons. */
  @media (max-width:600px){
    .topbar{padding:8px 10px; gap:6px 8px;}
    .brand{margin-right:0; flex:1 1 100%;}
    .brand small{display:none;}
    .brand h1{font-size:18px;}
    .stat{min-width:0; flex:1 1 0; padding:4px 8px; border-radius:10px;}
    .stat .lbl{font-size:8.5px; letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
    .stat .val{font-size:14.5px; white-space:nowrap;}
    .stat .cal-chip{display:none;}
    .tb-actions{flex:1 1 100%; margin-left:0; gap:5px;}
    .tb-btn{flex:1 1 0; min-width:0; padding:5px 2px;}
    .content{padding:14px 12px;}
    .toolbar{padding:10px 12px; margin-left:-12px; margin-right:-12px; margin-top:-14px;}
    .weekbtn{padding:11px 18px; font-size:14px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom, 0px));}
    #toasts{bottom:calc(76px + env(safe-area-inset-bottom, 0px)); width:calc(100vw - 24px); gap:6px;}
    .toast{font-size:13px; padding:8px 14px; border-radius:12px; max-width:100%; text-align:center;}
  }

  /* Wide landscape screens (car displays, laptops): two wine cards per row so
     a glance shows twice the market instead of three tall rows. */
  @media (min-width:1180px){
    #marketGrid{grid-template-columns:repeat(auto-fill,minmax(500px,1fr));}
  }
  @media (max-height:820px){
    body.car .navbtn{min-height:54px; padding:7px 3px;}
    body.car .navbtn .tx{font-size:11.5px;}
  }

  /* ============ LUXE GRAPHICS (v4.9) ============ */
  #app{z-index:1;}                       /* above the ambient canvas */
  /* candlelight: two warm pools of light that breathe slowly (dark mode) */
  body.dark::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(700px 480px at 12% 8%, rgba(232,170,80,.16), transparent 70%),
      radial-gradient(620px 520px at 92% 96%, rgba(162,58,76,.18), transparent 70%);
    animation:candle 5.5s ease-in-out infinite alternate;
  }
  @keyframes candle{ 0%{opacity:.75;} 40%{opacity:1;} 55%{opacity:.86;} 100%{opacity:.97;} }

  /* gold hairline under the top bar, glow on the active nav item */
  .topbar{position:relative;}
  .topbar::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(200,151,63,.85) 30%, #F1D58F 50%, rgba(200,151,63,.85) 70%, transparent);}
  .navbtn.active{box-shadow:0 4px 12px -3px rgba(89,28,42,.55), inset 0 1px 0 rgba(255,255,255,.18), 0 0 0 2px rgba(200,151,63,.35), 0 0 22px -4px rgba(232,182,76,.65);}

  /* money counters flash when they change */
  .stat .val.stat-up{animation:statUp .9s ease;}
  .stat .val.stat-down{animation:statDown .9s ease;}
  @keyframes statUp{ 0%{text-shadow:0 0 0 rgba(232,182,76,0);} 25%{text-shadow:0 0 14px rgba(232,182,76,.95); transform:scale(1.06);} 100%{text-shadow:none; transform:none;} }
  @keyframes statDown{ 25%{text-shadow:0 0 12px rgba(178,74,62,.8);} 100%{text-shadow:none;} }

  /* rare wines: gold foil frame + a light sweep; Unicorns also glow */
  .wine-card.rare-4, .slot.rare-4{box-shadow:0 0 0 1.5px rgba(200,151,63,.55), 0 6px 18px -8px rgba(200,151,63,.45);}
  .wine-card.rare-5, .slot.rare-5{box-shadow:0 0 0 2px rgba(214,165,70,.9), 0 0 26px -6px rgba(232,182,76,.75), 0 8px 22px -10px rgba(62,44,38,.4);
    background:linear-gradient(160deg, #FFF8E6 0%, var(--parchment) 40%, #F6E7C4 100%);}
  body.dark .wine-card.rare-5, body.dark .slot.rare-5{background:linear-gradient(160deg,#3A2C1E,#2A211F 45%,#352819);}
  body.dark .slot.rare-5{box-shadow:0 0 0 2px rgba(214,165,70,.85), 0 0 24px -6px rgba(232,182,76,.6), 0 8px 18px -8px rgba(0,0,0,.6); border-color:transparent;}
  body.dark .slot.rare-4{box-shadow:0 0 0 1.5px rgba(200,151,63,.5), 0 6px 16px -8px rgba(0,0,0,.5);}
  .wine-card.rare-4, .wine-card.rare-5, .slot.rare-4, .slot.rare-5{overflow:hidden;}
  .wine-card.rare-4::after, .wine-card.rare-5::after, .slot.rare-4::after, .slot.rare-5::after{
    content:''; position:absolute; top:0; bottom:0; left:-60%; width:22%; pointer-events:none;
    background:linear-gradient(105deg, transparent, rgba(255,243,210,.38), transparent);
    transform:skewX(-18deg); animation:foil 7s ease-in-out infinite;}
  .wine-card.rare-5::after, .slot.rare-5::after{animation-duration:4.2s; background:linear-gradient(105deg, transparent, rgba(255,236,180,.5), rgba(255,255,255,.22), transparent);}
  body.dark .wine-card.rare-4::after, body.dark .wine-card.rare-5::after, body.dark .slot.rare-4::after, body.dark .slot.rare-5::after{opacity:.45;}
  /* dark mode top-bar buttons were pale boxes with faint labels */
  body.dark .tb-btn{background:rgba(255,255,255,.06); border-color:rgba(240,227,210,.18); box-shadow:0 2px 0 rgba(0,0,0,.35);}
  body.dark .tb-btn span{color:#D9C6B2;}
  body.dark .tb-btn.danger span{color:#F09080;}
  @media(hover:hover){ body.dark .tb-btn:hover{background:rgba(255,255,255,.12);} }
  @keyframes foil{ 0%,62%{left:-60%;} 100%{left:130%;} }
  /* the next-week button catches the light now and then */
  .weekbtn{overflow:hidden;}
  .weekbtn::after{content:''; position:absolute; top:0; bottom:0; left:-60%; width:40%; pointer-events:none;
    background:linear-gradient(105deg, transparent, rgba(255,250,230,.6), transparent); transform:skewX(-18deg); animation:foil 6s ease-in-out infinite;}

  /* page and dialog entrances */
