    if(t==='smug') return `<path d="M${x1-6} ${y} L${x1+6} ${y-3}" stroke="#3E2C26" stroke-width="2.4" stroke-linecap="round"/><path d="M${x2-6} ${y-3} L${x2+6} ${y}" stroke="#3E2C26" stroke-width="2.4" stroke-linecap="round"/>`;
    if(t==='sad') return `<path d="M${x1-6} ${y-2} L${x1+6} ${y+2}" stroke="#3E2C26" stroke-width="2.4" stroke-linecap="round"/><path d="M${x2-6} ${y+2} L${x2+6} ${y-2}" stroke="#3E2C26" stroke-width="2.4" stroke-linecap="round"/>`;
    return `<path d="M${x1-6} ${y} q6 -3 12 0" stroke="#3E2C26" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M${x2-6} ${y} q6 -3 12 0" stroke="#3E2C26" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  }
  function mouth(cx,cy){
    if(emotion==='happy') return `<path d="M${cx-10} ${cy} q10 12 20 0" stroke="${mouthC}" stroke-width="2.4" fill="#B5675F" stroke-linecap="round"/>`;
    if(emotion==='smug') return `<path d="M${cx-9} ${cy} q9 6 18 -2" stroke="${mouthC}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    if(emotion==='sad') return `<path d="M${cx-9} ${cy+2} q9 -6 18 0" stroke="${mouthC}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    if(emotion==='serious') return `<line x1="${cx-8}" y1="${cy}" x2="${cx+8}" y2="${cy}" stroke="${mouthC}" stroke-width="2.4" stroke-linecap="round"/>`;
    return `<path d="M${cx-8} ${cy} q8 4 16 0" stroke="${mouthC}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  }

  // Character-specific hair/clothing/features. Face center ~ (150,150)
  let hair='', extra='', cloth='', clothC, hairC;
  switch(who){
    case 'mentor': // elderly, white hair + beard, warm cardigan
      hairC='#EDEAE4'; clothC='#7C6A54';
      cloth=`<path d="M70 340 L70 300 Q70 250 150 250 Q230 250 230 300 L230 340 Z" fill="${clothC}"/>
             <path d="M150 250 L135 300 L150 320 L165 300 Z" fill="#F3EBDD"/>
             <circle cx="150" cy="285" r="4" fill="#5A4C3A"/><circle cx="150" cy="305" r="4" fill="#5A4C3A"/>`;
      hair=`<path d="M96 140 Q90 78 150 74 Q210 78 204 140 Q210 120 206 100 Q196 60 150 60 Q104 60 94 100 Q90 120 96 140Z" fill="${hairC}"/>`;
      extra=`<path d="M112 190 Q150 240 188 190 Q186 210 150 224 Q114 210 112 190Z" fill="${hairC}"/>
             <ellipse cx="127" cy="150" rx="10" ry="9" fill="none" stroke="#8A7B68" stroke-width="1.6"/><ellipse cx="173" cy="150" rx="10" ry="9" fill="none" stroke="#8A7B68" stroke-width="1.6"/><line x1="137" y1="150" x2="163" y2="150" stroke="#8A7B68" stroke-width="1.6"/>`; // glasses
      break;
    case 'rival': // slick dark hair, sunglasses often, sharp suit
      hairC='#2B2622'; clothC='#3A3540';
      cloth=`<path d="M66 340 L66 296 Q66 250 150 250 Q234 250 234 296 L234 340 Z" fill="${clothC}"/>
             <path d="M150 250 L128 340 L172 340 Z" fill="#1E1B22"/>
             <path d="M150 250 L138 288 L150 300 L162 288 Z" fill="#C0392B"/>`; // red tie
      hair=`<path d="M98 132 Q92 72 150 70 Q208 72 202 132 Q206 96 176 74 Q150 66 124 74 Q94 96 98 132Z" fill="${hairC}"/>
            <path d="M150 70 Q120 74 108 104 Q140 88 150 70Z" fill="#1A1613"/>`;
      break;
    case 'broker': // young, tied-back hair, modern blazer, tablet vibe
      hairC='#3B2A20'; clothC='#4A6670';
      cloth=`<path d="M70 340 L70 298 Q70 252 150 252 Q230 252 230 298 L230 340 Z" fill="${clothC}"/>
             <path d="M150 252 L136 300 L150 316 L164 300 Z" fill="#EDE4D4"/>`;
      hair=`<path d="M100 150 Q92 80 150 76 Q208 80 200 150 Q206 120 200 98 Q184 66 150 66 Q116 66 100 98 Q94 120 100 150Z" fill="${hairC}"/>
            <path d="M198 120 Q224 130 220 170 Q214 150 196 146Z" fill="${hairC}"/>`; // ponytail
      break;
    case 'critic': // distinguished, top hat/bow tie, monocle
      hairC='#4A4038'; clothC='#3E3A44';
      cloth=`<path d="M68 340 L68 298 Q68 252 150 252 Q232 252 232 298 L232 340 Z" fill="${clothC}"/>
             <path d="M150 252 L132 300 L150 314 L168 300 Z" fill="#F3EBDD"/>
             <path d="M128 288 Q150 300 172 288 Q150 282 128 288Z" fill="#7B2C3A"/>`; // bow tie
      hair=`<path d="M104 128 Q98 84 150 80 Q202 84 196 128 Q200 100 178 84 Q150 74 122 84 Q100 100 104 128Z" fill="${hairC}"/>`;
      extra=`<circle cx="173" cy="150" r="12" fill="none" stroke="#C8973F" stroke-width="2"/><line x1="185" y1="150" x2="196" y2="176" stroke="#C8973F" stroke-width="1.4"/>`; // monocle
      break;
    case 'regular': // kind elderly lady, bun, shawl
      hairC='#D8CFC4'; clothC='#9C6B78';
      cloth=`<path d="M70 340 L70 300 Q70 252 150 252 Q230 252 230 300 L230 340 Z" fill="${clothC}"/>
             <path d="M92 262 Q150 296 208 262 L208 300 Q150 320 92 300Z" fill="#B98996"/>`; // shawl
      hair=`<path d="M100 148 Q94 84 150 80 Q206 84 200 148 Q206 116 198 96 Q182 66 150 66 Q118 66 102 96 Q94 116 100 148Z" fill="${hairC}"/>
            <circle cx="150" cy="58" r="16" fill="${hairC}"/>`; // bun
      extra=`<circle cx="118" cy="172" r="7" fill="#E8A0A8" opacity="0.5"/><circle cx="182" cy="172" r="7" fill="#E8A0A8" opacity="0.5"/>`; // rosy cheeks
      break;
    default:
      hairC='#3B2A20'; clothC='#7C6A54';
      cloth=`<path d="M70 340 L70 300 Q70 252 150 252 Q230 252 230 300 L230 340 Z" fill="${clothC}"/>`;
      hair=`<path d="M100 148 Q94 80 150 76 Q206 80 200 148 Q206 112 150 66 Q94 112 100 148Z" fill="${hairC}"/>`;
  }

  return `<svg viewBox="0 0 300 340" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
    <defs><radialGradient id="pfg" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="rgba(255,255,255,.15)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></radialGradient></defs>
    ${cloth}
    <!-- neck -->
    <rect x="134" y="212" width="32" height="44" rx="12" fill="${skinSh}"/>
    <!-- head -->
    <ellipse cx="150" cy="150" rx="58" ry="66" fill="${skin}"/>
    <ellipse cx="150" cy="150" rx="58" ry="66" fill="url(#pfg)"/>
    <!-- ears -->
    <ellipse cx="93" cy="152" rx="9" ry="13" fill="${skin}"/><ellipse cx="207" cy="152" rx="9" ry="13" fill="${skin}"/>
    ${hair}
    ${brow(127,173,126,brows)}
    ${eyes(127,173,146)}
    <!-- nose -->
    <path d="M150 150 q4 12 -3 18" stroke="${skinSh}" stroke-width="2" fill="none" stroke-linecap="round"/>
    ${mouth(150,190)}
    ${extra}
  </svg>`;
}

/* ---- PAGE: MARKET ---- */
function pageMarket(){
  const idx = [
    {nm:'Fine Wine 100', f:()=>true},
    {nm:'Burgundy Idx', f:w=>w.region==='Burgundy'},
    {nm:'Bordeaux Idx', f:w=>w.region==='Bordeaux'},
    {nm:'Unicorn 10', f:w=>w.tier>=5},
  ];
  let html = `<div class="page-head"><h2>${T("ตลาดไวน์สะสม")}</h2><p>${T("ปี")} ${gameYear()} ${T("· Bid/Offer · ค่าคอม")} ${(brokerFee()*100).toFixed(1)}${T("% · vintage ปีนี้ส่งผลต่อของที่ซื้อ")}</p></div>`;

  // Victor's presence in the market, once the rivalry is live
  if(rivalUnlocked() && G.rivalGrabs>0){
    const heat=G.rivalHeat||0;
    const heatTxt = heat>=7?T('ดุเดือด') : heat>=4?T('เข้มข้น') : T('เริ่มก่อตัว');
    html+=`<div class="rival-strip">
      <div class="rv-face">${lineIcon('search',18)}</div>
      <div class="rv-body">
        <div class="rv-title">${T("วิกเตอร์ ครูซ กำลังแข่งในตลาด ·")} ${heatTxt}</div>
        <div class="rv-note">${T("เขากว้านไวน์ชั้นดีไปแล้ว")} ${G.rivalGrabs} ${T("ครั้ง — รีบซื้อก่อนของหมดชั้น")}</div>
        <div class="rv-heat">${Array.from({length:10},(_,i)=>`<i class="${i<heat?'on':''}"></i>`).join('')}</div>
      </div>
    </div>`;
  }
  html += `<div class="index-strip">`;
  idx.forEach(ix=>{
    const v = indexValue(ix.f), d=indexDelta(ix.f);
    const cls=d>=0?'up':'down';
    html+=`<div class="index-box"><div class="nm">${ix.nm}</div><div class="vl">${v.toFixed(1)}</div><div class="dl ${cls}" style="color:${d>=0?'var(--up)':'var(--down)'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(2)}%</div>${sparkline(WINES.filter(ix.f).map(w=>G.prices[w.id]).length?G.priceHist[WINES.filter(ix.f)[0].id]:[1,1])}</div>`;
  });
  html += `</div>`;

  // ---- market regime + regional heat ----
  const RG=currentRegime();
  const trends=Object.entries(G.regionTrend||{}).sort((a,b)=>b[1]-a[1]);
  const hot=trends.slice(0,3).filter(([,v])=>v>0.12);
  const cold=trends.slice(-3).filter(([,v])=>v<-0.12).reverse();
  html+=`<div class="card" style="margin-bottom:14px;border-color:${RG.k==='bull'?'var(--up)':RG.k==='bear'?'var(--down)':'var(--line)'}">
    <div class="row" style="gap:10px">
      <span style="font-size:24px">${RG.ic}</span>
      <div style="flex:1"><b style="font-family:Fraunces;font-size:16px;color:var(--wine)">${RG.t}</b>
        <div class="wine-sub">${RG.note} ${T("· คงอยู่อีกราว")} ${Math.max(1,G.regimeWeeksLeft||1)} ${T("สัปดาห์")}</div></div>
    </div>
    ${(hot.length||cold.length)?`<div class="trend-row">
      ${hot.map(([r,v])=>`<span class="trend up">${lineIcon('flame',13)} ${r} <b>+${(v*100).toFixed(0)}</b></span>`).join('')}
      ${cold.map(([r,v])=>`<span class="trend down">${lineIcon('ice',13)} ${r} <b>${(v*100).toFixed(0)}</b></span>`).join('')}
    </div>`:''}
  </div>`;

  if(G.news.length){
    html+=`<div class="card" style="border-color:var(--gold); margin-bottom:14px;"><div class="row"><span style="display:inline-flex">${lineIcon('news',22)}</span><b style="font-family:Fraunces">${T("ข่าวตลาดสัปดาห์นี้")}</b></div>`;
    G.news.forEach(n=> html+=`<p style="margin-top:6px; font-size:13.5px; font-weight:600; color:var(--ink)">${emojify(n.msg,15)}</p>`);
    html+=`</div>`;
  }

  // ---- vintage weather report ----
  const yr=gameYear();
  const shownRegions=['Bordeaux','Burgundy','Champagne','Italy','Napa','Germany'];
  html+=`<div class="card" style="margin-bottom:14px">
    <div class="row" style="margin-bottom:8px">${lineIcon('sparkle',20)}<b style="font-family:Fraunces;font-size:16px;color:var(--wine)">${T("รายงาน Vintage ปี")} ${yr}</b>
    <span class="wine-sub" style="margin-left:auto">${T("ปีที่ดีทำให้ไวน์ที่ซื้อปีนี้มีคุณภาพสูงกว่า")}</span></div>
    <div class="wx-grid">`;
  shownRegions.forEach(r=>{
    const wx=regionWeather(r,yr);
    html+=`<div class="wx-item">${weatherArt(wx.k,34)}<div class="wx-rg">${r}</div><div class="wx-t" style="color:${wx.c}">${wx.t}</div><div class="wx-d">${wx.d}</div></div>`;
  });
  html+=`</div></div>`;

  html += `<div class="grid" id="marketGrid">`;
  // ---- filter / search / sort toolbar ----
  const mO={zone:UI.marketZone, country:UI.marketCountry, region:UI.marketRegion};
  const mOrigin = mO.zone!=='all'||mO.country!=='all'||mO.region!=='all';
  const mType=(UI.marketTier?1:0)+(UI.marketColor!=='all'?1:0);
  const mActive=mType+(mOrigin?1:0)+(UI.marketSort!=='name'?1:0);
  const mCounts={}; WINES.forEach(w=>{ if(!isRareLocked(w.id)) mCounts[w.region]=(mCounts[w.region]||0)+1; });
  const sortNames={name:T("ชื่อ"), priceUp:T("ราคาต่ำ→สูง"), priceDown:T("ราคาสูง→ต่ำ"), change:T("เปลี่ยนแปลงมาก"), score:T("คะแนนสูง"), rare:T("หายาก")};
  const mChips=[];
  if(UI.marketTier) mChips.push({k:'tier', t:TIER_NAMES[UI.marketTier]});
  if(UI.marketColor!=='all') mChips.push({k:'color', t:STYLE_LABELS[UI.marketColor]});
  if(mOrigin) mChips.push({k:'origin', t:originLabel(mO)});
  if(UI.marketSort!=='name') mChips.push({k:'sort', t:sortNames[UI.marketSort]});
  html = html.replace('<div class="grid" id="marketGrid">', `
  <div class="toolbar">
    <div class="tb-search">${lineIcon('search',16)}<input id="mSearch" type="text" placeholder="${TA("ค้นหาไวน์ / ภูมิภาค...")}" value="${UI.marketSearch}"></div>
    <button class="tb-toggle ${UI.marketOwnedOnly?'on':''}" id="mOwned">${lineIcon('cellar',15)} ${T("เฉพาะที่มี")}</button>
    <button class="tb-toggle ${UI.marketAfford?'on':''}" id="mAfford">${lineIcon('coin',15)} ${T("ซื้อไหว")}</button>
    ${filterToggleHTML(mActive)}
    ${(mActive||UI.marketOwnedOnly||UI.marketAfford)?`<button class="tb-toggle" id="mClear" style="border-color:var(--down);color:var(--down)">${T("ล้างตัวกรอง ✕")}</button>`:''}
  </div>
  ${activeFiltersHTML(mChips,'mclear')}
  <div class="filter-panel ${UI.filtersOpen?'open':''}" id="fPanel">
  ${filterTabsHTML([{k:'type',t:T('ระดับ & ประเภท'),n:mType},{k:'origin',t:T('แหล่งผลิต'),n:mOrigin?1:0},{k:'sort',t:T('เรียงลำดับ'),n:UI.marketSort!=='name'?1:0}])}
  <div data-tabbody="type">
  <div class="filter-row">
    <span class="fr-label">${T("ระดับชั้น")}</span>
    <div class="filter-chips">
      <button class="chip ${!UI.marketTier?'on':''}" data-mtier="0">${T("ทั้งหมด")}</button>
      ${[5,4,3,2,1].map(t=>`<button class="chip tier-chip t${t} ${UI.marketTier===t?'on':''}" data-mtier="${t}">${TIER_NAMES[t]}</button>`).join('')}
    </div>
  </div>
  <div class="filter-row">
    <span class="fr-label">${T("ประเภท")}</span>
    <div class="filter-chips">
      <button class="chip ${UI.marketColor==='all'?'on':''}" data-mcolor="all">${T("ทั้งหมด")}</button>
      ${WINE_STYLES.map(st=>`<button class="chip col-${st} ${UI.marketColor===st?'on':''}" data-mcolor="${st}">${STYLE_LABELS[st]}</button>`).join('')}
    </div>
  </div>
  </div>
  <div data-tabbody="origin">${originHTML('morigin', mO, mCounts)}</div>
  <div data-tabbody="sort">
  <div class="filter-row">
    <span class="fr-label">${T("เรียงตาม")}</span>
    <div class="filter-chips">
      ${Object.entries(sortNames).map(([k,t])=>`<button class="chip ${UI.marketSort===k?'on':''}" data-msort="${k}">${t}</button>`).join('')}
    </div>
  </div>
  </div>
  </div>
  <div class="grid" id="marketGrid">`);

  // build filtered list
  const q=UI.marketSearch.toLowerCase().trim();
  let list=WINES.filter(w=>{
    if(isRareLocked(w.id)) return false;   // not yet unlocked — invisible on the market
    if(!originMatch(w.region, mO)) return false;
    if(UI.marketOwnedOnly && !(G.cellar[w.id]?.qty)) return false;
    if(UI.marketTier && w.tier!==UI.marketTier) return false;
    if(UI.marketColor!=='all' && wineStyle(w)!==UI.marketColor) return false;
    if(UI.marketAfford && offerPrice(w.id)>G.cash) return false;
    if(q && !(w.name+' '+w.cuvee+' '+w.region).toLowerCase().includes(q)) return false;
    return true;
  });
  const chgOf=w=>{const h=G.priceHist[w.id];return ((h[h.length-1]-h[h.length-2])/h[h.length-2]*100)||0;};
  list.sort((a,b)=>{
    switch(UI.marketSort){
      case 'priceUp': return G.prices[a.id]-G.prices[b.id];
      case 'priceDown': return G.prices[b.id]-G.prices[a.id];
      case 'change': return Math.abs(chgOf(b))-Math.abs(chgOf(a));
      case 'score': return b.score-a.score;
      case 'rare': return b.tier-a.tier;
      default: return a.name.localeCompare(b.name);

function shade(hex, amt){
  let c=hex.replace('#',''); if(c.length===3)c=c.split('').map(x=>x+x).join('');
  let r=parseInt(c.slice(0,2),16), g=parseInt(c.slice(2,4),16), b=parseInt(c.slice(4,6),16);
  r=Math.max(0,Math.min(255,r+amt)); g=Math.max(0,Math.min(255,g+amt)); b=Math.max(0,Math.min(255,b+amt));
  return `rgb(${r},${g},${b})`;
}

/* ============================================================
   MARKET STOCK / DEPTH — each wine has a limited number of bottles
   available on the open market each week. Rare wines are scarce.
   ============================================================ */
// Base weekly availability by tier. Unicorns show up a few bottles at a time.
function baseStockFor(w){
  const byTier={1:24, 2:16, 3:10, 4:5, 5:2};
  return byTier[w.tier]||10;
}
// Deterministic-per-week jitter so the number is stable while you browse.
function rollStock(w){
  const b=baseStockFor(w);
  let n=Math.round(b*(0.6+Math.random()*0.85));
  // regional fashion: hot regions get bought out, cold regions pile up
  const t=(G.regionTrend&&G.regionTrend[w.region])||0;
  n=Math.round(n*(1-t*0.35));
  // bear markets flood the market, bull markets dry it up
  const RG=currentRegime();
  if(RG.k==='bull') n=Math.round(n*0.7);
  else if(RG.k==='bear') n=Math.round(n*1.35);
  return Math.max(0, n);
}
/* ============================================================
   VICTOR CRUZ, THE RIVAL — once he has made his entrance in the
   story, he stops being a talking head and starts competing for
   the same bottles. Each week he sweeps a slice of the premium
   market before you can reach it, thinning the shelves of exactly
   the wines a serious cellar wants. Beat him to a wine he was
   eyeing and the rivalry heats up; the hotter it runs, the harder
   he pushes — and the sweeter it is when you win the wines he
   wanted at auction.
   ============================================================ */
const RIVAL_CHAPTER = 3;   // he introduces himself in chapter 3

function rivalUnlocked(){ return G.rivalActive || G.chapter >= RIVAL_CHAPTER; }

// Victor sweeps part of the high-end market each week.
function tickRival(){
  if(!rivalUnlocked()) return;
  G.rivalActive=true;
  // some weeks he is busy elsewhere
  if(Math.random()<0.35) return;
  // he targets desirable, in-stock wines: tier 4+ (the truly collectible end)
  const targets=WINES.filter(w=>!isRareLocked(w.id) && w.tier>=4 && (G.stock[w.id]||0)>0);
  if(!targets.length) return;
  // at most 1-2 wines a week even when the rivalry is white-hot
  const sweeps=1+Math.floor((G.rivalHeat||0)/7);   // 1 normally, 2 at heat 7+
  const grabbed=[];
  for(let i=0;i<sweeps && targets.length;i++){
    const w=targets[Math.floor(Math.random()*targets.length)];
    const have=G.stock[w.id]||0;
    if(have<=0) continue;
    // a noticeable bite, but rarely the whole shelf
    const bite=Math.max(1, Math.round(have*(0.20+Math.random()*0.25)));
    G.stock[w.id]=Math.max(0, have-bite);
    grabbed.push(w);
    G.rivalGrabs=(G.rivalGrabs||0)+1;
  }
  // occasionally he corners a wine entirely and gloats in the news feed
  if(grabbed.length && Math.random()<0.5){
    const w=grabbed[0];
    const barbs=[
      `${T("วิกเตอร์กว้าน")}${w.name}${T("ไปเกือบหมดตลาด — \"ของดีต้องอยู่กับคนที่เข้าใจ\"")}`,
      `${T("Cruz Cellars เหมา")}${w.cuvee||w.name}${T("ตัดหน้าคุณอีกแล้ว")}`,
      `${T("วิกเตอร์โพสต์รูปคู่กับ")}${w.name} ${T("— \"บางคนได้แต่มองราคา\"")}`,
      `${w.region}${T(": ตลาดตึงตัว วิกเตอร์กว้านเก็บก่อนใคร")}`,
    ];
    G.news.push({mult:1, msg:barbs[Math.floor(Math.random()*barbs.length)]});
  }
}

// Call this when the player buys a wine Victor was after — it stokes the rivalry.
function rivalNoteBuy(id){
  if(!rivalUnlocked()) return;
  const w=wineById(id); if(!w || w.tier<3) return;
  // beating him to a premium wine raises the heat (capped)
  if(Math.random()<0.4){
    G.rivalHeat=Math.min(10,(G.rivalHeat||0)+1);
    if(G.rivalHeat===5) G.news.push({mult:1, msg:T('วิกเตอร์เริ่มมองคุณเป็นคู่แข่งจริงจัง — เขาจะสู้หนักขึ้น')});
  }
}

function refreshStock(){
  G.stock=G.stock||{};
  WINES.forEach(w=>{
    if(isRareLocked(w.id)){ G.stock[w.id]=0; return; }   // not on the market until earned
    const prev=G.stock[w.id];
    // unsold bottles partly carry over, then a new consignment arrives
    const carry = prev===undefined ? 0 : Math.floor(prev*0.4);
    G.stock[w.id]=Math.min(baseStockFor(w)*2, carry+rollStock(w));
  });
  // Wines you are contracted to deliver are held for you by the supplier —
  // otherwise a contract could become impossible through no fault of yours.
  for(const k of (G.contracts||[])){
    const reserve = k.perWeek*2;
    if((G.stock[k.wineId]||0) < reserve) G.stock[k.wineId] = reserve;
  }
}
function stockOf(id){
  G.stock=G.stock||{};
  if(G.stock[id]===undefined) G.stock[id]=rollStock(wineById(id));
  return G.stock[id];
}
// Buying into a thin market moves the price against you.
function stockPriceImpact(id, qty){
  const st=stockOf(id);
  if(st<=0) return 1;
  const frac=Math.min(1, qty/st);
  return 1 + frac*frac*0.18;   // taking the whole shelf costs ~18% more
}
function stockLabel(id){
  const w=wineById(id), st=stockOf(id), b=baseStockFor(w);
  if(st<=0)        return {t:T('ไม่มีของ'), c:'var(--down)', ic:'⛔'};
  if(st<=b*0.25)   return {t:T('ของหายาก'), c:'var(--down)', ic:'🔥'};
  if(st<=b*0.6)    return {t:T('ของจำกัด'), c:'var(--gold)', ic:'⚠'};
  return {t:T('ของพร้อมส่ง'), c:'var(--up)', ic:'✔'};
}

/* ============================================================
   COUNTERFEIT WINE SYSTEM
   ============================================================ */
// Some market lots are fakes sold at a discount. A taster on staff can spot them.
// Returns {fake:bool, discount:number} for the currently offered lot of a wine.
function fakeChanceFor(w){
  // rarer wines are faked more often
  let base = 0.02 + (w.tier-1)*0.022;      // tier1 ~2% ... tier5 ~11%
  return Math.min(0.14, base);
}
// Roll a lot when the trade modal opens; stored per-week so it's stable while you look at it
function lotFor(id){
  const w=wineById(id);
  const key=id+':'+G.week;
  G._lots=G._lots||{};
  if(!G._lots[key]){
    const fake = Math.random() < fakeChanceFor(w);
    // fakes are offered a bit cheaper to bait you
    const bait = fake ? (0.72+Math.random()*0.14) : 1;
    G._lots[key]={fake, bait};
  }
  return G._lots[key];
}
// Taster skill determines whether you're warned. 0 = no staff, higher = better.
function tasterVerdict(id){
  const lot=lotFor(id);
  const skill=staffBonus('quality');           // sum of taster levels
  if(skill<=0) return {known:false, lot};
  const detect = Math.min(0.95, 0.45 + skill*0.16);
  // detection roll is stable per lot too
  const key='v'+id+':'+G.week;
  G._verdicts=G._verdicts||{};
  if(G._verdicts[key]===undefined) G._verdicts[key]= Math.random()<detect;
  const spotted=G._verdicts[key];
  if(lot.fake) return {known:spotted, lot, msg: spotted?'fake':'missed'};
  // false alarm chance on genuine bottles when skill is low
  return {known:true, lot, msg:'genuine'};
}

/* ============================================================
   AUCTION SYSTEM — periodic bidding events against NPC rivals
   ============================================================ */
const AUCTION_BIDDERS=[
  {name:T('วิกเตอร์ ครูซ'), av:'🕶️', aggression:1.25},
  {name:T('นักสะสมนิรนาม'), av:'🎭', aggression:1.05},
  {name:T('ตัวแทนจากฮ่องกง'), av:'🏙️', aggression:1.15},
  {name:T('พิพิธภัณฑ์ไวน์'), av:'🏛️', aggression:0.95},
];
function maybeStartAuction(){
  // roughly every 6-9 weeks once the player is established
  if(G.week<6 || G.auction) return false;
  if(G.week - (G.lastAuctionWeek||0) < 6) return false;
  if(Math.random()>0.35) return false;
  // pick a desirable lot: prefer rare wines
  const pool=WINES.filter(w=>w.tier>=3 && !isRareLocked(w.id));
  const w=pool[Math.floor(Math.random()*pool.length)];
  const est=G.prices[w.id];
  const qty=1+Math.floor(Math.random()*2);
  // Once the rivalry is hot, Victor shows up to auctions far more often and
  // pushes his walk-away price higher — winning against him is the payoff.
  let bidder;
  const heat=G.rivalHeat||0;
  if(rivalUnlocked() && Math.random() < 0.25+heat*0.05){
    bidder=AUCTION_BIDDERS[0];   // Victor
  } else {
    bidder=AUCTION_BIDDERS[Math.floor(Math.random()*AUCTION_BIDDERS.length)];
  }
  const heatPush = bidder===AUCTION_BIDDERS[0] ? 1 + heat*0.03 : 1;
  // rival's walk-away price — genuinely competitive, sometimes above estimate
  const rivalMax=Math.round(est*qty*(1.05+Math.random()*0.75)*bidder.aggression*heatPush);
  G.auction={
    id:w.id, qty, est,
    current: Math.round(est*qty*0.5),
    rivalMax, bidder,
    yourTurn:true, over:false, won:false, rounds:0,
  };
  G.lastAuctionWeek=G.week;
  return true;
}
function auctionIncrement(a){ return Math.max(1000, Math.round(a.current*0.08)); }
function placeBid(){
  const a=G.auction; if(!a||a.over) return;
  // block re-entry while the rival is "thinking" — otherwise rapid taps on a
  // touch screen stack multiple bids and blow past the ceiling
  if(a.awaitingRival) return;
  const inc=auctionIncrement(a);
  const myBid=a.current+inc;
  if(myBid>G.cash){ toast(T('เงินสดไม่พอสำหรับราคานี้'),'bad'); sfx('bad'); return; }
  // The rival may raise once more before dropping out, and we would then owe
  // that higher figure. Only bid if we could settle at that price too.
  const exposure=myBid+auctionIncrement({...a, current:myBid});
  if(exposure>G.cash && myBid+inc<=a.rivalMax){
    toast(T('เงินสดอาจไม่พอถ้าคู่แข่งสู้ต่อ'),'bad'); sfx('bad'); return;
  }
  a.current=myBid; a.rounds++;
  sfx('click');
  // rival responds
  if(a.current + auctionIncrement(a) <= a.rivalMax){
    a.awaitingRival=true;
    renderAuction();   // repaint immediately so the bid button shows as disabled
    setTimeout(()=>{
      if(!G.auction||G.auction!==a||a.over){ return; }
      a.current=a.current+auctionIncrement(a);
      a.awaitingRival=false;
      sfx('nav');
      renderAuction();
    }, 700);
  } else {
    // rival drops out — you win. Charge only what the player can actually pay:
    // the rival raised after our affordability check, so re-verify here.
    a.over=true; a.won=true;
    const owed=Math.min(a.current, G.cash);
    G.cash-=owed; G.cash=Math.round(G.cash);
    const yr=gameYear();
    if(cellarUsed()+a.qty<=cellarCapacity()){
      const c=G.cellar[a.id];
      if(c){ c.buyPrice=(c.buyPrice*c.qty+a.current)/(c.qty+a.qty); c.qty+=a.qty; }
      else { G.cellar[a.id]={qty:a.qty, buyWeek:G.week, buyPrice:Math.round(a.current/a.qty), vintage:yr, quality:vintageRating(a.id,yr), fake:0, suspect:0}; sealLot(G.cellar[a.id]); }
    } else {
      G.cash+=a.current*0.9;
      toast(T('เซลลาร์เต็ม — ขายต่อทันทีที่ 90%'),'bad');
    }
    G.stats.auctionsWon=(G.stats.auctionsWon||0)+1;
    sfx('gavel'); setTimeout(()=>sfx('great'),300);
    checkAchievements();
  }
  renderAuction(); renderTop();
}
function withdrawAuction(){
  const a=G.auction; if(!a) return;

  renderAuction();

    const mq=maxQty();

    document.getElementById('btnBuy').disabled = !canBuy || maxBuy()<1;
    document.getElementById('btnSell').disabled = !canSell || own<1;
    document.getElementById('qPlus').disabled = modalQty>=mq;
    document.getElementById('qMinus').disabled = modalQty<=1;
    const sl=document.getElementById('qSlider');
    if(sl){ if(+sl.max!==mq){ sl.max=mq; } if(+sl.value!==modalQty) sl.value=modalQty;
      const sm=document.getElementById('qSliderMax'); if(sm) sm.textContent=mq; }
  };
  document.getElementById('qMinus').onclick=()=>{modalQty=Math.max(1,modalQty-1);updateCost();};

  const setQ=n=>{ modalQty=Math.max(1,Math.min(maxQty(),n)); updateCost(); };

  if(slider) slider.oninput=()=>setQ(+slider.value);

  if(qa) qa.onclick=()=>setQ(own);
  let tradeBusy=false;
  const guardTrade=(fn)=>()=>{
    if(tradeBusy) return;

  };

  document.getElementById('btnSell').onclick=guardTrade(()=>doSell(id,modalQty));
  document.getElementById('btnClose').onclick=closeModal;
  updateCost();
  modalFocusables();

function doBuy(id, qty){
  const lot=lotFor(id);
  const off=Math.round(offerPrice(id)*lot.bait); const fee=brokerFee();
  // clamp to what is actually possible so no path can over-buy
  const space=cellarCapacity()-cellarUsed();
  const afford=Math.floor(G.cash/(off*(1+fee)));
  const avail=stockOf(id);
  if(avail<1){ sfx('deny'); toast(T('ไวน์ตัวนี้หมดจากตลาดแล้ว — รอของเข้าสัปดาห์หน้า'),'bad'); return; }
  qty=Math.min(safeQty(qty), space, afford, avail);
  if(qty<1){ sfx('deny'); toast(afford<1?T('เงินสดไม่พอ'):T('เซลลาร์เต็ม! อัพเกรดหรือขายบางส่วนก่อน'),'bad'); return; }
  const slip=stockPriceImpact(id, qty);
  const cost=off*slip*qty*(1+fee);
  G.stock[id]=Math.max(0, avail-qty);
  if(slip>1.01) toast(`${T("ของในตลาดน้อย — ราคาขยับขึ้น")} ${((slip-1)*100).toFixed(1)}%`,'bad');
  G.cash-=cost; floatMoney(-cost);
  const yr=gameYear(); const vr=vintageRating(id,yr);
  const c=G.cellar[id];
  if(c){
    sealLot(c);
    c.buyPrice=(c.buyPrice*c.qty+off*slip*qty)/(c.qty+qty); c.qty+=qty;
    if(lot.fake){ c.fake=(c.fake||0)+qty; if(staffBonus('quality')>0) c.suspect=(c.suspect||0)+qty; }
    c.fake=Math.min(c.fake||0, c.qty); c.suspect=Math.min(c.suspect||0, c.fake||0);
  }
  else {
    const nf = lot.fake?qty:0;
    G.cellar[id]={qty, buyWeek:G.week, buyPrice:Math.round(off*slip), vintage:yr, quality:vr,
                  fake: nf, suspect: (lot.fake&&staffBonus('quality')>0)? nf : 0};
    sealLot(G.cellar[id]);
  }
  normalizeCellarLots();
  G.stats.bottlesBought+=qty;
  questProgress('buy', qty);
  sfx('buy');
  rivalNoteBuy(id);
  toast(`${T("ซื้อแล้ว:")} ${wineById(id).name} ×${qty} (vintage ${yr})`,'good');
  closeModal(); checkStory(); checkAchievements(); renderTop(); routePage();
}
function doSell(id, qty){
  const c=G.cellar[id]; if(c) sealLot(c);
  if(!c){ toast(T('ไม่มีไวน์ตัวนี้ในเซลลาร์'),'bad'); return; }
  qty=Math.min(safeQty(qty), c.qty);
  if(qty<1){ toast(T('ไม่มีของพอ'),'bad'); return; }
  const bid=bidPrice(id); const fee=brokerFee();
  const qualMult = c.quality? (0.9 + (c.quality-82)/18*0.25) : 1;
  // fakes get discovered by the buyer's authenticator
  const fakeQty = Math.min(qty, c.fake||0);
  const realQty = qty - fakeQty;
  let gain = bid*realQty*(1-fee)*agingMult(id)*qualMult;
  if(fakeQty>0){
    gain += bid*fakeQty*0.05;   // near-worthless once exposed
    G.rep = Math.max(0, G.rep - fakeQty*3);
    sfx('bad');
    toast(`${T("🚨 ถูกจับได้ว่าขายของปลอม")} ${fakeQty} ${T("ขวด! ชื่อเสียงเสียหาย (-★")}${fakeQty*3})`,'bad');
  }
  const cost=(c.buyPrice||0)*qty;
  const profit=gain-cost;
  G.cash+=gain;
  // large sales move the market against you
  const imp=marketImpact(id, qty);
  if(imp>0.01){
    G.prices[id]=Math.round(G.prices[id]*(1-imp));
    if(imp>0.06) toast(`${T("📉 การขายจำนวนมากกดราคาตลาดลง")} ${(imp*100).toFixed(0)}%`,'bad');
  }
  c.qty-=qty; c.fake=Math.max(0,(c.fake||0)-fakeQty);
  // suspect bottles are a subset of the fake ones, which are a subset of the lot
  c.fake=Math.max(0, Math.min(c.fake||0, c.qty));
  c.suspect=Math.max(0, Math.min(c.suspect||0, c.fake));
  G.stock=G.stock||{}; G.stock[id]=(G.stock[id]||0)+realQty;   // your bottles go back onto the market
  if(c.qty<=0) delete G.cellar[id];
  normalizeCellarLots();
  if(profit>=0){ G.stats.tradesWon++; } else { G.stats.tradesLost++; }
  G.stats.totalProfit+=profit;
  if(profit>0) questProgress('profit', profit);
  sfx(profit>=0?'sell':'bad');
  floatMoney(gain);
  if(profit>0) setTimeout(()=>sfx('cash'),120);
  toast(`${T("ขายได้")} ${fmt(gain)} · ${profit>=0?T('📈 กำไร ')+fmtK(profit):T('📉 ขาดทุน ')+fmtK(-profit)}`, profit>=0?'good':'bad');
  closeModal(); checkStory(); checkAchievements(); renderTop(); routePage();
}

    const totalDestroy=fakeLots.reduce((a,id)=>a+disposalCost('destroy',lotSuspect(G.cellar[id])),0);
    const hasTaster=staffBonus('quality')>0;
    html+=`<div class="fake-panel">

          <div class="fp-sub">${T("ห้ามขายให้ลูกค้า — จะถูกจับได้และเสียชื่อเสียงหนัก ·")} <b style="color:var(--up)">${T("จัดการเฉพาะขวดที่ปลอม ของแท้ในล็อตเดียวกันปลอดภัย")}</b></div>
        </div>
      </div>
      <div class="fp-list">`;
    fakeLots.forEach(id=>{
      const w=wineById(id), sn=lotSuspect(G.cellar[id]);
      const genuine = Math.max(0, (G.cellar[id].qty||0) - sn);
      const canReport = hasTaster || G.cellar[id].certified;
      html+=`<div class="fp-row">
        <div class="fp-wine">${bottleSVGLite(w,30)}<div><b>${w.name.split(' ').slice(0,3).join(' ')}</b><span><b style="color:var(--down)">${T("ปลอม")} ${sn}</b>${genuine>0?` · <b style="color:var(--up)">${T("แท้")} ${genuine} ${T("ปลอดภัย")}</b>`:''}</span></div></div>
        <div class="fp-actions">

// Resolve every suspect lot at once with one method — the bulk convenience.
function handleAllFakes(mode){
  const ids=Object.keys(G.cellar).filter(id=>lotSuspect(G.cellar[id]));
  if(mode==='destroy'){
    const total=ids.reduce((a,id)=>a+disposalCost('destroy',lotSuspect(G.cellar[id])),0);
    if(total>G.cash){ toast(T('เงินสดไม่พอทำลายทั้งหมด'),'bad'); sfx('bad'); return; }
  }
  let count=0;
  // snapshot ids first, since disposeFakes mutates G.cellar
  ids.forEach(id=>{ if(G.cellar[id] && lotSuspect(G.cellar[id])){ count+=lotSuspect(G.cellar[id]); disposeFakesSilent(id, mode); } });
  if(mode==='report'){ toast(`${lineIcon?'':''}${T("🛡️ แจ้งสมาคมของปลอมทั้งหมด")} ${count} ${T("ขวดเรียบร้อย")}`,'gold'); sfx('great'); }
  else { toast(`${T("ทำลายไวน์ปลอมทั้งหมด")} ${count} ${T("ขวดอย่างถูกต้อง")}`,'good'); sfx('cash'); }
  renderTop(); routePage();
}

  let totCost=0,totVal=0;
  // sort by profit descending so best positions surface first

    const ca=G.cellar[a], cb=G.cellar[b];

    html+=`<tr data-focus="wine" data-id="${id}" tabindex="0"><td>${w.name}</td><td>${c.qty}</td><td>${fmtK(c.buyPrice)}</td><td>${fmtK(cur)}</td><td><span class="pill ${pl>=0?'up':'down'}">${pl>=0?'+':''}${pl.toFixed(1)}%</span></td><td><button class="btn sm ghost" data-focus="sellall" data-id="${id}" tabindex="0">${T("ขายหมด")}</button></td></tr>`;
  });
  html+=`</tbody></table>`;
  if(ids.length){
    const tp=(totVal-totCost)/totCost*100;

    </div>`;
  }
  html+=`</div>`;
  // primeur holdings
  const pids=Object.keys(G.primeur);
  if(pids.length){
    html+=`<div class="page-head" style="margin-top:20px"><h2 style="font-size:20px">${T("En Primeur (ซื้อล่วงหน้า)")}</h2></div><div class="grid">`;

/* ---- PAGE: EN PRIMEUR ---- */
// En primeur is only sold during a campaign window each year (spring release
// of the previous harvest). Outside the window nothing can be reserved.
function primeurOpen(){
  const m=gameMonth();
  return m>=2 && m<=4;      // มี.ค. - พ.ค.
}
function primeurWeeksLeft(){
  if(!primeurOpen()) return 0;
  return 5 - gameMonth();   // months remaining in window (1 week = 1 month)
}
function nextPrimeurIn(){
  const m=gameMonth();
  return m<2 ? (2-m) : (14-m);   // weeks until the window opens again
}
// The campaign offers a stable set for the whole window (vintage being released)
function primeurOffers(){
  const yr=gameYear();
  const seed=(yr*7919)>>>0;
  return WINES.filter(w=>w.tier>=3).filter((w,i)=>((i*31+seed)%4)===0).slice(0,8);
}

function openPrimeur(id, ep){
  const w=wineById(id); modalQty=1;
  const m=document.getElementById('modal');
  m.innerHTML=`<div style="display:flex; gap:16px; align-items:center; margin-bottom:6px">
      <div style="flex-shrink:0; filter:drop-shadow(0 4px 6px rgba(62,44,38,.22))">${bottleSVGLite(w,54)}</div>
      <div><h3 style="margin:0">${w.name}</h3><div class="wine-sub">En Primeur · ${w.cuvee}</div></div>
    </div>
    <div class="knowledge"><b>${T("En Primeur คือ?")}</b> ${T("การซื้อไวน์ตั้งแต่ยังบ่มในถัง ก่อนบรรจุขวด 1-2 ปี ได้ราคาถูกกว่าตอนออกตลาด แต่มีความเสี่ยงเรื่องคุณภาพและการส่งมอบ")}</div>
    <div class="body row" style="justify-content:space-between"><div><div class="wine-sub">${T("ราคา EP/ขวด")}</div><div style="font-family:Fraunces;font-size:20px;font-weight:600;color:var(--sage-deep)">${fmt(ep)}</div></div>
    <div><div class="wine-sub">${T("ราคาตลาดตอนนี้")}</div><div style="font-family:Fraunces;font-size:18px;font-weight:600">${fmt(G.prices[id])}</div></div></div>
    <div class="qty-ctrl"><button id="qMinus">−</button><div class="qnum" id="qNum">1</div><button id="qPlus">+</button></div>
    <div class="qty-cost" id="qCost"></div>
    <div class="row" style="justify-content:center;gap:10px">
      <button class="btn sage" id="btnEP" data-focus="modal"><span class="bic">${lineIcon('sprout',16)}</span>${T("จองล่วงหน้า")}</button>
      <button class="btn ghost" id="btnClose" data-focus="modal">${T("ปิด")}</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
  const epAfford=()=>Math.max(0, Math.floor(G.cash/(ep*(1+BROKER_FEE))));
  const epSpace=()=>cellarFreeForPrimeur();
  const epMax=()=>Math.max(0, Math.min(epAfford(), epSpace()));
  if(modalQty>epMax()) modalQty=Math.max(1, epMax());
  const upd=()=>{
    if(modalQty>epMax()) modalQty=epMax();
    document.getElementById('qNum').textContent=modalQty;
    const lim=epMax();
    const reason = epSpace()<epAfford() ? `${T("เซลลาร์ว่าง")} <b>${epSpace()}</b> ${T("ขวด (รวมที่จองไว้แล้ว)")}` : `${T("เงินสดจองได้")} <b>${epAfford()}</b> ${T("ขวด")}`;
    document.getElementById('qCost').innerHTML=T('รวม ')+fmt(ep*modalQty*(1+BROKER_FEE))
      + `<div class="qty-limit">${T("จองได้สูงสุด")} <b>${lim}</b> ${T("ขวด ·")} ${reason}</div>`;
    document.getElementById('qPlus').disabled = modalQty>=lim;
    document.getElementById('qMinus').disabled = modalQty<=1;
    document.getElementById('btnEP').disabled = lim<1;
  };
  document.getElementById('qMinus').onclick=()=>{modalQty=Math.max(1,modalQty-1);upd();};
  document.getElementById('qPlus').onclick=()=>{modalQty=Math.min(epMax(),modalQty+1);upd();};
  document.getElementById('btnClose').onclick=closeModal;
  document.getElementById('btnEP').onclick=()=>{
    if(!primeurOpen()){ toast(T('แคมเปญปิดแล้ว จองไม่ได้'),'bad'); return; }
    modalQty=Math.min(modalQty, epMax());   // final clamp in case space changed
    if(modalQty<1){ toast(T('เซลลาร์ไม่พอสำหรับการจองล่วงหน้า — ขายหรือขยายคลังก่อน'),'bad'); return; }
    const cost=ep*modalQty*(1+BROKER_FEE);
    if(cost>G.cash){toast(T('เงินสดไม่พอ'),'bad');return;}
    G.cash-=cost;
    // deliveries all land in the autumn bottling run of the same year
    const bottlingWeek = G.week + (9 - gameMonth()) + 1;   // ~ต.ค. ของปีเดียวกัน
    const rel = Math.max(G.week+3, bottlingWeek);
    if(G.primeur[id]){ G.primeur[id].qty+=modalQty; }
    else G.primeur[id]={qty:modalQty, releaseWeek:rel, buyPrice:ep};
    sfx('coin');
    toast(`${T("จอง")} ${w.name} ×${modalQty} ${T("· ส่งมอบสัปดาห์ที่")} ${rel}`,'gold');
    closeModal(); renderTop(); routePage();
  };
  upd(); modalFocusables();
}

function generateShopQueue(){
  G.shopQueue=[];
  const n=seatsPerWeek() + festivalTraffic();
  const mktBonus=G.upgrades.marketing;
  const diff=G.difficulty||1;
  G.regulars=G.regulars||{};
  // Track who is already seated this week so the same person can't appear twice.
  // We re-roll on collision (with a retry cap) rather than filtering a Set —
  // this keeps selection genuinely random and unpredictable each week instead
  // of walking a fixed remaining-list order.
  const seated={};
  for(let i=0;i<n;i++){
    let base, reg=null;
    // Draw someone not already seated. We make several independent random draws
    // (regular-or-new decided fresh each time), and if they all collide we fall
    // back to a random pick among whoever is still unseated. This stays random
    // and unpredictable — no fixed traversal order like a Set-filter would give.
    for(let attempt=0; attempt<12; attempt++){
      reg=null;
      const regIds=Object.keys(G.regulars).filter(rid=>!seated[rid]);
      const newPool=CUSTOMERS.filter(c=>(!c.minRep||G.rep>=c.minRep) && !seated[c.name]);
      const wantReg = regIds.length && Math.random()<0.42;
      if(wantReg){
        const rid=regIds[Math.floor(Math.random()*regIds.length)];
        reg=G.regulars[rid];
        base=CUSTOMERS.find(c=>c.name===reg.name)||CUSTOMERS[0];
      } else if(newPool.length){
        base=newPool[Math.floor(Math.random()*newPool.length)];
      } else if(regIds.length){
        // no new faces left this week — take an unseated regular instead
        const rid=regIds[Math.floor(Math.random()*regIds.length)];
        reg=G.regulars[rid];
        base=CUSTOMERS.find(c=>c.name===reg.name)||CUSTOMERS[0];
      } else {
        // everyone is seated (tiny roster) — accept a repeat as a last resort
        const pool=CUSTOMERS.filter(c=>!c.minRep || G.rep>=c.minRep);
        base=pool[Math.floor(Math.random()*pool.length)];
      }
      const nm = reg? reg.name : base.name;
      if(!seated[nm]) break;   // unseated — take it
    }
    const seatKey = reg? reg.name : base.name;
    seated[seatKey]=true;
    const food=FOODS[Math.floor(Math.random()*FOODS.length)];
    // regulars have bigger budgets the more they like you
    const loyalty = reg? reg.visits : 0;
    // trait shapes budget and fussiness
    const TRAIT={
      rare:       {bud:1.4, fus:0.10},
      fussy:      {bud:1.1, fus:0.28},
      value:      {bud:0.85,fus:0.05},
      loyal:      {bud:0.95,fus:-0.05},
      obscure:    {bud:1.0, fus:0.12},
      easy:       {bud:0.8, fus:-0.15},
      bigspender: {bud:2.1, fus:0.05},
      collector:  {bud:8.0, fus:0.22},
      budget:     {bud:0.45,fus:-0.10},
      rep:        {bud:1.2, fus:0.20},
    }[base.trait] || {bud:1, fus:0};
    const repTier=1+Math.min(G.rep,400)/400*7.5;   // ★0 -> 1.0x, ★400+ -> 8.5x
    const prestigeMul=1+(G.prestige||0)*0.35;
    const mult=(1+mktBonus*0.25)*diff*(1+loyalty*0.06)*prestigeMul*seasonDemand()*festivalBudgetMult();
    const general=(40000+Math.random()*190000)*TRAIT.bud*repTier*mult;
    // Each guest also shops in one price tier and brings enough for a real
    // bottle from it, so every tier — Grand Cru included — has buyers.
    const bt=pickBudgetTier(base.trait);
    const budget=Math.round(Math.max(general, tierBudget(bt)*mult));
    const fussy = Math.max(0, Math.min(1, 0.3 + Math.random()*0.3 + G.rep*0.004 + TRAIT.fus));
    let opener;
    if(reg && reg.visits>=1){
      const back=[
        `${T("กลับมาอีกแล้วครับ! คราวก่อนคุณแนะนำได้ดีมาก วันนี้ผมสั่ง")} ${food.name}${food.em}`,
        `${T("ร้านนี้ไม่เคยทำให้ผิดหวัง วันนี้ขอไวน์คู่")} ${food.name}${food.em} ${T("หน่อย")}`,
        `${T("มาเป็นครั้งที่")} ${reg.visits+1} ${T("แล้วนะ! วันนี้")} ${food.name}${food.em} ${T("ครับ")}`,
      ];
      opener=back[Math.floor(Math.random()*back.length)];
    } else {
      const openers=[
        `${T("สวัสดีครับ")} ${food.name}${food.em} ${T("คืนนี้ ขอไวน์ที่เข้ากันหน่อย")}`,
        `${T("ผมสั่ง")} ${food.name}${food.em} ${T("มา อยากได้ไวน์ที่ใช่ๆ")}`,
        `${T("คู่กับ")} ${food.name}${food.em} ${T("ควรดื่มอะไรดีครับ?")}`,
        `${T("วันนี้กิน")} ${food.name}${food.em} ${T("ช่วยเลือกไวน์ให้หน่อย")}`,
      ];
      opener=openers[Math.floor(Math.random()*openers.length)];
    }
    G.shopQueue.push({...base, food, budget, fussy, opener, isRegular:!!reg, visits: loyalty, lastWine: reg?reg.lastWine:null});
  }
  G.shopDone=false;
}

/* Which price tier a guest is shopping in. Reputation shifts the odds
   upward; the guest's trait nudges it (collectors aim high, bargain hunters low). */
const BUDGET_TIER_W = [[0,[.40,.32,.18,.08,.02]], [100,[.15,.25,.30,.20,.10]], [300,[.08,.15,.27,.28,.22]]];
const BUDGET_TRAIT_SHIFT = {collector:2, bigspender:1, rare:1, rep:1, budget:-1, value:-1};
function budgetTierWeights(rep){
  const pts=BUDGET_TIER_W; if(rep<=pts[0][0]) return pts[0][1];
  for(let i=1;i<pts.length;i++){ if(rep<=pts[i][0]){ const [r0,a]=pts[i-1], [r1,b]=pts[i], k=(rep-r0)/(r1-r0); return a.map((v,j)=>v+(b[j]-v)*k); } }
  return pts[pts.length-1][1];
}
function pickBudgetTier(trait){
  const wts=budgetTierWeights(G.rep||0); let r=Math.random()*wts.reduce((a,b)=>a+b,0), t=1;
  for(let i=0;i<wts.length;i++){ r-=wts[i]; if(r<=0){ t=i+1; break; } }
  return Math.max(1, Math.min(5, t+(BUDGET_TRAIT_SHIFT[trait]||0)));
}
// enough for a bottle picked at random from that tier at today's price, plus room for the markup
function tierBudget(t){
  const ids=WINES.filter(w=>w.tier===t && !isRareLocked(w.id)).map(w=>w.id);
  if(!ids.length) return 0;
  const id=ids[Math.floor(Math.random()*ids.length)];
  return (G.prices[id]||wineById(id).base)*(1.25+Math.random()*0.65);
}
// the highest tier whose typical bottle this budget covers (shown on the guest card)
function budgetReach(budget){
  let best=0;
  for(let t=1;t<=5;t++){
    const ps=WINES.filter(w=>w.tier===t && !isRareLocked(w.id)).map(w=>G.prices[w.id]||w.base).sort((a,b)=>a-b);
    if(ps.length && budget>=ps[Math.floor(ps.length/2)]*1.05) best=t;
  }
  return best;
}

function foodProfile(food){ return FOOD_PROFILE[food.ic] || {body:3,tannin:3,acid:4,sweet:0,why:''}; }

/* How close is this wine's structure to what the dish wants? 0..1 */
function structureMatch(w, food){
  const fp=foodProfile(food);
  const wb=w.body??3, wt=w.tannin??3, wa=w.acid??4, ws=w.sweet??0;
  // weighted distance — tannin and sweetness matter most for clashes
  const d = Math.abs(wb-fp.body)*1.0 + Math.abs(wt-fp.tannin)*1.4
          + Math.abs(wa-fp.acid)*0.8 + Math.abs(ws-fp.sweet)*1.6;
  const maxD = 5*1.0 + 5*1.4 + 5*0.8 + 5*1.6;
  return Math.max(0, 1 - d/maxD);
}

/* Per-axis explanation used by the hint UI */
function pairingReasons(w, food){
  const fp=foodProfile(food);
  const wb=w.body??3, wt=w.tannin??3, wa=w.acid??4, ws=w.sweet??0;
  const axes=[
    {k:T('บอดี้'),   w:wb, f:fp.body,   hiT:T('เข้มเกินอาหาร'), loT:T('เบาเกินอาหาร')},
    {k:T('แทนนิน'), w:wt, f:fp.tannin, hiT:T('แทนนินสูงเกินไป'), loT:T('แทนนินน้อยไปสำหรับจานนี้')},
    {k:T('กรด'),    w:wa, f:fp.acid,   hiT:T('กรดสูงกว่าที่ต้องการ'), loT:T('กรดน้อยไป จานนี้ต้องการความสดตัดเลี่ยน')},
    {k:T('ความหวาน'), w:ws, f:fp.sweet, hiT:T('หวานเกินจาน'), loT:T('หวานน้อยไปสำหรับจานนี้')},
  ];
  const good=[], bad=[];
  axes.forEach(a=>{
    const diff=a.w-a.f;
    if(Math.abs(diff)<=1) good.push(a.k);
    else if(diff>1) bad.push(a.hiT);
    else bad.push(a.loT);
  });
  return {good, bad, why:fp.why};
}

// how well the wine's style fits the kind of wine the dish calls for
function styleBonus(pc, w){
  const st = wineStyle(w);
  const sweet = (w.sweet??0)>=4;
  if(pc==='any') return 0.05;
  if(pc==='rose') return st==='rose' ? 0.12 : (st==='white' || (st==='red' && (w.body??3)<=3)) ? 0.04 : 0;
  // Rosé is the great all-rounder: never the top score for a specific
  // pairing, but it rarely clashes either.
  if(st==='rose') return (pc==='sweet'||pc==='fortified') ? 0.02 : 0.06;
  if(pc==='red') return st==='red' ? 0.07 : 0;
  if(pc==='white') return st==='white' ? 0.08 : st==='sparkling' ? 0.06 : 0;
  if(pc==='sparkling') return st==='sparkling' ? 0.12 : st==='white' ? 0.05 : 0;
  if(pc==='sweet') return (st==='sweet'||sweet) ? 0.12 : 0;
  if(pc==='fortified') return st==='fortified' ? 0.12 : st==='sweet' ? 0.06 : 0;
  return 0;
}
function evalPairing(cust, w, c){
  const sm = structureMatch(w, cust.food);      // 0..1 how well the wine's build fits the dish
  const regionOK = cust.food.pairRegions.includes(w.region);
  // structure is the backbone of the score; region is a classic-pairing bonus on top
  let q = 0.12 + sm*0.52 + (regionOK?0.22:0);
  q += styleBonus(cust.food.pairColor, w);
  // quality/vintage of the specific bottle helps
  if(c&&c.quality) q += (c.quality-82)/18*0.10;
  // staff + upgrade
  q += G.upgrades.sommelier*0.03 + staffBonus('pairing')*0.05;
  // score prestige nudges impression
  q += (w.score-90)/10*0.14;
  // fussy customers only punish a genuinely poor structural match
  if(sm<0.72 && !regionOK) q -= cust.fussy*0.12;
  return Math.max(0, Math.min(1,q));
}

function serveCustomer(id){
  // guard against a double-tap serving before the UI re-renders
  if(G._serving) return;
  const cust=G.shopQueue[0]; if(!cust) return;
  const w=wineById(id);
  if(!w){ toast(T('ไม่พบข้อมูลไวน์นี้'),'bad'); return; }
  const c=G.cellar[id];
  if(!c||c.qty<1){ toast(T('ไม่มีไวน์นี้แล้ว'),'bad'); return; }
  G._serving=true;
  const quality=evalPairing(cust, w, c);

  const price=G.prices[id];
  const servedCost=Math.round(c.buyPrice||price);   // captured before the lot is decremented
  const markup=1.05+quality*quality*0.75;
  let sellPrice=price*markup*seasonPref(w)*festivalStyleBonus(w);
  let repGain, tip=0, reaction, mood;

  // Prestige premium: serving a rare, expensive bottle well is worth more than
  // its markup alone — the cachet earns extra reputation and a fatter tip. This
  // is what makes high-tier wines worth their steep buy-in, instead of players
  // only ever churning cheap bottles near each customer's budget.
  const tierPrem = [0, 0, 0.04, 0.10, 0.20, 0.35][w.tier] || 0;   // tier4 +20% tip, tier5 +35%
  const repPrem  = [0, 0, 0,    1,    2,    3   ][w.tier] || 0;   // bonus rep for a great high-tier pairing

  // Budget is a real ceiling. A great pairing earns a small stretch (up to
  // +15%); anything beyond that, the customer simply pays what they can.
  const stretch = 1 + (quality>0.78 ? 0.15 : quality>0.55 ? 0.07 : 0);
  const payCap  = Math.max(0, cust.budget||0) * stretch;
  if(sellPrice > payCap){
    sellPrice = payCap; repGain = quality>0.7?1:0;
    reaction=`"${cust.name} ${T("ยิ้มบางๆ — ขวดนี้เกินงบ จ่ายได้เท่าที่มี\"")}`; mood='ok';
  } else {
    if(quality>0.78){ repGain=3+repPrem+Math.floor(staffBonus('pairing')/2); tip=sellPrice*(0.15+tierPrem+staffBonus('pairing')*0.02); 
      reaction=`${T("✨ \"สมบูรณ์แบบ!")} ${w.cuvee} ${T("เข้ากับ")}${cust.food.name}${T("อย่างเหลือเชื่อ\" —")} ${cust.name}${T("ประทับใจสุดๆ")}`; mood='great';
      G.stats.perfectPairs++; questProgress('perfect',1);
      if(w.tier>=4){ reaction=`${T("✨ \"ขวดระดับนี้หายากมาก!")} ${w.cuvee} ${T("กับ")}${cust.food.name} ${T("คือประสบการณ์ที่ผมจะไม่มีวันลืม\" —")} ${cust.name}${T("ตื้นตัน")}`; } }
    else if(quality>0.55){ repGain=2; tip=sellPrice*(0.06+tierPrem*0.4);
      reaction=`🙂 "${cust.name} ${T("พยักหน้าพอใจ รสชาติเข้ากันดีทีเดียว\"")}`; mood='good'; }
    else { repGain=1; tip=0;
      reaction=`😐 "${cust.name} ${T("ดื่มเงียบๆ ดูไม่ค่อยเข้ากับอาหารเท่าไร\"")}`; mood='meh'; }
  }
  const total=Math.max(0, (sellPrice+tip)*prestigeMult());
  G.cash += total; G.cash=Math.round(G.cash);
  floatMoney(total);
  G._weekRevenue=(G._weekRevenue||0)+total;
  G._weekServed=(G._weekServed||0)+1;
  // reputation has diminishing returns — the floor used to guarantee +1 per serve,
  // which let rep run away to 4-digit values. Accumulate fractionally instead.
  const repScale = G.rep<20 ? 1 : G.rep<50 ? 0.6 : G.rep<100 ? 0.30 : G.rep<200 ? 0.12 : G.rep<400 ? 0.05 : 0.02;
  const rawGain = repGain*repScale;
  G._repFrac = (G._repFrac||0) + rawGain;
  repGain = Math.floor(G._repFrac);
  G._repFrac -= repGain;
  G.rep = Math.max(0, G.rep+repGain);
  G.stats.served++;
  questProgress('serve',1);
  // Serving removes a bottle; re-clamp so fake/suspect can never exceed what
  // is left in the lot (0 <= suspect <= fake <= qty).
  c.qty--; sealLot(c); if(c.qty<=0) delete G.cellar[id];

  // occasional review
  if(mood==='great'||mood==='meh'){
    const revs = mood==='great'
      ? [`${T("ร้านนี้ซอมเมอลิเยร์เก่งมาก! แนะนำ")}${w.cuvee}${T("ได้ตรงใจ ⭐⭐⭐⭐⭐")}`,`${T("ประสบการณ์ไวน์ที่ดีที่สุดในเมือง ⭐⭐⭐⭐⭐")}`]
      : [`${T("บริการโอเค แต่ไวน์ไม่ค่อยเข้ากับอาหาร ⭐⭐")}`,`${T("ยังต้องพัฒนาการจับคู่อีกนิด ⭐⭐⭐")}`];
    G.stats.reviews.unshift({week:G.week, text:revs[Math.floor(Math.random()*revs.length)], by:cust.name, mood});
    if(G.stats.reviews.length>12) G.stats.reviews.length=12;
  }

  // a well-served customer may become a regular
  G.regulars=G.regulars||{};
  if(mood==='great'||mood==='good'){
    const key=cust.name;
    const r=G.regulars[key]||{name:cust.name, av:cust.av, visits:0, spent:0};
    r.visits++; r.spent+=total; r.lastWine=w.name; r.lastWeek=G.week;
    G.regulars[key]=r;
  } else if(mood==='meh' && G.regulars[cust.name]){
    // a bad pairing can lose a regular
    if(Math.random()<0.35) delete G.regulars[cust.name];
  }

  G.shopQueue.shift();
  if(G.shopQueue.length===0) G.shopDone=true;
  checkStory(); checkAchievements();
  renderTop();
  G._serving=false;
  showServeResult(cust, w, reaction, total, tip, repGain, mood, servedCost);
}

function showServeResult(cust, w, reaction, total, tip, repGain, mood, cost){
  sfx(mood==='great'?'great':mood==='good'?'good':mood==='meh'?'click':'coin');
  if(mood==='great'){ sfx('cork'); setTimeout(()=>sfx('cheers'),260); }
  if(mood==='good') sfx('pour');
  if(mood==='meh') sfx('swirl');
  const col = mood==='great'?'var(--gold)':mood==='good'?'var(--sage)':mood==='meh'?'var(--ink-soft)':'var(--sky)';
  const m=document.getElementById('modal');
  m.innerHTML=`
    <div style="text-align:center">
      <div class="srv-av">${custAvatar(cust.av,72)}</div>
      <div style="font-family:Fraunces;font-weight:600;font-size:18px">${cust.name}</div>
    </div>
    <div class="knowledge" style="border-color:${col};background:rgba(200,151,63,.08);text-align:center;font-size:14px;margin:14px 0">${reaction}</div>
    <div class="body" style="font-size:14px">
      <div class="rep-row"><span class="rr-ic">${lineIcon('coin',15)} ${T("ยอดขาย")}</span><b style="color:var(--up)">${fmt(total-tip)}</b></div>
      ${tip>0?`<div class="rep-row"><span class="rr-ic">${lineIcon('gift',15)} ${T("ทิป")}</span><b style="color:var(--gold)">+${fmt(tip)}</b></div>`:''}
      ${cost!=null?`<div class="rep-row"><span class="rr-ic">${lineIcon('cellar',15)} ${T("ทุนขวดนี้")}</span><b style="color:var(--down)">−${fmt(cost)}</b></div>
      <div class="rep-row" style="border-top:2px solid var(--line);margin-top:6px;padding-top:8px"><span><b>${T("กำไรสุทธิ")}</b></span><b style="color:${total-cost>=0?'var(--up)':'var(--down)'};font-size:17px">${total-cost>=0?'+':''}${fmt(total-cost)}</b></div>`:''}
      <div class="rep-row" style="margin-top:4px"><span class="rr-ic">${lineIcon('star',15)} ${T("ชื่อเสียง")}</span><b style="color:var(--gold)">+${repGain}</b></div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn gold" id="srvNext" data-focus="modal">${G.shopQueue.length>1?T('ลูกค้าถัดไป ▶'):T('เสร็จสิ้น')}</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
  document.getElementById('srvNext').onclick=()=>{ closeModal(); pageShop(); bindFocusables(); };
  modalFocusables();
}

function buyUpgrade(uid){
  const u=UPGRADES.find(x=>x.id===uid); const lv=G.upgrades[uid];
  if(lv>=u.max){ toast(T('อัพเกรดสูงสุดแล้ว'),'bad'); return; }
  const cost=u.cost(lv);
  if(cost>G.cash){ toast(T('เงินสดไม่พอ'),'bad'); return; }
  G.cash-=cost; G.upgrades[uid]++;
  sfx('levelup');
  toast(`${T("อัพเกรด")} ${u.name} ${T("เป็นระดับ")} ${G.upgrades[uid]}!`,'gold');
  renderTop(); pageShop(); bindFocusables();
}

/* ---------- DISPLAY PREFERENCES (separate from save) ---------- */
const DISP_KEY='cellarAndVine_display';
let DISP={dark:(()=>{ try{ return window.matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; } })(), fs:'normal', sfx:true, bgm:false, bgmVol:0.5, car:'auto',
  fx:(()=>{ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches?'low':'high'; }catch(e){ return 'high'; } })()};
function loadDisplay(){
  try{ const d=JSON.parse(localStorage.getItem(DISP_KEY)||'{}'); DISP=Object.assign(DISP,d); }catch(e){}
  applyDisplay();
}
// The Tesla browser identifies itself with "Tesla/<firmware>" in its user
// agent (older MCU1 cars: "QtCarBrowser").
const IS_TESLA = /Tesla\/|QtCarBrowser/i.test(navigator.userAgent||'');
function carMode(){ return DISP.car==='on' || (DISP.car!=='off' && IS_TESLA); }
function applyDisplay(){
  const b=document.body;
  b.classList.toggle('dark', !!DISP.dark);
  b.classList.toggle('car', carMode());
  b.classList.toggle('fx-off', DISP.fx==='off');
  b.classList.toggle('fx-low', DISP.fx==='low');
  try{ if(DISP.fx==='high') Ambient.start(); else Ambient.stop(); }catch(e){}
  b.classList.remove('fs-large','fs-xlarge');
  if(DISP.fs==='large') b.classList.add('fs-large');
  if(DISP.fs==='xlarge') b.classList.add('fs-xlarge');
  sfxOn = !!DISP.sfx;
  if(DISP.bgm) startBGM(); else stopBGM();
  try{ localStorage.setItem(DISP_KEY, JSON.stringify(DISP)); }catch(e){}
}

/* ---------- filter sets: tabs + origin drill-down (zone › country › region) ---------- */
const ZONES=[
  {k:'eu', t:T('ยุโรป'), c:['fr','it','es','pt','de','at','hu','gr','gb']},
  {k:'nw', t:T('โลกใหม่'), c:['us','au','nz','cl','ar','za']},
  {k:'as', t:T('เอเชีย & ตะวันออกกลาง'), c:['lb','cn','jp']},
];
const COUNTRY_NAMES={fr:T('ฝรั่งเศส'), it:T('อิตาลี'), es:T('สเปน'), pt:T('โปรตุเกส'), de:T('เยอรมนี'), at:T('ออสเตรีย'),
  hu:T('ฮังการี'), gr:T('กรีซ'), gb:T('อังกฤษ'), us:T('สหรัฐฯ'), au:T('ออสเตรเลีย'), nz:T('นิวซีแลนด์'), cl:T('ชิลี'),
  ar:T('อาร์เจนตินา'), za:T('แอฟริกาใต้'), lb:T('เลบานอน'), cn:T('จีน'), jp:T('ญี่ปุ่น')};
function countryOf(region){ return REGION_COUNTRY[region]||''; }
function zoneOf(region){ const c=countryOf(region); const z=ZONES.find(z=>z.c.includes(c)); return z?z.k:''; }
function countryFlag(code, h){ const r=Object.keys(REGION_COUNTRY).find(x=>REGION_COUNTRY[x]===code); return r?flagSVG(r,h||11):''; }
function originMatch(region, o){
  if(o.region!=='all') return region===o.region;
  if(o.country!=='all') return countryOf(region)===o.country;
  if(o.zone!=='all') return zoneOf(region)===o.zone;
  return true;
}
function originLabel(o){
  if(o.region!=='all') return `${countryFlag(countryOf(o.region))}${COUNTRY_NAMES[countryOf(o.region)]||''} › ${o.region}`;
  if(o.country!=='all') return `${countryFlag(o.country)}${COUNTRY_NAMES[o.country]||o.country}`;
  if(o.zone!=='all') return (ZONES.find(z=>z.k===o.zone)||{}).t||'';
  return '';
}
// counts: {region: number of wines}. Each level only appears once the one above is chosen.
function originHTML(attr, o, counts){
  const regs=Object.keys(counts); const sum=f=>regs.filter(f).reduce((a,r)=>a+counts[r],0);
  const zones=ZONES.filter(z=>regs.some(r=>zoneOf(r)===z.k));
  let h=`<div class="filter-row"><span class="fr-label">${T('โซน')}</span><div class="filter-chips">
    <button class="chip ${o.zone==='all'?'on':''}" data-${attr}="zone:all">${T('ทั้งหมด')} <span class="cnt">${sum(()=>true)}</span></button>
    ${zones.map(z=>`<button class="chip ${o.zone===z.k?'on':''}" data-${attr}="zone:${z.k}">${z.t} <span class="cnt">${sum(r=>zoneOf(r)===z.k)}</span></button>`).join('')}</div></div>`;
  if(o.zone!=='all'){
    const z=ZONES.find(z=>z.k===o.zone);
    const cs=z.c.filter(c=>regs.some(r=>countryOf(r)===c));
    h+=`<div class="filter-row sub"><span class="fr-label">${T('ประเทศ')}</span><div class="filter-chips">
      <button class="chip ${o.country==='all'?'on':''}" data-${attr}="country:all">${T('ทุกประเทศ')}</button>
      ${cs.map(c=>`<button class="chip ${o.country===c?'on':''}" data-${attr}="country:${c}">${countryFlag(c,12)}${COUNTRY_NAMES[c]} <span class="cnt">${sum(r=>countryOf(r)===c)}</span></button>`).join('')}</div></div>`;
  }
  if(o.country!=='all'){
    const rs=regs.filter(r=>countryOf(r)===o.country).sort();
    if(rs.length>1) h+=`<div class="filter-row sub2"><span class="fr-label">${T('ภูมิภาค')}</span><div class="filter-chips">
      <button class="chip ${o.region==='all'?'on':''}" data-${attr}="region:all">${T('ทุกภูมิภาค')}</button>
      ${rs.map(r=>`<button class="chip ${o.region===r?'on':''}" data-${attr}="region:${r}">${r} <span class="cnt">${counts[r]}</span></button>`).join('')}</div></div>`;
  }
  return h;
}
// apply a tap on an origin chip: picking a level resets the levels below it
function setOrigin(o, val){
  const [lvl,v]=val.split(':');
  if(lvl==='zone'){ o.zone=v; o.country='all'; o.region='all'; }
  else if(lvl==='country'){ o.country=v; o.region='all'; }
  else o.region=v;
}
// tab strip inside the filter panel; switching tabs never re-renders the list
function filterTabsHTML(tabs){
  const cur = tabs.some(t=>t.k===UI.filterTab) ? UI.filterTab : tabs[0].k;
  return `<div class="fp-tabs" role="tablist">${tabs.map(t=>`<button class="fp-tab ${cur===t.k?'on':''}" data-ftab="${t.k}" role="tab">${t.t}${t.n?` <span class="f-count">${t.n}</span>`:''}</button>`).join('')}</div>`;
}
function bindFilterTabs(){
  const panel=document.getElementById('fPanel'); if(!panel) return;
  const tabs=[...panel.querySelectorAll('[data-ftab]')];
  const show=k=>{ UI.filterTab=k; tabs.forEach(b=>b.classList.toggle('on', b.dataset.ftab===k));
    panel.querySelectorAll('[data-tabbody]').forEach(d=>d.style.display = d.dataset.tabbody===k ? '' : 'none'); };
  tabs.forEach(b=>b.onclick=()=>{ sfx('click'); show(b.dataset.ftab); });
  show(tabs.some(b=>b.dataset.ftab===UI.filterTab) ? UI.filterTab : (tabs[0]&&tabs[0].dataset.ftab));
}
// removable summary of active filters, shown under the toolbar
function activeFiltersHTML(items, attr){

  return `<div class="active-filters ${UI.filtersOpen?'hide':''}">${items.map(i=>`<button class="af-chip" data-${attr}="${i.k}">${i.t} <b>✕</b></button>`).join('')}</div>`;
}

/* ---------- ROUTER ---------- */
let _routedPage=null;
function routePage(){
  const content=document.getElementById('content');
  const samePage = _routedPage===G.page;
  const keepScroll = samePage && content ? content.scrollTop : 0;
  _routedPage=G.page;
  renderNav();
  // leaving the cellar: tear down the lazy-bottle observer so it doesn't linger
  if(G.page!=='cellar' && _bottleObserver){ _bottleObserver.disconnect(); _bottleObserver=null; }
  if(G.page==='market') pageMarket();
  else if(G.page==='cellar') pageCellar();
  else if(G.page==='portfolio') pagePortfolio();
  else if(G.page==='primeur') pagePrimeur();
  else if(G.page==='learn') pageLearn();
  else if(G.page==='story') pageStory();
  else if(G.page==='staff') pageStaff();
  else if(G.page==='stats') pageStats();
  else if(G.page==='guide') pageGuide();
  else if(G.page==='biz') pageBiz();
  else if(G.page==='settings') pageSettings();
  else pageShop();
  try{ decoratePageHead(G.page); }catch(e){}
  if(content) content.scrollTop = keepScroll;
  if(!samePage){ focusIndex=0; if(content){ content.classList.remove('page-enter'); void content.offsetWidth; content.classList.add('page-enter'); } }
  updateFocus();
}

/* ---------- NEXT WEEK ---------- */
function nextWeek(){
  normalizeCellarLots();   // start the week from a consistent cellar
  const cashBefore=G.cash;
  const revenueThisWeek = G._weekRevenue||0; // accumulated from shop sales during the week
  G.week++;
  G.stats.weeksPlayed++;
  tickMarket();

  // deliver primeur
  let delivered=[];
  for(const id in G.primeur){
    const p=G.primeur[id];
    if(p.releaseWeek<=G.week){
      if(cellarUsed()+p.qty<=cellarCapacity()){
        const yr=p.vintage||gameYear();
        if(G.cellar[id]){G.cellar[id].qty+=p.qty;} else { G.cellar[id]={qty:p.qty,buyWeek:G.week,buyPrice:p.buyPrice,vintage:yr,quality:vintageRating(id,yr),fake:0,suspect:0}; sealLot(G.cellar[id]); }
        delivered.push(`${wineById(id).name} ×${p.qty}`);
      } else {
        G.cash+=G.prices[id]*p.qty*0.95;
        toast(`${T("เซลลาร์เต็ม —")} ${wineById(id).name} ${T("ถูกขายอัตโนมัติ")}`,'bad');
      }
      delete G.primeur[id];
    }
  }
  if(delivered.length) toast(`${T("📦 ส่งมอบ En Primeur:")} ${delivered.join(', ')}`,'gold');

  // rare wines may have just become available
  checkRareUnlocks();
  // B2B deliveries settle first — they are revenue for this week
  const contractResult = settleContracts();
  // new offers arrive
  tickAllocations();
  tickContractOffers();
  tickParty();
  tickOpportunity();
  tickHazard();

  // weekly costs
  const costs = weeklyCosts();
  G.cash -= costs;

  // flag wines that just reached their drinking peak so the cellar can highlight them
  G._justRipe = [];
  for(const id in G.cellar){
    const st = drinkWindow(id).state;
    const prev = (G.cellar[id]._dw || 'young');
    if(prev!=='peak' && st==='peak') G._justRipe.push(id);
    G.cellar[id]._dw = st;
  }
  if(G._justRipe.length){
    const nm = wineById(G._justRipe[0]);
    toast(`🍷 ${nm?nm.cuvee||nm.name:T('ไวน์')}${G._justRipe.length>1?` ${T("และอีก")} ${G._justRipe.length-1} ${T("รายการ")}`:''} ${T("พร้อมดื่มแล้ว")}`,'gold');
  }

  // loan interest is charged after operating costs
  const interest = accrueLoans();

  // build financial report
  G.lastReport = {
    week:G.week-1,
    revenue: revenueThisWeek,
    salaries: weeklySalaries(),
    rent: weeklyRent(),
    interest: interest,
    debt: loanDebt(),
    contractPaid: contractResult.paid,
    contractFailed: contractResult.failed,
    net: revenueThisWeek - costs - interest,
    served: G._weekServed||0,
    cash: G.cash,
  };
  G.weeklyLog.push({week:G.week-1, revenue:revenueThisWeek, costs, net:revenueThisWeek-costs});
  if(G.weeklyLog.length>52) G.weeklyLog.shift();
  if(revenueThisWeek>G.stats.bestWeek) G.stats.bestWeek=revenueThisWeek;

  // reset weekly accumulators
  G._weekRevenue=0; G._weekServed=0;

  // difficulty scales slowly with reputation/time
  G.difficulty = 1 + G.week*0.015 + G.rep*0.004;

  generateShopQueue();
  generateQuests();
  checkStory();
  checkAchievements();

  normalizeCellarLots();
  if(isStuck()){
    // no cash and nothing left to sell — offer the bank instead of a dead save
    setTimeout(()=>openBank(true), 420);
  } else if(G.cash<0){
    toast(T('⚠️ เงินสดติดลบ! ขายไวน์ ลดค่าใช้จ่าย หรือกู้เงินที่หน้าธนาคาร'),'bad');
  }

  // smart QoL alerts
  smartAlerts();

  roundMoney();
  pruneEmptyLots();   // safe here: nothing is iterating the cellar any more
  saveGame(true);
  renderTop();
  routePage();

  sfx('week');
  // show weekly report modal
  showWeeklyReport();
}
/* QoL: contextual warnings so players don't miss important states */
function smartAlerts(){
  const space=cellarCapacity()-cellarUsed();
  if(space<=2 && space>0) toast(`${T("⚠️ เซลลาร์ใกล้เต็ม (เหลือ")} ${space} ${T("ช่อง)")}`,'bad');
  if(G.cash < weeklyCosts()*2 && G.cash>=0) toast(T('⚠️ เงินสดใกล้ไม่พอจ่ายค่าใช้จ่าย'),'bad');
  if(!Object.keys(G.cellar).length) toast(T('เซลลาร์ว่าง — ไปซื้อไวน์ที่หน้าตลาดก่อน'),'bad');
  // big winners worth taking profit on
  const winners=Object.keys(G.cellar).filter(id=>{
    const c=G.cellar[id]; return G.prices[id]*agingMult(id) > c.buyPrice*1.6;
  });
  if(winners.length) toast(`${T("📈 มีไวน์")} ${winners.length} ${T("รายการกำไรเกิน 60% — พิจารณาขายทำกำไร")}`,'gold');
}

function saveGame(silent){
  let json;
  try{ json=JSON.stringify(G); }
  catch(e){ if(!silent) toast(T('บันทึกไม่สำเร็จ (ข้อมูลเสียหาย)'),'bad'); return false; }
  try{
    localStorage.setItem(SAVE_KEY, json);
    if(!silent) toast(T('💾 บันทึกเกมแล้ว'),'good');
    return true;
  }catch(e){
    // QuotaExceededError or private-mode block. The previous save is untouched
    // because setItem is atomic — it either writes the whole value or nothing.
    const quota = e && (e.name==='QuotaExceededError' || e.code===22 || e.code===1014);
    if(quota){
      // last resort: drop bulky non-essential history so the core save fits
      try{
        const slim=JSON.parse(json);
        if(slim.priceHist) for(const k in slim.priceHist) slim.priceHist[k]=slim.priceHist[k].slice(-24);
        if(slim.bidHist) for(const k in slim.bidHist) slim.bidHist[k]=slim.bidHist[k].slice(-24);
        if(Array.isArray(slim.news)) slim.news=slim.news.slice(-20);
        if(slim.stats&&Array.isArray(slim.stats.reviews)) slim.stats.reviews=slim.stats.reviews.slice(-8);
        localStorage.setItem(SAVE_KEY, JSON.stringify(slim));
        if(!silent) toast(T('💾 บันทึกแล้ว (ตัดประวัติเก่าบางส่วนเพื่อประหยัดพื้นที่)'),'gold');
        return true;
      }catch(e2){
        toast(T('⚠️ พื้นที่เซฟเต็ม! เซฟเก่ายังอยู่ครบ แต่ความคืบหน้าล่าสุดยังไม่ถูกบันทึก'),'bad');
        return false;
      }
    }
    if(!silent) toast(T('บันทึกไม่สำเร็จ'),'bad');
    return false;
  }
}
// Recursively fill in any missing keys from the template (freshState) without
// clobbering saved values. Plain objects merge key-by-key; arrays and scalars
// from the save win as-is. This means new nested fields added in a later
// version appear automatically without hand-written `G.x = G.x || ...` lines.
function deepMergeDefaults(target, template){
  for(const k in template){
    const tv=template[k], sv=target[k];
    const tIsObj = tv && typeof tv==='object' && !Array.isArray(tv);
    if(!(k in target) || sv===undefined || sv===null){
      // clone the template default so saves don't share references with freshState
      target[k] = tIsObj || Array.isArray(tv) ? JSON.parse(JSON.stringify(tv)) : tv;
    } else if(tIsObj && sv && typeof sv==='object' && !Array.isArray(sv)){
      deepMergeDefaults(sv, tv);
    }
  }
  return target;
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw){ toast(T('ไม่พบไฟล์เซฟ'),'bad'); return false; }
    const data=JSON.parse(raw);
    // deep-merge the save onto a fresh template so every field — including
    // nested ones added in later versions — exists, without overwriting saved data
    G = deepMergeDefaults(JSON.parse(JSON.stringify(data)), freshState());
    // ensure prices exist for any new wines added since save
    WINES.forEach(w=>{ if(!(w.id in G.prices)){ G.prices[w.id]=w.base; G.priceHist[w.id]=[w.base]; } });
    // v1.9: the whole economy was rescaled. A pre-1.9 save carries prices from the
    // old scale, which would make everything look free. Detect and rebase.
    if(!data.econScale || data.econScale < 2){
      const sample = WINES[0];
      const saved = G.prices[sample.id] || sample.base;
      const ratio = sample.base / Math.max(1, saved);
      if(ratio > 3){   // clearly an old-scale save
        WINES.forEach(w=>{
          G.prices[w.id] = Math.round((G.prices[w.id]||w.base) * ratio);
          if(Array.isArray(G.priceHist[w.id])) G.priceHist[w.id]=G.priceHist[w.id].map(v=>Math.round(v*ratio));
          if(Array.isArray(G.bidHist?.[w.id])) G.bidHist[w.id]=G.bidHist[w.id].map(v=>Math.round(v*ratio));
        });
        for(const id in G.cellar){ if(G.cellar[id].buyPrice) G.cellar[id].buyPrice=Math.round(G.cellar[id].buyPrice*ratio); }
        for(const id in G.primeur){ if(G.primeur[id].buyPrice) G.primeur[id].buyPrice=Math.round(G.primeur[id].buyPrice*ratio); }
        G.cash = Math.round(G.cash * ratio);
        toast(T('ปรับสเกลเศรษฐกิจของเซฟเก่าให้เข้ากับเวอร์ชันใหม่แล้ว'),'gold');
      }
      G.econScale = 2;
    }
    // deep-merge already guaranteed every field exists; just clean stale refs
    pruneMissingWines();
    normalizeCellarLots();
    pruneEmptyLots();     // a corrupt save can clamp to qty 0; don't show ghosts
    checkRareUnlocks();   // re-evaluate in case an old save already met a condition
    migrateSaveLang();    // names saved in the other language → this language
    return true;
  }catch(e){ toast(T('โหลดเซฟผิดพลาด'),'bad'); return false; }
}
function hasSave(){ return !!localStorage.getItem(SAVE_KEY); }

function showTutorial(){

  const t=TUTORIAL[G.tutStep];
  if(!t){ G.tutDone=true; saveGame(true); return; }
  const m=document.getElementById('modal');
  const last=G.tutStep>=TUTORIAL.length-1;
  m.innerHTML=`
    <div style="text-align:center;margin-bottom:4px">
      <div style="font-size:44px">${t.icon}</div>
      <h3 style="justify-content:center">${t.title}</h3>
      <div class="wine-sub">${T("คู่มือเริ่มต้น")} ${G.tutStep+1}/${TUTORIAL.length}</div>
    </div>
    <div class="body" style="font-size:14px;line-height:1.7">${t.body}</div>

    <div class="row" style="justify-content:center;gap:10px;margin-top:6px">
      <button class="btn gold" id="tutNext" data-focus="modal">${last?T('✅ เริ่มเล่นเลย'):T('ถัดไป ▶')}</button>
      <button class="btn ghost" id="tutSkip" data-focus="modal">${T("ข้ามคู่มือ")}</button>

  document.getElementById('modalBg').classList.add('show');

    if(t.page){ G.page=t.page; }
    G.tutStep++;
    if(G.tutStep>=TUTORIAL.length){
      G.tutDone=true; saveGame(true); closeModal(); routePage();
      toast(T('💡 อ่านคู่มือเพิ่มเติมได้ที่หน้า "คู่มือ" ตลอดเวลา'),'gold');

function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!G.ach[a.id] && a.check(G)){
      G.ach[a.id]=true;
      sfx('unlock');
      toast(`${T("🏅 ปลดล็อกความสำเร็จ:")} ${a.name}!`,'gold');
    }
  });
}
function generateQuests(){
  G.quests=[];
  const pool=[...QUEST_TEMPLATES];
  for(let i=0;i<2;i++){
    const t=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    let target;
    if(t.step) target = t.min + Math.floor(Math.random()*(t.rng/t.step))*t.step;
    else target = t.min + Math.floor(Math.random()*t.rng);
    G.quests.push({type:t.id, target, reward:t.reward, progress:0, done:false});
  }
}
function questProgress(type, amount){
  G.quests.forEach(q=>{
    if(q.done) return;
    if(q.type===type){
      q.progress+=amount;
      if(q.progress>=q.target){
        q.done=true;
        G.cash+=q.reward;
        sfx('quest');
        toast(`${T("✅ เควสต์สำเร็จ +")}${fmtK(q.reward)}`,'gold');
      }
    }
  });
}

/* ============================================================
   STORY SYSTEM
   ============================================================ */
function currentChapter(){ return CHAPTERS[G.chapter] || null; }

function goalProgress(goal){
  switch(goal.type){
    case 'rep': return G.rep;
    case 'cellar': return cellarUsed();
    case 'portfolio': return portfolioValue();
    case 'cash': return G.cash;
    case 'unicorn': return Object.keys(G.cellar).reduce((s,id)=> s + ((wineById(id)?.tier||0)>=5? G.cellar[id].qty:0), 0);
    case 'regions': return new Set(Object.keys(G.cellar).map(id=>wineById(id)?.region).filter(Boolean)).size;
    case 'staffRep': return G.staff.length>=4 ? G.rep : 0; // requires 4 staff AND rep target
    default: return 0;
  }
}
// human-readable sub-status for goals with compound conditions
function goalSubtext(goal){
  if(goal.type==='staffRep') return `${T("พนักงาน")} ${G.staff.length}${T("/4 คน · ชื่อเสียง ★")}${G.rep}/${goal.target}`;
  if(goal.type==='regions'){
    const rs=[...new Set(Object.keys(G.cellar).map(id=>wineById(id)?.region).filter(Boolean))];
    return `${T("ภูมิภาคที่มี:")} ${rs.length? rs.join(', ') : '—'}`;
  }
  return '';
}
function goalMet(goal){ return goalProgress(goal) >= goal.target; }

function checkStory(){
  const ch=currentChapter();
  if(!ch) return;
  if(goalMet(ch.goal)){
    // grant reward
    const r=ch.reward||{};
    if(r.cash) G.cash+=r.cash;
    if(r.rep) G.rep+=r.rep;
    G.storyLog.push(ch.id);
    G.chapter++;
    // queue an explainer for any system that just became available
    if(G.chapter===PARTY_CHAPTER) G._unlockExplain='party';
    else if(G.chapter===ALLOC_CHAPTER) G._unlockExplain='alloc';
    else if(G.chapter===CONTRACT_CHAPTER) G._unlockExplain='contract';
    const nextCh=currentChapter();
    showChapterComplete(ch, r, nextCh);
  }
}

function maybeShowChapterScene(){
  const ch=currentChapter();
  if(ch && G.chapterSeen < ch.id){
    G.chapterSeen=ch.id;
    saveGame(true);
    showChapterScene(ch);
  }
}

let sceneLines=[], sceneStep=0, sceneChapter=null;
function showChapterScene(ch){
  sceneChapter=ch; sceneLines=ch.lines; sceneStep=0;
  renderScene();
}
function renderScene(){
  const line=sceneLines[sceneStep];
  const whoId=line[0], text=line[1], emo=line[2]||'neutral';
  const c=CHARACTERS[whoId];
  const bg=sceneChapter.bg||'cellar';
  const last=sceneStep>=sceneLines.length-1;
  const m=document.getElementById('modal');
  m.className='modal vn-modal';
  m.innerHTML=`
    <div class="vn-stage">
      ${sceneBG(bg)}
      <div class="vn-vignette"></div>
      <div class="vn-title">${sceneChapter.title}</div>
      <div class="vn-portrait">${charPortrait(whoId, emo)}</div>
    </div>
    <div class="vn-dialogue">
      <div class="vn-namebar"><span class="vn-name">${c.name}</span><span class="vn-role">${c.role}</span></div>
      <div class="vn-text" id="vnText">${text}</div>
      <div class="vn-foot">
        <span class="vn-count">${sceneStep+1} / ${sceneLines.length}</span>
        <button class="btn ${last?'gold':''}" id="sceneNext" data-focus="modal">${last?T('📜 รับเควสต์'):T('ถัดไป ▶')}</button>
      </div>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
  // typewriter effect
  const tx=document.getElementById('vnText');
  tx.textContent='';
  let i=0; clearInterval(window._vnType);
  window._vnType=setInterval(()=>{
    tx.textContent=text.slice(0,++i);
    if(i%3===0) sfx('type');
    if(i>=text.length) clearInterval(window._vnType);
  }, 18);
  const advance=()=>{
    if(i<text.length){ clearInterval(window._vnType); tx.textContent=text; i=text.length; return; }
    if(sceneStep<sceneLines.length-1){ sceneStep++; renderScene(); }
    else{
      clearInterval(window._vnType);
      m.className='modal';
      closeModal();
      toast(`${T("📜 เควสต์ใหม่:")} ${sceneChapter.goal.text}`,'gold');
      routePage();
    }
  };
  document.getElementById('sceneNext').onclick=advance;
  modalFocusables();
}
function showChapterComplete(ch, reward, nextCh){
  sfx('fanfare');
  const c=CHARACTERS[ch.who];
  const m=document.getElementById('modal');
  m.innerHTML=`
    <div style="text-align:center">
      <div style="display:flex;justify-content:center">${lineIcon('party',40)}</div>
      <h3 style="justify-content:center">${T("เควสต์สำเร็จ!")}</h3>
      <div class="wine-sub" style="margin-bottom:10px">${ch.title}</div>
      <div style="width:150px;height:170px;margin:0 auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))">${charPortrait(ch.who,'happy')}</div>
    </div>
    <div class="knowledge" style="text-align:center;border-color:var(--gold);background:rgba(200,151,63,.12)">
      🎁 ${reward.text||T('ทำได้ดีมาก!')}
    </div>
    ${nextCh?`<div class="body" style="text-align:center;font-size:13px">${T("เควสต์ถัดไปกำลังมา...")}</div>`:`<div class="body" style="text-align:center;font-size:15px;font-weight:700;color:var(--wine)"><span style="display:inline-flex;vertical-align:middle">${lineIcon('trophy',18)}</span> ${T("คุณเล่นจบเนื้อเรื่องหลักแล้ว!")}<br>${T("เล่นต่อเพื่อสร้างอาณาจักรไวน์ในแบบของคุณ")}</div>`}
    <div class="row" style="justify-content:center">
      <button class="btn gold" id="doneBtn" data-focus="modal">${T("รับรางวัล")}</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
  document.getElementById('doneBtn').onclick=()=>{
    closeModal(); renderTop();
    // a newly unlocked system explainer takes priority over the next scene
    if(G._unlockExplain){
      const key=G._unlockExplain; G._unlockExplain=null;
      setTimeout(()=>showSystemIntro(key), 350);
    } else if(maybeShowEnding()){
      // final chapter complete — the ending cinematic takes over
    } else {
      setTimeout(()=>maybeShowChapterScene(), 350);
    }
    routePage();
  };
  modalFocusables();
}

function hireStaff(idx){
  const sp=STAFF_POOL[idx]; const cost=sp.salary*3;
  if(cost>G.cash){ toast(T('เงินสดไม่พอจ้าง'),'bad'); return; }
  G.cash-=cost;
  const name=sp.names[Math.floor(Math.random()*sp.names.length)];
  G.staff.push({role:sp.role, icon:sp.icon, salary:sp.salary, skill:sp.skill, name, lvl:1});
  sfx('coin');
  toast(`${name} (${sp.role}${T(") เข้าร่วมทีมแล้ว!")}`,'gold');
  checkAchievements(); renderTop(); pageStaff(); bindFocusables();
}
function trainStaff(idx){
  const s=G.staff[idx]; if(!s) return;
  if(s.lvl>=STAFF_MAX_LVL){ toast(T('ถึงระดับสูงสุดแล้ว (ระดับโลก)'),'bad'); return; }
  const nextTier=tierOf(s.lvl+1);
  const base=STAFF_POOL.find(p=>p.skill===s.skill)?.salary || s.salary;
  const cost=Math.round(base*(s.lvl===1?9:22));      // big jumps, real commitment
  if(cost>G.cash){ toast(`${T("เงินสดไม่พอ ต้องใช้")} ${fmtK(cost)}`,'bad'); return; }
  G.cash-=cost;
  s.lvl++;
  s.salary=Math.round(base*nextTier.salaryMult);
  sfx('great');
  toast(`🎓 ${s.name} ${T("เลื่อนขั้นเป็น \"")}${nextTier.t}${T("\"! (เงินเดือน")} ${fmtK(s.salary)})`,'gold');
  checkAchievements(); renderTop(); pageStaff(); bindFocusables();
}
