   flavor:'ลูกค้าประจำคนหนึ่งเป็นนักสะสม เปิดทางให้เธอเข้าถึงขวดหายาก'},
];
const RARE_IDS = RARE_UNLOCKS.map(u=>u.id);
function isRareLocked(id){
  return RARE_IDS.includes(id) && !(G.unlockedWines&&G.unlockedWines[id]);
}
function checkRareUnlocks(){
  G.unlockedWines=G.unlockedWines||{}; G.unlockSeen=G.unlockSeen||{};
  for(const u of RARE_UNLOCKS){
    if(G.unlockedWines[u.id]) continue;
    let met=false; try{ met=u.cond(G); }catch(e){ met=false; }
    if(met){
      G.unlockedWines[u.id]=true;
      // seed market stock so it can actually be bought
      const w=wineById(u.id);
      if(w){ G.stock=G.stock||{}; if(!G.stock[u.id]) G.stock[u.id]=baseStockFor(w); }
      if(!G.unlockSeen[u.id]){
        G.unlockSeen[u.id]=true;
        const nm=w?w.name:u.id;
        G.news.push({mult:1, msg:`🔓 ปลดล็อกไวน์หายาก: ${nm} — ${u.flavor}`});
        setTimeout(()=>{ sfx('levelup'); toast(`🔓 ปลดล็อก: ${nm}!`,'gold'); }, 700);
      }
    }
  }
}

/* ============================================================
   ALLOCATION — you cannot simply buy the rarest wine. A negociant
   forces you to take slow-moving stock alongside it. Unlocked by
   the story (chapter 10, "นักสะสมระดับโลก").
   ============================================================ */
const ALLOC_CHAPTER = 10;
function allocUnlocked(){ return G.chapter >= ALLOC_CHAPTER; }

const NEGOCIANTS = [
  {name:'เมซง ดูว์ปองต์',  style:'เข้มงวดเรื่องโควตา ไม่ต่อรอง'},
  {name:'กาซา แบร์นินี',   style:'ชอบผลักสต๊อกภูมิภาครองออกมาพร้อมของดี'},
  {name:'บอร์กโดซ์ เพลส',  style:'ขายเป็นลังผสม ไม่แยกขาย'},
];

// The trophy bottle you actually want, plus filler you must absorb.
function makeAllocOffer(){
  const stars = WINES.filter(w=>w.tier>=4 && !isRareLocked(w.id));
  if(!stars.length) return null;
  const star = stars[Math.floor(Math.random()*stars.length)];
  const starQty = 1 + (Math.random()<0.3?1:0);
  // filler: cheaper wines, ideally from the same region so it reads as a real book
  const pool = WINES.filter(w=>w.tier<=2 && w.id!==star.id && !isRareLocked(w.id));
  const sameRegion = pool.filter(w=>w.region===star.region);
  const src = sameRegion.length>=3 ? sameRegion : pool;
  const bundle=[];
  const nKinds = 2 + Math.floor(Math.random()*3);
  const used={};
  for(let i=0;i<nKinds && src.length;i++){
    const f = src[Math.floor(Math.random()*src.length)];
    if(used[f.id]) continue;
    used[f.id]=true;
    bundle.push({id:f.id, qty: 2 + Math.floor(Math.random()*4)});
  }
  if(!bundle.length) return null;
  // price: the star at a genuine discount, the filler at full freight
  const starPrice = (G.prices[star.id]||star.base) * starQty * 0.82;
  const fillPrice = bundle.reduce((a,b)=>a+(G.prices[b.id]||wineById(b.id).base)*b.qty, 0);
  const neg = NEGOCIANTS[Math.floor(Math.random()*NEGOCIANTS.length)];
  return {
    id: G.allocSeq++,
    negociant: neg.name,
    note: neg.style,
    wineId: star.id,
    qty: starQty,
    bundle,
    price: Math.round(starPrice + fillPrice),
    starValue: Math.round((G.prices[star.id]||star.base)*starQty),
    fillValue: Math.round(fillPrice),
    expires: G.week + 3,
  };
}

function allocBottles(o){ return o.qty + o.bundle.reduce((a,b)=>a+b.qty,0); }

function tickAllocations(){
  if(!allocUnlocked()) return;
  G.allocOffers = (G.allocOffers||[]).filter(o=>o.expires > G.week);
  if(G.allocOffers.length >= 2) return;
  if(Math.random() < 0.45){
    const o = makeAllocOffer();
    if(o){
      G.allocOffers.push(o);
      G.news.push({mult:1, msg:`📦 ${o.negociant} เสนอโควตา ${wineById(o.wineId).name} — ต้องรับไวน์พ่วงด้วย (ดูหน้าโควตา)`});
    }
  }
}

function acceptAlloc(offerId){
  const o=(G.allocOffers||[]).find(x=>x.id===offerId); if(!o) return;
  const need = allocBottles(o);
  if(cellarUsed()+need > cellarCapacity()){
    toast(`เซลลาร์ไม่พอ ต้องมีที่ว่าง ${need} ขวด`,'bad'); return;
  }
  if(o.price > G.cash){ toast('เงินสดไม่พอรับโควตานี้','bad'); return; }
  G.cash -= o.price;
  floatMoney(-o.price);
  const yr=gameYear();
  const add=(id,qty,unit)=>{
    const c=G.cellar[id];
    if(c){ sealLot(c); c.buyPrice=(c.buyPrice*c.qty+unit*qty)/(c.qty+qty); c.qty+=qty; }
    else { G.cellar[id]={qty, buyWeek:G.week, buyPrice:Math.round(unit), vintage:yr,
                         quality:vintageRating(id,yr), fake:0, suspect:0}; sealLot(G.cellar[id]); }
  };
  add(o.wineId, o.qty, o.starValue/Math.max(1,o.qty)*0.82);
  for(const b of o.bundle) add(b.id, b.qty, (G.prices[b.id]||wineById(b.id).base));
  G.allocOffers=G.allocOffers.filter(x=>x.id!==offerId);
  G.allocTaken=(G.allocTaken||0)+1;
  G.stats.bottlesBought+=need;
  normalizeCellarLots();
  sfx('cash');
  toast(`📦 รับโควตาจาก ${o.negociant} — ได้ ${wineById(o.wineId).name} ×${o.qty} พร้อมของพ่วง ${need-o.qty} ขวด`,'gold');
  closeModal(); checkAchievements(); renderTop(); routePage();
}

function passAlloc(offerId){
  G.allocOffers=(G.allocOffers||[]).filter(x=>x.id!==offerId);
  G.allocPassed=(G.allocPassed||0)+1;
  sfx('click');
  toast('ปฏิเสธโควตานี้แล้ว','');
  closeModal(); routePage();
}

/* ============================================================
   B2B CONTRACTS — a Michelin kitchen wants a fixed weekly
   delivery. Guaranteed money, but you must never come up short.
   Unlocked by the story (chapter 12, "ค่ำคืนของป้าโรซ่า").
   ============================================================ */
const CONTRACT_CHAPTER = 12;
function contractsUnlocked(){ return G.chapter >= CONTRACT_CHAPTER; }

const CHEFS = [
  {chef:'เชฟอากิระ',   rest:'Kaiseki Nine',    menu:'คอร์สปลาดิบและดาชิ',      want:{white:true}},
  {chef:'เชฟมาร์โก',   rest:'Osteria Rossa',   menu:'พาสต้าราคุและเนื้อตุ๋น',   want:{red:true}},
  {chef:'เชฟปิแอร์',   rest:'La Douzieme',     menu:'เป็ดรมควันซอสเชอร์รี่',    want:{red:true}},
  {chef:'เชฟนภา',      rest:'ห้องอาหารบ้านสวน', menu:'อาหารไทยรสจัดร่วมสมัย',   want:{white:true}},
  {chef:'เชฟเอเลน่า',  rest:'Brasa',           menu:'เนื้อย่างถ่านและผักรมควัน', want:{red:true}},
];

function makeContractOffer(){
  const c = CHEFS[Math.floor(Math.random()*CHEFS.length)];
  const pool = WINES.filter(w=>{
    if(isRareLocked(w.id)) return false;
    const white = isWhiteWine(w);
    if(c.want.white && !white) return false;
    if(c.want.red && white) return false;
    return w.tier>=2 && w.tier<=4;
  });
  if(!pool.length) return null;
  const w = pool[Math.floor(Math.random()*pool.length)];
  const perWeek = 2 + Math.floor(Math.random()*3);
  const weeks = 8;
  // pays above the current bid, locked for the whole term — that is the gamble
  const unit = Math.round((G.prices[w.id]||w.base) * (1.28 + Math.random()*0.22));
  return {
    id: G.contractSeq++,
    chef:c.chef, restaurant:c.rest, menu:c.menu,
    wineId:w.id, perWeek, weeksLeft:weeks, totalWeeks:weeks,
    price:unit, missed:0, delivered:0,
    expires: G.week + 2,
    pending:true,
  };
}

function tickContractOffers(){
  if(!contractsUnlocked()) return;
  G.contractOffers = (G.contractOffers||[]).filter(o=>o.expires > G.week);
  const active=(G.contracts||[]).length;
  if(active>=3 || G.contractOffers.length>=2) return;
  if(Math.random() < 0.35){
    const o=makeContractOffer();
    if(o){
      G.contractOffers.push(o);
      G.news.push({mult:1, msg:`🍽️ ${o.chef} แห่ง ${o.restaurant} เสนอสัญญาส่งไวน์ ${o.totalWeeks} สัปดาห์ (ดูหน้าสัญญา)`});
    }
  }
}

function signContract(offerId){
  const o=(G.contractOffers||[]).find(x=>x.id===offerId); if(!o) return;
  o.pending=false;
  // the supplier immediately sets aside enough for the first deliveries
  G.stock=G.stock||{};
  G.stock[o.wineId]=Math.max(G.stock[o.wineId]||0, o.perWeek*3);
  G.contracts=G.contracts||[];
  G.contracts.push(o);
  G.contractOffers=G.contractOffers.filter(x=>x.id!==offerId);
  sfx('great');
  toast(`✍️ เซ็นสัญญากับ ${o.chef} — ส่ง ${wineById(o.wineId).cuvee||wineById(o.wineId).name} สัปดาห์ละ ${o.perWeek} ขวด`,'gold');
  closeModal(); routePage();
}

function declineContract(offerId){
  G.contractOffers=(G.contractOffers||[]).filter(x=>x.id!==offerId);
  sfx('click'); toast('ปฏิเสธสัญญาแล้ว','');
  closeModal(); routePage();
}

// Deliveries are settled every week inside nextWeek().
function settleContracts(){
  if(!G.contracts || !G.contracts.length) return {paid:0, failed:0};
  let paid=0, failed=0;
  const keep=[];
  for(const k of G.contracts){
    const c=G.cellar[k.wineId];
    const have = c ? Math.max(0, c.qty-(c.suspect||0)) : 0;
    if(have >= k.perWeek){
      c.qty -= k.perWeek;
      sealLot(c);   // qty shrank: fake/suspect must be re-clamped under it
      if(c.qty<=0) delete G.cellar[k.wineId];
      const gain = k.price*k.perWeek;
      G.cash += gain; paid += gain;
      k.delivered += k.perWeek;
      k.weeksLeft--;
      G._weekRevenue=(G._weekRevenue||0)+gain;
    } else {
      // short delivery. The first slip is a warning; after that it costs.
      k.missed++; failed++;
      k.weeksLeft--;
      if(k.missed===1){
        G.news.push({mult:1, msg:`⚠️ ส่งไวน์ให้ ${k.restaurant} ไม่ครบสัปดาห์นี้ — เชฟให้อภัยครั้งเดียว รีบหาไวน์เพิ่ม!`});
      } else {
        const pen = Math.round(k.price*k.perWeek*0.35);
        G.cash -= pen;
        G.rep = Math.max(0, G.rep-3);
        G.news.push({mult:1, msg:`⚠️ ส่งไวน์ให้ ${k.restaurant} ไม่ครบ — เสียค่าปรับ ${fmtK(pen)} และชื่อเสียง −★3`});
      }
    }
    if(k.weeksLeft>0){ keep.push(k); }
    else {
      if(k.missed<=1){
        const bonus=Math.round(k.price*k.perWeek*(k.missed===0?1.5:0.8));
        G.cash+=bonus; G.rep+=(k.missed===0?8:4);
        G.contractsDone=(G.contractsDone||0)+1;
        G.news.push({mult:1, msg:`🏆 ส่งครบสัญญาให้ ${k.restaurant}! โบนัส ${fmtK(bonus)} + ชื่อเสียง ★8`});
      } else {
        G.contractsFailed=(G.contractsFailed||0)+1;
        G.news.push({mult:1, msg:`สัญญากับ ${k.restaurant} จบลง (ส่งขาด ${k.missed} ครั้ง)`});
      }
    }
  }
  G.contracts=keep;
  normalizeCellarLots();
  return {paid, failed};
}

/* ============================================================
   BANK — emergency loans so a cash-out player can keep playing.
   Interest is charged every week; the debt is real, but it is
   always better than a dead save.
   ============================================================ */
const LOAN_TIERS = [
  {id:'small',  amt:2500000,   rate:0.020, name:'สินเชื่อฉุกเฉิน',      desc:'ก้อนเล็ก ดอกต่ำ เหมาะกับการกู้วิกฤตระยะสั้น'},
  {id:'medium', amt:9000000,  rate:0.030, name:'สินเชื่อธุรกิจ',        desc:'ก้อนกลาง ใช้ต่อลมหายใจและกลับมาซื้อของได้อีกครั้ง'},
  {id:'large',  amt:30000000,  rate:0.042, name:'สินเชื่อขยายกิจการ',    desc:'ก้อนใหญ่ ดอกสูง ใช้เมื่อต้องพลิกเกมจริงๆ'},
];

function loanDebt(){ return (G.loans||[]).reduce((a,l)=>a+l.owed,0); }
function loanWeeklyInterest(){ return Math.round((G.loans||[]).reduce((a,l)=>a+l.owed*l.rate,0)); }

// how much the bank is willing to lend, based on what the player can back it with
function creditLimit(){
  const assets = Math.max(0, portfolioValue()) + Math.max(0, G.cash);
  const repBonus = G.rep*70000;
  return Math.max(2500000, Math.round(assets*0.85 + repBonus + 3000000));
}
function canBorrow(amt){ return loanDebt()+amt <= creditLimit(); }

function takeLoan(tierId){
  const t=LOAN_TIERS.find(x=>x.id===tierId); if(!t) return;
  if(!canBorrow(t.amt)){
    toast('วงเงินไม่พอ — ขายไวน์บางส่วนหรือลดหนี้ก่อน','bad'); return;
  }
  G.loans=G.loans||[];
  G.loans.push({id:G.loanSeq++, principal:t.amt, owed:t.amt, rate:t.rate, tookWeek:G.week});
  G.cash += t.amt;
  sfx('cash');
  toast(`🏦 อนุมัติ ${t.name} +${fmtK(t.amt)} · ดอกเบี้ย ${(t.rate*100).toFixed(1)}%/สัปดาห์`,'gold');
  closeModal(); renderTop(); routePage();
}

function repayLoan(loanId, amount){
  const l=(G.loans||[]).find(x=>x.id===loanId); if(!l) return;
  const pay=Math.min(amount, l.owed, G.cash);
  if(pay<=0){ toast('เงินสดไม่พอชำระ','bad'); return; }
  G.cash-=pay; l.owed-=pay;
  if(l.owed<=1){
    G.loans=G.loans.filter(x=>x.id!==loanId);
    sfx('great');
    toast('✅ ปิดหนี้ก้อนนี้เรียบร้อย!','gold');
  } else {
    sfx('cash');
    toast(`ชำระ ${fmtK(pay)} · เหลือหนี้ ${fmtK(l.owed)}`,'good');
  }
  renderTop(); routePage();
}

// charged inside nextWeek()
function accrueLoans(){
  if(!G.loans || !G.loans.length) return 0;
  const interest = loanWeeklyInterest();
  if(interest<=0) return 0;
  if(G.cash >= interest){
    G.cash -= interest;
    G.totalInterestPaid=(G.totalInterestPaid||0)+interest;
  } else {
    // can't pay: the unpaid interest is capitalised onto the debt
    const short = interest - Math.max(0,G.cash);
    if(G.cash>0){ G.totalInterestPaid=(G.totalInterestPaid||0)+G.cash; G.cash=0; }
    else G.cash=0;
    const per = short/G.loans.length;
    G.loans.forEach(l=>{ l.owed=Math.round(l.owed+per); });
    G.missedPayments=(G.missedPayments||0)+1;
    if(G.missedPayments%3===0 && G.rep>0){ G.rep=Math.max(0,G.rep-1); }
    toast(`⚠️ จ่ายดอกเบี้ยไม่ไหว ${fmtK(short)} ถูกทบเข้าเงินต้น`,'bad');
  }
  return interest;
}

// Offer a rescue when the player is genuinely stuck: no cash, nothing sellable.
function isStuck(){
  if(G.cash > 0) return false;
  const sellable = Object.keys(G.cellar||{}).some(id=>{
    const c=G.cellar[id]; return c && c.qty>0 && (c.qty-(c.suspect||0))>0;
  });
  return !sellable;
}

function weeklyCosts(){ return weeklySalaries() + weeklyRent() + (G.cellarInsured?insuranceWeekly():0); }

// Renders a term with a small "?" affordance that reveals its definition.
function term(key, label){
  const g=GLOSSARY[key]; if(!g) return label||key;
  return `<span class="gloss" data-gloss="${key}" tabindex="0" role="button"
    aria-label="${g.t}: ${g.d}">${label||g.t}<span class="gloss-q">?</span></span>`;
}

function showGlossary(key){
  const g=GLOSSARY[key]; if(!g) return;
  const m=document.getElementById('modal');
  m.innerHTML=`
    <div style="text-align:center;margin-bottom:8px">
      <div style="display:flex;justify-content:center">${lineIcon('book',30)}</div>
      <h3 style="justify-content:center">${g.t}</h3>
    </div>
    <p style="font-size:14px;line-height:1.8;color:var(--ink);text-align:center;margin-bottom:16px">${g.d}</p>
    <div class="row" style="justify-content:center"><button class="btn gold big" id="glClose" data-focus="modal">เข้าใจแล้ว</button></div>`;
  document.getElementById('modalBg').classList.add('show');
  document.getElementById('glClose').onclick=closeModal;
  modalFocusables();
}

// Ending: plays once the final chapter is complete.
function buildEndingCards(){
  const worth=Math.round(G.cash+portfolioValue()-loanDebt());
  const rare=Object.keys(G.unlockedWines||{}).length;
  return [
    {art:'cellarwide', text:'หลายปีผ่านไป เซลลาร์ที่เคยเงียบเหงา<br>กลับมามีชีวิตอีกครั้ง'},
    {art:'shopnight', text:`คุณเสิร์ฟลูกค้าไปแล้ว ${(G.stats?.served||0).toLocaleString()} คน<br>แต่ละคนมีค่ำคืนที่จำได้ไม่ลืม`},
    {art:'vineyard', text:`ไวน์ในตำนานที่คุณตามหาจนพบ: ${rare}/8 ขวด<br>มูลค่ากิจการ ${fmtK(worth)}`},
    {art:'letter', text:'"ไวน์ที่ไม่ได้เปิดก็เป็นแค่ของเหลวในแก้ว"<br>คำของอาจารย์ยังก้องอยู่'},
    {art:'toast', text:'คืนนี้คุณเปิดขวดที่เก็บไว้นานที่สุด<br>ไม่ได้ขาย ไม่ได้ประเมินราคา — แค่ดื่ม'},
    {art:'title', text:'', ending:true},
  ];
}

    const x=((i*131+seed*47)%600), y=((i*79+seed*23)%210), r=0.6+((i*seed)%5)*0.35;
    const dur=(2.5+((i*seed)%4)).toFixed(1);
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="#F4E2B0"><animate attributeName="opacity" values="${0.2+(i%3)*0.15};0.85;${0.2+(i%3)*0.15}" dur="${dur}s" begin="${(i%5)*0.4}s" repeatCount="indefinite"/></circle>`;

  const A={

        <linearGradient id="vHill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A7A44"/><stop offset="1" stop-color="#5A4A28"/></linearGradient>
      </defs>
      <rect width="600" height="340" fill="url(#vSky)"/><rect width="600" height="340" fill="url(#vSun)"/>

      <path d="M0 168 Q 200 150 400 170 T 600 172 L600 240 L0 240z" fill="url(#vHill)"/>
      ${Array.from({length:9},(_,r)=>`<path d="M-30 ${212+r*15} Q 300 ${196+r*15} 630 ${216+r*15}" fill="none" stroke="#4A3A22" stroke-width="${2.6-r*0.14}" opacity="${0.8-r*0.06}"/>`).join('')}
      ${Array.from({length:22},(_,i)=>{const x=8+i*28,y=206+((i%3)*6);return `<line x1="${x}" y1="${y}" x2="${x}" y2="${y+30}" stroke="#3E3020" stroke-width="3"/><circle cx="${x}" cy="${y-4}" r="6.5" fill="#6E3A52"/><circle cx="${x-3}" cy="${y}" r="4.5" fill="#7E4560" opacity="0.9"/>`;}).join('')}

let csCards=[], csStep=0, csIsEnding=false, csIsReplay=false;
function playCutscene(cards, isEnding, isReplay){
  csCards=cards; csStep=0; csIsEnding=!!isEnding; csIsReplay=!!isReplay;
  // A cutscene is a moment — give it music even if ambient BGM is off, then
  // restore whatever the player had afterwards.
  try{
    csPrevBgm = DISP.bgm;
    const ac=audioCtx();
    if(ac){ if(ac.state==='suspended') ac.resume(); if(!BGM) startBGM(); }
  }catch(e){}
  renderCutscene();
}
let csPrevBgm=false;
function endCutsceneMusic(){
  try{ if(!csPrevBgm && BGM) stopBGM(); }catch(e){}
}
function renderCutscene(){
  const card=csCards[csStep];
  const last=csStep>=csCards.length-1;
  const m=document.getElementById('modal');
  m.className='modal cs-modal';
  const isTitle = card.art==='title';
  m.innerHTML=`
    <div class="cs-stage">
      <div class="cs-art" id="csArt">${cutsceneArt(card.art)}</div>
      <div class="cs-vignette"></div>
      ${isTitle?`<div class="cs-titlecard">
          <div class="cs-title-main">Cellar &amp; Vine</div>
          <div class="cs-title-sub">${csIsEnding?'จบบริบูรณ์ · ขอบคุณที่ร่วมเดินทาง':'ร้านไวน์ &amp; เซลลาร์'}</div>
        </div>`
        :`<div class="cs-narr" id="csNarr">${card.text}</div>`}
    </div>
    <div class="cs-foot">
      <span class="cs-count">${csStep+1} / ${csCards.length}</span>
      <div class="row" style="gap:8px">
        ${!last?`<button class="btn ghost" id="csSkip" data-focus="modal">ข้าม</button>`:''}
        <button class="btn ${last?'gold big':''}" id="csNext" data-focus="modal">${last?(csIsEnding?'จบเกม':'เริ่มเรื่องราว'):'ถัดไป ▶'}</button>
      </div>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
  // fade the panel in
  const art=document.getElementById('csArt');
  if(art){ art.style.opacity='0'; requestAnimationFrame(()=>{ art.style.opacity='1'; }); }
  const nr=document.getElementById('csNarr');
  if(nr){ nr.style.opacity='0'; setTimeout(()=>{ nr.style.opacity='1'; }, 260); }
  if(isTitle) sfx('fanfare'); else sfx('page');
  const finish=()=>{
    closeModal();
    endCutsceneMusic();
    if(csIsReplay){ renderTop(); routePage(); return; }   // just watching it again
    if(csIsEnding){ G.endingSeen=true; saveGame(true); renderTop(); routePage(); }
    else {
      G.introSeen=true; saveGame(true);
      // new players get the tutorial first, then chapter 0's scene
      if(!G.tutDone) setTimeout(showTutorial, 300);
      else setTimeout(()=>maybeShowChapterScene(), 300);
    }
  };
  const next=document.getElementById('csNext');
  if(next) next.onclick=()=>{ if(last) finish(); else { csStep++; renderCutscene(); } };
  const skip=document.getElementById('csSkip');
  if(skip) skip.onclick=finish;
  modalFocusables();
}

// Show the ending once the last chapter has been completed.
function maybeShowEnding(){
  if(G.endingSeen) return false;
  if(G.chapter < CHAPTERS.length) return false;
  G.endingSeen=true;
  saveGame(true);
  setTimeout(()=>playCutscene(buildEndingCards(), true), 400);
  return true;
}

  {icon:'shield', t:'ภัยในเซลลาร์ — เก็บไวน์ก็มีความเสี่ยง', d:'ตั้งแต่บทที่ 7 ไวน์ที่เก็บไว้อาจเจอภัย: <b>ไฟดับ</b> (อุณหภูมิพุ่ง), <b>ท่อแตก</b> (น้ำท่วม), <b>จุกเสีย</b> (ออกซิไดซ์), <b>แมลงกัดฉลาก</b><br><br>เมื่อเกิดเหตุ เลือกได้ว่า<b>จ่ายจัดการทันที</b> (ปลอดภัย) หรือ<b>ปล่อยไว้</b> (เสี่ยงเสียหาย)<br><br>ป้องกันได้ 2 ทางในหน้าร้าน: <b>บำรุงระบบควบคุมอุณหภูมิ</b> (ยิ่งดูแลดี ยิ่งเกิดเหตุน้อย) และ<b>ทำประกัน</b> (ลดโอกาส + จ่ายคืน 70%) — ยิ่งเก็บไวน์แพงเยอะ ยิ่งควรป้องกัน'},
  {icon:'search', t:'วิกเตอร์ ครูซ — คู่แข่งตัวจริง', d:'หลังเจอกันในเนื้อเรื่อง (บท 3) วิกเตอร์จะ<b>กว้านไวน์ชั้นดี (tier 4+) ในตลาดตัดหน้าคุณ</b>ทุกสัปดาห์ — ของดีจะหมดชั้นเร็ว รีบซื้อก่อน<br><br>ยิ่งคุณแย่งไวน์ดีๆ มาได้ <b>ความเป็นคู่แข่งยิ่งร้อนแรง</b> เขาจะสู้หนักขึ้นทั้งในตลาดและ<b>ในการประมูล</b> — แต่การเอาชนะเขาในงานประมูลก็ยิ่งสะใจ<br><br>ดูระดับความดุเดือดได้ที่แถบบนหน้าตลาด'},
  {icon:'grape', t:'โรเซ่ และเขตไวน์ทั่วโลก', d:'ตอนนี้เกมมีไวน์ <b>207 ขวดจาก 46 เขต</b> ครอบคลุมทั้งคลาสสิกและแหล่งใหม่ที่กำลังมาแรง — โพรวองซ์ · โตกาจ · ซานโตรีนี · ปริโอราต · โมเซล · เอตนา · วาเคา · บารอสซา · เซ็นทรัลโอทาโก · หนิงเซี่ย · ยามานาชิ และอีกมาก<br><br>🌸 <b>โรเซ่เป็นประเภทที่สาม</b> แยกจากแดงและขาว มีตัวกรองของตัวเองในหน้าตลาด<br><br>จุดเด่นของโรเซ่คือ<b>เข้ากับอาหารได้แทบทุกจาน</b> — ไม่เคยได้คะแนนจับคู่สูงสุด แต่ก็แทบไม่เคยพลาดเลย เหมาะเมื่อไม่แน่ใจว่าลูกค้าสั่งอะไร หรือคลังเหลือไม่ตรงธีม'},
  {icon:'question', t:'ไม่รู้จักศัพท์ไวน์? แตะดูได้เลย', d:'คำเฉพาะทางในเกมจะมี<b>ไอคอน ? เล็กๆ</b> ต่อท้าย แตะแล้วมีคำอธิบายสั้นๆ เด้งขึ้นมาทันที ไม่ต้องออกจากหน้าที่เล่นอยู่<br><br>ครอบคลุมคำอย่าง Grand Cru · Premier Cru · Cru Bourgeois · En Primeur · Vintage · Terroir · Tannin · Négociant และอีกหลายคำ<br><br>💡 ถ้าเงินสดใกล้หมด <b>มีอา แทน</b> โบรกเกอร์จะโผล่มาเตือนพร้อมบอกทางออก (ขายขวดไหนดี · กู้ได้เท่าไร · ลดค่าใช้จ่ายยังไง) ก่อนที่จะสายเกินแก้'},
  {icon:'search', t:'กรองและเรียงลำดับให้เจอไวน์เร็วขึ้น', d:'ทั้งหน้า <b>ตลาด</b> และ <b>เซลลาร์</b> ใช้ปุ่มกดแทนเมนูดรอปดาวน์ แตะครั้งเดียวได้เลย ไม่ต้องเลื่อนหา<br><br>🔍 <b>ตลาด</b>: กรองตามระดับชั้น (Grand Cru → Table) · ประเภท (แดง/ขาว) · ภูมิภาค · เฉพาะที่มีในคลัง · <b>เฉพาะที่ซื้อไหว</b> (ซ่อนขวดที่เงินไม่พอ) แล้วเรียงตามราคา/คะแนน/ความเปลี่ยนแปลง<br><br>🍷 <b>เซลลาร์</b>: กรองระดับชั้นและภูมิภาค เรียงตามมูลค่า กำไร% อายุบ่ม ความพร้อมดื่ม หรือ vintage<br><br>ปุ่ม <b>ล้างตัวกรอง</b> จะโผล่มาเมื่อมีตัวกรองทำงานอยู่ กดครั้งเดียวกลับมาดูทั้งหมด<br><br>💡 การ์ดไวน์แต่ละใบมีป้ายระดับชั้นมุมขวาบน (GC / 1er / VIL / CB / TBL) และชื่อภูมิภาคใต้ชื่อไวน์ ดูปราดเดียวรู้ว่าหายากแค่ไหน'},
  {icon:'bell', t:'เสียงและเพลงประกอบ', d:'เกมมี<b>เอฟเฟกต์เสียง</b>ครบทุกจังหวะ — เปิดจุกไวน์ รินไวน์ เคาะค้อนประมูล เสียงเงิน และแตรแฟนแฟร์เมื่อทำสำเร็จ<br><br>🎵 <b>เพลงประกอบ (BGM)</b> เป็นดนตรีบรรยากาศแบบสังเคราะห์สดๆ — คอร์ดอุ่นๆ กับทำนองเบาๆ ให้ฟีลร้านไวน์หรู วนไม่ซ้ำ ปรับระดับเสียงได้<br><br>เปิด/ปิดเสียงและเพลงแยกกันได้ที่หน้า <b>ตั้งค่า</b> · เพลงจะเริ่มหลังแตะหน้าจอครั้งแรก (ข้อจำกัดของเบราว์เซอร์) ทั้งหมดสร้างในเกม ไม่ต้องโหลดไฟล์เสียง เหมาะกับเน็ตในรถ'},
  {icon:'chart', t:'ลงทุนบ่มไวน์ให้ได้กำไร (พอร์ตระยะยาว)', d:'ไม่จำเป็นต้องขายไวน์ทุกขวดในร้าน — <b>ไวน์ชั้นดี (tier 4-5) ยิ่งเก็บนานยิ่งมีมูลค่า</b> ขวดกร็องด์ครูที่บ่ม 2 ปีอาจมีมูลค่าเพิ่ม +30% ถึง +150% ขึ้นกับจังหวะตลาด<br><br>📈 <b>ตลาดรองเป็นสองทาง</b> (มีขึ้นมีลง วิ่งกลับเข้าหาราคายุติธรรมเสมอ) — กลยุทธ์คือ <b>ซื้อตอนราคาตก เก็บบ่ม ขายตอนพีค</b> ดูกราฟราคาย้อนหลังและข่าวเพื่อจับจังหวะ<br><br>ไวน์ tier ต่ำ (1-2) บ่มแล้วไม่ค่อยขึ้น (เหมาะดื่ม/ขายเร็ว) แต่ไวน์แพงคือสินทรัพย์ลงทุนจริง — แบ่งเซลลาร์ส่วนหนึ่งเก็บของดีไว้ยาวๆ ดูกำไร/ขาดทุนแต่ละขวดได้ที่หน้า <b>พอร์ต</b><br><br>💡 กระจายความเสี่ยง: อย่าทุ่มเงินสดทั้งหมดกับการเก็บของ ต้องมีสภาพคล่องจ่ายค่าเช่า/เงินเดือนด้วย'},
  {icon:'bulb', t:'เหตุการณ์พิเศษคืออะไร? (ปลดล็อกบทที่ 5)', d:'เป็นครั้งคราวจะมี<b>เหตุการณ์ให้เลือกตัดสินใจ</b>โผล่มาหลังจบสัปดาห์ เช่น มรดกตกทอด (ซื้อเหมาไวน์เสี่ยงของปลอม) · นักวิจารณ์แวะเยี่ยม (เปิดขวดดีเลี้ยงเพื่อรีวิว) · ผู้ขายร้อนเงิน (ไวน์ลด 35%) · งานการกุศล · เด็กฝึกงาน<br><br>แต่ละเหตุการณ์มีทางเลือกที่ให้ผลต่างกัน — บางอันได้กำไร บางอันเสี่ยง ทำให้ทุกรอบการเล่นไม่เหมือนกัน คิดให้ดีก่อนเลือก เพราะบางโอกาสมาแล้วไม่มาอีก'},
  {icon:'compass', t:'จัดการเซลลาร์ใหญ่ๆ ยังไงให้เร็ว?', d:'เมื่อคลังเริ่มใหญ่ ใช้ <b>ตัวกรองอัจฉริยะ</b> ในหน้าเซลลาร์: แตะชิประดับชั้น (Grand Cru / Premier Cru / Village / Cru Bourgeois / Table) เพื่อดูเฉพาะกลุ่ม หรือเลือกภูมิภาคจากเมนู<br><br>ด้านบนมี<b>สรุปเซลลาร์</b>: มูลค่ารวม กำไร/ขาดทุน และจำนวนขวดพร้อมดื่ม เห็นภาพรวมได้ทันที<br><br>เวลาซื้อ/ขาย ใช้<b>แถบเลื่อน (slider)</b> หรือปุ่มลัด (1/5/10/ซื้อสูงสุด/ขายทั้งหมด) เพื่อปรับจำนวนทีเดียว ไม่ต้องกดทีละครั้ง — เหมาะกับจอสัมผัสในรถ'},
  {icon:'🎉', t:'งานปาร์ตี้ประจำเดือนคืออะไร? (ปลดล็อกบทที่ 10)', d:'ราวเดือนละครั้ง ลูกค้ารายใหญ่ (โรงแรม บริษัท งานแต่ง) จะมาจัดงานและ<b>ซื้อไวน์จำนวนมากทีเดียว</b> เขาไม่สนการจับคู่ให้เป๊ะ — ขอแค่ปริมาณตามธีม (สีไวน์ + เพดาน tier)<br><br>💰 <b>นี่คือทางระบายไวน์ถูกในช่วงท้ายเกม:</b> แทนที่จะรอขายทีละขวดให้ลูกค้างบน้อย คุณส่งไวน์ tier 1-3 เข้างานทีละหลายสิบขวดในราคา +15-40% จากตลาด พร้อมโบนัสเมื่อส่งครบ<br><br>เก็บไวน์ถูกๆ ที่ซื้อมาเยอะๆ ไว้รองานได้เลย ยิ่งชื่อเสียงสูง งานยิ่งใหญ่ (ต้องการไวน์มากขึ้นและจ่ายดีขึ้น) มีเวลา 3 สัปดาห์ต่องาน · ส่งไวน์ต้องสงสัยเข้างานไม่ได้'},
  {icon:'🦄', t:'ไวน์หายากในตำนานปลดล็อกยังไง?', d:'ขวดที่หายากที่สุด 8 ตัวในเกมไม่มีขายในตลาดตั้งแต่แรก คุณต้องพิสูจน์ตัวเองก่อนถึงจะซื้อได้ แต่ละขวดปลดล็อกด้วยความสำเร็จคนละแบบ:<br><br>🍷 จับคู่สมบูรณ์แบบ 25 ครั้ง · ชื่อเสียง ★150 · ส่งครบสัญญาร้านอาหาร 3 ฉบับ · ตรวจแล็บ 8 ครั้ง · รับโควตาพ่วง 5 ครั้ง · มูลค่าเซลลาร์ ฿20M · เดินเรื่องถึงบทที่ 16 · มีลูกค้าประจำ 8 คน<br><br>ดูความคืบหน้าทั้งหมดได้ที่หน้า "ธุรกิจ" — พอปลดล็อกแล้ว ขวดจะโผล่ในตลาดเหมือนไวน์ทั่วไป (แต่ยังหายากและสต๊อกน้อยมาก) ออกแบบให้เป็นเป้าหมายระยะยาวที่ผลักดันให้คุณลองเล่นทุกระบบในเกม'},
  {icon:'📦', t:'โควตาพ่วงสินค้าคืออะไร? (ปลดล็อกบทที่ 11)', d:'ไวน์หายากระดับกร็องด์ครูไม่ได้ขายให้ใครก็ได้ พ่อค้าคนกลาง (négociant) จะบังคับ "ขายพ่วง" — อยากได้ของดี 1-2 ขวด ต้องรับไวน์ระดับรองไปด้วยหลายขวด<br><br>ราคารวมมักถูกกว่าซื้อแยก แต่คุณต้องคิดให้ดี 3 อย่าง: <b>เงินสด</b>จมไปเท่าไหร่ · <b>พื้นที่เซลลาร์</b>พอไหม · แล้วจะ<b>ระบายของพ่วง</b>ออกหน้าร้านยังไงโดยไม่ขาดทุน<br><br>ของพ่วงมักเป็นไวน์ tier 1-2 ที่ขายออกช้า ถ้ารับทุกโควตาโดยไม่คิด เซลลาร์จะเต็มไปด้วยของขายไม่ออกและเงินสดหมด — ปฏิเสธเป็นก็สำคัญพอๆ กับรับเป็น'},
  {icon:'🍽️', t:'สัญญาส่งร้านอาหารคืออะไร? (ปลดล็อกบทที่ 13)', d:'เชฟระดับมิชลินจะเสนอสัญญาส่งไวน์ต่อเนื่อง 8 สัปดาห์ ในราคาคงที่ที่สูงกว่าตลาด ณ วันเซ็น<br><br><b>ข้อดี:</b> รายได้แน่นอนทุกสัปดาห์ ไม่ต้องลุ้นลูกค้าหน้าร้าน ส่งครบทั้งสัญญาได้โบนัสก้อนใหญ่ + ชื่อเสียง ★8<br><br><b>ข้อเสีย:</b> ราคาล็อกไว้แล้ว ถ้าราคาตลาดพุ่งขึ้นคุณก็ต้องกัดฟันซื้อของแพงมาส่ง และถ้าส่งไม่ครบ ครั้งแรกเชฟให้อภัย แต่ครั้งต่อไปโดนค่าปรับ 35% และเสียชื่อเสียง −★3<br><br><b>เคล็ดลับ:</b> กันไวน์ในสัญญาไว้อย่าเอาไปขายหน้าร้าน และตุนไว้อย่างน้อย 2 เท่าของยอดส่งต่อสัปดาห์เสมอ'},

/* Init prices + momentum */
function initPrices(){
  WINES.forEach(w=>{
    let p = w.base;
    let h=[p];
    for(let i=0;i<23;i++){ p = p*(1+(Math.random()-.45)*w.vol); h.unshift(Math.round(p)); }

    G.prices[w.id] = h[h.length-1];
    G.momentum[w.id] = 0;

const BASE_YEAR = 2018;
function gameYear(){ return BASE_YEAR + Math.floor((G.week-1)/12); }

// Each region gets a weather outcome per year, which drives that year's vintage quality.
const WEATHER=[
  {k:'perfect', t:'ปีทอง', d:'อากาศสมบูรณ์แบบ องุ่นสุกงอมพอดี', mod:14, c:'var(--gold)'},
  {k:'warm',    t:'ปีอบอุ่น', d:'แดดจัด ผลผลิตเข้มข้น', mod:8,  c:'var(--sage-deep)'},
  {k:'normal',  t:'ปีปกติ', d:'สภาพอากาศทั่วไป', mod:3,  c:'var(--sky)'},
  {k:'rain',    t:'ปีฝนชุก', d:'ฝนตอนเก็บเกี่ยว องุ่นเจือจาง', mod:-4, c:'var(--ink-soft)'},
  {k:'frost',   t:'ปีน้ำค้างแข็ง', d:'น้ำค้างแข็งทำลายตาอ่อน ผลผลิตน้อย', mod:-2, c:'var(--down)'},
];
// deterministic per region+year so it is stable across sessions and saves
function regionWeather(region, year){
  let h=0; const s='w:'+region+':'+year;
  for(let i=0;i<s.length;i++) h=(h*33+s.charCodeAt(i))>>>0;
  const r=h%100;
  if(r<12) return WEATHER[0];
  if(r<34) return WEATHER[1];
  if(r<68) return WEATHER[2];
  if(r<88) return WEATHER[3];
  return WEATHER[4];
}
// Frost years reduce supply, which lifts prices for that region
function weatherSupplyEffect(region, year){
  const w=regionWeather(region,year);
  return w.k==='frost' ? 1.06 : w.k==='rain' ? 0.98 : 1.0;
}
function vintageRating(wid, year){
  const w=wineById(wid);
  let h=0; const s=wid+':'+year;
  for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; }
  const r=(h%100)/100;
  const base = 82 + r*12;                       // 82..94 intrinsic
  const wx = w? regionWeather(w.region, year).mod : 0;
  return Math.max(78, Math.min(100, Math.round(base + wx)));
}
function vintageLabel(rating){
  if(rating>=97) return {t:'ปีทอง', c:'var(--gold)'};
  if(rating>=93) return {t:'ยอดเยี่ยม', c:'var(--sage-deep)'};
  if(rating>=88) return {t:'ดี', c:'var(--sky)'};
  return {t:'ปานกลาง', c:'var(--ink-soft)'};
}

function cellarCapacity(){ return 20 + G.upgrades.cellarCap*15; }
function cellarUsed(){ return Object.values(G.cellar).reduce((s,c)=>s+c.qty,0); }
function primeurReserved(){ return Object.values(G.primeur||{}).reduce((s,p)=>s+p.qty,0); }
function cellarFreeForPrimeur(){ return Math.max(0, cellarCapacity() - cellarUsed() - primeurReserved()); }
function seatsPerWeek(){ return 2 + G.upgrades.seats + Math.floor(staffBonus('service')/2); }

function portfolioValue(){
  let v=0;
  for(const id in G.cellar){ v += G.prices[id]*G.cellar[id].qty * agingMult(id); }
  for(const id in G.primeur){ v += G.primeur[id].buyPrice*G.primeur[id].qty*1.1; }
  return v;
}

// aging bonus: older = more valuable (up to a cap), better with cellar upgrade
/* ============================================================
   DRINKING WINDOW — wines mature, peak, then decline
   ============================================================ */
// Cellaring potential from structure: tannin + acid + tier drive longevity.
function agingPotential(w){
  const t=w.tier||3, tan=w.tannin??3, ac=w.acid??4;
  return Math.round(6 + t*3.2 + tan*1.1 + ac*0.9);   // ~12..34 weeks
}
// Where a lot sits in its life: young → peak → late → old
function drinkWindow(id){
  const w=wineById(id), c=G.cellar[id];
  if(!c||!w) return {state:'young', pct:0, label:'—', mult:1, until:0};
  const age=G.week-c.buyWeek;
  const pot=agingPotential(w);
  const peakStart=Math.round(pot*0.45), peakEnd=pot;
  const pct=Math.min(1.6, age/Math.max(1,peakEnd));
  if(age<peakStart)     return {state:'young', pct, label:'ยังอ่อน',    mult:1.00, until:peakStart-age};
  if(age<=peakEnd)      return {state:'peak',  pct, label:'พร้อมดื่ม',  mult:1.12, until:peakEnd-age};
  if(age<=peakEnd*1.45) return {state:'late',  pct, label:'เลยจุดพีค',  mult:0.97, until:0};
  return {state:'old', pct, label:'เสื่อมสภาพ', mult:0.85, until:0};
}

function agingMult(id){
  const c = G.cellar[id]; if(!c) return 1;
  const age = G.week - c.buyWeek;
  const cellarQ = 1 + G.upgrades.cellarCap*0.02;
  const w = wineById(id);
  // Fine wine appreciates more, and for longer, than everyday bottles — so a
  // patiently cellared Grand Cru is a genuine investment, not just stock to
  // serve. Higher tiers get a steeper curve and a higher ceiling, which makes
  // the portfolio / long-hold play matter alongside the weekly shop grind.
  const tier = w ? w.tier : 3;
  const rate = 0.007 + (tier-3)*0.0018;              // tier1 ~0.004, tier5 ~0.014 per week
  const ceiling = 0.35 + (tier-1)*0.11;              // tier1 +0.35, tier5 +0.79 max
  const m = 1 + Math.min(age*rate*cellarQ, ceiling);
  // maturity curve modifies value: peak bottles fetch more, tired ones less
  return m * drinkWindow(id).mult;
}
function wineById(id){ return WINES.find(w=>w.id===id); }
// Remove lots that hold no bottles. sealLot() clamps a corrupt lot to qty 0 but
// deliberately leaves it in place (callers may be mid-iteration); without this
// sweep such a lot lingers and renders as an empty card in the cellar.
function pruneEmptyLots(){
  for(const id in G.cellar){
    const c=G.cellar[id];
    if(!c || !(c.qty>0)) delete G.cellar[id];
  }
}

function pruneMissingWines(){
  const exists=id=>WINES.some(w=>w.id===id);
  for(const id in G.cellar) if(!exists(id)) delete G.cellar[id];
  for(const id in G.primeur) if(!exists(id)) delete G.primeur[id];
  for(const id in G.stock) if(!exists(id)) delete G.stock[id];
  if(Array.isArray(G.contracts)) G.contracts = G.contracts.filter(k=>exists(k.wineId));
  if(Array.isArray(G.contractOffers)) G.contractOffers = G.contractOffers.filter(k=>exists(k.wineId));
  if(Array.isArray(G.allocOffers)) G.allocOffers = G.allocOffers.filter(o=>exists(o.wineId) && (o.bundle||[]).every(b=>exists(b.id)));
  if(G.auction && !exists(G.auction.id)) G.auction=null;
}

/* ============================================================
   MARKET DEPTH — cycles, regional trends, bubbles, liquidity
   ============================================================ */
// Macro regime the whole market sits in; shifts every ~10-18 weeks.
const REGIMES=[
  {k:'bull',    t:'ตลาดกระทิง',   ic:'📈', drift:+0.012, vol:1.0,  note:'เงินไหลเข้าไวน์สะสม ราคาขาขึ้นทั้งตลาด'},
  {k:'calm',    t:'ตลาดทรงตัว',   ic:'😐', drift:+0.001, vol:0.75, note:'ซื้อขายเบาบาง ราคาแกว่งน้อย'},
  {k:'bear',    t:'ตลาดหมี',      ic:'📉', drift:-0.011, vol:1.15, note:'นักลงทุนถอนตัว ราคาปรับฐานทั้งกระดาน'},
  {k:'volatile',t:'ตลาดผันผวน',   ic:'⚡', drift:+0.002, vol:1.75, note:'ข่าวสะพัด ราคาเหวี่ยงแรงทั้งสองทาง'},
];
function currentRegime(){ return REGIMES.find(r=>r.k===(G.regime||'calm'))||REGIMES[1]; }
function tickRegime(){
  G.regimeWeeksLeft=(G.regimeWeeksLeft||0)-1;
  if(G.regimeWeeksLeft>0) return;
  const prev=G.regime;
  // transitions are biased so bull rarely flips straight to bear
  const table={
    bull:     ['bull','calm','calm','volatile','bear'],
    calm:     ['calm','bull','bear','volatile','calm'],
    bear:     ['bear','calm','calm','bull','volatile'],
    volatile: ['calm','bull','bear','volatile','calm'],
    undefined:['calm','bull','calm','bear','volatile'],
  };
  const opts=table[prev]||table.calm;
  G.regime=opts[Math.floor(Math.random()*opts.length)];
  G.regimeWeeksLeft=10+Math.floor(Math.random()*9);
  if(G.regime!==prev && G.week>1){
    const r=currentRegime();
    G.news.push({msg:`${r.ic} ภาวะตลาดเปลี่ยนเป็น "${r.t}" — ${r.note}`, id:null, mult:1});
    sfx('alert');
  }
}
// Slow-moving regional fashion: each region drifts in and out of favour.
function tickRegionTrends(){
  G.regionTrend=G.regionTrend||{};
  const regions=[...new Set(WINES.map(w=>w.region))];
  regions.forEach(rg=>{
    const cur=G.regionTrend[rg]||0;
    // mean-reverting random walk in [-1, 1]
    const next=Math.max(-1, Math.min(1, cur*0.88 + (Math.random()-0.5)*0.34));
    G.regionTrend[rg]=next;
  });
  // occasionally announce a strong trend
  const hot=regions.filter(r=>G.regionTrend[r]>0.55);
  const cold=regions.filter(r=>G.regionTrend[r]<-0.55);
  if(hot.length && Math.random()<0.35){
    const r=hot[Math.floor(Math.random()*hot.length)];
    G.news.push({msg:`🔥 ${r} กำลังเป็นที่ต้องการอย่างมากในหมู่นักสะสม`, region:r, mult:1.03, id:null});
  }
  if(cold.length && Math.random()<0.28){
    const r=cold[Math.floor(Math.random()*cold.length)];
    G.news.push({msg:`🧊 ความสนใจใน ${r} ซบเซาลง นักลงทุนหันไปที่อื่น`, region:r, mult:0.98, id:null});
  }
}
// Bubbles: a wine that has run up too fast can pop.
function tickBubbles(){
  G.bubble=G.bubble||{};
  WINES.forEach(w=>{
    const h=G.priceHist[w.id]; if(!h||h.length<6) return;
    const ratio=G.prices[w.id]/h[Math.max(0,h.length-6)];
    if(ratio>1.55 && !G.bubble[w.id] && Math.random()<0.30){
      G.bubble[w.id]={since:G.week};
    }
    if(G.bubble[w.id]){
      const age=G.week-G.bubble[w.id].since;
      // the longer it stays inflated the more likely the correction
      if(Math.random() < 0.14+age*0.06){
        const drop=0.72+Math.random()*0.14;
        G.prices[w.id]=Math.round(G.prices[w.id]*drop);
        G.news.push({msg:`💥 ฟองสบู่แตก! ${w.name} ดิ่งลง ${Math.round((1-drop)*100)}% หลังราคาพุ่งเกินจริง`, id:w.id, mult:1});
        delete G.bubble[w.id];
        sfx('crack');
      } else if(age>6){ delete G.bubble[w.id]; }
    }
  });
}
// Liquidity: rare wines are harder to move — affects spread already, plus
// large sells push the price down (market impact).
function marketImpact(id, qty){
  const w=wineById(id);
  const depth = 6 + (6-w.tier)*4;          // tier5 ~10 bottles deep, tier1 ~26
  const impact = Math.min(0.22, (qty/depth)*0.10);
  return impact;
}

const NEWS_EVENTS = [
  {w:22, f:w=>({mult:1+(0.10+Math.random()*0.20), msg:`🏆 ${w.name} คว้า ${Math.min(100,w.score+1)} คะแนนเต็มจากนักวิจารณ์ — ราคาพุ่งแรง!`, id:w.id})},
  {w:18, f:w=>({mult:1-(0.08+Math.random()*0.16), msg:`📉 คลังไวน์ใหญ่ทิ้งสต๊อก ${w.name} เข้าตลาด — ราคาย่อตัว`, id:w.id})},
  {w:14, f:w=>({mult:1+(0.06+Math.random()*0.12), region:w.region, msg:`🌏 กระแสนักสะสมเอเชียดันไวน์ ${w.region} ทั้งภูมิภาคร้อนแรง`, id:null})},
  {w:10, f:w=>({mult:1-(0.05+Math.random()*0.10), region:w.region, msg:`💱 ค่าเงินผันผวน กดดันตลาด ${w.region} ทั้งกลุ่ม`, id:null})},
  {w:8,  f:w=>({mult:1+(0.14+Math.random()*0.22), msg:`🔥 ประมูล ${w.name} ที่ฮ่องกงทำสถิติราคาใหม่!`, id:w.id})},
  {w:8,  f:w=>({mult:1-(0.12+Math.random()*0.14), msg:`⚠️ ข่าวลือขวดปลอม ${w.name} ระบาด — ความเชื่อมั่นสั่นคลอน`, id:w.id})},
  {w:6,  f:w=>({mult:1+(0.05+Math.random()*0.08), region:w.region, msg:`☀️ รายงานสภาพอากาศดีเยี่ยม คาด vintage ${w.region} ปีนี้ยอดเยี่ยม`, id:null})},
];
function pickNewsWine(){ return WINES[Math.floor(Math.random()*WINES.length)]; }
function tickMarket(){
  G.news=[];
  tickRegime();
  tickRegionTrends();
  const RG=currentRegime();
  const nEvents = 1 + (Math.random()<0.4?1:0) + (Math.random()<0.15?1:0);
  const totW = NEWS_EVENTS.reduce((s,e)=>s+e.w,0);
  for(let k=0;k<nEvents;k++){
    let r=Math.random()*totW, pick=NEWS_EVENTS[0];
    for(const e of NEWS_EVENTS){ r-=e.w; if(r<=0){pick=e;break;} }
    const w=pickNewsWine();
    const ev=pick.f(w);
    G.news.push(ev);
    G.newsLog.unshift({week:G.week, msg:ev.msg});
  }
  if(G.newsLog.length>40) G.newsLog.length=40;

  WINES.forEach(w=>{
    // momentum: prices have inertia
    let mom = G.momentum[w.id]||0;
    // regime sets the baseline drift and how wild the swings are.
    // Mean-reversion pulls prices back toward each wine's base so the market
    // stays a two-way trading arena (buy dips, sell peaks) instead of a
    // one-way escalator that makes any long hold a guaranteed win.
    // reversion is asymmetric: pulls hard when a wine runs far above fair value,
    // gently when below — so fine wine trends up modestly but can't balloon.
    const rel = G.prices[w.id]/w.base;
    const revert = rel>1 ? (1-rel)*0.03 : (1-rel)*0.012;
    let drift = (Math.random()-.5)*w.vol*RG.vol + (w.tier-3)*0.0022 + mom*0.5 + RG.drift + revert;
    // regional fashion pushes whole regions over many weeks
    drift += (G.regionTrend?.[w.region]||0)*0.010;
    let mult = 1+drift;
    G.news.forEach(n=>{
      if(n.id===w.id) mult*=n.mult;
      else if(n.region && n.region===w.region) mult*=(1+(n.mult-1)*0.4);
    });
    // update momentum (decays, picks up event shocks)
    G.momentum[w.id] = mom*0.6 + (mult-1)*0.4;
    // weather-driven supply pressure for the current vintage year
    mult *= (1 + (weatherSupplyEffect(w.region, gameYear())-1)*0.25);
    let np = Math.max(w.base*0.35, G.prices[w.id]*mult);
    G.prices[w.id]=Math.round(np);
    G.priceHist[w.id].push(G.prices[w.id]);
    if(G.priceHist[w.id].length>36) G.priceHist[w.id].shift();
  });

  // speculative bubbles can pop after a fast run-up
  tickBubbles();

  // new consignments arrive on the open market
  refreshStock();
  // ...then Victor takes his cut before the shelves settle
  tickRival();

  // suspicions surface on their own over time, even without a taster
  tickFakeSuspicion();
  normalizeCellarLots();   // keep suspect <= fake <= qty right after they change

  // broker occasionally drops an insider tip (if broker chapter reached)
  if(G.chapter>=2 && Math.random()<0.4){
    const w=pickNewsWine();
    const dir = (G.momentum[w.id]||0)>=0 ? 'up':'down';
    G.tips=[{id:w.id, dir, week:G.week, conf:0.5+Math.random()*0.4}];
  } else { G.tips=G.tips.filter(t=>G.week-t.week<2); }
}

/* Indices */
function indexValue(filter){
  let list = WINES.filter(filter);
  let sum=0, basesum=0;
  list.forEach(w=>{ sum+=G.prices[w.id]; basesum+=w.base; });
  return (sum/basesum)*100;
}
function indexDelta(filter){
  let list = WINES.filter(filter);
  let cur=0, prev=0;
  list.forEach(w=>{
    const h=G.priceHist[w.id];
    cur+=h[h.length-1]; prev+=h[h.length-2]||h[h.length-1];
  });
  return prev? ((cur-prev)/prev)*100 : 0;
}

/* bid/offer spread based on liquidity (tier), reduced by trader staff */
function spreadFor(w){
  const traderCut = Math.min(0.4, staffBonus('trading')*0.08);
  return (0.025 + (w.tier-1)*0.02) * (1-traderCut);
}
function bidPrice(id){ const w=wineById(id); return Math.round(G.prices[id]*(1-spreadFor(w)/2)); }
function offerPrice(id){ const w=wineById(id); return Math.round(G.prices[id]*(1+spreadFor(w)/2)); }
function brokerFee(){ return Math.max(0.008, 0.025 - staffBonus('trading')*0.004); }

function sparkline(hist, w=140, h=34){
  const min=Math.min(...hist), max=Math.max(...hist), rng=(max-min)||1;
  const step=w/(hist.length-1);
  const up = hist[hist.length-1]>=hist[0];
  let d='';
  hist.forEach((v,i)=>{ const x=i*step, y=h-((v-min)/rng)*(h-4)-2; d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '; });
  const col = up? 'var(--up)':'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* Every wine carries an explicit `style`, so a bottle belongs to exactly one
   group. Guessing from tannin used to put Tokaji in "white" and Port in
   "red" — and sweet wines matched two filters at once. */
const WINE_STYLES = ['red','white','rose','sweet','fortified','sparkling'];
const STYLE_LABELS = {
  red:'แดง', white:'ขาว', rose:'โรเซ่',
  sweet:'หวาน', fortified:'เสริมแอลกอฮอล์', sparkling:'สปาร์กลิง',
};

function wineStyle(w){
  if(!w) return 'red';
  if(w.style && WINE_STYLES.includes(w.style)) return w.style;
  // legacy fallback for any record predating the style field
  if(w.rose) return 'rose';
  if(typeof w.tannin==='number' && w.tannin<=1) return (w.sweet||0)>=3 ? 'sweet' : 'white';
  return 'red';
}

function isRoseWine(w){ return wineStyle(w)==='rose'; }
function isWhiteWine(w){ return wineStyle(w)==='white'; }
function isSweetWine(w){ return wineStyle(w)==='sweet'; }
function isFortifiedWine(w){ return wineStyle(w)==='fortified'; }
function isSparklingWine(w){ return wineStyle(w)==='sparkling'; }
function isRedWine(w){ return wineStyle(w)==='red'; }

// Main generator. size = pixel width. w = wine object. opts.mini for tiny.
// LIGHTWEIGHT bottle: flat fills only — no gradients, no clipPath, no <defs>.
// Tesla's browser chokes on dozens of gradient objects in one scroll view, so
// every list/grid view uses this. Same silhouette + colour identity as the full one.
// Only virtualize when the cellar is large enough to matter — small cellars
// render everything up-front (no observer overhead).
let VIRT_BOTTLES=false;
let _bottleObserver=null;
function hydrateBottles(){
  // always disconnect the previous observer first — this is the cleanup that
  // prevents listeners/observers from piling up across page switches
  if(_bottleObserver){ _bottleObserver.disconnect(); _bottleObserver=null; }
  if(!VIRT_BOTTLES) return;
  const slots=document.querySelectorAll('.slot-bottle[data-bottle]');
  if(!slots.length || typeof IntersectionObserver==='undefined'){
    // fallback: no observer support — just fill them all in
    slots.forEach(el=>{ const w=wineById(el.dataset.bottle); if(w) el.innerHTML=bottleSVGLite(w,40); });
    return;
  }
  _bottleObserver=new IntersectionObserver((entries,obs)=>{
    for(const e of entries){
      if(e.isIntersecting){
        const el=e.target, w=wineById(el.dataset.bottle);
        if(w && el.querySelector('.bottle-ph')) el.innerHTML=bottleSVGLite(w,40);
        obs.unobserve(el);   // done — stop watching this one
      }
    }
  }, {root:null, rootMargin:'300px 0px', threshold:0.01});
  slots.forEach(el=>_bottleObserver.observe(el));
}

function bottleSVGLite(w, size=64){
  const s=bottleShape(w.region);
  const cx=30;
  const foil = w.tier>=5 ? '#C8973F' : w.tier>=4 ? '#B8B0A0' : (isWhiteWine(w)?'#7C8B5E':'#7B2C3A');
  const glass = s.glass;
  const bw=s.bodyW, bx=cx-bw/2, bx2=cx+bw/2;
  const shY=s.shoulderY, curve=s.shoulderCurve;
  const neckW=s.neck, nx=cx-neckW/2, nx2=cx+neckW/2;
  const isW=isWhiteWine(w);
  const bodyPath = `M ${nx} 40 L ${nx} ${shY-curve} C ${nx} ${shY}, ${bx} ${shY-4}, ${bx} ${shY+8} L ${bx} 184 Q ${bx} 192, ${bx+8} 192 L ${bx2-8} 192 Q ${bx2} 192, ${bx2} 184 L ${bx2} ${shY+8} C ${bx2} ${shY-4}, ${nx2} ${shY}, ${nx2} ${shY-curve} L ${nx2} 40 Z`;
  const labY=118, labH=52, labX=bx+5, labW=bw-10;
  // wine level drawn as a plain rect behind the body outline, no clipping needed
  return `<svg viewBox="0 0 60 200" width="${size}" height="${size*200/60}" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible">
    <ellipse cx="${cx}" cy="195" rx="${bw/2+2}" ry="4" fill="rgba(62,44,38,.18)"/>
    <path d="${bodyPath}" fill="${glass}" stroke="${shade(glass,-46)}" stroke-width="1.1"/>
    <rect x="${bx+3}" y="46" width="3.4" height="140" rx="1.7" fill="#fff" opacity="${isW?0.20:0.16}"/>
    <path d="M ${nx} 40 L ${nx} ${shY-curve+2} L ${nx2} ${shY-curve+2} L ${nx2} 40 Z" fill="${glass}" stroke="${shade(glass,-46)}" stroke-width="1.1"/>
    <path d="M ${nx-1.2} 13 Q ${cx} 9.4 ${nx2+1.2} 13 L ${nx2+1.2} 45 Q ${cx} 48.4 ${nx-1.2} 45 Z" fill="${foil}" stroke="${shade(foil,-30)}" stroke-width="0.7"/>
    <rect x="${labX}" y="${labY}" width="${labW}" height="${labH}" rx="2.5" fill="#F7EFE0" stroke="rgba(62,44,38,.22)" stroke-width="0.7"/>
    <rect x="${labX}" y="${labY}" width="${labW}" height="11" rx="2.5" fill="${foil}" opacity="0.88"/>
    <line x1="${labX+4.5}" y1="${labY+20}" x2="${labX+labW-4.5}" y2="${labY+20}" stroke="rgba(62,44,38,.42)" stroke-width="1.4"/>
    <line x1="${labX+7.5}" y1="${labY+26}" x2="${labX+labW-7.5}" y2="${labY+26}" stroke="rgba(62,44,38,.24)" stroke-width="0.9"/>
    ${labelEmblem(w.region, cx, labY+41, foil)}
  </svg>`;
}

function bottleSVG(w, size=64){
  const s=bottleShape(w.region);
  const cx=30;
  const foil = w.tier>=5 ? '#C8973F' : w.tier>=4 ? '#B8B0A0' : (isWhiteWine(w)?'#7C8B5E':'#7B2C3A');
  const foilDark = shade(foil,-30);
  const glass = s.glass;
  const glassLight = shade(glass, 34);
  const wineC = w.color;
  const wineLight = shade(w.color, 30);
  const bw=s.bodyW, bx=cx-bw/2, bx2=cx+bw/2;
  const shY=s.shoulderY, curve=s.shoulderCurve;
  const neckW=s.neck, nx=cx-neckW/2, nx2=cx+neckW/2;
  const uid = 'b'+w.id+Math.round(size);
  // Body path: from neck bottom, out to shoulders, down to base with slight taper, rounded bottom
  const bodyPath = `
    M ${nx} 40
    L ${nx} ${shY-curve}
    C ${nx} ${shY}, ${bx} ${shY-4}, ${bx} ${shY+8}
    L ${bx} 184
    Q ${bx} 192, ${bx+8} 192
    L ${bx2-8} 192
    Q ${bx2} 192, ${bx2} 184
    L ${bx2} ${shY+8}
    C ${bx2} ${shY-4}, ${nx2} ${shY}, ${nx2} ${shY-curve}
    L ${nx2} 40
    Z`;
  // label rectangle
  const labY = 118, labH = 52, labX = bx+5, labW = bw-10;
  const isW = isWhiteWine(w);
  return `<svg viewBox="0 0 60 200" width="${size}" height="${size*200/60}" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible">
    <defs>
      <linearGradient id="gl${uid}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="${shade(glass,-18)}"/>
        <stop offset="0.18" stop-color="${glassLight}"/>
        <stop offset="0.34" stop-color="${glass}"/>
        <stop offset="0.62" stop-color="${shade(glass,-8)}"/>
        <stop offset="0.86" stop-color="${shade(glass,-30)}"/>
        <stop offset="1" stop-color="${shade(glass,-14)}"/>
      </linearGradient>
      <linearGradient id="wn${uid}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="${shade(wineC,-14)}"/>
        <stop offset="0.32" stop-color="${wineLight}"/>
        <stop offset="0.7" stop-color="${wineC}"/>
        <stop offset="1" stop-color="${shade(wineC,-32)}"/>
      </linearGradient>
      <linearGradient id="fo${uid}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="${shade(foil,-34)}"/>
        <stop offset="0.28" stop-color="${shade(foil,16)}"/>
        <stop offset="0.55" stop-color="${foil}"/>
        <stop offset="1" stop-color="${shade(foil,-38)}"/>
      </linearGradient>
      <linearGradient id="lb${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FDFAF3"/>
        <stop offset="0.55" stop-color="#F7EFE0"/>
        <stop offset="1" stop-color="#EADFC9"/>
      </linearGradient>
      <clipPath id="cp${uid}"><path d="${bodyPath}"/></clipPath>
    </defs>
    <!-- soft ground shadow -->
    <ellipse cx="${cx}" cy="195" rx="${bw/2+3}" ry="4.5" fill="rgba(62,44,38,.20)"/>
    <ellipse cx="${cx}" cy="194" rx="${bw/2-3}" ry="2.5" fill="rgba(62,44,38,.14)"/>
    <!-- glass body -->
    <path d="${bodyPath}" fill="url(#gl${uid})" stroke="${shade(glass,-46)}" stroke-width="1.1"/>
    <g clip-path="url(#cp${uid})">
      <!-- wine fill seen through glass -->
      <rect x="${bx-2}" y="${shY-6}" width="${bw+4}" height="${190-shY}" fill="url(#wn${uid})" opacity="${isW?0.34:0.66}"/>
      <!-- punt (dimple) shading at base -->
      <ellipse cx="${cx}" cy="192" rx="${bw/2-4}" ry="7" fill="${shade(glass,-40)}" opacity=".55"/>
      <!-- primary specular highlight -->
      <rect x="${bx+4}" y="40" width="4.5" height="152" rx="2.2" fill="#ffffff" opacity="0.26"/>
      <rect x="${bx+9.5}" y="52" width="1.8" height="128" rx="1" fill="#ffffff" opacity="0.13"/>
      <!-- rim light on the right -->
      <rect x="${bx+bw-6}" y="46" width="2.6" height="142" rx="1.3" fill="#ffffff" opacity="0.10"/>
      <!-- subtle horizontal glass banding -->
      <rect x="${bx}" y="${shY+4}" width="${bw}" height="1" fill="#ffffff" opacity="0.07"/>
    </g>
    <!-- neck -->
    <path d="M ${nx} 40 L ${nx} ${shY-curve+2} L ${nx2} ${shY-curve+2} L ${nx2} 40 Z" fill="url(#gl${uid})" stroke="${shade(glass,-46)}" stroke-width="1.1"/>
    <rect x="${nx+1.8}" y="42" width="2.2" height="${shY-curve-40}" rx="1.1" fill="#fff" opacity="0.24"/>
    <!-- foil capsule with crisp edge -->
    <path d="M ${nx-1.2} 13 Q ${cx} 9.4 ${nx2+1.2} 13 L ${nx2+1.2} 45 Q ${cx} 48.4 ${nx-1.2} 45 Z" fill="url(#fo${uid})" stroke="${foilDark}" stroke-width="0.7"/>
    <path d="M ${nx-1.2} 38 Q ${cx} 41.4 ${nx2+1.2} 38" fill="none" stroke="${shade(foil,-30)}" stroke-width="0.8" opacity=".8"/>
    <ellipse cx="${cx}" cy="13" rx="${neckW/2+1.2}" ry="2.6" fill="${shade(foil,26)}"/>
    <ellipse cx="${cx}" cy="13" rx="${neckW/2-1.4}" ry="1.4" fill="${shade(foil,-18)}" opacity=".6"/>
    <!-- label with subtle paper edge -->
    <rect x="${labX}" y="${labY}" width="${labW}" height="${labH}" rx="2.5" fill="url(#lb${uid})" stroke="rgba(62,44,38,.22)" stroke-width="0.7"/>
    <rect x="${labX+1}" y="${labY+1}" width="${labW-2}" height="${labH-2}" rx="1.8" fill="none" stroke="${foil}" stroke-width="0.5" opacity=".45"/>
    <!-- label header band -->
    <rect x="${labX}" y="${labY}" width="${labW}" height="11" rx="2.5" fill="${foil}" opacity="0.88"/>
    <rect x="${labX}" y="${labY+11}" width="${labW}" height="0.9" fill="${shade(foil,-25)}"/>
    <!-- typographic lines -->
    <line x1="${labX+4.5}" y1="${labY+20}" x2="${labX+labW-4.5}" y2="${labY+20}" stroke="rgba(62,44,38,.46)" stroke-width="1.5"/>
    <line x1="${labX+7.5}" y1="${labY+26}" x2="${labX+labW-7.5}" y2="${labY+26}" stroke="rgba(62,44,38,.26)" stroke-width="0.9"/>
    <line x1="${labX+10}" y1="${labY+31}" x2="${labX+labW-10}" y2="${labY+31}" stroke="rgba(62,44,38,.18)" stroke-width="0.8"/>
    <!-- region emblem -->
    ${labelEmblem(w.region, cx, labY+41, foil)}
    <!-- vintage tick marks -->
    <line x1="${labX+5}" y1="${labY+labH-4}" x2="${labX+11}" y2="${labY+labH-4}" stroke="rgba(62,44,38,.3)" stroke-width="0.8"/>
    <line x1="${labX+labW-11}" y1="${labY+labH-4}" x2="${labX+labW-5}" y2="${labY+labH-4}" stroke="rgba(62,44,38,.3)" stroke-width="0.8"/>
  </svg>`;
}

// Map the emojis used throughout the UI to inline SVG icons, so nothing relies
// on the car browser's emoji font (which renders inconsistently or not at all).
// Returns an SVG string for known emojis, or the original char as a fallback.
const EMO_MAP={
  '\u2b50':'star', '\u2605':'star', '\u2728':'sparkle',
  '\ud83c\udfc6':'trophy', '\ud83c\udfaf':'target', '\u26a0':'warn', '\u26a0\ufe0f':'warn',
  '\u2705':'check', '\ud83d\udcc8':'up', '\ud83d\udcc9':'chart',
  '\ud83c\udf77':'glass', '\ud83d\udce6':'box', '\ud83c\udf7d':'plate', '\ud83c\udf7d\ufe0f':'plate',
  '\ud83c\udf89':'party', '\ud83e\udd84':'unicorn', '\ud83d\udd25':'fire',
  '\ud83c\udfe6':'bank', '\ud83d\udcb0':'coin', '\ud83c\udf31':'sprout',
  '\ud83c\udf07':'globe', '\ud83c\udf0d':'globe', '\ud83c\udff0':'cellar',
  '\ud83d\udd0d':'search', '\ud83d\udcdc':'scroll', '\ud83d\udee1':'medal', '\ud83d\udee1\ufe0f':'medal',
  '\ud83d\udca1':'idea', '\ud83c\udf19':'moon', '\ud83d\udea8':'warn', '\ud83c\udfa9':'trophy',
  '\ud83d\udc65':'people', '\ud83d\udd28':'hammer', '\ud83c\udfea':'shop',
  '\ud83e\uddea':'flask', '\ud83c\udf81':'gift', '\ud83d\udcbe':'save',
  '\ud83c\udf47':'grape', '\u2600':'sun', '\u2600\ufe0f':'sun', '\ud83e\uddca':'ice',
  '\ud83d\udcc2':'box', '\u2b06':'up', '\ud83c\udfa8':'sparkle',
  '\ud83d\udcb8':'coin', '\u23f3':'clock', '\u231b':'clock',
};
function emo(ch, size=18, color='currentColor'){
  const key=EMO_MAP[ch];
  return key ? lineIcon(key, size, color) : ch;
}
// Replace every known emoji in a string with its inline SVG.
function emojify(str, size=17){
  if(str==null) return str;
  let out=String(str);
  for(const ch in EMO_MAP){ if(out.indexOf(ch)>=0){ out=out.split(ch).join(lineIcon(EMO_MAP[ch], size)); } }
  return out;
}

/* ============================================================
   VISUAL-NOVEL CUTSCENE ART — SVG portraits + backgrounds
   ============================================================ */
// Half-body character portraits, drawn on a 300x340 canvas.
// emotion: 'neutral'|'happy'|'serious'|'smug'|'sad'
function charPortrait(who, emotion='neutral'){
  const skin='#E8C0A0', skinSh='#D4A888', mouthC='#8A4A44';
  // eyebrow/mouth by emotion
  const brows={neutral:'',happy:'',serious:'angry',smug:'smug',sad:'sad'}[emotion]||'';
  function eyes(cx1,cx2,cy){
    const closed = emotion==='happy';
    if(closed) return `<path d="M${cx1-6} ${cy} q6 5 12 0" stroke="#3E2C26" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M${cx2-6} ${cy} q6 5 12 0" stroke="#3E2C26" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    return `<ellipse cx="${cx1}" cy="${cy}" rx="4" ry="5" fill="#fff"/><circle cx="${cx1+(emotion==='smug'?1:0)}" cy="${cy+1}" r="2.6" fill="#3E2C26"/>
            <ellipse cx="${cx2}" cy="${cy}" rx="4" ry="5" fill="#fff"/><circle cx="${cx2+(emotion==='smug'?1:0)}" cy="${cy+1}" r="2.6" fill="#3E2C26"/>`;
  }
  function brow(x1,x2,y,type){
    const t=type;
    if(t==='angry') return `<path d="M${x1-6} ${y+2} L${x1+6} ${y-2}" stroke="#3E2C26" stroke-width="2.6" stroke-linecap="round"/><path d="M${x2-6} ${y-2} L${x2+6} ${y+2}" stroke="#3E2C26" stroke-width="2.6" stroke-linecap="round"/>`;
    if(t==='smug') return `<path d="M${x1-6} ${y} L${x1+6} ${y-3}" stroke="#3E2C26" stroke-width="2.4" stroke-linecap="round"/><path d="M${x2-6} ${y-3} L${x2+6} ${y}" stroke="#3E2C26" stroke-width="2.4" stroke-linecap="round"/>`;
    if(t==='sad') return `<path d="M${x1-6} ${y-2} L${x1+6} ${y+2}" stroke="#3E2C26" stroke-width="2.4" stroke-linecap="round"/><path d="M${x2-6} ${y+2} L${x2+6} ${y-2}" stroke="#3E2C26" stroke-width="2.4" stroke-linecap="round"/>`;
    return `<path d="M${x1-6} ${y} q6 -3 12 0" stroke="#3E2C26" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M${x2-6} ${y} q6 -3 12 0" stroke="#3E2C26" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  }
  function mouth(cx,cy){
    if(emotion==='happy') return `<path d="M${cx-10} ${cy} q10 12 20 0" stroke="${mouthC}" stroke-width="2.4" fill="#B5675F" stroke-linecap="round"/>`;
    if(emotion==='smug') return `<path d="M${cx-9} ${cy} q9 6 18 -2" stroke="${mouthC}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    if(emotion==='sad') return `<path d="M${cx-9} ${cy+2} q9 -6 18 0" stroke="${mouthC}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    if(emotion==='serious') return `<line x1="${cx-8}" y1="${cy}" x2="${cx+8}" y2="${cy}" stroke="${mouthC}" stroke-width="2.4" stroke-linecap="round"/>`;
    return `<path d="M${cx-8} ${cy} q8 4 16 0" stroke="${mouthC}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  }

  // Character-specific hair/clothing/features. Face center ~ (150,150)
  let hair='', extra='', cloth='', clothC, hairC;
  switch(who){
    case 'mentor': // elderly, white hair + beard, warm cardigan
      hairC='#EDEAE4'; clothC='#7C6A54';
      cloth=`<path d="M70 340 L70 300 Q70 250 150 250 Q230 250 230 300 L230 340 Z" fill="${clothC}"/>
             <path d="M150 250 L135 300 L150 320 L165 300 Z" fill="#F3EBDD"/>
             <circle cx="150" cy="285" r="4" fill="#5A4C3A"/><circle cx="150" cy="305" r="4" fill="#5A4C3A"/>`;
      hair=`<path d="M96 140 Q90 78 150 74 Q210 78 204 140 Q210 120 206 100 Q196 60 150 60 Q104 60 94 100 Q90 120 96 140Z" fill="${hairC}"/>`;
      extra=`<path d="M112 190 Q150 240 188 190 Q186 210 150 224 Q114 210 112 190Z" fill="${hairC}"/>
             <ellipse cx="127" cy="150" rx="10" ry="9" fill="none" stroke="#8A7B68" stroke-width="1.6"/><ellipse cx="173" cy="150" rx="10" ry="9" fill="none" stroke="#8A7B68" stroke-width="1.6"/><line x1="137" y1="150" x2="163" y2="150" stroke="#8A7B68" stroke-width="1.6"/>`; // glasses
      break;
    case 'rival': // slick dark hair, sunglasses often, sharp suit
      hairC='#2B2622'; clothC='#3A3540';
      cloth=`<path d="M66 340 L66 296 Q66 250 150 250 Q234 250 234 296 L234 340 Z" fill="${clothC}"/>
             <path d="M150 250 L128 340 L172 340 Z" fill="#1E1B22"/>
             <path d="M150 250 L138 288 L150 300 L162 288 Z" fill="#C0392B"/>`; // red tie
      hair=`<path d="M98 132 Q92 72 150 70 Q208 72 202 132 Q206 96 176 74 Q150 66 124 74 Q94 96 98 132Z" fill="${hairC}"/>
            <path d="M150 70 Q120 74 108 104 Q140 88 150 70Z" fill="#1A1613"/>`;
      break;
    case 'broker': // young, tied-back hair, modern blazer, tablet vibe
      hairC='#3B2A20'; clothC='#4A6670';
      cloth=`<path d="M70 340 L70 298 Q70 252 150 252 Q230 252 230 298 L230 340 Z" fill="${clothC}"/>
             <path d="M150 252 L136 300 L150 316 L164 300 Z" fill="#EDE4D4"/>`;
      hair=`<path d="M100 150 Q92 80 150 76 Q208 80 200 150 Q206 120 200 98 Q184 66 150 66 Q116 66 100 98 Q94 120 100 150Z" fill="${hairC}"/>
            <path d="M198 120 Q224 130 220 170 Q214 150 196 146Z" fill="${hairC}"/>`; // ponytail
      break;
    case 'critic': // distinguished, top hat/bow tie, monocle
      hairC='#4A4038'; clothC='#3E3A44';
      cloth=`<path d="M68 340 L68 298 Q68 252 150 252 Q232 252 232 298 L232 340 Z" fill="${clothC}"/>
             <path d="M150 252 L132 300 L150 314 L168 300 Z" fill="#F3EBDD"/>
             <path d="M128 288 Q150 300 172 288 Q150 282 128 288Z" fill="#7B2C3A"/>`; // bow tie
      hair=`<path d="M104 128 Q98 84 150 80 Q202 84 196 128 Q200 100 178 84 Q150 74 122 84 Q100 100 104 128Z" fill="${hairC}"/>`;
      extra=`<circle cx="173" cy="150" r="12" fill="none" stroke="#C8973F" stroke-width="2"/><line x1="185" y1="150" x2="196" y2="176" stroke="#C8973F" stroke-width="1.4"/>`; // monocle
      break;
    case 'regular': // kind elderly lady, bun, shawl
      hairC='#D8CFC4'; clothC='#9C6B78';
      cloth=`<path d="M70 340 L70 300 Q70 252 150 252 Q230 252 230 300 L230 340 Z" fill="${clothC}"/>
             <path d="M92 262 Q150 296 208 262 L208 300 Q150 320 92 300Z" fill="#B98996"/>`; // shawl
      hair=`<path d="M100 148 Q94 84 150 80 Q206 84 200 148 Q206 116 198 96 Q182 66 150 66 Q118 66 102 96 Q94 116 100 148Z" fill="${hairC}"/>
            <circle cx="150" cy="58" r="16" fill="${hairC}"/>`; // bun
      extra=`<circle cx="118" cy="172" r="7" fill="#E8A0A8" opacity="0.5"/><circle cx="182" cy="172" r="7" fill="#E8A0A8" opacity="0.5"/>`; // rosy cheeks
      break;
    default:
      hairC='#3B2A20'; clothC='#7C6A54';
      cloth=`<path d="M70 340 L70 300 Q70 252 150 252 Q230 252 230 300 L230 340 Z" fill="${clothC}"/>`;
      hair=`<path d="M100 148 Q94 80 150 76 Q206 80 200 148 Q206 112 150 66 Q94 112 100 148Z" fill="${hairC}"/>`;
  }

  return `<svg viewBox="0 0 300 340" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
    <defs><radialGradient id="pfg" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="rgba(255,255,255,.15)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></radialGradient></defs>
    ${cloth}
    <!-- neck -->
    <rect x="134" y="212" width="32" height="44" rx="12" fill="${skinSh}"/>
    <!-- head -->
    <ellipse cx="150" cy="150" rx="58" ry="66" fill="${skin}"/>
    <ellipse cx="150" cy="150" rx="58" ry="66" fill="url(#pfg)"/>
    <!-- ears -->
    <ellipse cx="93" cy="152" rx="9" ry="13" fill="${skin}"/><ellipse cx="207" cy="152" rx="9" ry="13" fill="${skin}"/>
    ${hair}
    ${brow(127,173,126,brows)}
    ${eyes(127,173,146)}
    <!-- nose -->
    <path d="M150 150 q4 12 -3 18" stroke="${skinSh}" stroke-width="2" fill="none" stroke-linecap="round"/>
    ${mouth(150,190)}
    ${extra}
  </svg>`;
}

function shade(hex, amt){
  let c=hex.replace('#',''); if(c.length===3)c=c.split('').map(x=>x+x).join('');
  let r=parseInt(c.slice(0,2),16), g=parseInt(c.slice(2,4),16), b=parseInt(c.slice(4,6),16);
  r=Math.max(0,Math.min(255,r+amt)); g=Math.max(0,Math.min(255,g+amt)); b=Math.max(0,Math.min(255,b+amt));
  return `rgb(${r},${g},${b})`;
}

/* ============================================================
   MARKET STOCK / DEPTH — each wine has a limited number of bottles
   available on the open market each week. Rare wines are scarce.
   ============================================================ */
// Base weekly availability by tier. Unicorns show up a few bottles at a time.
function baseStockFor(w){
  const byTier={1:24, 2:16, 3:10, 4:5, 5:2};
  return byTier[w.tier]||10;
}
// Deterministic-per-week jitter so the number is stable while you browse.
function rollStock(w){
  const b=baseStockFor(w);
  let n=Math.round(b*(0.6+Math.random()*0.85));
  // regional fashion: hot regions get bought out, cold regions pile up
  const t=(G.regionTrend&&G.regionTrend[w.region])||0;
  n=Math.round(n*(1-t*0.35));
  // bear markets flood the market, bull markets dry it up
  const RG=currentRegime();
  if(RG.k==='bull') n=Math.round(n*0.7);
  else if(RG.k==='bear') n=Math.round(n*1.35);
  return Math.max(0, n);
}
/* ============================================================
   VICTOR CRUZ, THE RIVAL — once he has made his entrance in the
   story, he stops being a talking head and starts competing for
   the same bottles. Each week he sweeps a slice of the premium
   market before you can reach it, thinning the shelves of exactly
   the wines a serious cellar wants. Beat him to a wine he was
   eyeing and the rivalry heats up; the hotter it runs, the harder
   he pushes — and the sweeter it is when you win the wines he
   wanted at auction.
   ============================================================ */
const RIVAL_CHAPTER = 3;   // he introduces himself in chapter 3

function rivalUnlocked(){ return G.rivalActive || G.chapter >= RIVAL_CHAPTER; }

// Victor sweeps part of the high-end market each week.
function tickRival(){
  if(!rivalUnlocked()) return;
  G.rivalActive=true;
  // some weeks he is busy elsewhere
  if(Math.random()<0.35) return;
  // he targets desirable, in-stock wines: tier 4+ (the truly collectible end)
  const targets=WINES.filter(w=>!isRareLocked(w.id) && w.tier>=4 && (G.stock[w.id]||0)>0);
  if(!targets.length) return;
  // at most 1-2 wines a week even when the rivalry is white-hot
  const sweeps=1+Math.floor((G.rivalHeat||0)/7);   // 1 normally, 2 at heat 7+
  const grabbed=[];
  for(let i=0;i<sweeps && targets.length;i++){
    const w=targets[Math.floor(Math.random()*targets.length)];
    const have=G.stock[w.id]||0;
    if(have<=0) continue;
    // a noticeable bite, but rarely the whole shelf
    const bite=Math.max(1, Math.round(have*(0.20+Math.random()*0.25)));
    G.stock[w.id]=Math.max(0, have-bite);
    grabbed.push(w);
    G.rivalGrabs=(G.rivalGrabs||0)+1;
  }
  // occasionally he corners a wine entirely and gloats in the news feed
  if(grabbed.length && Math.random()<0.5){
    const w=grabbed[0];
    const barbs=[
      `วิกเตอร์กว้าน${w.name}ไปเกือบหมดตลาด — "ของดีต้องอยู่กับคนที่เข้าใจ"`,
      `Cruz Cellars เหมา${w.cuvee||w.name}ตัดหน้าคุณอีกแล้ว`,
      `วิกเตอร์โพสต์รูปคู่กับ${w.name} — "บางคนได้แต่มองราคา"`,
      `ตลาด${w.region}ตึงตัว วิกเตอร์กว้านเก็บก่อนใคร`,
    ];
    G.news.push({mult:1, msg:barbs[Math.floor(Math.random()*barbs.length)]});
  }
}

// Call this when the player buys a wine Victor was after — it stokes the rivalry.
function rivalNoteBuy(id){
  if(!rivalUnlocked()) return;
  const w=wineById(id); if(!w || w.tier<3) return;
  // beating him to a premium wine raises the heat (capped)
  if(Math.random()<0.4){
    G.rivalHeat=Math.min(10,(G.rivalHeat||0)+1);
    if(G.rivalHeat===5) G.news.push({mult:1, msg:'วิกเตอร์เริ่มมองคุณเป็นคู่แข่งจริงจัง — เขาจะสู้หนักขึ้น'});
  }
}

function refreshStock(){
  G.stock=G.stock||{};
  WINES.forEach(w=>{
    if(isRareLocked(w.id)){ G.stock[w.id]=0; return; }   // not on the market until earned
    const prev=G.stock[w.id];
    // unsold bottles partly carry over, then a new consignment arrives
    const carry = prev===undefined ? 0 : Math.floor(prev*0.4);
    G.stock[w.id]=Math.min(baseStockFor(w)*2, carry+rollStock(w));
  });
  // Wines you are contracted to deliver are held for you by the supplier —
  // otherwise a contract could become impossible through no fault of yours.
  for(const k of (G.contracts||[])){
    const reserve = k.perWeek*2;
    if((G.stock[k.wineId]||0) < reserve) G.stock[k.wineId] = reserve;
  }
}
function stockOf(id){
  G.stock=G.stock||{};
  if(G.stock[id]===undefined) G.stock[id]=rollStock(wineById(id));
  return G.stock[id];
}
// Buying into a thin market moves the price against you.
function stockPriceImpact(id, qty){
  const st=stockOf(id);
  if(st<=0) return 1;
  const frac=Math.min(1, qty/st);
  return 1 + frac*frac*0.18;   // taking the whole shelf costs ~18% more
}
function stockLabel(id){
  const w=wineById(id), st=stockOf(id), b=baseStockFor(w);
  if(st<=0)        return {t:'ไม่มีของ', c:'var(--down)', ic:'⛔'};
  if(st<=b*0.25)   return {t:'ของหายาก', c:'var(--down)', ic:'🔥'};
  if(st<=b*0.6)    return {t:'ของจำกัด', c:'var(--gold)', ic:'⚠'};
  return {t:'ของพร้อมส่ง', c:'var(--up)', ic:'✔'};
}

/* ============================================================
   COUNTERFEIT WINE SYSTEM
   ============================================================ */
// Some market lots are fakes sold at a discount. A taster on staff can spot them.
// Returns {fake:bool, discount:number} for the currently offered lot of a wine.
function fakeChanceFor(w){
  // rarer wines are faked more often
  let base = 0.02 + (w.tier-1)*0.022;      // tier1 ~2% ... tier5 ~11%
  return Math.min(0.14, base);
}
// Roll a lot when the trade modal opens; stored per-week so it's stable while you look at it
function lotFor(id){
  const w=wineById(id);
  const key=id+':'+G.week;
  G._lots=G._lots||{};
  if(!G._lots[key]){
    const fake = Math.random() < fakeChanceFor(w);
    // fakes are offered a bit cheaper to bait you
    const bait = fake ? (0.72+Math.random()*0.14) : 1;
    G._lots[key]={fake, bait};
  }
  return G._lots[key];
}
// Taster skill determines whether you're warned. 0 = no staff, higher = better.
function tasterVerdict(id){
  const lot=lotFor(id);
  const skill=staffBonus('quality');           // sum of taster levels
  if(skill<=0) return {known:false, lot};
  const detect = Math.min(0.95, 0.45 + skill*0.16);
  // detection roll is stable per lot too
  const key='v'+id+':'+G.week;
  G._verdicts=G._verdicts||{};
  if(G._verdicts[key]===undefined) G._verdicts[key]= Math.random()<detect;
  const spotted=G._verdicts[key];
  if(lot.fake) return {known:spotted, lot, msg: spotted?'fake':'missed'};
  // false alarm chance on genuine bottles when skill is low
  return {known:true, lot, msg:'genuine'};
}

/* ============================================================
   AUCTION SYSTEM — periodic bidding events against NPC rivals
   ============================================================ */
const AUCTION_BIDDERS=[
  {name:'วิกเตอร์ ครูซ', av:'🕶️', aggression:1.25},
  {name:'นักสะสมนิรนาม', av:'🎭', aggression:1.05},
  {name:'ตัวแทนจากฮ่องกง', av:'🏙️', aggression:1.15},
  {name:'พิพิธภัณฑ์ไวน์', av:'🏛️', aggression:0.95},
];
function maybeStartAuction(){
  // roughly every 6-9 weeks once the player is established
  if(G.week<6 || G.auction) return false;
  if(G.week - (G.lastAuctionWeek||0) < 6) return false;
  if(Math.random()>0.35) return false;
  // pick a desirable lot: prefer rare wines
  const pool=WINES.filter(w=>w.tier>=3 && !isRareLocked(w.id));
  const w=pool[Math.floor(Math.random()*pool.length)];
  const est=G.prices[w.id];
  const qty=1+Math.floor(Math.random()*2);
  // Once the rivalry is hot, Victor shows up to auctions far more often and
  // pushes his walk-away price higher — winning against him is the payoff.
  let bidder;
  const heat=G.rivalHeat||0;
  if(rivalUnlocked() && Math.random() < 0.25+heat*0.05){
    bidder=AUCTION_BIDDERS[0];   // Victor
  } else {
    bidder=AUCTION_BIDDERS[Math.floor(Math.random()*AUCTION_BIDDERS.length)];
  }
  const heatPush = bidder===AUCTION_BIDDERS[0] ? 1 + heat*0.03 : 1;
  // rival's walk-away price — genuinely competitive, sometimes above estimate
  const rivalMax=Math.round(est*qty*(1.05+Math.random()*0.75)*bidder.aggression*heatPush);
  G.auction={
    id:w.id, qty, est,
    current: Math.round(est*qty*0.5),
    rivalMax, bidder,
    yourTurn:true, over:false, won:false, rounds:0,
  };
  G.lastAuctionWeek=G.week;
  return true;
}
function auctionIncrement(a){ return Math.max(1000, Math.round(a.current*0.08)); }
function placeBid(){
  const a=G.auction; if(!a||a.over) return;
  // block re-entry while the rival is "thinking" — otherwise rapid taps on a
  // touch screen stack multiple bids and blow past the ceiling
  if(a.awaitingRival) return;
  const inc=auctionIncrement(a);
  const myBid=a.current+inc;
  if(myBid>G.cash){ toast('เงินสดไม่พอสำหรับราคานี้','bad'); sfx('bad'); return; }
  // The rival may raise once more before dropping out, and we would then owe
  // that higher figure. Only bid if we could settle at that price too.
  const exposure=myBid+auctionIncrement({...a, current:myBid});
  if(exposure>G.cash && myBid+inc<=a.rivalMax){
    toast('เงินสดอาจไม่พอถ้าคู่แข่งสู้ต่อ','bad'); sfx('bad'); return;
  }
  a.current=myBid; a.rounds++;
  sfx('click');
  // rival responds
  if(a.current + auctionIncrement(a) <= a.rivalMax){
    a.awaitingRival=true;
    renderAuction();   // repaint immediately so the bid button shows as disabled
    setTimeout(()=>{
      if(!G.auction||G.auction!==a||a.over){ return; }
      a.current=a.current+auctionIncrement(a);
      a.awaitingRival=false;
      sfx('nav');
      renderAuction();
    }, 700);
  } else {
    // rival drops out — you win. Charge only what the player can actually pay:
    // the rival raised after our affordability check, so re-verify here.
    a.over=true; a.won=true;
    const owed=Math.min(a.current, G.cash);
    G.cash-=owed; G.cash=Math.round(G.cash);
    const yr=gameYear();
    if(cellarUsed()+a.qty<=cellarCapacity()){
      const c=G.cellar[a.id];
      if(c){ c.buyPrice=(c.buyPrice*c.qty+a.current)/(c.qty+a.qty); c.qty+=a.qty; }
      else { G.cellar[a.id]={qty:a.qty, buyWeek:G.week, buyPrice:Math.round(a.current/a.qty), vintage:yr, quality:vintageRating(a.id,yr), fake:0, suspect:0}; sealLot(G.cellar[a.id]); }
    } else {
      G.cash+=a.current*0.9;
      toast('เซลลาร์เต็ม — ขายต่อทันทีที่ 90%','bad');
    }
    G.stats.auctionsWon=(G.stats.auctionsWon||0)+1;
    sfx('gavel'); setTimeout(()=>sfx('great'),300);
    checkAchievements();
  }
  renderAuction(); renderTop();
}
function withdrawAuction(){
  const a=G.auction; if(!a) return;
  a.over=true; a.won=false;
  sfx('gavel');
  renderAuction();
}

function doBuy(id, qty){
  const lot=lotFor(id);
  const off=Math.round(offerPrice(id)*lot.bait); const fee=brokerFee();
  // clamp to what is actually possible so no path can over-buy
  const space=cellarCapacity()-cellarUsed();
  const afford=Math.floor(G.cash/(off*(1+fee)));
  const avail=stockOf(id);
  if(avail<1){ sfx('deny'); toast('ไวน์ตัวนี้หมดจากตลาดแล้ว — รอของเข้าสัปดาห์หน้า','bad'); return; }
  qty=Math.min(safeQty(qty), space, afford, avail);
  if(qty<1){ sfx('deny'); toast(afford<1?'เงินสดไม่พอ':'เซลลาร์เต็ม! อัพเกรดหรือขายบางส่วนก่อน','bad'); return; }
  const slip=stockPriceImpact(id, qty);
  const cost=off*slip*qty*(1+fee);
  G.stock[id]=Math.max(0, avail-qty);
  if(slip>1.01) toast(`ของในตลาดน้อย — ราคาขยับขึ้น ${((slip-1)*100).toFixed(1)}%`,'bad');
  G.cash-=cost; floatMoney(-cost);
  const yr=gameYear(); const vr=vintageRating(id,yr);
  const c=G.cellar[id];
  if(c){
    sealLot(c);
    c.buyPrice=(c.buyPrice*c.qty+off*slip*qty)/(c.qty+qty); c.qty+=qty;
    if(lot.fake){ c.fake=(c.fake||0)+qty; if(staffBonus('quality')>0) c.suspect=(c.suspect||0)+qty; }
    c.fake=Math.min(c.fake||0, c.qty); c.suspect=Math.min(c.suspect||0, c.fake||0);
  }
  else {
    const nf = lot.fake?qty:0;
    G.cellar[id]={qty, buyWeek:G.week, buyPrice:Math.round(off*slip), vintage:yr, quality:vr,
                  fake: nf, suspect: (lot.fake&&staffBonus('quality')>0)? nf : 0};
    sealLot(G.cellar[id]);
  }
  normalizeCellarLots();
  G.stats.bottlesBought+=qty;
  questProgress('buy', qty);
  sfx('buy');
  rivalNoteBuy(id);
  toast(`ซื้อ ${wineById(id).name} ×${qty} (vintage ${yr})`,'good');
  closeModal(); checkStory(); checkAchievements(); renderTop(); routePage();
}
function doSell(id, qty){
  const c=G.cellar[id]; if(c) sealLot(c);
  if(!c){ toast('ไม่มีไวน์ตัวนี้ในเซลลาร์','bad'); return; }
  qty=Math.min(safeQty(qty), c.qty);
  if(qty<1){ toast('ไม่มีของพอ','bad'); return; }
  const bid=bidPrice(id); const fee=brokerFee();
  const qualMult = c.quality? (0.9 + (c.quality-82)/18*0.25) : 1;
  // fakes get discovered by the buyer's authenticator
  const fakeQty = Math.min(qty, c.fake||0);
  const realQty = qty - fakeQty;
  let gain = bid*realQty*(1-fee)*agingMult(id)*qualMult;
  if(fakeQty>0){
    gain += bid*fakeQty*0.05;   // near-worthless once exposed
    G.rep = Math.max(0, G.rep - fakeQty*3);
    sfx('bad');
    toast(`🚨 ถูกจับได้ว่าขายของปลอม ${fakeQty} ขวด! ชื่อเสียงเสียหาย (-★${fakeQty*3})`,'bad');
  }
  const cost=(c.buyPrice||0)*qty;
  const profit=gain-cost;
  G.cash+=gain;
  // large sales move the market against you
  const imp=marketImpact(id, qty);
  if(imp>0.01){
    G.prices[id]=Math.round(G.prices[id]*(1-imp));
    if(imp>0.06) toast(`📉 การขายจำนวนมากกดราคาตลาดลง ${(imp*100).toFixed(0)}%`,'bad');
  }
  c.qty-=qty; c.fake=Math.max(0,(c.fake||0)-fakeQty);
  // suspect bottles are a subset of the fake ones, which are a subset of the lot
  c.fake=Math.max(0, Math.min(c.fake||0, c.qty));
  c.suspect=Math.max(0, Math.min(c.suspect||0, c.fake));
  G.stock=G.stock||{}; G.stock[id]=(G.stock[id]||0)+realQty;   // your bottles go back onto the market
  if(c.qty<=0) delete G.cellar[id];
  normalizeCellarLots();
  if(profit>=0){ G.stats.tradesWon++; } else { G.stats.tradesLost++; }
  G.stats.totalProfit+=profit;
  if(profit>0) questProgress('profit', profit);
  sfx(profit>=0?'sell':'bad');
  floatMoney(gain);
  if(profit>0) setTimeout(()=>sfx('cash'),120);
  toast(`ขายได้ ${fmt(gain)} · ${profit>=0?'📈 กำไร '+fmtK(profit):'📉 ขาดทุน '+fmtK(-profit)}`, profit>=0?'good':'bad');
  closeModal(); checkStory(); checkAchievements(); renderTop(); routePage();
}

// Resolve every suspect lot at once with one method — the bulk convenience.
function handleAllFakes(mode){
  const ids=Object.keys(G.cellar).filter(id=>lotSuspect(G.cellar[id]));
  if(mode==='destroy'){
    const total=ids.reduce((a,id)=>a+disposalCost('destroy',lotSuspect(G.cellar[id])),0);
    if(total>G.cash){ toast('เงินสดไม่พอทำลายทั้งหมด','bad'); sfx('bad'); return; }
  }
  let count=0;
  // snapshot ids first, since disposeFakes mutates G.cellar
  ids.forEach(id=>{ if(G.cellar[id] && lotSuspect(G.cellar[id])){ count+=lotSuspect(G.cellar[id]); disposeFakesSilent(id, mode); } });
  if(mode==='report'){ toast(`${lineIcon?'':''}🛡️ แจ้งสมาคมของปลอมทั้งหมด ${count} ขวดเรียบร้อย`,'gold'); sfx('great'); }
  else { toast(`ทำลายไวน์ปลอมทั้งหมด ${count} ขวดอย่างถูกต้อง`,'good'); sfx('cash'); }
  renderTop(); routePage();
}

/* ---- PAGE: PORTFOLIO ---- */
function pagePortfolio(){
  let html=`<div class="page-head"><h2>พอร์ตการลงทุน</h2><p>มูลค่ารวม ${fmt(portfolioValue())} · เงินสด ${fmt(G.cash)}</p></div>`;
  const ids=Object.keys(G.cellar);
  html+=`<div class="card"><table class="ptable"><thead><tr><th>ไวน์</th><th>จำนวน</th><th>ทุนเฉลี่ย</th><th>มูลค่าปัจจุบัน</th><th>กำไร/ขาดทุน</th><th></th></tr></thead><tbody>`;
  if(!ids.length){ html+=`<tr><td colspan="6" style="text-align:center;color:var(--ink-soft);padding:24px">ยังไม่มีไวน์ในพอร์ต</td></tr>`; }
  let totCost=0,totVal=0;
  // sort by profit descending so best positions surface first
  const sorted=ids.slice().sort((a,b)=>{
    const ca=G.cellar[a], cb=G.cellar[b];
    const pa=(G.prices[a]*agingMult(a)-ca.buyPrice)/ca.buyPrice;
    const pb=(G.prices[b]*agingMult(b)-cb.buyPrice)/cb.buyPrice;
    return pb-pa;
  });
  sorted.forEach(id=>{
    const w=wineById(id),c=G.cellar[id]; const val=G.prices[id]*agingMult(id);
    const cost=c.buyPrice*c.qty, cur=val*c.qty; totCost+=cost; totVal+=cur;
    const pl=(cur-cost)/cost*100;

  if(ids.length){

  // primeur holdings

  if(pids.length){

      html+=`<div class="card wine-card"><div class="bottle-wrap">${bottleSVGLite(w,48)}</div>
        <div class="wine-info"><div class="wine-name">${w.name}</div><div class="wine-sub">${w.cuvee} · ${p.qty} ขวด</div>

    });
    html+=`</div>`;
  }
  content.innerHTML=html; bindFocusables();
}

// En primeur is only sold during a campaign window each year (spring release
// of the previous harvest). Outside the window nothing can be reserved.
function primeurOpen(){
  const m=gameMonth();
  return m>=2 && m<=4;      // มี.ค. - พ.ค.
}
function primeurWeeksLeft(){
  if(!primeurOpen()) return 0;
  return 5 - gameMonth();   // months remaining in window (1 week = 1 month)
}
function nextPrimeurIn(){
  const m=gameMonth();
  return m<2 ? (2-m) : (14-m);   // weeks until the window opens again
}
// The campaign offers a stable set for the whole window (vintage being released)
function primeurOffers(){
  const yr=gameYear();
  const seed=(yr*7919)>>>0;
  return WINES.filter(w=>w.tier>=3).filter((w,i)=>((i*31+seed)%4)===0).slice(0,8);
}

  } else {
    html+=`<div class="card" style="border-color:var(--line);margin-bottom:16px;opacity:.9">
      <div class="row" style="gap:10px">${lineIcon('clock',22)}
        <div style="flex:1"><b style="font-family:Fraunces;font-size:16px;color:var(--ink-soft)">แคมเปญปิดอยู่</b>
        <div class="wine-sub">เปิดอีกครั้งในอีก <b>${nextPrimeurIn()} สัปดาห์</b> (ช่วง มี.ค.–พ.ค.)</div></div>

    </div>`;

  if(open){

    primeurOffers().forEach(w=>{
      // discount is stable within a campaign (seeded by wine + year)
      let h=0; const key=w.id+':'+gameYear();
      for(let i=0;i<key.length;i++) h=(h*31+key.charCodeAt(i))>>>0;
