  "Clos คืออะไร?": "What is a Clos?",
  "\"Clos\" ในภาษาฝรั่งเศสหมายถึงไร่องุ่นที่ล้อมด้วยกำแพงหิน มักมาจากยุคที่พระในอาราม (โดยเฉพาะเบอร์กันดี) ดูแลไร่ กำแพงช่วยแบ่งเขตเทอรัวร์ที่มีเอกลักษณ์ ตัวอย่างชื่อดัง เช่น Clos de Vougeot, Clos de Tart — หลายแห่งเป็น \"มอนอโปล\" (เจ้าของรายเดียว) จึงหายากและราคาสูง": "\"Clos\" in French means a vineyard enclosed by stone walls, often dating from when monks (especially in Burgundy) tended the vines. The walls mark off a distinctive terroir. Famous examples include Clos de Vougeot and Clos de Tart — many are \"monopoles\" (a single owner), so they're rare and expensive",
  "ในเบอร์กันดี Grand Cru คือระดับสูงสุด (แค่ ~2% ของผลผลิต) ตามด้วย Premier Cru, Village และ Regional ยิ่งเฉพาะเจาะจงแปลงยิ่งแพง ส่วนบอร์กโดซ์ใช้ระบบ \"Growth\" (Cru Classé) จากการจัดอันดับปี 1855 โดย First Growth เป็นระดับสูงสุด": "In Burgundy, Grand Cru is the top level (just ~2% of production), followed by Premier Cru, Village and Regional — the more specific the plot, the pricier. Bordeaux uses the \"Growth\" system (Cru Classé) from the 1855 classification, with First Growth at the top",
  "ตลาดรอง & ดัชนี Liv-ex": "The secondary market & the Liv-ex index",
  "ไวน์ชั้นดีซื้อขายเหมือนสินทรัพย์ Liv-ex คือตลาดกลางที่รวบรวมราคา Bid/Offer จากพ่อค้าทั่วโลก ดัชนีเช่น Liv-ex 100 และ Fine Wine 1000 ใช้วัดภาพรวมตลาด ปัจจัยที่ขับราคา ได้แก่ คะแนนนักวิจารณ์ ความหายาก อายุการบ่ม และกระแสความต้องการ": "Fine wine trades like an asset. Liv-ex is a central exchange that gathers Bid/Offer prices from merchants worldwide. Indices such as the Liv-ex 100 and Fine Wine 1000 track the overall market. Prices are driven by critic scores, scarcity, age and demand trends",
  "ทำไมไวน์ยิ่งเก่ายิ่งแพง?": "Why does wine get pricier with age?",
  "ไม่ใช่ไวน์ทุกตัว! เฉพาะไวน์ที่มีโครงสร้างดี (แทนนิน กรด น้ำตาลสมดุล) จึงบ่มได้ เมื่อบ่ม แทนนินนุ่มลง กลิ่นซับซ้อนขึ้น และเมื่อขวดในตลาดถูกดื่มไปเรื่อยๆ ของที่เหลือก็หายากขึ้น ราคาจึงสูงขึ้น": "Not every wine! Only well-structured wines (balanced tannin, acidity and sugar) can age. With age, tannins soften and aromas grow more complex, and as bottles on the market keep getting drunk, what's left becomes rarer, so prices rise",
  "หลักการจับคู่อาหาร": "The basics of food pairing",
  "กฎง่ายๆ: จับคู่น้ำหนัก (อาหารหนักคู่ไวน์หนัก), แทนนินสูงตัดไขมันเนื้อแดง, ไวน์ขาวกรดสูงคู่อาหารทะเล, ไวน์หวานคู่ของหวานหรือชีสบลู, สปาร์กลิงคู่อาหารทอด/เผ็ด \"เข้าถิ่นกันได้\" — อาหารกับไวน์จากภูมิภาคเดียวกันมักเข้ากัน": "Simple rules: match weight (heavy food, heavy wine), high tannin cuts red-meat fat, high-acid whites go with seafood, sweet wines with desserts or blue cheese, sparkling with fried or spicy food. \"What grows together goes together\" — food and wine from the same region usually match",
  "คือการซื้อไวน์ตั้งแต่ยังอยู่ในถังโอ๊ค ก่อนบรรจุขวด 1-2 ปี (นิยมในบอร์กโดซ์) ข้อดีคือราคาถูกกว่าตอนวางตลาดและได้จองของหายาก ข้อเสียคือต้องจ่ายเงินก่อนโดยยังไม่ได้ของ และคุณภาพขึ้นกับปีที่ผลิต": "It means buying wine while it's still in oak barrels, 1-2 years before bottling (popular in Bordeaux). The upside is a lower price than at release and a chance to reserve rare wine. The downside is paying before you get the goods, and quality depends on the vintage",
  "เทอรัวร์ (Terroir) คืออะไร?": "What is terroir?",
  "คำนี้แปลตรงตัวว่า \"ดิน\" แต่จริงๆ หมายถึงทุกอย่างที่ทำให้ไร่หนึ่งต่างจากอีกไร่หนึ่ง — ชนิดดิน ความลาดชัน ทิศที่แดดส่อง ลม ปริมาณฝน และวิธีที่คนท้องถิ่นทำมาหลายชั่วอายุคน<br><br>ตัวอย่างที่ชัดที่สุด: ดินคิมเมอริดเจียนของ<b>ชาบลี</b>เต็มไปด้วยฟอสซิลหอยจากยุคที่บริเวณนั้นเป็นทะเล ทำให้ไวน์มีกลิ่นเปลือกหอยและแร่ธาตุ ส่วน<b>ปริโอรัต</b>ในสเปนปลูกบนหินชนวน (llicorella) ที่รากต้องชอนไชลึกมากเพื่อหาน้ำ ให้ผลที่เข้มข้นผิดปกติ": "The word literally means \"soil\", but really it's everything that makes one vineyard different from another — soil type, slope, sun direction, wind, rainfall, and how locals have worked it for generations<br><br>The clearest example: <b>Chablis'</b> Kimmeridgian soil is full of fossil shells from when the area was a sea, giving the wine shell and mineral notes. Spain's <b>Priorat</b> grows on slate (llicorella), where roots must dig very deep for water, giving unusually concentrated fruit",
  "องุ่นหลัก 8 พันธุ์ที่ควรรู้": "8 key grapes to know",
  "<b>แดง</b><br>• <b>Cabernet Sauvignon</b> — แทนนินสูง ลูกเกดดำ ซีดาร์ บ่มได้นาน (บอร์กโดซ์ซ้าย, นาปา, คูนาวาร์รา)<br>• <b>Merlot</b> — นุ่มกว่า พลัมสุก ดื่มได้เร็ว (ปอมเมอโรล, แซงเตมิญง)<br>• <b>Pinot Noir</b> — สีซีด กรดสูง เชอร์รี่แดง ดินชื้น เอาใจยาก (เบอร์กันดี, นิวซีแลนด์)<br>• <b>Syrah/Shiraz</b> — พริกไทยดำ ควัน ผลไม้ดำ (โรน, บารอสซา)<br>• <b>Nebbiolo</b> — สีซีดแต่แทนนินโหด กุหลาบ ทาร์ (บาโรโล, บาร์บาเรสโก)<br>• <b>Sangiovese</b> — กรดสูง เชอร์รี่เปรี้ยว มะเขือเทศ (เคียนติ, บรูเนลโล)<br><br><b>ขาว</b><br>• <b>Chardonnay</b> — เปลี่ยนหน้าตามที่ปลูก บางเบาที่ชาบลี อวบอ้วนที่นาปา<br>• <b>Sauvignon Blanc</b> — กรดจัด หญ้าสด เสาวรส (ลัวร์, มาร์ลโบโร)": "<b>Red</b><br>• <b>Cabernet Sauvignon</b> — high tannin, blackcurrant, cedar, ages long (Left Bank Bordeaux, Napa, Coonawarra)<br>• <b>Merlot</b> — softer, ripe plum, ready sooner (Pomerol, Saint-Émilion)<br>• <b>Pinot Noir</b> — pale, high acid, red cherry, damp earth, fussy to grow (Burgundy, New Zealand)<br>• <b>Syrah/Shiraz</b> — black pepper, smoke, dark fruit (Rhône, Barossa)<br>• <b>Nebbiolo</b> — pale but fiercely tannic, roses, tar (Barolo, Barbaresco)<br>• <b>Sangiovese</b> — high acid, sour cherry, tomato (Chianti, Brunello)<br><br><b>White</b><br>• <b>Chardonnay</b> — changes with where it's grown: lean in Chablis, plush in Napa<br>• <b>Sauvignon Blanc</b> — zesty acidity, cut grass, passion fruit (Loire, Marlborough)",
  "ไวน์ปลอมในโลกจริง": "Fake wine in the real world",
  "ตลาดไวน์สะสมประเมินว่ามีของปลอมหมุนเวียนอยู่หลายเปอร์เซ็นต์ โดยเฉพาะขวดเก่าหายากที่ตรวจสอบยาก<br><br><b>วิธีที่มิจฉาชีพใช้:</b> เติมไวน์ราคาถูกลงในขวดเก่าของจริง (ขวดเปล่าของ DRC ขายได้เป็นหมื่น), พิมพ์ฉลากปลอม, ปลอมจุกและซีล<br><br><b>สัญญาณเตือน:</b> ฉลากใหม่เกินไปสำหรับอายุขวด · ระดับน้ำในขวดสูงผิดปกติสำหรับไวน์อายุ 30 ปี · จุกไม่ตรงยุคการผลิต · ราคาถูกผิดปกติ · ที่มาของขวด (provenance) เล่าไม่ชัด<br><br><b>กฎเหล็ก:</b> ถ้าดีลดีเกินจริง มันมักจะไม่จริง": "The fine wine market estimates that several percent of bottles in circulation are fake, especially rare old bottles that are hard to verify<br><br><b>How fraudsters do it:</b> refill genuine old bottles with cheap wine (an empty DRC bottle sells for tens of thousands), print fake labels, fake the corks and seals<br><br><b>Warning signs:</b> a label too new for the bottle's age · a fill level unusually high for a 30-year-old wine · a cork from the wrong era · an unusually low price · an unclear provenance<br><br><b>Iron rule:</b> if a deal seems too good to be true, it usually is",
  "Drink Window — เปิดตอนไหนดี?": "Drink window — when to open it?",
  "ไวน์ที่บ่มได้จะผ่าน 4 ช่วง:<br><br>1. <b>ยังอ่อน</b> — แทนนินกระด้าง กลิ่นยังปิด ดื่มได้แต่เสียของ<br>2. <b>พร้อมดื่ม</b> — แทนนินนุ่มลง กลิ่นเริ่มซับซ้อน สมดุลที่สุด<br>3. <b>เลยพีค</b> — ผลไม้เริ่มจาง กลิ่นตติยภูมิ (หนัง เห็ด ยาสูบ) เด่นขึ้น บางคนชอบช่วงนี้ที่สุด<br>4. <b>เสื่อม</b> — กลายเป็นน้ำส้มสายชูและน้ำตาลไหม้<br><br>ไวน์ขาวส่วนใหญ่พีคที่ 2-5 ปี · แดงกลางๆ 5-10 ปี · บอร์กโดซ์ชั้นดีหรือบาโรโล 15-40 ปี · ซอแตร์นและวินเทจพอร์ตอาจข้ามศตวรรษ": "Ageworthy wine goes through 4 stages:<br><br>1. <b>Too young</b> — harsh tannins, closed aromas; drinkable but a waste<br>2. <b>Ready to drink</b> — tannins soften, aromas grow complex, the best balance<br>3. <b>Past peak</b> — fruit fades, tertiary aromas (leather, mushroom, tobacco) take over; some people love this stage most<br>4. <b>Declining</b> — it turns to vinegar and burnt sugar<br><br>Most whites peak at 2-5 years · medium reds at 5-10 · fine Bordeaux or Barolo at 15-40 · Sauternes and Vintage Port can last over a century",
  "Vintage สำคัญแค่ไหน?": "How much does vintage matter?",
  "ปีที่ผลิต (vintage) สำคัญมากในภูมิภาคที่อากาศแปรปรวน อย่างบอร์กโดซ์ เบอร์กันดี และแชมเปญ ปีที่ฝนตกช่วงเก็บเกี่ยวอาจทำให้องุ่นเจือจางหรือเน่า ปีที่แดดดีพอดีจะให้ไวน์ที่บ่มได้นานหลายสิบปี<br><br>ในทางกลับกัน ภูมิภาคที่อากาศเสถียร เช่น เมนโดซาหรือบารอสซา ความต่างระหว่างปีจะน้อยกว่ามาก<br><br>ปีที่แย่ก็มีข้อดี — ราคาถูกกว่ามาก และผู้ผลิตชั้นนำมักยังทำของดีได้ด้วยการคัดองุ่นเข้มงวดขึ้น": "The vintage matters a lot in regions with fickle weather, like Bordeaux, Burgundy and Champagne. Rain at harvest can dilute or rot the grapes; a year with just the right sun gives wines that age for decades<br><br>By contrast, in regions with steady weather like Mendoza or Barossa, the difference between years is much smaller<br><br>Bad vintages have an upside too — they're much cheaper, and top producers can still make great wine by sorting grapes more strictly",
  "ระบบจัดชั้นของแต่ละประเทศ": "Each country's classification system",
  "<b>ฝรั่งเศส</b> — AOC/AOP คุมว่าปลูกอะไรได้ที่ไหน บอร์กโดซ์ใช้ระบบ Growth ปี 1855 (ฝั่งซ้าย) และ Cru Bourgeois ระดับรอง เบอร์กันดีแบ่งตามแปลง: Grand Cru > Premier Cru > Village > Régional<br><br><b>อิตาลี</b> — DOCG (สูงสุด) > DOC > IGT > Vino ที่น่าสนใจคือ \"Super Tuscan\" หลายตัวเลือกใช้ IGT เพราะไม่ยอมทำตามกฎ DOC แต่คุณภาพสูงกว่ามาก<br><br><b>สเปน</b> — วัดที่เวลาบ่ม: Joven (ไม่บ่ม) > Crianza > Reserva > Gran Reserva (บ่มรวมอย่างน้อย 5 ปี)<br><br><b>เยอรมนี</b> — วัดที่ความสุกของน้ำตาลตอนเก็บ: Kabinett > Spätlese > Auslese > Beerenauslese > Trockenbeerenauslese": "<b>France</b> — AOC/AOP controls what can be planted where. Bordeaux uses the 1855 Growth system (Left Bank) and the lower Cru Bourgeois tier. Burgundy is classified by plot: Grand Cru > Premier Cru > Village > Régional<br><br><b>Italy</b> — DOCG (highest) > DOC > IGT > Vino. Interestingly, many \"Super Tuscans\" chose IGT because they refused to follow DOC rules, yet their quality is far higher<br><br><b>Spain</b> — measured by aging time: Joven (unaged) > Crianza > Reserva > Gran Reserva (at least 5 years in total)<br><br><b>Germany</b> — measured by sugar ripeness at harvest: Kabinett > Spätlese > Auslese > Beerenauslese > Trockenbeerenauslese",
  "สภาพคล่องและ Spread": "Liquidity and spread",
  "ไวน์หายากมี \"spread\" กว้าง — ส่วนต่างระหว่างราคาที่คุณซื้อได้ (Offer) กับราคาที่คุณขายได้ (Bid) เพราะมีคนซื้อขายน้อย พ่อค้าจึงต้องกันความเสี่ยงไว้มาก<br><br>ไวน์ระดับ Unicorn อาจมี spread 15-20% แปลว่าถ้าซื้อแล้วขายทันที คุณขาดทุนทันที ต้องรอให้ราคาวิ่งขึ้นเกิน spread ก่อนถึงจะเริ่มมีกำไร<br><br>ในทางกลับกัน ไวน์ตลาดกว้าง (tier ต่ำ) มี spread แคบ ซื้อขายคล่อง แต่ราคาก็ขึ้นช้ากว่าเช่นกัน": "Rare wines have a wide \"spread\" — the gap between the price you can buy at (Offer) and the price you can sell at (Bid) — because few people trade them, so merchants hedge a lot of risk<br><br>A Unicorn wine may have a 15-20% spread, meaning if you buy and sell immediately you lose right away. You need the price to rise past the spread before you start making a profit<br><br>On the other hand, widely traded wines (low tier) have narrow spreads and trade easily, but their prices rise more slowly too",
  "สปาร์กลิงไม่ได้มีแค่แชมเปญ": "Sparkling isn't just Champagne",
  "<b>Champagne</b> — หมักครั้งที่สองในขวด (méthode traditionnelle) นอนบนกากยีสต์นานเป็นปี ให้กลิ่นขนมปังปิ้งและบิสกิต ราคาสูงเพราะแรงงานและกฎเข้มงวด<br><br><b>Prosecco</b> — หมักครั้งที่สองในถังใหญ่ (Charmat) เร็วและถูกกว่า เน้นกลิ่นผลไม้สดและดอกไม้ ไม่มีกลิ่นยีสต์<br><br><b>Crémant</b> — ใช้วิธีเดียวกับแชมเปญแต่ผลิตนอกแคว้นแชมเปญ (บอร์โด, บูร์กอญ, ลัวร์) คุ้มค่าที่สุดในกลุ่ม<br><br><b>Cava</b> — วิธีเดียวกับแชมเปญ จากสเปน ใช้องุ่นพื้นเมือง": "<b>Champagne</b> — second fermentation in the bottle (méthode traditionnelle), resting on yeast lees for years, giving toast and biscuit notes. Pricey because of the labor and strict rules<br><br><b>Prosecco</b> — second fermentation in large tanks (Charmat), faster and cheaper, focused on fresh fruit and flowers, no yeasty notes<br><br><b>Crémant</b> — same method as Champagne but made outside the Champagne region (Bordeaux, Burgundy, Loire), the best value of the group<br><br><b>Cava</b> — same method as Champagne, from Spain, using native grapes",

  const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{ const t=n.nodeValue.trim(); if(t && EN[t]!==undefined) n.nodeValue=n.nodeValue.replace(t, EN[t]); });
  root.querySelectorAll('[title],[placeholder],[aria-label]').forEach(el=>{
    ['title','placeholder','aria-label'].forEach(a=>{ const v=el.getAttribute(a); if(v && EN[v]!==undefined) el.setAttribute(a, EN[v]); });
  });
  document.title = 'Cellar & Vine — Wine Shop & Cellar Game';
}

// A save keeps the names it was made with (customers, regulars, staff, party
// hosts…). Regular customers are matched by name, so after a language switch
// those names must be converted or the game loses track of who is who.
function migrateSaveLang(){
  const from = G.lang || 'th';
  if(from===LANG){ G.lang=LANG; return; }
  let map;
  if(LANG==='en') map = s => (typeof s==='string' && EN[s]!==undefined) ? EN[s] : s;
  else { const rev={}; for(const k in EN){ if(!(EN[k] in rev)) rev[EN[k]]=k; } map = s => (typeof s==='string' && rev[s]!==undefined) ? rev[s] : s; }
  const fields = (o, keys) => { if(o) keys.forEach(k=>{ if(typeof o[k]==='string') o[k]=map(o[k]); }); };
  (G.shopQueue||[]).forEach(c=>{
    fields(c, ['name','type']);
    const f = c.food && FOODS.find(x=>x.ic===c.food.ic);
    if(f) c.food = {...f};
    if(c.food) c.opener = `${T('คู่กับ')} ${c.food.name}${c.food.em||''} ${T('ควรดื่มอะไรดีครับ?')}`;
  });
  if(G.regulars){ const r={}; for(const k in G.regulars){ const v=G.regulars[k]; fields(v,['name']); r[map(k)]=v; } G.regulars=r; }
  (G.staff||[]).forEach(s=>fields(s,['name','role']));
  ((G.stats&&G.stats.reviews)||[]).forEach(r=>fields(r,['by']));
  (G.allocOffers||[]).forEach(o=>fields(o,['negociant','note']));
  fields(G.party, ['host','theme','flavor']);
  (G.contractOffers||[]).forEach(o=>fields(o,['chef','restaurant','menu']));
  (G.contracts||[]).forEach(o=>fields(o,['chef','restaurant','menu']));
  G.lang = LANG;
}

];
// week 1..12 within a year maps to months
function gameMonth(){ return ((G.week-1)%12); }              // 0..11
function monthName(){ return MONTHS[gameMonth()]; }
function gameSeason(){
  const m=gameMonth();
  if(m<=1||m===11) return SEASONS[0];      // Dec-Feb winter
  if(m<=4) return SEASONS[1];              // Mar-May spring
  if(m<=7) return SEASONS[2];              // Jun-Aug summer
  return SEASONS[3];                       // Sep-Nov harvest
}
function seasonDemand(){ return gameSeason().demand; }

];

function currentFestival(){
  const m=gameMonth();
  return FESTIVALS.find(f=>f.month===m) || null;
}

// How many weeks until the next festival, and which one.
function nextFestival(){
  const m=gameMonth();
  let best=null, dist=99;
  FESTIVALS.forEach(f=>{
    let d=(f.month-m+12)%12;
    if(d>0 && d<dist){ dist=d; best=f; }
  });
  return best ? {fest:best, weeks:dist} : null;
}

// Budget/traffic multipliers applied during a festival week.
function festivalBudgetMult(){ const f=currentFestival(); return f? f.budget : 1; }
function festivalTraffic(){ const f=currentFestival(); return f? f.traffic : 0; }
// A wine matching the festival's favoured style sells at a premium.
function festivalStyleBonus(w){
  const f=currentFestival();
  if(f && f.favor && wineStyle(w)===f.favor) return 1.18;
  return 1;
}

// seasonal preference: winter favours reds, summer favours whites/sparkling
function seasonPref(w){
  const s=gameSeason().k;
  const white=isWhiteWine(w);
  if(s==='winter') return white?0.94:1.07;
  if(s==='summer') return white?1.09:0.93;
  return 1;
}

          return `${T("บริจาคเงิน")} ${fmtK(cost)} ${T("(+ชื่อเสียง ★")}${rep})`;
        }},
        {label:T('ไม่ร่วมงาน'), tone:'ghost', cost:()=>0, do(){ return T('คุณปฏิเสธคำเชิญ'); }},
      ]
    },
    {
      key:'apprentice',
      title:T('เด็กฝึกงาน'),
      body:T('มีนักศึกษาด้านไวน์มาขอฝึกงาน ช่วงแรกอาจเลอะเทอะบ้าง แต่ถ้าอดทนสอน อาจช่วยงานร้านได้ดี'),
      opts:[
        {label:T('รับฝึกงาน'), tone:'gold', cost:()=>0, do(){
          // small permanent-ish rep boost + one-time cash tip from busy weeks
          const rep=3+Math.floor(Math.random()*5); G.rep+=rep;
          const bonus=Math.round(100000+Math.random()*200000); G.cash+=bonus; G.cash=Math.round(G.cash);
          return `${T("เด็กฝึกงานช่วยดึงลูกค้าใหม่ (+★")}${rep}, +${fmtK(bonus)} ${T("จากยอดขายที่เพิ่มขึ้น)")}`;
        }},
        {label:T('ปฏิเสธ'), tone:'ghost', cost:()=>0, do(){ return T('คุณบอกว่ายังไม่พร้อมรับคน'); }},

}

/* ============================================================
   CELLAR HAZARDS — a stored bottle is not a safe bottle. Power
   cuts spike the temperature, a burst pipe floods a rack, a bad
   cork lets a lot oxidise. Each hazard threatens part of the
   cellar, and the player can pay to prevent or mitigate it. This
   is the pressure behind "sell now or hold for the peak?": the
   longer you cellar, the more you expose to fate. Insurance and a
   maintained climate system soften the blow.
   ============================================================ */
const HAZARD_CHAPTER = 6;
function hazardsUnlocked(){ return G.chapter >= HAZARD_CHAPTER; }

const HAZARDS = [
  {key:'power',  name:T('ไฟดับ อุณหภูมิพุ่ง'), icon:'flame',
   blurb:T('ไฟดับทั้งย่านนานหลายชั่วโมง อุณหภูมิเซลลาร์พุ่งขึ้น ไวน์บางส่วนเสี่ยงเสียหายจากความร้อน'),
   hits:0.35, sev:0.5},
  {key:'flood',  name:T('ท่อน้ำแตก น้ำท่วมชั้น'), icon:'ice',
   blurb:T('ท่อประปาเก่าแตกกลางดึก น้ำท่วมชั้นล่างของเซลลาร์ ฉลากเปื่อยและจุกบางขวดเสีย'),
   hits:0.30, sev:0.6},
  {key:'cork',   name:T('จุกเสีย ไวน์ออกซิไดซ์'), icon:'flask',
   blurb:T('ตรวจพบล็อตหนึ่งใช้จุกคุณภาพต่ำ อากาศเข้าไปทำให้ไวน์เริ่มออกซิไดซ์'),
   hits:0.20, sev:0.7},
  {key:'pest',   name:T('แมลงกัดฉลาก'), icon:'search',
   blurb:T('พบแมลงในเซลลาร์กัดกินฉลากไวน์ ทำให้มูลค่านักสะสมลดลงแม้ไวน์ยังดี'),
   hits:0.25, sev:0.35},
];

function tickHazard(){
  if(!hazardsUnlocked()) return;
  if(G.party || G.auction || G._pendingEvent) return;
  if(G.week - (G.lastHazardWeek||0) < 10) return;
  // a well-maintained, insured cellar faces hazards far less often
  const upkeep = G.cellarUpkeep||0;
  let chance = 0.16 * (1.4 - upkeep*0.7);   // ~0.16 neglected, ~0.11 maintained
  if(G.cellarInsured) chance *= 0.85;
  if(cellarUsed() < 8) chance *= 0.4;        // little at stake, little risk
  if(Math.random() < chance){
    G.lastHazardWeek=G.week;
    G._pendingHazard=true;
  }
}

// choose a hazard and the lots it threatens, then present the choice
function showHazardEvent(){
  const hz=HAZARDS[Math.floor(Math.random()*HAZARDS.length)];
  G.hazardsSeen=(G.hazardsSeen||0)+1;
  // which lots are in the blast radius
  const ids=Object.keys(G.cellar).filter(id=>G.cellar[id].qty>0);
  const threatened=ids.filter(()=>Math.random()<hz.hits);
  const atRisk=threatened.length?threatened:ids.slice(0,1);
  const riskValue=atRisk.reduce((a,id)=>a+ (G.prices[id]*agingMult(id)*G.cellar[id].qty), 0);
  // cost to prevent scales with what is at stake, discounted by insurance
  let fixCost=Math.round(riskValue*0.12 + 60000);
  if(G.cellarInsured) fixCost=Math.round(fixCost*0.4);

  const m=document.getElementById('modal');
  m.innerHTML=`
    <div style="text-align:center;margin-bottom:6px">
      <div style="display:flex;justify-content:center;color:var(--down)">${lineIcon(hz.icon,36)}</div>
      <h3 style="justify-content:center;color:var(--down)">${hz.name}</h3>
    </div>
    <p style="font-size:14px;line-height:1.7;color:var(--ink);text-align:center;margin-bottom:12px">${hz.blurb}</p>
    <div class="hz-risk">
      ${lineIcon('cellar',15)} ${T("เสี่ยง")} ${atRisk.length} ${T("ล็อต · มูลค่ารวม")} ${fmtK(riskValue)}
      ${G.cellarInsured?`<span class="hz-ins">${lineIcon('shield',12)} ${T("มีประกัน")}</span>`:''}
    </div>
    <div id="hzOpts" style="margin-top:12px">
      <button class="btn gold big" id="hzFix" style="width:100%;margin-bottom:8px;justify-content:center" ${fixCost>G.cash?'disabled':''}>
        ${T("จัดการทันที (")}${fmtK(fixCost)})${fixCost>G.cash?T(' — เงินไม่พอ'):''}
      </button>
      <button class="btn sage big" id="hzAbsorb" style="width:100%;justify-content:center">
        ${T("ปล่อยไว้ — เสี่ยงเสียหายบางส่วน")}
      </button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
  sfx('alert');

  document.getElementById('hzFix').onclick=()=>{
    if(fixCost>G.cash){ toast(T('เงินสดไม่พอ'),'bad'); return; }
    G.cash-=fixCost; G.cash=Math.round(G.cash);
    floatMoney(-fixCost);
    G.cellarUpkeep=Math.min(1,(G.cellarUpkeep||0)+0.15);   // acting well keeps the cellar in shape
    hazardResult(hz, [], 0, T('คุณรับมือได้ทัน ไวน์ทุกขวดปลอดภัย เซลลาร์อยู่ในสภาพดีขึ้น'));
  };
  document.getElementById('hzAbsorb').onclick=()=>{
    // damage lands: each at-risk lot loses part of its quality/quantity
    let lostVal=0, lostBottles=0, ruined=[];
    atRisk.forEach(id=>{
      const c=G.cellar[id]; if(!c) return;
      const w=wineById(id);
      const before=G.prices[id]*agingMult(id)*c.qty;
      if(hz.key==='flood' || hz.key==='power'){
        // lose some bottles outright
        const loss=Math.max(1, Math.round(c.qty*hz.sev*(0.5+Math.random()*0.5)));
        c.qty=Math.max(0,c.qty-loss); lostBottles+=loss;
        if(c.qty<=0){ ruined.push(w?w.name:id); }
      } else {
        // quality damage (oxidation, label loss) — value drops, bottles remain
        c.quality=Math.max(40, Math.round((c.quality||82) - hz.sev*22));
      }
      sealLot(c);
      if(c.qty<=0) delete G.cellar[id];
      const after = G.cellar[id] ? G.prices[id]*agingMult(id)*G.cellar[id].qty : 0;
      lostVal += Math.max(0, before-after);
    });
    normalizeCellarLots(); pruneEmptyLots();
    // an insured cellar recovers most of the loss as a payout
    let payout=0;
    if(G.cellarInsured && lostVal>0){ payout=Math.round(lostVal*0.7); G.cash+=payout; G.cash=Math.round(G.cash); }
    G.cellarUpkeep=Math.max(0,(G.cellarUpkeep||0)-0.1);
    let msg='';
    if(lostVal<=0) msg=T('โชคดี ความเสียหายน้อยมาก แทบไม่กระทบ');
    else msg=`${T("เสียหาย")} ${fmtK(lostVal)}`+(lostBottles?` (${lostBottles} ${T("ขวด)")}`:'')+(ruined.length?` ${T("· หมดสภาพ:")} ${ruined.slice(0,3).join(', ')}`:'')+(payout?` ${T("· ประกันจ่ายคืน")} ${fmtK(payout)}`:'');
    hazardResult(hz, ruined, lostVal, msg);
  };
  modalFocusables();
}

function hazardResult(hz, ruined, lostVal, msg){
  const m=document.getElementById('modal');
  const good = lostVal<=0;
  m.innerHTML=`
    <div style="text-align:center;margin-bottom:10px">
      <div style="display:flex;justify-content:center;color:${good?'var(--up)':'var(--down)'}">${lineIcon(good?'check':hz.icon,30)}</div>
      <h3 style="justify-content:center">${hz.name}</h3>
    </div>
    <p style="font-size:14px;line-height:1.7;text-align:center;color:var(--ink);margin-bottom:16px">${msg}</p>
    <div class="row" style="justify-content:center"><button class="btn gold big" id="hzClose" data-focus="modal">${T("รับทราบ")}</button></div>`;
  document.getElementById('hzClose').onclick=()=>{ closeModal(); renderTop(); routePage(); };
  renderTop();
  modalFocusables();
}

function tickOpportunity(){

/* ============================================================
   MONTHLY PARTY — a wealthy host throws a big event roughly once
   a month and buys wine in BULK by the case. They don't care about
   perfect pairings; they need volume in a theme (a color or a price
   ceiling). This is the late-game sink that makes cheap wine matter:
   you can offload dozens of inexpensive bottles at a healthy bulk
   premium instead of serving them one customer at a time.
   Unlocked once the shop has a reputation (chapter 9+).
   ============================================================ */
const PARTY_CHAPTER = 9;
function partyUnlocked(){ return G.chapter >= PARTY_CHAPTER; }

const PARTY_HOSTS = [
  {host:T('มาดามศิริพร'),  theme:T('งานกาลาการกุศล'),   flavor:T('งานการกุศลประจำปี ต้องการไวน์เสิร์ฟแขกหลายร้อยคน')},
  {host:T('บริษัทเทวารัตน์'), theme:T('งานเลี้ยงบริษัท'),  flavor:T('งานเลี้ยงพนักงานสิ้นปี งบเยอะ แขกไม่ใช่ผู้เชี่ยวชาญ')},
  {host:T('โรงแรมแกรนด์'),  theme:T('บุฟเฟต์ไวน์'),      flavor:T('เปิดตัวห้องอาหารใหม่ ต้องการไวน์เติมบาร์จำนวนมาก')},
  {host:T('สโมสรริเวอร์ไซด์'), theme:T('ปาร์ตี้ริมน้ำ'),   flavor:T('ปาร์ตี้สมาชิกฤดูร้อน เน้นปริมาณมากกว่าความหายาก')},
  {host:T('คุณหญิงวิไล'),   theme:T('งานแต่งลูกสาว'),    flavor:T('งานแต่งหรู ต้องการไวน์คู่มื้อค่ำสำหรับแขกทั้งงาน')},
];

// how big / what the party wants scales with your reputation
function makePartyOffer(){
  const h=PARTY_HOSTS[Math.floor(Math.random()*PARTY_HOSTS.length)];
  const colorRoll=Math.random();
  const color = colorRoll<0.4?'red' : colorRoll<0.8?'white' : 'any';
  // bigger parties as the shop grows
  const repScale = 1 + Math.min(G.rep,300)/300*2;   // 1x..3x
  const need = Math.round((12 + Math.floor(Math.random()*18)) * repScale);   // ~12-90 bottles
  // parties buy affordable wine — a price ceiling keeps it to cheap/mid stock
  const maxTier = colorRoll<0.5 ? 2 : 3;
  // they pay a bulk premium over market for the convenience of one big sale
  const premium = 1.15 + Math.random()*0.25;   // +15%..40%
  return {
    id: G.partySeq++,
    host:h.host, theme:h.theme, flavor:h.flavor,
    color, maxTier, need, filled:0,
    premium: Math.round(premium*100)/100,
    weeksLeft: 3,                       // you have 3 weeks to fill it
    reward: Math.round(need*repScale),  // rep bonus on completion
  };
}

function partyEligible(w){
  const P=G.party; if(!P) return false;
  if(isRareLocked(w.id)) return false;
  if(w.tier > P.maxTier) return false;
  if(P.color==='red' && isWhiteWine(w)) return false;
  if(P.color==='white' && !isWhiteWine(w)) return false;
  return true;
}

function partyUnitPrice(w){
  const P=G.party; if(!P) return 0;
  return Math.round((G.prices[w.id]||w.base) * P.premium);
}

function tickParty(){
  if(!partyUnlocked()) return;
  if(G.party){
    G.party.weeksLeft--;
    if(G.party.weeksLeft<=0){
      // party happens whether or not you filled it
      if(G.party.filled>=G.party.need){
        // (completion is normally handled at fill time; this is a safety net)
      } else if(G.party.filled>0){
        G.news.push({mult:1, msg:`${T("🎉 งาน")}${G.party.theme}${T("ของ")}${G.party.host}${T("จบลง — คุณส่งไวน์ได้")} ${G.party.filled}/${G.party.need} ${T("ขวด")}`});
      } else {
        G.news.push({mult:1, msg:`${T("งาน")}${G.party.theme}${T("ของ")}${G.party.host}${T("ผ่านไป โดยไม่ได้ใช้บริการร้านคุณ")}`});
      }
      G.party=null;
    }
    return;
  }
  // roughly one party per month (12 weeks), only when none is active
  if(G.week - (G.lastPartyWeek||0) >= 11 && Math.random()<0.55){
    G.party=makePartyOffer();
    G.lastPartyWeek=G.week;
    G.news.push({mult:1, msg:`🎉 ${G.party.host}${T("กำลังจัด")}${G.party.theme}${T("! ต้องการไวน์")}${G.party.color==='red'?T('แดง'):G.party.color==='white'?T('ขาว'):''} ${G.party.need} ${T("ขวด (ดูหน้าธุรกิจ)")}`});
    setTimeout(()=>toast(`${T("🎉 มีงานปาร์ตี้!")} ${G.party?G.party.host:''} ${T("ต้องการไวน์จำนวนมาก")}`,'gold'), 600);
  }
}

// sell bottles of one wine into the active party
function fillParty(id, qty){
  const P=G.party; if(!P){ toast(T('ไม่มีงานปาร์ตี้ตอนนี้'),'bad'); return; }
  const w=wineById(id); if(!w){ toast(T('ไม่พบไวน์นี้'),'bad'); return; }
  if(!partyEligible(w)){ toast(T('ไวน์นี้ไม่ตรงธีมงาน'),'bad'); return; }
  const c=G.cellar[id];
  const avail=c?Math.max(0,c.qty-(c.suspect||0)):0;
  if(avail<1){ toast(T('ไม่มีไวน์นี้ในคลัง (หรือเป็นของต้องสงสัย)'),'bad'); return; }
  const want=Math.min(safeQty(qty), avail, P.need-P.filled);
  if(want<1){ toast(T('งานนี้ได้ไวน์ครบแล้ว'),'bad'); return; }
  const unit=partyUnitPrice(w);
  const gain=unit*want;
  c.qty-=want; sealLot(c);
  if(c.qty<=0) delete G.cellar[id];
  G.cash+=gain; G.cash=Math.round(G.cash);
  floatMoney(gain);
  P.filled+=want;
  G.stats.bottlesSold=(G.stats.bottlesSold||0)+want;
  G._weekRevenue=(G._weekRevenue||0)+gain;
  sfx('cash');
  if(P.filled>=P.need){
    // completed! bonus cash + reputation
    const bonus=Math.round(P.need*partyAvgPrice()*0.1);
    G.cash+=bonus; G.cash=Math.round(G.cash);
    G.rep+=P.reward;
    G.partiesDone=(G.partiesDone||0)+1;
    questProgress('party',1);
    G.news.push({mult:1, msg:`${T("🏆 จัดไวน์ครบงาน")}${P.theme}${T("ของ")}${P.host}${T("! โบนัส")} ${fmtK(bonus)} ${T("+ ชื่อเสียง ★")}${P.reward}`});
    setTimeout(()=>sfx('fanfare'),150);
    toast(`${T("🎉 ส่งไวน์ครบงาน! โบนัส")} ${fmtK(bonus)} + ★${P.reward}`,'gold');
    G.party=null;
    checkAchievements();
  } else {
    toast(`${T("🍷 ส่ง")} ${w.cuvee||w.name} ×${want} ${T("เข้างาน (+")}${fmtK(gain)}${T(") — เหลืออีก")} ${P.need-P.filled} ${T("ขวด")}`,'good');
  }
  normalizeCellarLots();
  renderTop(); routePage();
}

function partyAvgPrice(){
  const P=G.party; if(!P) return 0;
  const pool=WINES.filter(partyEligible);
  if(!pool.length) return 0;
  return pool.reduce((a,w)=>a+partyUnitPrice(w),0)/pool.length;
}

/* ============================================================
   RARE-WINE UNLOCKS — the very rarest bottles are not for sale
   at the start. Each is a "unicorn" you earn access to by a
   distinct achievement. Once unlocked it appears on the market
   like any other wine (subject to normal scarcity/stock).
   ============================================================ */
const RARE_UNLOCKS = [
  {id:'w200', cond:g=>g.stats.perfectPairs>=25,
   how:T('จับคู่ไวน์สมบูรณ์แบบ 25 ครั้ง'),
   flavor:T('เจ้าของโดเมนเห็นแวว จึงยอมปล่อยขวดในลิสต์รอให้เธอ')},
  {id:'w201', cond:g=>g.rep>=150,
   how:T('ชื่อเสียงถึง ★150'),
   flavor:T('ชื่อของเธอดังพอที่ négociant จะเปิดโควตาลับให้')},
  {id:'w202', cond:g=>(g.contractsDone||0)>=3,
   how:T('ส่งครบสัญญาร้านอาหาร 3 ฉบับ'),
   flavor:T('เชฟมิชลินแนะนำเธอต่อให้ผู้นำเข้าที่ถือขวดหายาก')},

const RARE_IDS = RARE_UNLOCKS.map(u=>u.id);
function isRareLocked(id){
  return RARE_IDS.includes(id) && !(G.unlockedWines&&G.unlockedWines[id]);
}
function checkRareUnlocks(){
  G.unlockedWines=G.unlockedWines||{}; G.unlockSeen=G.unlockSeen||{};
  for(const u of RARE_UNLOCKS){
    if(G.unlockedWines[u.id]) continue;
    let met=false; try{ met=u.cond(G); }catch(e){ met=false; }
    if(met){
      G.unlockedWines[u.id]=true;
      // seed market stock so it can actually be bought
      const w=wineById(u.id);
      if(w){ G.stock=G.stock||{}; if(!G.stock[u.id]) G.stock[u.id]=baseStockFor(w); }
      if(!G.unlockSeen[u.id]){
        G.unlockSeen[u.id]=true;
        const nm=w?w.name:u.id;
        G.news.push({mult:1, msg:`${T("🔓 ปลดล็อกไวน์หายาก:")} ${nm} — ${u.flavor}`});
        setTimeout(()=>{ sfx('levelup'); toast(`${T("🔓 ปลดล็อก:")} ${nm}!`,'gold'); }, 700);
      }

  }
}

/* ============================================================
   ALLOCATION — you cannot simply buy the rarest wine. A negociant
   forces you to take slow-moving stock alongside it. Unlocked by
   the story (chapter 10, "นักสะสมระดับโลก").
   ============================================================ */
const ALLOC_CHAPTER = 10;
function allocUnlocked(){ return G.chapter >= ALLOC_CHAPTER; }

const NEGOCIANTS = [
  {name:T('เมซง ดูว์ปองต์'),  style:T('เข้มงวดเรื่องโควตา ไม่ต่อรอง')},
  {name:T('กาซา แบร์นินี'),   style:T('ชอบผลักสต๊อกภูมิภาครองออกมาพร้อมของดี')},
  {name:T('บอร์กโดซ์ เพลส'),  style:T('ขายเป็นลังผสม ไม่แยกขาย')},
];

// The trophy bottle you actually want, plus filler you must absorb.
function makeAllocOffer(){
  const stars = WINES.filter(w=>w.tier>=4 && !isRareLocked(w.id));
  if(!stars.length) return null;
  const star = stars[Math.floor(Math.random()*stars.length)];
  const starQty = 1 + (Math.random()<0.3?1:0);
  // filler: cheaper wines, ideally from the same region so it reads as a real book
  const pool = WINES.filter(w=>w.tier<=2 && w.id!==star.id && !isRareLocked(w.id));
  const sameRegion = pool.filter(w=>w.region===star.region);
  const src = sameRegion.length>=3 ? sameRegion : pool;
  const bundle=[];
  const nKinds = 2 + Math.floor(Math.random()*3);
  const used={};
  for(let i=0;i<nKinds && src.length;i++){
    const f = src[Math.floor(Math.random()*src.length)];
    if(used[f.id]) continue;
    used[f.id]=true;
    bundle.push({id:f.id, qty: 2 + Math.floor(Math.random()*4)});
  }
  if(!bundle.length) return null;
  // price: the star at a genuine discount, the filler at full freight
  const starPrice = (G.prices[star.id]||star.base) * starQty * 0.82;
  const fillPrice = bundle.reduce((a,b)=>a+(G.prices[b.id]||wineById(b.id).base)*b.qty, 0);
  const neg = NEGOCIANTS[Math.floor(Math.random()*NEGOCIANTS.length)];
  return {
    id: G.allocSeq++,
    negociant: neg.name,
    note: neg.style,
    wineId: star.id,
    qty: starQty,
    bundle,
    price: Math.round(starPrice + fillPrice),
    starValue: Math.round((G.prices[star.id]||star.base)*starQty),
    fillValue: Math.round(fillPrice),
    expires: G.week + 3,
  };
}

function allocBottles(o){ return o.qty + o.bundle.reduce((a,b)=>a+b.qty,0); }

function tickAllocations(){
  if(!allocUnlocked()) return;
  G.allocOffers = (G.allocOffers||[]).filter(o=>o.expires > G.week);
  if(G.allocOffers.length >= 2) return;
  if(Math.random() < 0.45){
    const o = makeAllocOffer();
    if(o){
      G.allocOffers.push(o);
      G.news.push({mult:1, msg:`📦 ${o.negociant} ${T("เสนอโควตา")} ${wineById(o.wineId).name} ${T("— ต้องรับไวน์พ่วงด้วย (ดูหน้าโควตา)")}`});
    }
  }
}

function acceptAlloc(offerId){
  const o=(G.allocOffers||[]).find(x=>x.id===offerId); if(!o) return;
  const need = allocBottles(o);
  if(cellarUsed()+need > cellarCapacity()){
    toast(`${T("เซลลาร์ไม่พอ ต้องมีที่ว่าง")} ${need} ${T("ขวด")}`,'bad'); return;
  }
  if(o.price > G.cash){ toast(T('เงินสดไม่พอรับโควตานี้'),'bad'); return; }
  G.cash -= o.price;
  floatMoney(-o.price);
  const yr=gameYear();
  const add=(id,qty,unit)=>{
    const c=G.cellar[id];
    if(c){ sealLot(c); c.buyPrice=(c.buyPrice*c.qty+unit*qty)/(c.qty+qty); c.qty+=qty; }
    else { G.cellar[id]={qty, buyWeek:G.week, buyPrice:Math.round(unit), vintage:yr,
                         quality:vintageRating(id,yr), fake:0, suspect:0}; sealLot(G.cellar[id]); }
  };
  add(o.wineId, o.qty, o.starValue/Math.max(1,o.qty)*0.82);
  for(const b of o.bundle) add(b.id, b.qty, (G.prices[b.id]||wineById(b.id).base));
  G.allocOffers=G.allocOffers.filter(x=>x.id!==offerId);
  G.allocTaken=(G.allocTaken||0)+1;
  G.stats.bottlesBought+=need;
  normalizeCellarLots();
  sfx('cash');
  toast(`${T("📦 รับโควตาจาก")} ${o.negociant} ${T("— ได้")} ${wineById(o.wineId).name} ×${o.qty} ${T("พร้อมของพ่วง")} ${need-o.qty} ${T("ขวด")}`,'gold');
  closeModal(); checkAchievements(); renderTop(); routePage();
}

function passAlloc(offerId){
  G.allocOffers=(G.allocOffers||[]).filter(x=>x.id!==offerId);
  G.allocPassed=(G.allocPassed||0)+1;
  sfx('click');
  toast(T('ปฏิเสธโควตานี้แล้ว'),'');
  closeModal(); routePage();
}

/* ============================================================
   B2B CONTRACTS — a Michelin kitchen wants a fixed weekly
   delivery. Guaranteed money, but you must never come up short.
   Unlocked by the story (chapter 12, "ค่ำคืนของป้าโรซ่า").
   ============================================================ */
const CONTRACT_CHAPTER = 12;
function contractsUnlocked(){ return G.chapter >= CONTRACT_CHAPTER; }

const CHEFS = [
  {chef:T('เชฟอากิระ'),   rest:'Kaiseki Nine',    menu:T('คอร์สปลาดิบและดาชิ'),      want:{white:true}},
  {chef:T('เชฟมาร์โก'),   rest:'Osteria Rossa',   menu:T('พาสต้าราคุและเนื้อตุ๋น'),   want:{red:true}},
  {chef:T('เชฟปิแอร์'),   rest:'La Douzieme',     menu:T('เป็ดรมควันซอสเชอร์รี่'),    want:{red:true}},
  {chef:T('เชฟนภา'),      rest:T('ห้องอาหารบ้านสวน'), menu:T('อาหารไทยรสจัดร่วมสมัย'),   want:{white:true}},
  {chef:T('เชฟเอเลน่า'),  rest:'Brasa',           menu:T('เนื้อย่างถ่านและผักรมควัน'), want:{red:true}},
];

function makeContractOffer(){
  const c = CHEFS[Math.floor(Math.random()*CHEFS.length)];
  const pool = WINES.filter(w=>{
    if(isRareLocked(w.id)) return false;
    const white = isWhiteWine(w);
    if(c.want.white && !white) return false;
    if(c.want.red && white) return false;
    return w.tier>=2 && w.tier<=4;
  });
  if(!pool.length) return null;
  const w = pool[Math.floor(Math.random()*pool.length)];
  const perWeek = 2 + Math.floor(Math.random()*3);
  const weeks = 8;
  // pays above the current bid, locked for the whole term — that is the gamble
  const unit = Math.round((G.prices[w.id]||w.base) * (1.28 + Math.random()*0.22));
  return {
    id: G.contractSeq++,
    chef:c.chef, restaurant:c.rest, menu:c.menu,
    wineId:w.id, perWeek, weeksLeft:weeks, totalWeeks:weeks,
    price:unit, missed:0, delivered:0,
    expires: G.week + 2,
    pending:true,
  };
}

function tickContractOffers(){
  if(!contractsUnlocked()) return;
  G.contractOffers = (G.contractOffers||[]).filter(o=>o.expires > G.week);
  const active=(G.contracts||[]).length;
  if(active>=3 || G.contractOffers.length>=2) return;
  if(Math.random() < 0.35){
    const o=makeContractOffer();
    if(o){
      G.contractOffers.push(o);
      G.news.push({mult:1, msg:`🍽️ ${o.chef} ${T("แห่ง")} ${o.restaurant} ${T("เสนอสัญญาส่งไวน์")} ${o.totalWeeks} ${T("สัปดาห์ (ดูหน้าสัญญา)")}`});
    }
  }
}

function signContract(offerId){
  const o=(G.contractOffers||[]).find(x=>x.id===offerId); if(!o) return;
  o.pending=false;
  // the supplier immediately sets aside enough for the first deliveries
  G.stock=G.stock||{};
  G.stock[o.wineId]=Math.max(G.stock[o.wineId]||0, o.perWeek*3);
  G.contracts=G.contracts||[];
  G.contracts.push(o);
  G.contractOffers=G.contractOffers.filter(x=>x.id!==offerId);
  sfx('great');
  toast(`${T("✍️ เซ็นสัญญากับ")} ${o.chef} ${T("— ส่ง")} ${wineById(o.wineId).cuvee||wineById(o.wineId).name} ${T("สัปดาห์ละ")} ${o.perWeek} ${T("ขวด")}`,'gold');
  closeModal(); routePage();
}

function declineContract(offerId){
  G.contractOffers=(G.contractOffers||[]).filter(x=>x.id!==offerId);
  sfx('click'); toast(T('ปฏิเสธสัญญาแล้ว'),'');
  closeModal(); routePage();
}

// Deliveries are settled every week inside nextWeek().
function settleContracts(){
  if(!G.contracts || !G.contracts.length) return {paid:0, failed:0};
  let paid=0, failed=0;
  const keep=[];
  for(const k of G.contracts){
    const c=G.cellar[k.wineId];
    const have = c ? Math.max(0, c.qty-(c.suspect||0)) : 0;
    if(have >= k.perWeek){
      c.qty -= k.perWeek;
      sealLot(c);   // qty shrank: fake/suspect must be re-clamped under it
      if(c.qty<=0) delete G.cellar[k.wineId];
      const gain = k.price*k.perWeek;
      G.cash += gain; paid += gain;
      k.delivered += k.perWeek;
      k.weeksLeft--;
      G._weekRevenue=(G._weekRevenue||0)+gain;
    } else {
      // short delivery. The first slip is a warning; after that it costs.
      k.missed++; failed++;
      k.weeksLeft--;
      if(k.missed===1){
        G.news.push({mult:1, msg:`${T("⚠️ ส่งไวน์ให้")} ${k.restaurant} ${T("ไม่ครบสัปดาห์นี้ — เชฟให้อภัยครั้งเดียว รีบหาไวน์เพิ่ม!")}`});
      } else {
        const pen = Math.round(k.price*k.perWeek*0.35);
        G.cash -= pen;
        G.rep = Math.max(0, G.rep-3);
        G.news.push({mult:1, msg:`${T("⚠️ ส่งไวน์ให้")} ${k.restaurant} ${T("ไม่ครบ — เสียค่าปรับ")} ${fmtK(pen)} ${T("และชื่อเสียง −★3")}`});
      }
    }
    if(k.weeksLeft>0){ keep.push(k); }
    else {
      if(k.missed<=1){
        const bonus=Math.round(k.price*k.perWeek*(k.missed===0?1.5:0.8));
        G.cash+=bonus; G.rep+=(k.missed===0?8:4);
        G.contractsDone=(G.contractsDone||0)+1;
        G.news.push({mult:1, msg:`${T("🏆 ส่งครบสัญญาให้")} ${k.restaurant}${T("! โบนัส")} ${fmtK(bonus)} ${T("+ ชื่อเสียง ★8")}`});
      } else {
        G.contractsFailed=(G.contractsFailed||0)+1;
        G.news.push({mult:1, msg:`${T("สัญญากับ")} ${k.restaurant} ${T("จบลง (ส่งขาด")} ${k.missed} ${T("ครั้ง)")}`});
      }
    }
  }
  G.contracts=keep;
  normalizeCellarLots();
  return {paid, failed};
}

/* ============================================================
   BANK — emergency loans so a cash-out player can keep playing.
   Interest is charged every week; the debt is real, but it is
   always better than a dead save.
   ============================================================ */
const LOAN_TIERS = [
  {id:'small',  amt:2500000,   rate:0.020, name:T('สินเชื่อฉุกเฉิน'),      desc:T('ก้อนเล็ก ดอกต่ำ เหมาะกับการกู้วิกฤตระยะสั้น')},
  {id:'medium', amt:9000000,  rate:0.030, name:T('สินเชื่อธุรกิจ'),        desc:T('ก้อนกลาง ใช้ต่อลมหายใจและกลับมาซื้อของได้อีกครั้ง')},
  {id:'large',  amt:30000000,  rate:0.042, name:T('สินเชื่อขยายกิจการ'),    desc:T('ก้อนใหญ่ ดอกสูง ใช้เมื่อต้องพลิกเกมจริงๆ')},
];

function loanDebt(){ return (G.loans||[]).reduce((a,l)=>a+l.owed,0); }
function loanWeeklyInterest(){ return Math.round((G.loans||[]).reduce((a,l)=>a+l.owed*l.rate,0)); }

// how much the bank is willing to lend, based on what the player can back it with
function creditLimit(){
  const assets = Math.max(0, portfolioValue()) + Math.max(0, G.cash);
  const repBonus = G.rep*70000;
  return Math.max(2500000, Math.round(assets*0.85 + repBonus + 3000000));
}
function canBorrow(amt){ return loanDebt()+amt <= creditLimit(); }

function takeLoan(tierId){
  const t=LOAN_TIERS.find(x=>x.id===tierId); if(!t) return;
  if(!canBorrow(t.amt)){
    toast(T('วงเงินไม่พอ — ขายไวน์บางส่วนหรือลดหนี้ก่อน'),'bad'); return;
  }
  G.loans=G.loans||[];
  G.loans.push({id:G.loanSeq++, principal:t.amt, owed:t.amt, rate:t.rate, tookWeek:G.week});
  G.cash += t.amt;
  sfx('cash');
  toast(`${T("🏦 อนุมัติ")} ${t.name} +${fmtK(t.amt)} ${T("· ดอกเบี้ย")} ${(t.rate*100).toFixed(1)}${T("%/สัปดาห์")}`,'gold');
  closeModal(); renderTop(); routePage();
}

function repayLoan(loanId, amount){
  const l=(G.loans||[]).find(x=>x.id===loanId); if(!l) return;
  const pay=Math.min(amount, l.owed, G.cash);
  if(pay<=0){ toast(T('เงินสดไม่พอชำระ'),'bad'); return; }
  G.cash-=pay; l.owed-=pay;
  if(l.owed<=1){
    G.loans=G.loans.filter(x=>x.id!==loanId);
    sfx('great');
    toast(T('✅ ปิดหนี้ก้อนนี้เรียบร้อย!'),'gold');
  } else {
    sfx('cash');
    toast(`${T("ชำระ")} ${fmtK(pay)} ${T("· เหลือหนี้")} ${fmtK(l.owed)}`,'good');
  }
  renderTop(); routePage();
}

// charged inside nextWeek()
function accrueLoans(){
  if(!G.loans || !G.loans.length) return 0;
  const interest = loanWeeklyInterest();
  if(interest<=0) return 0;
  if(G.cash >= interest){
    G.cash -= interest;
    G.totalInterestPaid=(G.totalInterestPaid||0)+interest;
  } else {
    // can't pay: the unpaid interest is capitalised onto the debt
    const short = interest - Math.max(0,G.cash);
    if(G.cash>0){ G.totalInterestPaid=(G.totalInterestPaid||0)+G.cash; G.cash=0; }
    else G.cash=0;
    const per = short/G.loans.length;
    G.loans.forEach(l=>{ l.owed=Math.round(l.owed+per); });
    G.missedPayments=(G.missedPayments||0)+1;
    if(G.missedPayments%3===0 && G.rep>0){ G.rep=Math.max(0,G.rep-1); }
    toast(`${T("⚠️ จ่ายดอกเบี้ยไม่ไหว")} ${fmtK(short)} ${T("ถูกทบเข้าเงินต้น")}`,'bad');
  }
  return interest;
}

// Offer a rescue when the player is genuinely stuck: no cash, nothing sellable.
function isStuck(){
  if(G.cash > 0) return false;
  const sellable = Object.keys(G.cellar||{}).some(id=>{
    const c=G.cellar[id]; return c && c.qty>0 && (c.qty-(c.suspect||0))>0;
  });
  return !sellable;
}

function weeklyCosts(){ return weeklySalaries() + weeklyRent() + (G.cellarInsured?insuranceWeekly():0); }

// Renders a term with a small "?" affordance that reveals its definition.
function term(key, label){
  const g=GLOSSARY[key]; if(!g) return label||key;
  return `<span class="gloss" data-gloss="${key}" tabindex="0" role="button"
    aria-label="${g.t}: ${g.d}">${label||g.t}<span class="gloss-q">?</span></span>`;
}

function showGlossary(key){
  const g=GLOSSARY[key]; if(!g) return;
  const m=document.getElementById('modal');
  m.innerHTML=`
    <div style="text-align:center;margin-bottom:8px">
      <div style="display:flex;justify-content:center">${lineIcon('book',30)}</div>
      <h3 style="justify-content:center">${g.t}</h3>
    </div>
    <p style="font-size:14px;line-height:1.8;color:var(--ink);text-align:center;margin-bottom:16px">${g.d}</p>
    <div class="row" style="justify-content:center"><button class="btn gold big" id="glClose" data-focus="modal">${T("เข้าใจแล้ว")}</button></div>`;
  document.getElementById('modalBg').classList.add('show');
  document.getElementById('glClose').onclick=closeModal;
  modalFocusables();
}

    normal: `${sun(25,13,6)}${cloud(6,26)}`,
    rain: `${cloud(6,20,'#C9D3DA','#7D8C98')}${[[12,28],[18,31],[24,28],[30,31],[15,35],[27,35]].map(([x,y])=>`<path d="M${x} ${y}l-1.6 3.2" stroke="#4A88B8" stroke-width="2" stroke-linecap="round"/>`).join('')}`,

}

/* ---------- illustrated page banners ---------- */
const PAGE_BANNER = { shop:'shop', story:'letter', market:'market', cellar:'cellarwide', portfolio:'auction', primeur:'vineyard',
  biz:'street', staff:'shopnight', stats:'toast', guide:'door', learn:'cellar', settings:'title' };
function bannerArt(kind){
  const scene=['cellar','shop','market','auction','street','dream'];
  try{ return scene.includes(kind) ? sceneBG(kind) : cutsceneArt(kind); }catch(e){ return ''; }
}
// wrap the page title block in an illustrated banner after each page render
function decoratePageHead(page){
  if(fxLevel()==='off') return;
  const head=document.querySelector('#content > .page-head');
  if(!head || head.classList.contains('has-banner')) return;
  const kind=PAGE_BANNER[page]; if(!kind) return;
  const art=bannerArt(kind); if(!art) return;
  head.classList.add('has-banner');
  const bg=document.createElement('div'); bg.className='banner-art'; bg.setAttribute('aria-hidden','true'); bg.innerHTML=art;
  head.insertBefore(bg, head.firstChild);
}

let csCards=[], csStep=0, csIsEnding=false, csIsReplay=false;
function playCutscene(cards, isEnding, isReplay){
  csCards=cards; csStep=0; csIsEnding=!!isEnding; csIsReplay=!!isReplay;
  // A cutscene is a moment — give it music even if ambient BGM is off, then
  // restore whatever the player had afterwards.
  try{
    csPrevBgm = DISP.bgm;
    const ac=audioCtx();
    if(ac){ if(ac.state==='suspended') ac.resume(); if(!BGM) startBGM(); }
  }catch(e){}
  renderCutscene();
}
let csPrevBgm=false;
function endCutsceneMusic(){
  try{ if(!csPrevBgm && BGM) stopBGM(); }catch(e){}
}
function renderCutscene(){
  const card=csCards[csStep];
  const last=csStep>=csCards.length-1;
  const m=document.getElementById('modal');
  m.className='modal cs-modal';
  const isTitle = card.art==='title';
  m.innerHTML=`
    <div class="cs-stage">
      <div class="cs-art" id="csArt">${cutsceneArt(card.art)}</div>
      <div class="cs-vignette"></div>
      ${isTitle?`<div class="cs-titlecard">
          <div class="cs-title-main">Cellar &amp; Vine</div>
          <div class="cs-title-sub">${csIsEnding?T('จบบริบูรณ์ · ขอบคุณที่ร่วมเดินทาง'):T('ร้านไวน์ &amp; เซลลาร์')}</div>
        </div>`
        :`<div class="cs-narr" id="csNarr">${card.text}</div>`}
    </div>
    <div class="cs-foot">
      <span class="cs-count">${csStep+1} / ${csCards.length}</span>
      <div class="row" style="gap:8px">
        ${!last?`<button class="btn ghost" id="csSkip" data-focus="modal">${T("ข้าม")}</button>`:''}
        <button class="btn ${last?'gold big':''}" id="csNext" data-focus="modal">${last?(csIsEnding?T('จบเกม'):T('เริ่มเรื่องราว')):T('ถัดไป ▶')}</button>
      </div>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
  // fade the panel in
  const art=document.getElementById('csArt');
  if(art){ art.style.opacity='0'; requestAnimationFrame(()=>{ art.style.opacity='1'; }); }
  const nr=document.getElementById('csNarr');
  if(nr){ nr.style.opacity='0'; setTimeout(()=>{ nr.style.opacity='1'; }, 260); }
  if(isTitle) sfx('fanfare'); else sfx('page');
  const finish=()=>{
    closeModal();
    endCutsceneMusic();
    if(csIsReplay){ renderTop(); routePage(); return; }   // just watching it again
    if(csIsEnding){ G.endingSeen=true; saveGame(true); renderTop(); routePage(); }
    else {
      G.introSeen=true; saveGame(true);
      // new players get the tutorial first, then chapter 0's scene
      if(!G.tutDone) setTimeout(showTutorial, 300);
      else setTimeout(()=>maybeShowChapterScene(), 300);
    }
  };
  const next=document.getElementById('csNext');
  if(next) next.onclick=()=>{ if(last) finish(); else { csStep++; renderCutscene(); } };
  const skip=document.getElementById('csSkip');
  if(skip) skip.onclick=finish;
  modalFocusables();
}

// Show the ending once the last chapter has been completed.
function maybeShowEnding(){
  if(G.endingSeen) return false;
  if(G.chapter < CHAPTERS.length) return false;
  G.endingSeen=true;
  saveGame(true);
  setTimeout(()=>playCutscene(buildEndingCards(), true), 400);
  return true;
}

  {icon:'bell', t:T('เสียงและเพลงประกอบ'), d:T('เกมมี<b>เอฟเฟกต์เสียง</b>ครบทุกจังหวะ — เปิดจุกไวน์ รินไวน์ เคาะค้อนประมูล เสียงเงิน และแตรแฟนแฟร์เมื่อทำสำเร็จ<br><br>🎵 <b>เพลงประกอบ (BGM)</b> เป็นดนตรีบรรยากาศแบบสังเคราะห์สดๆ — คอร์ดอุ่นๆ กับทำนองเบาๆ ให้ฟีลร้านไวน์หรู วนไม่ซ้ำ ปรับระดับเสียงได้<br><br>เปิด/ปิดเสียงและเพลงแยกกันได้ที่หน้า <b>ตั้งค่า</b> · เพลงจะเริ่มหลังแตะหน้าจอครั้งแรก (ข้อจำกัดของเบราว์เซอร์) ทั้งหมดสร้างในเกม ไม่ต้องโหลดไฟล์เสียง เหมาะกับเน็ตในรถ')},
  {icon:'chart', t:T('ลงทุนบ่มไวน์ให้ได้กำไร (พอร์ตระยะยาว)'), d:T('ไม่จำเป็นต้องขายไวน์ทุกขวดในร้าน — <b>ไวน์ชั้นดี (tier 4-5) ยิ่งเก็บนานยิ่งมีมูลค่า</b> ขวดกร็องด์ครูที่บ่ม 2 ปีอาจมีมูลค่าเพิ่ม +30% ถึง +150% ขึ้นกับจังหวะตลาด<br><br>📈 <b>ตลาดรองเป็นสองทาง</b> (มีขึ้นมีลง วิ่งกลับเข้าหาราคายุติธรรมเสมอ) — กลยุทธ์คือ <b>ซื้อตอนราคาตก เก็บบ่ม ขายตอนพีค</b> ดูกราฟราคาย้อนหลังและข่าวเพื่อจับจังหวะ<br><br>ไวน์ tier ต่ำ (1-2) บ่มแล้วไม่ค่อยขึ้น (เหมาะดื่ม/ขายเร็ว) แต่ไวน์แพงคือสินทรัพย์ลงทุนจริง — แบ่งเซลลาร์ส่วนหนึ่งเก็บของดีไว้ยาวๆ ดูกำไร/ขาดทุนแต่ละขวดได้ที่หน้า <b>พอร์ต</b><br><br>💡 กระจายความเสี่ยง: อย่าทุ่มเงินสดทั้งหมดกับการเก็บของ ต้องมีสภาพคล่องจ่ายค่าเช่า/เงินเดือนด้วย')},
  {icon:'bulb', t:T('เหตุการณ์พิเศษคืออะไร? (ปลดล็อกบทที่ 5)'), d:T('เป็นครั้งคราวจะมี<b>เหตุการณ์ให้เลือกตัดสินใจ</b>โผล่มาหลังจบสัปดาห์ เช่น มรดกตกทอด (ซื้อเหมาไวน์เสี่ยงของปลอม) · นักวิจารณ์แวะเยี่ยม (เปิดขวดดีเลี้ยงเพื่อรีวิว) · ผู้ขายร้อนเงิน (ไวน์ลด 35%) · งานการกุศล · เด็กฝึกงาน<br><br>แต่ละเหตุการณ์มีทางเลือกที่ให้ผลต่างกัน — บางอันได้กำไร บางอันเสี่ยง ทำให้ทุกรอบการเล่นไม่เหมือนกัน คิดให้ดีก่อนเลือก เพราะบางโอกาสมาแล้วไม่มาอีก')},
  {icon:'compass', t:T('จัดการเซลลาร์ใหญ่ๆ ยังไงให้เร็ว?'), d:T('เมื่อคลังเริ่มใหญ่ ใช้ <b>ตัวกรองอัจฉริยะ</b> ในหน้าเซลลาร์: แตะชิประดับชั้น (Grand Cru / Premier Cru / Village / Cru Bourgeois / Table) เพื่อดูเฉพาะกลุ่ม หรือเลือกภูมิภาคจากเมนู<br><br>ด้านบนมี<b>สรุปเซลลาร์</b>: มูลค่ารวม กำไร/ขาดทุน และจำนวนขวดพร้อมดื่ม เห็นภาพรวมได้ทันที<br><br>เวลาซื้อ/ขาย ใช้<b>แถบเลื่อน (slider)</b> หรือปุ่มลัด (1/5/10/ซื้อสูงสุด/ขายทั้งหมด) เพื่อปรับจำนวนทีเดียว ไม่ต้องกดทีละครั้ง — เหมาะกับจอสัมผัสในรถ')},
  {icon:'🎉', t:T('งานปาร์ตี้ประจำเดือนคืออะไร? (ปลดล็อกบทที่ 10)'), d:T('ราวเดือนละครั้ง ลูกค้ารายใหญ่ (โรงแรม บริษัท งานแต่ง) จะมาจัดงานและ<b>ซื้อไวน์จำนวนมากทีเดียว</b> เขาไม่สนการจับคู่ให้เป๊ะ — ขอแค่ปริมาณตามธีม (สีไวน์ + เพดาน tier)<br><br>💰 <b>นี่คือทางระบายไวน์ถูกในช่วงท้ายเกม:</b> แทนที่จะรอขายทีละขวดให้ลูกค้างบน้อย คุณส่งไวน์ tier 1-3 เข้างานทีละหลายสิบขวดในราคา +15-40% จากตลาด พร้อมโบนัสเมื่อส่งครบ<br><br>เก็บไวน์ถูกๆ ที่ซื้อมาเยอะๆ ไว้รองานได้เลย ยิ่งชื่อเสียงสูง งานยิ่งใหญ่ (ต้องการไวน์มากขึ้นและจ่ายดีขึ้น) มีเวลา 3 สัปดาห์ต่องาน · ส่งไวน์ต้องสงสัยเข้างานไม่ได้')},
  {icon:'🦄', t:T('ไวน์หายากในตำนานปลดล็อกยังไง?'), d:T('ขวดที่หายากที่สุด 8 ตัวในเกมไม่มีขายในตลาดตั้งแต่แรก คุณต้องพิสูจน์ตัวเองก่อนถึงจะซื้อได้ แต่ละขวดปลดล็อกด้วยความสำเร็จคนละแบบ:<br><br>🍷 จับคู่สมบูรณ์แบบ 25 ครั้ง · ชื่อเสียง ★150 · ส่งครบสัญญาร้านอาหาร 3 ฉบับ · ตรวจแล็บ 8 ครั้ง · รับโควตาพ่วง 5 ครั้ง · มูลค่าเซลลาร์ ฿20M · เดินเรื่องถึงบทที่ 16 · มีลูกค้าประจำ 8 คน<br><br>ดูความคืบหน้าทั้งหมดได้ที่หน้า "ธุรกิจ" — พอปลดล็อกแล้ว ขวดจะโผล่ในตลาดเหมือนไวน์ทั่วไป (แต่ยังหายากและสต๊อกน้อยมาก) ออกแบบให้เป็นเป้าหมายระยะยาวที่ผลักดันให้คุณลองเล่นทุกระบบในเกม')},
  {icon:'📦', t:T('โควตาพ่วงสินค้าคืออะไร? (ปลดล็อกบทที่ 11)'), d:T('ไวน์หายากระดับกร็องด์ครูไม่ได้ขายให้ใครก็ได้ พ่อค้าคนกลาง (négociant) จะบังคับ "ขายพ่วง" — อยากได้ของดี 1-2 ขวด ต้องรับไวน์ระดับรองไปด้วยหลายขวด<br><br>ราคารวมมักถูกกว่าซื้อแยก แต่คุณต้องคิดให้ดี 3 อย่าง: <b>เงินสด</b>จมไปเท่าไหร่ · <b>พื้นที่เซลลาร์</b>พอไหม · แล้วจะ<b>ระบายของพ่วง</b>ออกหน้าร้านยังไงโดยไม่ขาดทุน<br><br>ของพ่วงมักเป็นไวน์ tier 1-2 ที่ขายออกช้า ถ้ารับทุกโควตาโดยไม่คิด เซลลาร์จะเต็มไปด้วยของขายไม่ออกและเงินสดหมด — ปฏิเสธเป็นก็สำคัญพอๆ กับรับเป็น')},
  {icon:'🍽️', t:T('สัญญาส่งร้านอาหารคืออะไร? (ปลดล็อกบทที่ 13)'), d:T('เชฟระดับมิชลินจะเสนอสัญญาส่งไวน์ต่อเนื่อง 8 สัปดาห์ ในราคาคงที่ที่สูงกว่าตลาด ณ วันเซ็น<br><br><b>ข้อดี:</b> รายได้แน่นอนทุกสัปดาห์ ไม่ต้องลุ้นลูกค้าหน้าร้าน ส่งครบทั้งสัญญาได้โบนัสก้อนใหญ่ + ชื่อเสียง ★8<br><br><b>ข้อเสีย:</b> ราคาล็อกไว้แล้ว ถ้าราคาตลาดพุ่งขึ้นคุณก็ต้องกัดฟันซื้อของแพงมาส่ง และถ้าส่งไม่ครบ ครั้งแรกเชฟให้อภัย แต่ครั้งต่อไปโดนค่าปรับ 35% และเสียชื่อเสียง −★3<br><br><b>เคล็ดลับ:</b> กันไวน์ในสัญญาไว้อย่าเอาไปขายหน้าร้าน และตุนไว้อย่างน้อย 2 เท่าของยอดส่งต่อสัปดาห์เสมอ')},
  {icon:'🏪', t:T('ทำกำไรจากร้านอย่างไร?'), d:T('ราคาขายในร้าน = ราคาตลาด × markup โดย markup สูงขึ้นตามคุณภาพการจับคู่ ยิ่งจับคู่ตรงใจยิ่งได้ราคาดี + ทิป + ชื่อเสียง<br><br>💎 <b>ไวน์ยิ่งแพงยิ่งคุ้มถ้าจับคู่เก่ง:</b> ขวด tier 4-5 ที่เสิร์ฟได้สมบูรณ์แบบจะได้ทิปพิเศษ (+20-35%) และชื่อเสียงมากกว่าปกติ เพราะ "ความหรู" ของขวดหายาก กำไรสุทธิต่อขวด tier 5 อาจสูงถึงหลักล้าน เทียบกับ tier 1 ที่ได้หลักหมื่น — แต่ต้องมีลูกค้ากระเป๋าหนัก (ชื่อเสียงสูง) มารองรับ<br><br>ถ้าไวน์แพงเกินงบลูกค้ามาก เขาจะจ่ายแค่เท่างบ ทำให้เสียโอกาส — ช่วงแรกเน้นไวน์ถูกก่อน พอชื่อเสียงขึ้นค่อยขยับไปขวดแพง')},
  {icon:'📈', t:T('เทรดให้ได้กำไรอย่างไร?'), d:T('ราคามี momentum (แรงเฉื่อย) ถ้าขึ้นแล้วมักขึ้นต่ออีกระยะ ดูกราฟและลูกศร 📈/📉 ในหน้าต่างซื้อขาย ข่าวดี (คะแนนนักวิจารณ์ ประมูลทำสถิติ) ดันราคาขึ้น ข่าวร้าย (ทิ้งสต๊อก ข่าวลือของปลอม) กดราคาลง ซื้อตอนตกแล้วรอเด้ง คือกลยุทธ์พื้นฐาน')},
  {icon:'💸', t:T('ทำไมเงินหายทุกสัปดาห์?'), d:T('ทุกสัปดาห์หักค่าเช่าร้าน + เงินเดือนพนักงาน ยิ่งอัพเกรดและจ้างคนเยอะ ค่าใช้จ่ายยิ่งสูง ต้องแน่ใจว่ารายได้จากร้าน + กำไรเทรด มากกว่าค่าใช้จ่าย ดูสรุปได้ในหน้าต่างจบสัปดาห์ ถ้าขาดทุนติดกัน ให้ขายไวน์บางส่วนหรือลดพนักงาน')},
  {icon:'⏳', t:T('บ่มไวน์คุ้มไหม?'), d:T('คุ้ม! ไวน์ในเซลลาร์ได้โบนัสมูลค่าเพิ่มขึ้นตามเวลา (สูงสุด +60%) และอัพเกรดเซลลาร์ทำให้บ่มได้ดีขึ้น แต่ต้องแลกกับสภาพคล่อง — เงินจมอยู่ในขวด สมดุลระหว่างของที่เก็บยาวกับของที่หมุนขายคือกุญแจสำคัญ')},
  {icon:'🍇', t:T('ปี vintage ในเกมทำงานอย่างไร?'), d:T('ไวน์ที่คุณซื้อจะติดปี vintage ของปีนั้นในเกม แต่ละปีมีเรตติ้งคุณภาพต่างกัน (ปีทอง/ยอดเยี่ยม/ดี/ปานกลาง) vintage ดีขายได้ราคาสูงกว่าและลูกค้าประทับใจกว่า ปีในเกมเปลี่ยนทุก 12 สัปดาห์ ดังนั้นการรอซื้อในปีดีก็เป็นกลยุทธ์')},
  {icon:'👥', t:T('ควรจ้างพนักงานเมื่อไหร่?'), d:T('จ้างเมื่อรายได้ต่อสัปดาห์มั่นคงแล้ว แต่ละตำแหน่งช่วยต่างกัน: ซอมเมอลิเยร์ (จับคู่แม่นขึ้น + บอกใบ้), เทรดเดอร์ (ลดค่าคอมและ spread — คุ้มมากถ้าเทรดบ่อย), พนักงานต้อนรับ (ลูกค้าเพิ่ม), นักชิม (ประเมินคุณภาพ) เทรนพนักงานเพิ่มเลเวลได้แต่เงินเดือนขึ้นตาม')},
  {icon:'🌱', t:T('En Primeur เสี่ยงไหม?'), d:T('ซื้อล่วงหน้าได้ส่วนลด ~25-28% จากราคาตลาด แต่ต้องรอส่งมอบ 3-5 สัปดาห์ และเงินจมระหว่างนั้น ระวัง: ถ้าเซลลาร์เต็มตอนของมาส่ง ระบบจะขายอัตโนมัติที่ 95% ของราคาตลาด ให้เผื่อพื้นที่ไว้เสมอ')},
  {icon:'📦', t:T('ทำไมซื้อไวน์ได้จำกัด?'), d:T('ตลาดเปิดมีของจำกัดต่อสัปดาห์ (ดูป้าย "ตลาดมี N" บนการ์ดไวน์) ไวน์ยิ่งหายากยิ่งมีของน้อย — Unicorn บางตัวมีแค่ 1-2 ขวด<br><br>• <b>ซื้อทีละมากๆ ดันราคาขึ้น</b> — กวาดทั้งชั้นจ่ายแพงขึ้นได้ถึง ~18%<br>• ของที่เหลือขายไม่หมดจะทบไปสัปดาห์หน้าบางส่วน แล้วมีของเข้าใหม่<br>• ภูมิภาคที่กำลังฮอต 🔥 ของจะหายเร็ว ภูมิภาคที่เย็น 🧊 ของจะเหลือเยอะ<br>• ตลาดหมี = ของล้นตลาด · ตลาดกระทิง = ของขาดแคลน<br>• ไวน์ที่คุณขายออกไปจะกลับเข้าไปเป็นสต๊อกในตลาดด้วย')},

// Each region gets a weather outcome per year, which drives that year's vintage quality.
const WEATHER=[
  {k:'perfect', t:T('ปีทอง'), d:T('อากาศสมบูรณ์แบบ องุ่นสุกงอมพอดี'), mod:14, c:'var(--gold)'},
  {k:'warm',    t:T('ปีอบอุ่น'), d:T('แดดจัด ผลผลิตเข้มข้น'), mod:8,  c:'var(--sage-deep)'},
  {k:'normal',  t:T('ปีปกติ'), d:T('สภาพอากาศทั่วไป'), mod:3,  c:'var(--sky)'},
  {k:'rain',    t:T('ปีฝนชุก'), d:T('ฝนตอนเก็บเกี่ยว องุ่นเจือจาง'), mod:-4, c:'var(--ink-soft)'},
  {k:'frost',   t:T('ปีน้ำค้างแข็ง'), d:T('น้ำค้างแข็งทำลายตาอ่อน ผลผลิตน้อย'), mod:-2, c:'var(--down)'},
];
// deterministic per region+year so it is stable across sessions and saves
function regionWeather(region, year){
  let h=0; const s='w:'+region+':'+year;
  for(let i=0;i<s.length;i++) h=(h*33+s.charCodeAt(i))>>>0;
  const r=h%100;
  if(r<12) return WEATHER[0];
  if(r<34) return WEATHER[1];
  if(r<68) return WEATHER[2];
  if(r<88) return WEATHER[3];
  return WEATHER[4];
}
// Frost years reduce supply, which lifts prices for that region
function weatherSupplyEffect(region, year){
  const w=regionWeather(region,year);
  return w.k==='frost' ? 1.06 : w.k==='rain' ? 0.98 : 1.0;
}
function vintageRating(wid, year){
  const w=wineById(wid);
  let h=0; const s=wid+':'+year;
  for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; }
  const r=(h%100)/100;
  const base = 82 + r*12;                       // 82..94 intrinsic
  const wx = w? regionWeather(w.region, year).mod : 0;
  return Math.max(78, Math.min(100, Math.round(base + wx)));
}
function vintageLabel(rating){
  if(rating>=97) return {t:T('ปีทอง'), c:'var(--gold)'};
  if(rating>=93) return {t:T('ยอดเยี่ยม'), c:'var(--sage-deep)'};
  if(rating>=88) return {t:T('ดี'), c:'var(--sky)'};
  return {t:T('ปานกลาง'), c:'var(--ink-soft)'};
}

function portfolioValue(){
  let v=0;
  for(const id in G.cellar){ v += G.prices[id]*G.cellar[id].qty * agingMult(id); }

/* ============================================================
   DRINKING WINDOW — wines mature, peak, then decline
   ============================================================ */
// Cellaring potential from structure: tannin + acid + tier drive longevity.
function agingPotential(w){
  const t=w.tier||3, tan=w.tannin??3, ac=w.acid??4;
  return Math.round(6 + t*3.2 + tan*1.1 + ac*0.9);   // ~12..34 weeks
}
// Where a lot sits in its life: young → peak → late → old
function drinkWindow(id){
  const w=wineById(id), c=G.cellar[id];
  if(!c||!w) return {state:'young', pct:0, label:'—', mult:1, until:0};
  const age=G.week-c.buyWeek;
  const pot=agingPotential(w);
  const peakStart=Math.round(pot*0.45), peakEnd=pot;
  const pct=Math.min(1.6, age/Math.max(1,peakEnd));
  if(age<peakStart)     return {state:'young', pct, label:T('ยังอ่อน'),    mult:1.00, until:peakStart-age};
  if(age<=peakEnd)      return {state:'peak',  pct, label:T('พร้อมดื่ม'),  mult:1.12, until:peakEnd-age};
  if(age<=peakEnd*1.45) return {state:'late',  pct, label:T('เลยจุดพีค'),  mult:0.97, until:0};
  return {state:'old', pct, label:T('เสื่อมสภาพ'), mult:0.85, until:0};
}

function agingMult(id){
  const c = G.cellar[id]; if(!c) return 1;
  const age = G.week - c.buyWeek;
  const cellarQ = 1 + G.upgrades.cellarCap*0.02;
  const w = wineById(id);
  // Fine wine appreciates more, and for longer, than everyday bottles — so a
  // patiently cellared Grand Cru is a genuine investment, not just stock to
  // serve. Higher tiers get a steeper curve and a higher ceiling, which makes
  // the portfolio / long-hold play matter alongside the weekly shop grind.
  const tier = w ? w.tier : 3;
  const rate = 0.007 + (tier-3)*0.0018;              // tier1 ~0.004, tier5 ~0.014 per week
  const ceiling = 0.35 + (tier-1)*0.11;              // tier1 +0.35, tier5 +0.79 max
  const m = 1 + Math.min(age*rate*cellarQ, ceiling);
  // maturity curve modifies value: peak bottles fetch more, tired ones less
  return m * drinkWindow(id).mult;
}
function wineById(id){ return WINES.find(w=>w.id===id); }
// Remove lots that hold no bottles. sealLot() clamps a corrupt lot to qty 0 but
// deliberately leaves it in place (callers may be mid-iteration); without this
// sweep such a lot lingers and renders as an empty card in the cellar.
function pruneEmptyLots(){
  for(const id in G.cellar){
    const c=G.cellar[id];
    if(!c || !(c.qty>0)) delete G.cellar[id];
  }
}

function pruneMissingWines(){
  const exists=id=>WINES.some(w=>w.id===id);
  for(const id in G.cellar) if(!exists(id)) delete G.cellar[id];
  for(const id in G.primeur) if(!exists(id)) delete G.primeur[id];
  for(const id in G.stock) if(!exists(id)) delete G.stock[id];
  if(Array.isArray(G.contracts)) G.contracts = G.contracts.filter(k=>exists(k.wineId));
  if(Array.isArray(G.contractOffers)) G.contractOffers = G.contractOffers.filter(k=>exists(k.wineId));
  if(Array.isArray(G.allocOffers)) G.allocOffers = G.allocOffers.filter(o=>exists(o.wineId) && (o.bundle||[]).every(b=>exists(b.id)));
  if(G.auction && !exists(G.auction.id)) G.auction=null;
}

// Macro regime the whole market sits in; shifts every ~10-18 weeks.
const REGIMES=[
  {k:'bull',    t:T('ตลาดกระทิง'),   ic:'📈', drift:+0.012, vol:1.0,  note:T('เงินไหลเข้าไวน์สะสม ราคาขาขึ้นทั้งตลาด')},
  {k:'calm',    t:T('ตลาดทรงตัว'),   ic:'😐', drift:+0.001, vol:0.75, note:T('ซื้อขายเบาบาง ราคาแกว่งน้อย')},
  {k:'bear',    t:T('ตลาดหมี'),      ic:'📉', drift:-0.011, vol:1.15, note:T('นักลงทุนถอนตัว ราคาปรับฐานทั้งกระดาน')},
  {k:'volatile',t:T('ตลาดผันผวน'),   ic:'⚡', drift:+0.002, vol:1.75, note:T('ข่าวสะพัด ราคาเหวี่ยงแรงทั้งสองทาง')},
];
function currentRegime(){ return REGIMES.find(r=>r.k===(G.regime||'calm'))||REGIMES[1]; }
function tickRegime(){
  G.regimeWeeksLeft=(G.regimeWeeksLeft||0)-1;
  if(G.regimeWeeksLeft>0) return;
  const prev=G.regime;
  // transitions are biased so bull rarely flips straight to bear
  const table={
    bull:     ['bull','calm','calm','volatile','bear'],
    calm:     ['calm','bull','bear','volatile','calm'],
    bear:     ['bear','calm','calm','bull','volatile'],
    volatile: ['calm','bull','bear','volatile','calm'],
    undefined:['calm','bull','calm','bear','volatile'],
  };
  const opts=table[prev]||table.calm;
  G.regime=opts[Math.floor(Math.random()*opts.length)];
  G.regimeWeeksLeft=10+Math.floor(Math.random()*9);
  if(G.regime!==prev && G.week>1){
    const r=currentRegime();
    G.news.push({msg:`${r.ic} ${T("ภาวะตลาดเปลี่ยนเป็น \"")}${r.t}" — ${r.note}`, id:null, mult:1});
    sfx('alert');
  }
}
// Slow-moving regional fashion: each region drifts in and out of favour.
function tickRegionTrends(){
  G.regionTrend=G.regionTrend||{};
  const regions=[...new Set(WINES.map(w=>w.region))];
  regions.forEach(rg=>{
    const cur=G.regionTrend[rg]||0;
    // mean-reverting random walk in [-1, 1]
    const next=Math.max(-1, Math.min(1, cur*0.88 + (Math.random()-0.5)*0.34));
    G.regionTrend[rg]=next;
  });
  // occasionally announce a strong trend
  const hot=regions.filter(r=>G.regionTrend[r]>0.55);
  const cold=regions.filter(r=>G.regionTrend[r]<-0.55);
  if(hot.length && Math.random()<0.35){
    const r=hot[Math.floor(Math.random()*hot.length)];
    G.news.push({msg:`🔥 ${r} ${T("กำลังเป็นที่ต้องการอย่างมากในหมู่นักสะสม")}`, region:r, mult:1.03, id:null});
  }
  if(cold.length && Math.random()<0.28){
    const r=cold[Math.floor(Math.random()*cold.length)];
    G.news.push({msg:`${T("🧊 ความสนใจใน")} ${r} ${T("ซบเซาลง นักลงทุนหันไปที่อื่น")}`, region:r, mult:0.98, id:null});
  }
}
// Bubbles: a wine that has run up too fast can pop.
function tickBubbles(){
  G.bubble=G.bubble||{};
  WINES.forEach(w=>{
    const h=G.priceHist[w.id]; if(!h||h.length<6) return;
    const ratio=G.prices[w.id]/h[Math.max(0,h.length-6)];
    if(ratio>1.55 && !G.bubble[w.id] && Math.random()<0.30){
      G.bubble[w.id]={since:G.week};
    }
    if(G.bubble[w.id]){
      const age=G.week-G.bubble[w.id].since;
      // the longer it stays inflated the more likely the correction
      if(Math.random() < 0.14+age*0.06){
        const drop=0.72+Math.random()*0.14;
        G.prices[w.id]=Math.round(G.prices[w.id]*drop);
        G.news.push({msg:`${T("💥 ฟองสบู่แตก!")} ${w.name} ${T("ดิ่งลง")} ${Math.round((1-drop)*100)}${T("% หลังราคาพุ่งเกินจริง")}`, id:w.id, mult:1});
        delete G.bubble[w.id];
        sfx('crack');
      } else if(age>6){ delete G.bubble[w.id]; }
    }
  });
}
// Liquidity: rare wines are harder to move — affects spread already, plus
// large sells push the price down (market impact).
function marketImpact(id, qty){
  const w=wineById(id);
  const depth = 6 + (6-w.tier)*4;          // tier5 ~10 bottles deep, tier1 ~26
  const impact = Math.min(0.22, (qty/depth)*0.10);
  return impact;
}

];
function pickNewsWine(){ return WINES[Math.floor(Math.random()*WINES.length)]; }
function tickMarket(){
  G.news=[];
  tickRegime();
  tickRegionTrends();
  const RG=currentRegime();
  const nEvents = 1 + (Math.random()<0.4?1:0) + (Math.random()<0.15?1:0);
  const totW = NEWS_EVENTS.reduce((s,e)=>s+e.w,0);
  for(let k=0;k<nEvents;k++){
    let r=Math.random()*totW, pick=NEWS_EVENTS[0];
    for(const e of NEWS_EVENTS){ r-=e.w; if(r<=0){pick=e;break;} }
    const w=pickNewsWine();
    const ev=pick.f(w);
    G.news.push(ev);
    G.newsLog.unshift({week:G.week, msg:ev.msg});
  }
  if(G.newsLog.length>40) G.newsLog.length=40;

  WINES.forEach(w=>{
    // momentum: prices have inertia
    let mom = G.momentum[w.id]||0;
    // regime sets the baseline drift and how wild the swings are.
    // Mean-reversion pulls prices back toward each wine's base so the market
    // stays a two-way trading arena (buy dips, sell peaks) instead of a
    // one-way escalator that makes any long hold a guaranteed win.
    // reversion is asymmetric: pulls hard when a wine runs far above fair value,
    // gently when below — so fine wine trends up modestly but can't balloon.
    const rel = G.prices[w.id]/w.base;
    const revert = rel>1 ? (1-rel)*0.03 : (1-rel)*0.012;
    let drift = (Math.random()-.5)*w.vol*RG.vol + (w.tier-3)*0.0022 + mom*0.5 + RG.drift + revert;
    // regional fashion pushes whole regions over many weeks
    drift += (G.regionTrend?.[w.region]||0)*0.010;
    let mult = 1+drift;
    G.news.forEach(n=>{
      if(n.id===w.id) mult*=n.mult;
      else if(n.region && n.region===w.region) mult*=(1+(n.mult-1)*0.4);
    });
    // update momentum (decays, picks up event shocks)
    G.momentum[w.id] = mom*0.6 + (mult-1)*0.4;
    // weather-driven supply pressure for the current vintage year
    mult *= (1 + (weatherSupplyEffect(w.region, gameYear())-1)*0.25);
    let np = Math.max(w.base*0.35, G.prices[w.id]*mult);
    G.prices[w.id]=Math.round(np);
    G.priceHist[w.id].push(G.prices[w.id]);
    if(G.priceHist[w.id].length>36) G.priceHist[w.id].shift();
  });

  // speculative bubbles can pop after a fast run-up
  tickBubbles();

  // new consignments arrive on the open market
  refreshStock();
  // ...then Victor takes his cut before the shelves settle
  tickRival();

  // suspicions surface on their own over time, even without a taster
  tickFakeSuspicion();
  normalizeCellarLots();   // keep suspect <= fake <= qty right after they change

  // broker occasionally drops an insider tip (if broker chapter reached)
  if(G.chapter>=2 && Math.random()<0.4){
    const w=pickNewsWine();
    const dir = (G.momentum[w.id]||0)>=0 ? 'up':'down';
    G.tips=[{id:w.id, dir, week:G.week, conf:0.5+Math.random()*0.4}];
  } else { G.tips=G.tips.filter(t=>G.week-t.week<2); }
}

/* Indices */
function indexValue(filter){
  let list = WINES.filter(filter);
  let sum=0, basesum=0;
  list.forEach(w=>{ sum+=G.prices[w.id]; basesum+=w.base; });
  return (sum/basesum)*100;
}
function indexDelta(filter){
  let list = WINES.filter(filter);
  let cur=0, prev=0;
  list.forEach(w=>{
    const h=G.priceHist[w.id];
    cur+=h[h.length-1]; prev+=h[h.length-2]||h[h.length-1];
  });
  return prev? ((cur-prev)/prev)*100 : 0;
}

/* bid/offer spread based on liquidity (tier), reduced by trader staff */
function spreadFor(w){
  const traderCut = Math.min(0.4, staffBonus('trading')*0.08);
  return (0.025 + (w.tier-1)*0.02) * (1-traderCut);
}
function bidPrice(id){ const w=wineById(id); return Math.round(G.prices[id]*(1-spreadFor(w)/2)); }
function offerPrice(id){ const w=wineById(id); return Math.round(G.prices[id]*(1+spreadFor(w)/2)); }
function brokerFee(){ return Math.max(0.008, 0.025 - staffBonus('trading')*0.004); }

function sparkline(hist, w=140, h=34){
  const min=Math.min(...hist), max=Math.max(...hist), rng=(max-min)||1;
  const step=w/(hist.length-1);
  const up = hist[hist.length-1]>=hist[0];
  let d='';
  hist.forEach((v,i)=>{ const x=i*step, y=h-((v-min)/rng)*(h-4)-2; d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '; });
  const col = up? 'var(--up)':'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

   group. Guessing from tannin used to put Tokaji in "white" and Port in

const WINE_STYLES = ['red','white','rose','sweet','fortified','sparkling'];

  red:T('แดง'), white:T('ขาว'), rose:T('โรเซ่'),
  sweet:T('หวาน'), fortified:T('เสริมแอลกอฮอล์'), sparkling:T('สปาร์กลิง'),
};

function wineStyle(w){
  if(!w) return 'red';
  if(w.style && WINE_STYLES.includes(w.style)) return w.style;
  // legacy fallback for any record predating the style field
  if(w.rose) return 'rose';
  if(typeof w.tannin==='number' && w.tannin<=1) return (w.sweet||0)>=3 ? 'sweet' : 'white';
  return 'red';
}

// Tesla's browser chokes on dozens of gradient objects in one scroll view, so
// every list/grid view uses this. Same silhouette + colour identity as the full one.
// Only virtualize when the cellar is large enough to matter — small cellars
// render everything up-front (no observer overhead).
let VIRT_BOTTLES=false;
let _bottleObserver=null;
function hydrateBottles(){
  // always disconnect the previous observer first — this is the cleanup that
  // prevents listeners/observers from piling up across page switches
  if(_bottleObserver){ _bottleObserver.disconnect(); _bottleObserver=null; }
  if(!VIRT_BOTTLES) return;
  const slots=document.querySelectorAll('.slot-bottle[data-bottle]');
  if(!slots.length || typeof IntersectionObserver==='undefined'){
    // fallback: no observer support — just fill them all in
    slots.forEach(el=>{ const w=wineById(el.dataset.bottle); if(w) el.innerHTML=bottleSVGLite(w,40); });
    return;
  }
  _bottleObserver=new IntersectionObserver((entries,obs)=>{
    for(const e of entries){
      if(e.isIntersecting){
        const el=e.target, w=wineById(el.dataset.bottle);
        if(w && el.querySelector('.bottle-ph')) el.innerHTML=bottleSVGLite(w,40);
        obs.unobserve(el);   // done — stop watching this one
      }
    }
  }, {root:null, rootMargin:'300px 0px', threshold:0.01});
  slots.forEach(el=>_bottleObserver.observe(el));
}

        <stop offset="0" stop-color="${shade(foil,-34)}"/>
        <stop offset="0.28" stop-color="${shade(foil,16)}"/>
        <stop offset="0.55" stop-color="${foil}"/>
        <stop offset="1" stop-color="${shade(foil,-38)}"/>
      </linearGradient>
      <linearGradient id="lb${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FDFAF3"/>
        <stop offset="0.55" stop-color="#F7EFE0"/>
        <stop offset="1" stop-color="#EADFC9"/>
      </linearGradient>
      <clipPath id="cp${uid}"><path d="${bodyPath}"/></clipPath>
    </defs>
    <!-- soft ground shadow -->
    <ellipse cx="${cx}" cy="195" rx="${bw/2+3}" ry="4.5" fill="rgba(62,44,38,.20)"/>
    <ellipse cx="${cx}" cy="194" rx="${bw/2-3}" ry="2.5" fill="rgba(62,44,38,.14)"/>
    <!-- glass body -->
    <path d="${bodyPath}" fill="url(#gl${uid})" stroke="${shade(glass,-46)}" stroke-width="1.1"/>
    <g clip-path="url(#cp${uid})">
      <!-- wine fill seen through glass -->
      <rect x="${bx-2}" y="${shY-6}" width="${bw+4}" height="${190-shY}" fill="url(#wn${uid})" opacity="${isW?0.34:0.66}"/>
      <!-- punt (dimple) shading at base -->
      <ellipse cx="${cx}" cy="192" rx="${bw/2-4}" ry="7" fill="${shade(glass,-40)}" opacity=".55"/>
      <!-- primary specular highlight -->
      <rect x="${bx+4}" y="40" width="4.5" height="152" rx="2.2" fill="#ffffff" opacity="0.26"/>
      <rect x="${bx+9.5}" y="52" width="1.8" height="128" rx="1" fill="#ffffff" opacity="0.13"/>
      <!-- rim light on the right -->
      <rect x="${bx+bw-6}" y="46" width="2.6" height="142" rx="1.3" fill="#ffffff" opacity="0.10"/>
      <!-- subtle horizontal glass banding -->
      <rect x="${bx}" y="${shY+4}" width="${bw}" height="1" fill="#ffffff" opacity="0.07"/>
    </g>
    <!-- neck -->
    <path d="M ${nx} 40 L ${nx} ${shY-curve+2} L ${nx2} ${shY-curve+2} L ${nx2} 40 Z" fill="url(#gl${uid})" stroke="${shade(glass,-46)}" stroke-width="1.1"/>
    <rect x="${nx+1.8}" y="42" width="2.2" height="${shY-curve-40}" rx="1.1" fill="#fff" opacity="0.24"/>
    <!-- foil capsule with crisp edge -->
    <path d="M ${nx-1.2} 13 Q ${cx} 9.4 ${nx2+1.2} 13 L ${nx2+1.2} 45 Q ${cx} 48.4 ${nx-1.2} 45 Z" fill="url(#fo${uid})" stroke="${foilDark}" stroke-width="0.7"/>
    <path d="M ${nx-1.2} 38 Q ${cx} 41.4 ${nx2+1.2} 38" fill="none" stroke="${shade(foil,-30)}" stroke-width="0.8" opacity=".8"/>
    <ellipse cx="${cx}" cy="13" rx="${neckW/2+1.2}" ry="2.6" fill="${shade(foil,26)}"/>
    <ellipse cx="${cx}" cy="13" rx="${neckW/2-1.4}" ry="1.4" fill="${shade(foil,-18)}" opacity=".6"/>
    <!-- label with subtle paper edge -->
    <rect x="${labX}" y="${labY}" width="${labW}" height="${labH}" rx="2.5" fill="url(#lb${uid})" stroke="rgba(62,44,38,.22)" stroke-width="0.7"/>
    <rect x="${labX+1}" y="${labY+1}" width="${labW-2}" height="${labH-2}" rx="1.8" fill="none" stroke="${foil}" stroke-width="0.5" opacity=".45"/>
    <!-- label header band -->
    <rect x="${labX}" y="${labY}" width="${labW}" height="11" rx="2.5" fill="${foil}" opacity="0.88"/>
    <rect x="${labX}" y="${labY+11}" width="${labW}" height="0.9" fill="${shade(foil,-25)}"/>
    <!-- typographic lines -->
    <line x1="${labX+4.5}" y1="${labY+20}" x2="${labX+labW-4.5}" y2="${labY+20}" stroke="rgba(62,44,38,.46)" stroke-width="1.5"/>
    <line x1="${labX+7.5}" y1="${labY+26}" x2="${labX+labW-7.5}" y2="${labY+26}" stroke="rgba(62,44,38,.26)" stroke-width="0.9"/>
    <line x1="${labX+10}" y1="${labY+31}" x2="${labX+labW-10}" y2="${labY+31}" stroke="rgba(62,44,38,.18)" stroke-width="0.8"/>
    <!-- region emblem -->
    ${labelEmblem(w.region, cx, labY+41, foil)}
    <!-- vintage tick marks -->
    <line x1="${labX+5}" y1="${labY+labH-4}" x2="${labX+11}" y2="${labY+labH-4}" stroke="rgba(62,44,38,.3)" stroke-width="0.8"/>
    <line x1="${labX+labW-11}" y1="${labY+labH-4}" x2="${labX+labW-5}" y2="${labY+labH-4}" stroke="rgba(62,44,38,.3)" stroke-width="0.8"/>
  </svg>`;
}

// swap emoji in any text that reaches the page
(function(){
  const SKIP = /^(SCRIPT|STYLE|TEXTAREA|INPUT|TITLE|OPTION)$/;
  function convertText(node){
    const p=node.parentNode; if(!p || p.nodeType!==1 || SKIP.test(p.nodeName) || p.namespaceURI==='http://www.w3.org/2000/svg') return;
    const t=node.nodeValue; GI_RE.lastIndex=0; if(!GI_RE.test(t)) return;
    GI_RE.lastIndex=0;
    const frag=document.createDocumentFragment(); let last=0, m, changed=false;
    while((m=GI_RE.exec(t))){
      const ch=m[0], key=GI_CHAR[ch], html = key && p.closest && p.closest('.char-av') ? miniPortrait(key) : giHTML(ch);
      if(html===ch) continue;
      if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
      const tmp=document.createElement('span'); tmp.innerHTML=html; frag.appendChild(tmp.firstChild);
      last=m.index+ch.length; changed=true;
    }
    if(!changed) return;
    if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last)));
    p.replaceChild(frag, node);
  }
  function walk(root){
    if(root.nodeType===3){ convertText(root); return; }
    if(root.nodeType!==1 || SKIP.test(root.nodeName) || root.namespaceURI==='http://www.w3.org/2000/svg') return;
    const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list=[];
    while(w.nextNode()) list.push(w.currentNode);
    list.forEach(convertText);
  }
  window.deEmoji = walk;
  const start=()=>{
    walk(document.body);
    new MutationObserver(muts=>{
      for(const m of muts){
        if(m.type==='characterData') convertText(m.target);
        else m.addedNodes.forEach(walk);
      }
    }).observe(document.body, {childList:true, subtree:true, characterData:true});
  };
  if(document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();

    const t=type;
